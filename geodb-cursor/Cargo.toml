[package]
name = "geodb-cursor"
version = "0.1.0"
edition = "2024"
description = "Best-effort mirror of an indexer's chain cursor into geo-db's derived class, over `geodb-client derived pipe`"

[dependencies]
metrics = "0.24"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
