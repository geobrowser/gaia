apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: embedding-service
  namespace: gaia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: embedding-service
  # Two pods keep the query path alive through a rollout or a node loss. The ceiling is for
  # backfill windows (a new slot, a widened scope): embedding-indexer drives one pod to its CPU
  # limit, the HPA adds pods, and the ClusterIP Service spreads the batches across them.
  minReplicas: 2
  maxReplicas: 6
  behavior:
    # Same damping as api/k8s/v2/hpa.yaml, for the same reason: a freshly booted pod has no
    # metrics yet, so the average over the older, busier pods rises during a scale-out.
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
