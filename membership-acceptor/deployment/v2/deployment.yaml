# membership-acceptor — gaia v2 stack (chain 55516, namespace `gaia`).
#
# GEO-2478: this service existed only on prod (ns `knowledge`, chain 19411) and
# was never brought to the v2 cluster, so automatic member acceptance simply did
# not run there. Modeled on deployment/production/deployment.yaml with the v2
# conventions applied: namespace `gaia`, `regcred` pull secret (prod uses `geo`),
# and chain-55516 config.
#
# Sponsorship differs from prod: 55516 has no Safe infrastructure, so the
# acceptor uses an EIP-7702 Kernel account via ZeroDev instead of Safe+Pimlico
# (see src/wallet.ts). Under EIP-7702 the acting address IS the acceptor's EOA,
# not a Safe proxy — that EOA must own ACCEPTOR_SPACE_ID and hold editor rights
# in the auto-accept spaces, which is NOT the same identity as on prod.
#
# Requires a `membership-acceptor-credentials` secret in `gaia` holding
# ACCEPTOR_PRIVATE_KEY, GEO_WEBHOOK_SECRET, RPC_URL, ZERODEV_SPONSORSHIP_RPC_URL
# and (optionally) SENTRY_DSN. PIMLICO_API_KEY is deliberately absent — this
# chain never calls Pimlico.
#
# It also needs a row in `app_webhooks` pointing at this Service, or nothing will
# ever invoke it; the notification system is what drives the bot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: membership-acceptor
  namespace: gaia
  labels:
    app: membership-acceptor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: membership-acceptor
  template:
    metadata:
      labels:
        app: membership-acceptor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      imagePullSecrets:
        - name: regcred
      containers:
        - name: membership-acceptor
          image: registry.digitalocean.com/geo/membership-acceptor:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Shared secret — MUST equal this service's app_webhooks.secret row
            - name: GEO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: membership-acceptor-credentials
                  key: GEO_WEBHOOK_SECRET
            # Voting identity (sensitive).
            # Reads the SAME key proposal-executor's membership path uses rather
            # than copying it into a second secret — one private key in one place.
            - name: ACCEPTOR_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: proposal-executor-credentials
                  key: MEMBERSHIP_BOT_PRIVATE_KEY
            - name: RPC_URL
              valueFrom:
                secretKeyRef:
                  name: membership-acceptor-credentials
                  key: RPC_URL
            # ZeroDev bundler + paymaster (replaces PIMLICO_API_KEY on this chain)
            - name: ZERODEV_SPONSORSHIP_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: membership-acceptor-credentials
                  key: ZERODEV_SPONSORSHIP_RPC_URL
            # Non-sensitive config
            #
            # Uses the v2 membership-bot identity, NOT prod's. v2 provisioned a
            # dedicated bot space + key during bring-up:
            #   space 0xf61e6ac5a54f47898ee23ae48a0729ba
            #     -> registered to 0x14b3F486aD9a2f5E2a15B54bCa43684C17210e3A
            #   proposal-executor-credentials/MEMBERSHIP_BOT_PRIVATE_KEY
            #     -> derives to that same address (verified 2026-07-30)
            # which is EOA-keyed and therefore works under EIP-7702. Prod's
            # acceptor space is registered to a *Safe* address that cannot exist
            # on 55516, so reusing prod's identity here would revert every vote.
            - name: ACCEPTOR_SPACE_ID
              value: "0xf61e6ac5a54f47898ee23ae48a0729ba"
            # Self-owned SpaceRegistry deployed 2026-07-29 on chain 55516
            - name: SPACE_REGISTRY_ADDRESS
              value: "0xCF13491802747e759e1BB8E364bc43045398d1DD"
            - name: CHAIN_ID
              value: "55516"
            # In-cluster: avoids an external hop and does not depend on public DNS
            - name: GRAPHQL_ENDPOINT
              value: "http://api.gaia.svc.cluster.local:3000/graphql"
            # !!! MUST STAY EMPTY UNLESS proposal-executor's LIST IS EMPTIED !!!
            #
            # On v2 automatic member acceptance is ALREADY handled by
            # proposal-executor's built-in membership path (src/membership.ts —
            # stage-1 detect + stage-2 on-chain eligibility read + YES vote),
            # driven by its own MEMBERSHIP_AUTOACCEPT_SPACE_IDS. That is the path
            # GEO-2478 was actually about: the variable was simply never set
            # there, so the allowlist was empty and nobody was admitted.
            #
            # This standalone webhook-driven service is the second implementation
            # of the same behaviour (prod runs both). Listing a space in BOTH
            # places means two independent bots vote on the same request. Pick
            # one owner per space.
            - name: MEMBERSHIP_AUTOACCEPT_SPACE_IDS
              value: ""
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: membership-acceptor-credentials
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_ENVIRONMENT
              value: "testnet"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: membership-acceptor
  namespace: gaia
spec:
  selector:
    app: membership-acceptor
  ports:
    - name: http
      port: 80
      targetPort: http
