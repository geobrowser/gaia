services:
  scoring-cronjob:
    build:
      context: ./cronjob
      dockerfile: Dockerfile
    volumes:
      - ./cronjob:/app
    environment:
      # Database connection string (provided by deployment infrastructure)
      - DATABASE_URL
      # Disable Python output buffering for real-time logs in Docker
      - PYTHONUNBUFFERED=1
      # Use copy mode for uv to avoid hardlink warnings in Docker volumes
      - UV_LINK_MODE=copy
      # Kafka configuration
      - OUTPUT_MODE=${OUTPUT_MODE:-all}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:29092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-curation.scores}
      - SCORE_BATCH_SIZE=${SCORE_BATCH_SIZE:-1000}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      - SENTRY_SEND_DEFAULT_PII=${SENTRY_SEND_DEFAULT_PII:-false}
      - SENTRY_DEBUG=${SENTRY_DEBUG:-false}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-scoring-cronjob@1.0.0}
    networks:
      - hermes_default

  vote-indexer:
    build:
      context: ..
      dockerfile: scoring-service/vote-indexer/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/postgres}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:29092}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-vote-indexer}
      - BATCH_SIZE=${BATCH_SIZE:-100}
      - BATCH_TIMEOUT_MS=${BATCH_TIMEOUT_MS:-1000}
      - RUST_LOG=${RUST_LOG:-info,vote_indexer=debug}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      - SENTRY_SEND_DEFAULT_PII=${SENTRY_SEND_DEFAULT_PII:-false}
      - SENTRY_DEBUG=${SENTRY_DEBUG:-false}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-vote-indexer@1.0.0}
    networks:
      - hermes_default

networks:
  hermes_default:
    external: true
