services:
  scoring-service:
    build:
      context: ..
      dockerfile: scoring-service/Dockerfile
    volumes:
      - ./:/app/scoring-service
    environment:
      # Database connection string (provided by deployment infrastructure)
      - DATABASE_URL
      # Disable Python output buffering for real-time logs in Docker
      - PYTHONUNBUFFERED=1
      # Use copy mode for uv to avoid hardlink warnings in Docker volumes
      - UV_LINK_MODE=copy
      # Kafka configuration
      - OUTPUT_MODE=${OUTPUT_MODE:-postgres}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:29092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-curation.scores}
      - SCORE_BATCH_SIZE=${SCORE_BATCH_SIZE:-1000}
    networks:
      - hermes_default

networks:
  hermes_default:
    external: true
