[package]
name = "vote-indexer"
version = "0.1.0"
edition = "2021"
description = "Vote indexer that consumes curation.votes events from Kafka and indexes into PostgreSQL"

# Explicit once there is more than one binary. `comment_sweep` is the ranking score's
# missing comment trigger — see its module doc, and `ranking-indexer` for the same
# one-shot-binary-plus-CronJob shape.
[[bin]]
name = "vote-indexer"
path = "src/main.rs"

[[bin]]
name = "comment_sweep"
path = "src/bin/comment_sweep.rs"

[dependencies]
hermes-schema = { path = "../../hermes-schema" }
hermes-instrumentation = { path = "../../hermes-instrumentation" }
hermes-kafka = { path = "../../hermes-kafka" }
sdk = { path = "../../sdk" }
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "zstd"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures = "0.3.31"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
prost = "0.13.5"
thiserror = "2.0.12"
chrono = "0.4.41"
uuid = { version = "1.17.0", features = ["v4", "v5"] }
dotenv = "0.15.0"
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "test-util"] }
