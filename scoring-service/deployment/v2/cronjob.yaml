apiVersion: batch/v1
kind: CronJob
metadata:
  name: scoring-service
  namespace: gaia
spec:
  schedule: "0 3 * * *"  # Run at 3am every day
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      # A run takes ~66 min. Retry other failures (e.g. a dropped DB connection) twice, but
      # fail the Job at once on exit 3: scores were computed and written to Postgres but not
      # delivered to Kafka, and a rerun would recompute for another hour to fail the same
      # way (GEO-3108: the topic was missing and every night "succeeded" with 0 delivered).
      # podFailurePolicy requires restartPolicy: Never.
      backoffLimit: 2
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: scoring-service
              operator: In
              values: [3]
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: geo
          containers:
            - name: scoring-service
              image: registry.digitalocean.com/geo/scoring-service:latest
              imagePullPolicy: Always
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: scoring-service-credentials
                      key: DATABASE_URL
                # Output mode: postgres, kafka, or all
                - name: OUTPUT_MODE
                  value: "all"
                # Kafka configuration (uses kafka-credentials secret copied to scoring namespace)
                - name: KAFKA_BROKER
                  valueFrom:
                    secretKeyRef:
                      name: kafka-credentials
                      key: KAFKA_BROKER
                - name: KAFKA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: kafka-credentials
                      key: KAFKA_USERNAME
                - name: KAFKA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kafka-credentials
                      key: KAFKA_PASSWORD
                - name: KAFKA_SSL_CA_PEM
                  valueFrom:
                    secretKeyRef:
                      name: kafka-credentials
                      key: KAFKA_SSL_CA_PEM
                - name: ENVIRONMENT
                  value: "testnet"
                - name: KAFKA_TOPIC
                  value: "curation.scores"
                - name: SCORE_BATCH_SIZE
                  value: "1000"
                - name: NORMALIZATION_METHOD
                  value: "z_score_sigmoid"
                - name: SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: scoring-cronjob-secrets
                      key: SENTRY_DSN
                      optional: true
                - name: SENTRY_TRACES_SAMPLE_RATE
                  valueFrom:
                    secretKeyRef:
                      name: scoring-cronjob-secrets
                      key: SENTRY_TRACES_SAMPLE_RATE
                      optional: true
                - name: SENTRY_SEND_DEFAULT_PII
                  valueFrom:
                    secretKeyRef:
                      name: scoring-cronjob-secrets
                      key: SENTRY_SEND_DEFAULT_PII
                      optional: true
                - name: SENTRY_ENVIRONMENT
                  valueFrom:
                    secretKeyRef:
                      name: scoring-cronjob-secrets
                      key: SENTRY_ENVIRONMENT
                      optional: true
                - name: SENTRY_RELEASE
                  valueFrom:
                    secretKeyRef:
                      name: scoring-cronjob-secrets
                      key: SENTRY_RELEASE
                      optional: true
              resources:
                requests:
                  memory: "2048Mi"
                  cpu: "1000m"
                limits:
                  memory: "4096Mi"
                  cpu: "2000m"
