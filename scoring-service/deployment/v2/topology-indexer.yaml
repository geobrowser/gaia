# Topology Indexer Deployment
#
# Consumes CanonicalGraphDiff events from Kafka and persists space distances to PostgreSQL.
# This daemon runs continuously alongside the scoring-service CronJob.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-indexer
  namespace: gaia
  labels:
    app: topology-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: topology-indexer
  template:
    metadata:
      labels:
        app: topology-indexer
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        # geodb-client for the topology distance mirror (GEODB_DERIVED_MIRROR, RUNBOOK section 2f-topology / 24). Dormant while
        # the flag is "0": nothing below is read, and every reference is optional or fails soft, so an absent
        # geodb never blocks a rollout. Same wiring as hermes-pipeline.yaml, but with the SCORES key: a principal
        # that may write derived collections 0, 1, 2, 3, 4, 5, 11, 12, 13 to 19, 20 to 26 and nothing else (geodb-scores-key-job.yaml).
        - name: geodb-bin
          emptyDir: {}
        - name: geodb-space-map
          configMap:
            # Written by the geodb-feeder / serve. Not shipped in these manifests.
            name: geodb-space-map
            optional: true
        - name: geodb-key
          secret:
            secretName: geodb-scores-key
            optional: true
            defaultMode: 0440
            items:
              - key: key
                path: scores.key
      initContainers:
        - name: geodb-setup
          # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
          image: registry.digitalocean.com/geo/geodb:93be2804b7
          imagePullPolicy: IfNotPresent
          # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
          # binding and the mirror stays disabled even if the flag is turned on.
          command:
            - sh
            - -c
            - |
              cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -n "$node" ] && [ -n "$ip" ]; then
                printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
              else
                echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
              fi
              exit 0
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: topology-indexer
          image: registry.digitalocean.com/geo/topology-indexer:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
            - name: geodb-key
              mountPath: /etc/geodb/key
              readOnly: true
          env:
            # Copy scoring_topology_distances into geo-db derived collection 24 (RUNBOOK section 2f-topology), best-effort,
            # after each batch commits and once at start. ON: "1" (the image carries the mirror from #1220).
            - name: GEODB_DERIVED_MIRROR
              value: "1"
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_KEY_PATH
              value: /etc/geodb/key/scores.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            # Database configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scoring-service-credentials
                  key: DATABASE_URL
            # Kafka configuration
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_USERNAME
                  optional: true
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_PASSWORD
                  optional: true
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_SSL_CA_PEM
                  optional: true
            # Consumer configuration
            - name: ENVIRONMENT
              value: "testnet"
            - name: KAFKA_GROUP_ID
              value: "topology-indexer-testnet"
            - name: BATCH_SIZE
              value: "10"
            - name: BATCH_TIMEOUT_MS
              value: "1000"
            # Logging
            - name: RUST_LOG
              value: "info,topology_indexer=debug"
            - name: METRICS_PORT
              value: "9464"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: topology-indexer-secrets
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_TRACES_SAMPLE_RATE
              valueFrom:
                secretKeyRef:
                  name: topology-indexer-secrets
                  key: SENTRY_TRACES_SAMPLE_RATE
                  optional: true
            - name: SENTRY_SEND_DEFAULT_PII
              valueFrom:
                secretKeyRef:
                  name: topology-indexer-secrets
                  key: SENTRY_SEND_DEFAULT_PII
                  optional: true
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: topology-indexer-secrets
                  key: SENTRY_ENVIRONMENT
                  optional: true
            - name: SENTRY_RELEASE
              valueFrom:
                secretKeyRef:
                  name: topology-indexer-secrets
                  key: SENTRY_RELEASE
                  optional: true
            - name: SENTRY_DEBUG
              valueFrom:
                secretKeyRef:
                  name: topology-indexer-secrets
                  key: SENTRY_DEBUG
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: topology-indexer
  namespace: gaia
  labels:
    app: topology-indexer
    # Copied onto every scraped series by the hermes-metrics ServiceMonitor's
    # `targetLabels`, the same as kg-indexer and atlas.
    gaia_namespace: gaia
spec:
  type: ClusterIP
  selector:
    app: topology-indexer
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
