apiVersion: batch/v1
kind: CronJob
metadata:
  name: vote-indexer-new-entity-sweep
  namespace: gaia
  labels:
    app: vote-indexer-new-entity-sweep
spec:
  # Nothing gives a new entity a ranking score, and the Best feed INNER JOINs that score, so an
  # entity nobody has voted on or commented on cannot appear in Best at all (2.27M entities on
  # 2026-09-29). This scores entities created in the last NEW_ENTITY_SWEEP_LOOKBACK_HOURS that
  # have no row. `refresh_entity_ranking_scores` is an idempotent upsert, so overlap is harmless.
  #
  # Hourly like the comment sweep, at :30 so the two do not hit the database together. The
  # cadence is how long a new entity can be missing from Best, and nothing else: a schedule
  # edit, not a code change.
  #
  # No Kafka: this needs DATABASE_URL (plus the geo-db mirror wiring below). Same secret and pod conventions as
  # comment-sweep-cronjob.yaml alongside it.
  schedule: "30 * * * *"
  failedJobsHistoryLimit: 3
  # A sweep is not worth overlapping with itself; the next tick will pick up anything missed.
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            # geodb-client for the entity_type_ranking / entity_topic_ranking mirror into derived collections 0 and 1 (GEODB_DERIVED_MIRROR,
            # RUNBOOK section 2f / 12). Same wiring as vote-indexer.yaml: the SCORES key, which may write derived collections 0 to 5 and 11 to 26.
            # Every reference is optional or fails soft, so an absent geodb never blocks a run.
            - name: geodb-bin
              emptyDir: {}
            - name: geodb-space-map
              configMap:
                # Written by the geodb-feeder / serve. Not shipped in these manifests.
                name: geodb-space-map
                optional: true
            - name: geodb-key
              secret:
                secretName: geodb-scores-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: scores.key
          initContainers:
            - name: geodb-setup
              # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
              image: registry.digitalocean.com/geo/geodb:2eab4e170c
              imagePullPolicy: IfNotPresent
              # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
              # binding and the mirror stays disabled even if the flag is turned on.
              command:
                - sh
                - -c
                - |
                  cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
                  node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
                  ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
                  if [ -n "$node" ] && [ -n "$ip" ]; then
                    printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
                  else
                    echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
                  fi
                  exit 0
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: vote-indexer-new-entity-sweep
              image: registry.digitalocean.com/geo/vote-indexer:latest
              imagePullPolicy: Always
              # One image, three entrypoints — see the vote-indexer Dockerfile.
              command: ["new_entity_sweep"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                  readOnly: true
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
                - name: geodb-key
                  mountPath: /etc/geodb/key
                  readOnly: true
              env:
                # Copy the type, topic and entity ranking-score rows this job writes into geo-db derived collections 0, 1 and 21,
                # best-effort, after the Postgres write commits. votes_count stays with vote-indexer; the entity-scores rows this sweep
                # re-scores have no other mirror, so they are copied here.
                - name: GEODB_DERIVED_MIRROR
                  value: "1"
                - name: GEODB_DERIVED_MIRROR_TABLES
                  value: "entity_type_ranking,entity_topic_ranking,entity_ranking_scores"
                - name: GEODB_DERIVED_BATCH
                  value: "1"
                - name: GEODB_CLIENT_BIN
                  value: /geodb/geodb-client
                - name: GEODB_KEY_PATH
                  value: /etc/geodb/key/scores.key
                - name: GEODB_BINDING_PATH
                  value: /geodb/binding.txt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: scoring-service-credentials
                      key: DATABASE_URL
                # Hours of newly created entities each run scans. Widen it for a one-off
                # backlog run (see new_entity_sweep.rs); the hourly job keeps the default.
                - name: NEW_ENTITY_SWEEP_LOOKBACK_HOURS
                  value: "48"
                - name: RUST_LOG
                  value: "info,vote_indexer=info"
                - name: SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: vote-indexer-secrets
                      key: SENTRY_DSN
                      optional: true
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
