apiVersion: batch/v1
kind: CronJob
metadata:
  name: vote-indexer-comment-sweep
  namespace: gaia
  labels:
    app: vote-indexer-comment-sweep
spec:
  # The ranking score's comment term (migration 0079) has no event-driven trigger: the only
  # thing that recomputes a score is a vote batch, and a comment is not a vote. Without this
  # a commented entity keeps its pre-comment score until an unrelated vote touches it, which
  # looks exactly like the feature not working.
  #
  # Hourly to match ranking-indexer's rolling sweep, the same pattern for the same class of
  # problem. Cadence is a schedule edit, not a code change — the sweep re-scores every
  # commented entity and `refresh_entity_ranking_scores` is an idempotent upsert, so running
  # it more or less often only changes how stale a comment's effect can be.
  #
  # No Kafka: this needs DATABASE_URL (plus the geo-db mirror wiring below). Same secret and pod conventions as
  # vote-indexer.yaml alongside it.
  schedule: "0 * * * *"
  failedJobsHistoryLimit: 3
  # A sweep is not worth overlapping with itself; the next tick will pick up anything missed.
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            # geodb-client for the entity_type_ranking / entity_topic_ranking mirror into derived collections 0 and 1 (GEODB_DERIVED_MIRROR,
            # RUNBOOK section 2f / 12). Same wiring as vote-indexer.yaml: the SCORES key, which may write derived collections 0 to 5 and 11 to 26.
            # Every reference is optional or fails soft, so an absent geodb never blocks a run.
            - name: geodb-bin
              emptyDir: {}
            - name: geodb-space-map
              configMap:
                # Written by the geodb-feeder / serve. Not shipped in these manifests.
                name: geodb-space-map
                optional: true
            - name: geodb-key
              secret:
                secretName: geodb-scores-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: scores.key
          initContainers:
            - name: geodb-setup
              # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
              image: registry.digitalocean.com/geo/geodb:93be2804b7
              imagePullPolicy: IfNotPresent
              # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
              # binding and the mirror stays disabled even if the flag is turned on.
              command:
                - sh
                - -c
                - |
                  cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
                  node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
                  ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
                  if [ -n "$node" ] && [ -n "$ip" ]; then
                    printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
                  else
                    echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
                  fi
                  exit 0
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: vote-indexer-comment-sweep
              image: registry.digitalocean.com/geo/vote-indexer:latest
              imagePullPolicy: Always
              # One image, three entrypoints — see the vote-indexer Dockerfile.
              command: ["comment_sweep"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                  readOnly: true
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
                - name: geodb-key
                  mountPath: /etc/geodb/key
                  readOnly: true
              env:
                # Copy the type and topic ranking rows this job writes into geo-db derived collections 0 and 1, best-effort, after the
                # Postgres write commits. Only those two tables: the votes_count and entity-scores mirrors stay with vote-indexer.
                - name: GEODB_DERIVED_MIRROR
                  value: "1"
                - name: GEODB_DERIVED_MIRROR_TABLES
                  value: "entity_type_ranking,entity_topic_ranking"
                - name: GEODB_DERIVED_BATCH
                  value: "1"
                - name: GEODB_CLIENT_BIN
                  value: /geodb/geodb-client
                - name: GEODB_KEY_PATH
                  value: /etc/geodb/key/scores.key
                - name: GEODB_BINDING_PATH
                  value: /geodb/binding.txt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: scoring-service-credentials
                      key: DATABASE_URL
                - name: RUST_LOG
                  value: "info,vote_indexer=info"
                - name: SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: vote-indexer-secrets
                      key: SENTRY_DSN
                      optional: true
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
