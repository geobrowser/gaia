# Vote Indexer Deployment
#
# Consumes vote events from Kafka and indexes them into PostgreSQL with real-time aggregation.
# This daemon runs continuously alongside the scoring-service CronJob.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-indexer
  namespace: scoring
  labels:
    app: vote-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-indexer
  template:
    metadata:
      labels:
        app: vote-indexer
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: regcred
      containers:
        - name: vote-indexer
          image: registry.digitalocean.com/geo/vote-indexer:latest
          imagePullPolicy: Always
          env:
            # Database configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scoring-service-credentials
                  key: DATABASE_URL
            # Kafka configuration
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: username
                  optional: true
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: password
                  optional: true
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: ca-pem
                  optional: true
            # Consumer configuration
            - name: KAFKA_GROUP_ID
              value: "vote-indexer"
            - name: BATCH_SIZE
              value: "100"
            - name: BATCH_TIMEOUT_MS
              value: "1000"
            # Logging
            - name: RUST_LOG
              value: "info,vote_indexer=debug"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"