# Scoring Service Secrets
#
# This is a template file. The actual secrets should be created manually
# or via a secrets management tool (e.g., sealed-secrets, external-secrets).
#
# DO NOT commit actual credentials to version control.
#
# Required secrets:
#
# 1. Create the scoring namespace:
#    kubectl create namespace scoring
#
# 2. Copy regcred for image pulls:
#    kubectl get secret regcred -n api -o yaml | \
#      sed 's/namespace: api/namespace: scoring/' | \
#      kubectl apply -f -
#
# 3. Create database credentials:
#    kubectl create secret generic scoring-service-credentials \
#      --namespace=scoring \
#      --from-literal=DATABASE_URL=postgresql://user:password@host:5432/dbname
#
# 4. Copy Kafka credentials from kafka namespace:
#    kubectl get secret kafka-credentials -n kafka -o yaml | \
#      sed 's/namespace: kafka/namespace: scoring/' | \
#      kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: scoring-service-credentials
  namespace: scoring
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@host:5432/dbname"

