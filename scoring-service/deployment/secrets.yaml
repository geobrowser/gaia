# Scoring Service credentials for PostgreSQL database
#
# This is a template file. The actual secret should be created manually
# or via a secrets management tool (e.g., sealed-secrets, external-secrets).
#
# To create the secret manually:
#   kubectl create secret generic scoring-service-credentials \
#     --namespace=scoring \
#     --from-literal=DATABASE_URL=postgresql://user:password@host:5432/dbname
#
# DO NOT commit actual credentials to version control.
apiVersion: v1
kind: Secret
metadata:
  name: scoring-service-credentials
  namespace: scoring
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@host:5432/dbname"

