# Scoring Service Secrets
#
# This is a template file. The actual secrets should be created manually
# or via a secrets management tool (e.g., sealed-secrets, external-secrets).
#
# DO NOT commit actual credentials to version control.
#
# Required secrets:
#
# 1. Create the scoring namespace:
#    kubectl create namespace scoring
#
# 2. Copy regcred for image pulls:
#    kubectl get secret regcred -n api -o yaml | \
#      sed 's/namespace: api/namespace: scoring/' | \
#      kubectl apply -f -
#
# 3. Create database credentials (use connection pooler URL, not direct):
#    kubectl create secret generic scoring-service-credentials \
#      --namespace=scoring \
#      --from-literal=DATABASE_URL='postgresql://...pooler.../dbname'
#
# 4. Copy Kafka credentials from kafka namespace:
#    kubectl get secret kafka-credentials -n kafka -o yaml | \
#      sed 's/namespace: kafka/namespace: scoring/' | \
#      kubectl apply -f -
#
# 5. Create vote-indexer Sentry credentials (optional for production monitoring):
#    kubectl create secret generic vote-indexer-secrets \
#      --namespace=scoring \
#      --from-literal=SENTRY_DSN='https://...@o0.ingest.sentry.io/...' \
#      --from-literal=SENTRY_TRACES_SAMPLE_RATE='1.0' \
#      --from-literal=SENTRY_ENVIRONMENT='production' \
#      --from-literal=SENTRY_RELEASE='vote-indexer@1.0.0'
#      --from-literal=SENTRY_SEND_DEFAULT_PII='false'
#
# 6. Create scoring-service (cronjob) Sentry credentials (optional):
#    kubectl create secret generic scoring-cronjob-secrets \
#      --namespace=scoring \
#      --from-literal=SENTRY_DSN='https://...@o0.ingest.sentry.io/...' \
#      --from-literal=SENTRY_TRACES_SAMPLE_RATE='1.0' \
#      --from-literal=SENTRY_ENVIRONMENT='production' \
#      --from-literal=SENTRY_RELEASE='scoring-service@1.0.0'
#      --from-literal=SENTRY_SEND_DEFAULT_PII='false'
apiVersion: v1
kind: Secret
metadata:
  name: scoring-service-credentials
  namespace: scoring
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"  # Connection pooler URL (not direct)

