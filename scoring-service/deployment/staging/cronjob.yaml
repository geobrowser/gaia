apiVersion: batch/v1
kind: CronJob
metadata:
  name: scoring-service
  namespace: scoring-staging
  labels:
    environment: staging
spec:
  schedule: "0 3 * * *"  # Run at 3am every day
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            environment: staging
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: regcred
          containers:
            - name: scoring-service
              image: registry.digitalocean.com/geo/scoring-service:latest
              imagePullPolicy: Always
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: scoring-service-credentials
                      key: DATABASE_URL
                # Output mode: postgres, kafka, or all
                - name: OUTPUT_MODE
                  value: "all"
                # Kafka configuration (uses kafka-credentials secret copied to scoring namespace)
                - name: KAFKA_BROKER
                  valueFrom:
                    secretKeyRef:
                      name: kafka-credentials
                      key: KAFKA_BROKER
                - name: KAFKA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: kafka-credentials
                      key: KAFKA_USERNAME
                - name: KAFKA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kafka-credentials
                      key: KAFKA_PASSWORD
                - name: KAFKA_SSL_CA_PEM
                  valueFrom:
                    secretKeyRef:
                      name: kafka-credentials
                      key: KAFKA_SSL_CA_PEM
                - name: ENVIRONMENT
                  value: "staging"
                - name: KAFKA_TOPIC
                  value: "curation.scores"
                - name: SCORE_BATCH_SIZE
                  value: "1000"
                - name: NORMALIZATION_METHOD
                  value: "z_score_sigmoid"
              resources:
                requests:
                  memory: "4096Mi"
                  cpu: "1000m"
                limits:
                  memory: "8192Mi"
                  cpu: "2000m"
