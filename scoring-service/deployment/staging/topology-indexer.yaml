# Topology Indexer Deployment (Staging)
#
# Consumes CanonicalGraphDiff events from Kafka and persists space distances to PostgreSQL.
# This daemon runs continuously alongside the scoring-service CronJob.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-indexer
  namespace: scoring-staging
  labels:
    app: topology-indexer
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: topology-indexer
  template:
    metadata:
      labels:
        app: topology-indexer
        environment: staging
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: regcred
      containers:
        - name: topology-indexer
          image: registry.digitalocean.com/geo/topology-indexer:latest
          imagePullPolicy: Always
          env:
            # Database configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scoring-service-credentials
                  key: DATABASE_URL
            # Kafka configuration
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_USERNAME
                  optional: true
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_PASSWORD
                  optional: true
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_SSL_CA_PEM
                  optional: true
            # Consumer configuration
            - name: ENVIRONMENT
              value: "staging"
            - name: KAFKA_GROUP_ID
              value: "topology-indexer-staging"
            - name: BATCH_SIZE
              value: "10"
            - name: BATCH_TIMEOUT_MS
              value: "1000"
            # Logging
            - name: RUST_LOG
              value: "info,topology_indexer=debug"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
