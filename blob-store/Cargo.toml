[package]
name = "blob-store"
version = "0.1.0"
edition = "2024"
description = "Small blob-store trait with an S3-compatible backend and a filesystem backend, plus the flag-gated write-through and shadow-read helpers used to move Postgres blob tables to object storage"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
hmac = "0.12"
metrics = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net"] }
