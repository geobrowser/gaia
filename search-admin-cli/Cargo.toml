[package]
name = "search-admin-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for managing OpenSearch indices"

[[bin]]
name = "search-admin"
path = "src/main.rs"

[dependencies]
search-indexer-repository = { path = "../search-indexer-repository" }
search-indexer-shared = { path = "../search-indexer-shared" }

# OpenSearch
opensearch = "2.3.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "time"] }

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Error handling
anyhow = "1.0"
thiserror = "2.0.17"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
