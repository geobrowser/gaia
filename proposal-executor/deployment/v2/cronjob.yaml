apiVersion: batch/v1
kind: CronJob
metadata:
  name: proposal-executor
  namespace: gaia
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 290 # 10s gap before next 5-min CronJob invocation
      backoffLimit: 1 # Don't restart-loop on failure — try again in 5 min
      template:
        spec:
          restartPolicy: Never # CronJob retries via next scheduled run, not restarts
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          imagePullSecrets:
            - name: regcred
          volumes:
            - name: ssl-certs
              emptyDir: {}
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/proposal-executor:latest
              command: ["sh", "-c", "echo \"$DATABASE_SSL_CA\" > /ssl/ca.crt"]
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: proposal-executor
              image: registry.digitalocean.com/geo/proposal-executor:latest
              imagePullPolicy: Always
              env:
                # Secrets (sensitive — from K8s Secret)
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: DATABASE_URL
                - name: EXECUTOR_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: EXECUTOR_PRIVATE_KEY
                - name: PIMLICO_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: PIMLICO_API_KEY
                - name: MEMBERSHIP_BOT_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: MEMBERSHIP_BOT_PRIVATE_KEY
                # Config (non-sensitive — plain values)
                #
                # EXECUTOR_SPACE_ID/MEMBERSHIP_BOT_SPACE_ID below are specific to THIS
                # chain (55516) — SpaceRegistry.generateSpaceId() derives the ID from
                # keccak256("grc20.space", account, nonce, chainId), so it depends on
                # the calling address and chain ID, not just a fixed constant. The old
                # 19411 values (0xc669ec5cfd998cb14ca129a0f9838f78 /
                # 0x4612d0863fe0b321052cb8d404a7afac) belonged to the old chain's
                # Safe-derived executor address and can't be reused here — the executor
                # now uses an EIP-7702 account whose address IS the raw EOA, which is a
                # different address than the old Safe proxy. Registered via
                # registerSpaceId() against each bot's own address on 55516.
                - name: EXECUTOR_SPACE_ID
                  value: "0xc6fdd7ccff1b4f5ba5f81dae4e1eb99b"
                - name: MEMBERSHIP_BOT_SPACE_ID
                  value: "0xf61e6ac5a54f47898ee23ae48a0729ba"
                # GEO-2478: automatic member acceptance did nothing on this
                # cluster because this variable was never set — an empty
                # allowlist means "accept none", so the bot detected requests
                # and admitted no one. These are the same four spaces prod
                # auto-accepts; all four exist on 55516 under the same ids
                # (verified 2026-07-30), since the migration preserved space ids.
                - name: MEMBERSHIP_AUTOACCEPT_SPACE_IDS
                  value: "0xc9f267dcb0d270718c2a3c45a64afd32,0x84a679ce188f061ac9a92380bac2bab5,0x0477636ace64280fc43a9f440a502291,0x29a5122f65295cea9f421ec7a73ac825"
                # Self-owned SpaceRegistry deployed 2026-07-29. The live CronJob
                # was already patched to this address; this manifest still said
                # 0x364231615dcEA33D13C823b13B449DD9F55381E7, so redeploying from
                # the repo would have silently reverted the executor to the old
                # registry. Fixed 2026-07-30 to match the cluster.
                - name: SPACE_REGISTRY_ADDRESS
                  value: "0xCF13491802747e759e1BB8E364bc43045398d1DD"
                - name: RPC_URL
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: RPC_URL
                - name: CHAIN_ID
                  value: "55516"
                # Required because CHAIN_ID=55516 has no Safe infra deployed — the
                # executor uses an EIP-7702 Kernel account via ZeroDev's bundler
                # instead of Safe+Pimlico on this chain (see execute.ts).
                - name: ZERODEV_SPONSORSHIP_RPC_URL
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: ZERODEV_SPONSORSHIP_RPC_URL
                # Optional: Sentry error reporting
                - name: SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: SENTRY_DSN
                      optional: true
                # Trust DigitalOcean's CA cert for database SSL
                - name: NODE_EXTRA_CA_CERTS
                  value: "/ssl/ca.crt"
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
