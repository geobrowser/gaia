apiVersion: batch/v1
kind: CronJob
metadata:
  name: proposal-executor
  namespace: gaia
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 290 # 10s gap before next 5-min CronJob invocation
      backoffLimit: 1 # Don't restart-loop on failure — try again in 5 min
      template:
        spec:
          restartPolicy: Never # CronJob retries via next scheduled run, not restarts
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          imagePullSecrets:
            - name: regcred
          volumes:
            - name: ssl-certs
              emptyDir: {}
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/proposal-executor:latest
              command: ["sh", "-c", "echo \"$DATABASE_SSL_CA\" > /ssl/ca.crt"]
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: proposal-executor
              image: registry.digitalocean.com/geo/proposal-executor:latest
              imagePullPolicy: Always
              env:
                # Secrets (sensitive — from K8s Secret)
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: DATABASE_URL
                - name: EXECUTOR_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: EXECUTOR_PRIVATE_KEY
                - name: PIMLICO_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: PIMLICO_API_KEY
                - name: MEMBERSHIP_BOT_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: MEMBERSHIP_BOT_PRIVATE_KEY
                # Config (non-sensitive — plain values)
                #
                # EXECUTOR_SPACE_ID/MEMBERSHIP_BOT_SPACE_ID below are specific to THIS
                # chain (55516) AND this SpaceRegistry deployment — generateSpaceId()
                # derives the ID from the calling address, an internal per-account
                # nonce, and the chain ID, so a new SpaceRegistry proxy (its own,
                # separate storage) starts each account's nonce independently. These
                # values were re-registered via registerSpaceId() against the new
                # proxy below (2026-07-24); nonces landed at 2 and 3 respectively
                # because both accounts already had earlier registrations on this
                # same new proxy from prior exploratory work. The old 19411 values
                # (0xc669ec5cfd998cb14ca129a0f9838f78 / 0x4612d0863fe0b321052cb8d404a7afac)
                # belonged to the old chain's Safe-derived executor address and can't be
                # reused here — the executor uses an EIP-7702 account whose address IS
                # the raw EOA, a different address than the old Safe proxy.
                - name: EXECUTOR_SPACE_ID
                  value: "0xa98356cee6be405cae013cd55ef934f7"
                - name: MEMBERSHIP_BOT_SPACE_ID
                  value: "0x91c83a14d737420abae4ceb3f7b500c5"
                - name: SPACE_REGISTRY_ADDRESS
                  value: "0x4ee61966cCd1f6A99656def361e9E6e75bCE5eBa"
                - name: RPC_URL
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: RPC_URL
                - name: CHAIN_ID
                  value: "55516"
                # Required because CHAIN_ID=55516 has no Safe infra deployed — the
                # executor uses an EIP-7702 Kernel account via ZeroDev's bundler
                # instead of Safe+Pimlico on this chain (see execute.ts).
                - name: ZERODEV_SPONSORSHIP_RPC_URL
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: ZERODEV_SPONSORSHIP_RPC_URL
                # Optional: Sentry error reporting
                - name: SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: proposal-executor-credentials
                      key: SENTRY_DSN
                      optional: true
                # Trust DigitalOcean's CA cert for database SSL
                - name: NODE_EXTRA_CA_CERTS
                  value: "/ssl/ca.crt"
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
