[package]
name = "ipfs"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
bs58 = "0.5"
grc-20 = "0.4.1"
reqwest = "0.12.9"
sha2 = "0.10"
thiserror = "2.0.3"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "time", "test-util"] }
wiremock = "0.6"
