# geodb-replay-keyed: a one-shot Job that replays a few Kafka offsets through the keyed-record handlers whose intents
# were dead-lettered (`connect: Refused`, errors.jsonl) while serve was unreachable. Same image, volume, keys and guards
# as geodb-proposal-status-backfill-job.yaml. A consumer-group rewind cannot do this: a keyed consumer skips every offset
# at or below its own offset file's last done offset. This Job reads the offsets directly and moves no offset. See
# geodb/RUNBOOK.md section 2b-quater-replay and geodb-feeder/src/replay-keyed-main.ts.
#
# NOT in deploy-v2: it runs by hand. The dry run (reads Kafka, writes nothing) needs no stopped feeder; --apply needs
# Deployment geodb-feeder scaled to 0 (the Job mounts the feeder's RWO state volume and refuses while any feeder
# consumer group has members). Placeholders are filled at apply time:
#   GEODB_TAG=$(awk '/^ *- name: serve$/{s=1} s && /image: registry.digitalocean.com\/geo\/geodb:/{sub(/.*geodb:/,""); print; exit}' geodb.yaml)
#   sed -e "s|geodb-feeder:latest|geodb-feeder:$TAG|" -e "s|geodb:GEODB_TAG|geodb:$GEODB_TAG|" \
#       -e "s|__FAMILY__|governance|" -e "s|__PARTITION__|0|" -e "s|__OFFSETS__|172829-172833|" -e "s|__MODE__|--dry-run|" \
#       geodb-replay-keyed-job.yaml | kubectl apply -f -
# --family governance (space.governance: proposal status, versions and votes) or edit-meta (knowledge.edits). The GEODB_*
# values below copy geodb.yaml's feeder; change them together. Rerunning is safe (keyed ids are fixed). Delete the Job
# before applying it again: a Job's pod template is immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: geodb-replay-keyed
  namespace: gaia
  labels:
    app: geodb-replay-keyed
spec:
  # A failure stops here and is read from the logs; a rerun is a deliberate, fresh apply.
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        geodb-client: "true"
        app: geodb-replay-keyed
    spec:
      serviceAccountName: geodb
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: geodb-feeder-state
        - name: geodb-bin
          emptyDir: {}
        - name: space-map
          configMap:
            name: geodb-space-map
            optional: true
        - name: writer-key
          secret:
            secretName: geodb-writer-key
            defaultMode: 0440
            items:
              - key: key
                path: writer.key
      initContainers:
        # Same as the feeder's: the pinned geodb-client and a binding to serve's node id.
        - name: geodb-setup
          image: registry.digitalocean.com/geo/geodb:GEODB_TAG
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp /usr/local/bin/geodb-client /geodb/geodb-client
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -z "$node" ] || [ -z "$ip" ]; then
                echo "geodb-setup: serve has not published node-id yet, or no geodb Service"
                exit 1
              fi
              printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: replay-keyed
          image: registry.digitalocean.com/geo/geodb-feeder:latest
          imagePullPolicy: Always
          command: ["node", "dist/replay-keyed-main.js"]
          args: ["--family", "__FAMILY__", "--partition", "__PARTITION__", "--offsets", "__OFFSETS__", "__MODE__"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            # The live feeder's values (geodb.yaml): the handlers must write what the consumers would have.
            - name: GEODB_RECORD_KEYS
              value: "1"
            - name: GEODB_PROPOSAL_STATUS
              value: "1"
            - name: GEODB_PROPOSAL_VERSIONS
              value: "1"
            - name: GEODB_PROPOSAL_VERSION_PROPOSER_SPACE
              value: "1"
            - name: GEODB_PROPOSAL_VOTES
              value: "1"
            - name: GEODB_EDIT_META
              value: "1"
            - name: ENVIRONMENT
              value: testnet
            - name: KAFKA_GROUP_ID
              value: geodb-feeder-v1-testnet
            - name: DATA_DIR
              value: /data
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_KEY_PATH
              value: /etc/geodb/writer-key/writer.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            - name: GEODB_SEALER_FILE
              value: /etc/geodb/space-map/sealer-id
            - name: METRICS_PORT
              value: "9090"
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: geodb-feeder-kafka
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: geodb-feeder-kafka
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geodb-feeder-kafka
                  key: KAFKA_PASSWORD
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: geodb-feeder-kafka
                  key: KAFKA_SSL_CA_PEM
          volumeMounts:
            - name: state
              mountPath: /data
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
            - name: writer-key
              mountPath: /etc/geodb/writer-key
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
