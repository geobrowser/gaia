# Scheduled VolumeSnapshots of the geo-db store (PVC data-geodb-0) and the feeder's state (PVC geodb-feeder-state).
# Snapshots are the only recovery source for geo-db: Kafka keeps 7 days of edits, and the backfill Jobs write
# straight into the store. See geodb/RUNBOOK.md §9 for why, how to take one by hand and how to restore.
#
# Order matters and is the whole consistency argument: the feeder-state snapshot is taken first and must be
# readyToUse before the data snapshot is created. The state therefore never runs ahead of the data, and a restore
# replays edits the data already holds (idempotent) rather than skipping ones it lacks.
#
# Retention: the newest KEEP pairs carrying the labels below. Snapshots without them (the hand-made pretimes-*,
# posttimes-*, premigrate-* ...) are never selected, so never deleted.
#
# Shipped with deploy-v2 service geodb-feeder (it is listed with geodb-feeder.yaml). Applying this file creates the
# CronJob; nothing runs until its first schedule, or until:
#   kubectl -n gaia create job --from=cronjob/geodb-snapshot geodb-snapshot-first
apiVersion: v1
kind: ServiceAccount
metadata:
  name: geodb-snapshot
  namespace: gaia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geodb-snapshot
  namespace: gaia
rules:
  # Create, wait for and prune VolumeSnapshots. Nothing else: no scale on the feeder, no secrets, no pods.
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Preflight: both PVCs exist and are Bound.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["data-geodb-0", "geodb-feeder-state"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geodb-snapshot
  namespace: gaia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: geodb-snapshot
subjects:
  - kind: ServiceAccount
    name: geodb-snapshot
    namespace: gaia
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: geodb-snapshot
  namespace: gaia
  labels:
    app: geodb-snapshot
spec:
  schedule: "17 9 * * *" # 09:17 UTC daily (01:17 PST), off the hour marks the other CronJobs use
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: geodb-snapshot
    spec:
      backoffLimit: 0 # a failed run is read from its logs; the next day's run is the retry
      activeDeadlineSeconds: 1500 # the script's own waits total at most 2 x 600 s
      ttlSecondsAfterFinished: 604800 # a failed Job stays a week so kube_job_failed keeps firing until looked at
      template:
        metadata:
          labels:
            app: geodb-snapshot
        spec:
          serviceAccountName: geodb-snapshot
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              # kubectl + bash. Docker Hub image, pinned to the cluster's server version (1.36.5, same minor).
              image: alpine/k8s:1.36.5
              imagePullPolicy: IfNotPresent
              env:
                - name: KEEP
                  value: "7" # pairs kept; the newest KEEP stamps survive a successful run
                - name: READY_TIMEOUT
                  value: "600s" # per snapshot (measured: 4 s each, so this is 150x headroom)
                - name: SNAPSHOT_CAP
                  value: "25" # DigitalOcean per-volume VolumeSnapshot limit
                - name: SNAPSHOT_KIND
                  value: "scheduled"
                - name: NAME_PREFIX
                  value: "sched"
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              command: ["bash", "-ceu"]
              args:
                - |
                  set -o pipefail
                  SEL="app=geodb-snapshot,snapshot-kind=${SNAPSHOT_KIND}"
                  STAMP="$(date -u +%Y%m%dt%H%M%Sz)"
                  STATE_PVC=geodb-feeder-state
                  DATA_PVC=data-geodb-0
                  CAP="${SNAPSHOT_CAP:-25}"

                  snap() { # <pvc>: create the VolumeSnapshot, labelled so retention can find it and nothing else
                    cat <<YAML | kubectl create -f -
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: ${NAME_PREFIX}-${STAMP}-$1
                    namespace: ${NAMESPACE}
                    labels:
                      app: geodb-snapshot
                      snapshot-kind: ${SNAPSHOT_KIND}
                      snapshot-stamp: "${STAMP}"
                      snapshot-pvc: $1
                  spec:
                    volumeSnapshotClassName: do-block-storage
                    source:
                      persistentVolumeClaimName: $1
                  YAML
                  }
                  ready() { # <pvc>: block until readyToUse, or fail
                    kubectl wait "volumesnapshot/${NAME_PREFIX}-${STAMP}-$1" --for=jsonpath='{.status.readyToUse}'=true --timeout="${READY_TIMEOUT}"
                  }

                  STATE_CREATED=0
                  STATE_READY=0
                  DATA_CREATED=0
                  DATA_READY=0
                  CLEAN=0
                  cleanup_this_run() { # EXIT trap: remove incomplete snapshots; preserve a clean data-geodb-0 snapshot
                    [ "${CLEAN}" = 1 ] && return 0
                    if [ "${STATE_CREATED}" = 1 ] && [ "${STATE_READY}" = 0 ]; then
                      echo "FAILED: removing incomplete snapshot ${NAME_PREFIX}-${STAMP}-${STATE_PVC}" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${STATE_PVC}" --ignore-not-found --wait=false || true
                    fi
                    if [ "${DATA_CREATED}" = 1 ] && [ "${DATA_READY}" = 0 ]; then
                      echo "FAILED: removing incomplete snapshot ${NAME_PREFIX}-${STAMP}-${DATA_PVC}" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${DATA_PVC}" --ignore-not-found --wait=false || true
                    fi
                    if [ "${DATA_READY}" = 0 ] && [ "${STATE_READY}" = 1 ]; then
                      echo "FAILED: removing unpaired snapshot ${NAME_PREFIX}-${STAMP}-${STATE_PVC} because ${DATA_PVC} did not succeed" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${STATE_PVC}" --ignore-not-found --wait=false || true
                    fi
                  }
                  trap cleanup_this_run EXIT

                  for pvc in "${STATE_PVC}" "${DATA_PVC}"; do
                    phase="$(kubectl get pvc "${pvc}" -o jsonpath='{.status.phase}')"
                    [ "${phase}" = Bound ] || { echo "pvc ${pvc} is ${phase}, not Bound" >&2; false; }
                  done

                  # 0. Pre-create per-PVC VolumeSnapshot count diagnostic vs DigitalOcean's per-volume cap.
                  all_snaps="$(kubectl get volumesnapshot -o jsonpath='{range .items[*]}{.spec.source.persistentVolumeClaimName}{"|"}{.metadata.name}{"|"}{.metadata.labels.app}{"|"}{.metadata.labels.snapshot-kind}{"\n"}{end}')"

                  count_pvc_snaps() { # <pvc>: logs per-PVC count + manual snapshot names to stderr, prints total to stdout
                    local pvc="$1" total=0 sched=0 manual=0 manual_list=""
                    local row_pvc row_name row_app row_kind
                    while IFS='|' read -r row_pvc row_name row_app row_kind; do
                      [ -z "${row_pvc}" ] && continue
                      [ "${row_pvc}" = "${pvc}" ] || continue
                      total=$((total + 1))
                      if [ "${row_app}" = "geodb-snapshot" ] && [ -n "${row_kind}" ]; then
                        sched=$((sched + 1))
                      else
                        manual=$((manual + 1))
                        if [ -n "${manual_list}" ]; then
                          manual_list="${manual_list}, ${row_name}"
                        else
                          manual_list="${row_name}"
                        fi
                      fi
                    done <<< "${all_snaps}"
                    echo "preflight snapshot count: pvc=${pvc} total=${total}/${CAP} scheduled=${sched} manual=${manual}" >&2
                    if [ "${manual}" -gt 0 ]; then
                      echo "preflight manual/unlabelled snapshots on ${pvc} (${manual}): ${manual_list}" >&2
                    fi
                    printf '%s\n' "${total}"
                  }

                  STATE_COUNT="$(count_pvc_snaps "${STATE_PVC}")"
                  DATA_COUNT="$(count_pvc_snaps "${DATA_PVC}")"

                  # 1. feeder state first, and wait for it, so its offsets are older than anything in the data snapshot.
                  #    A cap refusal or timeout on feeder-state must not prevent data-geodb-0 from taking its snapshot.
                  if [ "${STATE_COUNT}" -ge "${CAP}" ]; then
                    echo "ERROR: pvc=${STATE_PVC} is at/over cap (${STATE_COUNT}/${CAP}); skipping create for ${STATE_PVC} and continuing to ${DATA_PVC}" >&2
                  else
                    STATE_CREATED=1
                    if snap "${STATE_PVC}" && ready "${STATE_PVC}"; then
                      STATE_READY=1
                    else
                      echo "ERROR: snapshot failed or timed out for pvc=${STATE_PVC} (stamp ${STAMP}); removing failed ${STATE_PVC} snapshot only and continuing to ${DATA_PVC}" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${STATE_PVC}" --ignore-not-found --wait=false || true
                      STATE_CREATED=0
                    fi
                  fi

                  # 2. then the store. Always attempted even if feeder-state failed.
                  if [ "${DATA_COUNT}" -ge "${CAP}" ]; then
                    echo "ERROR: pvc=${DATA_PVC} is at/over cap (${DATA_COUNT}/${CAP}); skipping create for ${DATA_PVC}" >&2
                  else
                    DATA_CREATED=1
                    if snap "${DATA_PVC}" && ready "${DATA_PVC}"; then
                      DATA_READY=1
                    else
                      echo "ERROR: snapshot failed or timed out for pvc=${DATA_PVC} (stamp ${STAMP}); removing failed ${DATA_PVC} snapshot" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${DATA_PVC}" --ignore-not-found --wait=false || true
                      DATA_CREATED=0
                    fi
                  fi

                  if [ "${STATE_READY}" = 1 ] && [ "${DATA_READY}" = 1 ]; then
                    CLEAN=1
                    echo "OK: pair ${STAMP} ready"
                  else
                    if [ "${DATA_READY}" = 0 ] && [ "${STATE_READY}" = 1 ]; then
                      echo "FAILED: removing unpaired snapshot ${NAME_PREFIX}-${STAMP}-${STATE_PVC} because ${DATA_PVC} failed" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${STATE_PVC}" --ignore-not-found --wait=false || true
                    fi
                    CLEAN=1
                    if [ "${STATE_READY}" = 0 ] && [ "${DATA_READY}" = 1 ]; then
                      echo "FAILED: partial run (stamp ${STAMP}): ${STATE_PVC}=FAILED ${DATA_PVC}=OK; preserved ${NAME_PREFIX}-${STAMP}-${DATA_PVC}; retention skipped" >&2
                    else
                      echo "FAILED: snapshot run incomplete (stamp ${STAMP}): ${STATE_PVC}=$([ "${STATE_READY}" = 1 ] && echo OK || echo FAILED) ${DATA_PVC}=FAILED; retention skipped" >&2
                    fi
                    exit 1
                  fi

                  # 3. retention, only after the new pair is ready: keep the newest KEEP stamps, delete the rest.
                  # A failed or partial run never reaches here, so it never costs a good pair.
                  stamps="$(kubectl get volumesnapshot -l "${SEL}" -o jsonpath='{range .items[*]}{.metadata.labels.snapshot-stamp}{"\n"}{end}' | sort -u)"
                  old="$(printf '%s\n' "${stamps}" | grep -v '^$' | awk -v k="${KEEP}" '{a[NR]=$0} END{for(i=1;i<=NR-k;i++)print a[i]}')"
                  while IFS= read -r s; do
                    [ -z "${s}" ] && continue
                    echo "pruning pair ${s}"
                    kubectl delete volumesnapshot -l "${SEL},snapshot-stamp=${s}" --wait=false
                  done <<< "${old}"
                  kubectl get volumesnapshot -l "${SEL}" --sort-by=.metadata.creationTimestamp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
---
# The 4-hourly pair (plan 10.24 section 4): cuts the worst-case RPO of the durable rows from 24 h to about 4 h. Same
# script and the same ServiceAccount as the daily CronJob above, with its own snapshot-kind (scheduled-4h) and name
# prefix (sched4h-), so the two retentions never see each other's pairs: the daily one keeps 7 days, this one the
# newest 6 (24 h). Both stay far inside the 6-day pair-age limit (Kafka keeps 7 days). The schedule is 30 min clear of
# the daily run so the two never snapshot at once. Worst-case volume: 6 more pairs of 55 Gi source size.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: geodb-snapshot-4h
  namespace: gaia
  labels:
    app: geodb-snapshot
spec:
  schedule: "47 */4 * * *" # 00:47, 04:47 ... 20:47 UTC: every 4 h, 30 min clear of the daily 09:17 run and off the hour marks
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: geodb-snapshot
    spec:
      backoffLimit: 0 # a failed run is read from its logs; the next run, 4 h later, is the retry
      activeDeadlineSeconds: 1500 # the script's own waits total at most 2 x 600 s
      ttlSecondsAfterFinished: 604800 # a failed Job stays a week so kube_job_failed keeps firing until looked at
      template:
        metadata:
          labels:
            app: geodb-snapshot
        spec:
          serviceAccountName: geodb-snapshot
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              # kubectl + bash. Docker Hub image, pinned to the cluster's server version (1.36.5, same minor).
              image: alpine/k8s:1.36.5
              imagePullPolicy: IfNotPresent
              env:
                - name: KEEP
                  value: "6" # pairs kept: 24 h of 4-hourly pairs; the newest KEEP stamps of THIS kind survive a successful run
                - name: READY_TIMEOUT
                  value: "600s" # per snapshot (measured: 4 s each, so this is 150x headroom)
                - name: SNAPSHOT_CAP
                  value: "25" # DigitalOcean per-volume VolumeSnapshot limit
                - name: SNAPSHOT_KIND
                  value: "scheduled-4h"
                - name: NAME_PREFIX
                  value: "sched4h"
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              command: ["bash", "-ceu"]
              args:
                - |
                  set -o pipefail
                  SEL="app=geodb-snapshot,snapshot-kind=${SNAPSHOT_KIND}"
                  STAMP="$(date -u +%Y%m%dt%H%M%Sz)"
                  STATE_PVC=geodb-feeder-state
                  DATA_PVC=data-geodb-0
                  CAP="${SNAPSHOT_CAP:-25}"

                  snap() { # <pvc>: create the VolumeSnapshot, labelled so retention can find it and nothing else
                    cat <<YAML | kubectl create -f -
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: ${NAME_PREFIX}-${STAMP}-$1
                    namespace: ${NAMESPACE}
                    labels:
                      app: geodb-snapshot
                      snapshot-kind: ${SNAPSHOT_KIND}
                      snapshot-stamp: "${STAMP}"
                      snapshot-pvc: $1
                  spec:
                    volumeSnapshotClassName: do-block-storage
                    source:
                      persistentVolumeClaimName: $1
                  YAML
                  }
                  ready() { # <pvc>: block until readyToUse, or fail
                    kubectl wait "volumesnapshot/${NAME_PREFIX}-${STAMP}-$1" --for=jsonpath='{.status.readyToUse}'=true --timeout="${READY_TIMEOUT}"
                  }

                  STATE_CREATED=0
                  STATE_READY=0
                  DATA_CREATED=0
                  DATA_READY=0
                  CLEAN=0
                  cleanup_this_run() { # EXIT trap: remove incomplete snapshots; preserve a clean data-geodb-0 snapshot
                    [ "${CLEAN}" = 1 ] && return 0
                    if [ "${STATE_CREATED}" = 1 ] && [ "${STATE_READY}" = 0 ]; then
                      echo "FAILED: removing incomplete snapshot ${NAME_PREFIX}-${STAMP}-${STATE_PVC}" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${STATE_PVC}" --ignore-not-found --wait=false || true
                    fi
                    if [ "${DATA_CREATED}" = 1 ] && [ "${DATA_READY}" = 0 ]; then
                      echo "FAILED: removing incomplete snapshot ${NAME_PREFIX}-${STAMP}-${DATA_PVC}" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${DATA_PVC}" --ignore-not-found --wait=false || true
                    fi
                    if [ "${DATA_READY}" = 0 ] && [ "${STATE_READY}" = 1 ]; then
                      echo "FAILED: removing unpaired snapshot ${NAME_PREFIX}-${STAMP}-${STATE_PVC} because ${DATA_PVC} did not succeed" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${STATE_PVC}" --ignore-not-found --wait=false || true
                    fi
                  }
                  trap cleanup_this_run EXIT

                  for pvc in "${STATE_PVC}" "${DATA_PVC}"; do
                    phase="$(kubectl get pvc "${pvc}" -o jsonpath='{.status.phase}')"
                    [ "${phase}" = Bound ] || { echo "pvc ${pvc} is ${phase}, not Bound" >&2; false; }
                  done

                  # 0. Pre-create per-PVC VolumeSnapshot count diagnostic vs DigitalOcean's per-volume cap.
                  all_snaps="$(kubectl get volumesnapshot -o jsonpath='{range .items[*]}{.spec.source.persistentVolumeClaimName}{"|"}{.metadata.name}{"|"}{.metadata.labels.app}{"|"}{.metadata.labels.snapshot-kind}{"\n"}{end}')"

                  count_pvc_snaps() { # <pvc>: logs per-PVC count + manual snapshot names to stderr, prints total to stdout
                    local pvc="$1" total=0 sched=0 manual=0 manual_list=""
                    local row_pvc row_name row_app row_kind
                    while IFS='|' read -r row_pvc row_name row_app row_kind; do
                      [ -z "${row_pvc}" ] && continue
                      [ "${row_pvc}" = "${pvc}" ] || continue
                      total=$((total + 1))
                      if [ "${row_app}" = "geodb-snapshot" ] && [ -n "${row_kind}" ]; then
                        sched=$((sched + 1))
                      else
                        manual=$((manual + 1))
                        if [ -n "${manual_list}" ]; then
                          manual_list="${manual_list}, ${row_name}"
                        else
                          manual_list="${row_name}"
                        fi
                      fi
                    done <<< "${all_snaps}"
                    echo "preflight snapshot count: pvc=${pvc} total=${total}/${CAP} scheduled=${sched} manual=${manual}" >&2
                    if [ "${manual}" -gt 0 ]; then
                      echo "preflight manual/unlabelled snapshots on ${pvc} (${manual}): ${manual_list}" >&2
                    fi
                    printf '%s\n' "${total}"
                  }

                  STATE_COUNT="$(count_pvc_snaps "${STATE_PVC}")"
                  DATA_COUNT="$(count_pvc_snaps "${DATA_PVC}")"

                  # 1. feeder state first, and wait for it, so its offsets are older than anything in the data snapshot.
                  #    A cap refusal or timeout on feeder-state must not prevent data-geodb-0 from taking its snapshot.
                  if [ "${STATE_COUNT}" -ge "${CAP}" ]; then
                    echo "ERROR: pvc=${STATE_PVC} is at/over cap (${STATE_COUNT}/${CAP}); skipping create for ${STATE_PVC} and continuing to ${DATA_PVC}" >&2
                  else
                    STATE_CREATED=1
                    if snap "${STATE_PVC}" && ready "${STATE_PVC}"; then
                      STATE_READY=1
                    else
                      echo "ERROR: snapshot failed or timed out for pvc=${STATE_PVC} (stamp ${STAMP}); removing failed ${STATE_PVC} snapshot only and continuing to ${DATA_PVC}" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${STATE_PVC}" --ignore-not-found --wait=false || true
                      STATE_CREATED=0
                    fi
                  fi

                  # 2. then the store. Always attempted even if feeder-state failed.
                  if [ "${DATA_COUNT}" -ge "${CAP}" ]; then
                    echo "ERROR: pvc=${DATA_PVC} is at/over cap (${DATA_COUNT}/${CAP}); skipping create for ${DATA_PVC}" >&2
                  else
                    DATA_CREATED=1
                    if snap "${DATA_PVC}" && ready "${DATA_PVC}"; then
                      DATA_READY=1
                    else
                      echo "ERROR: snapshot failed or timed out for pvc=${DATA_PVC} (stamp ${STAMP}); removing failed ${DATA_PVC} snapshot" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${DATA_PVC}" --ignore-not-found --wait=false || true
                      DATA_CREATED=0
                    fi
                  fi

                  if [ "${STATE_READY}" = 1 ] && [ "${DATA_READY}" = 1 ]; then
                    CLEAN=1
                    echo "OK: pair ${STAMP} ready"
                  else
                    if [ "${DATA_READY}" = 0 ] && [ "${STATE_READY}" = 1 ]; then
                      echo "FAILED: removing unpaired snapshot ${NAME_PREFIX}-${STAMP}-${STATE_PVC} because ${DATA_PVC} failed" >&2
                      kubectl delete volumesnapshot "${NAME_PREFIX}-${STAMP}-${STATE_PVC}" --ignore-not-found --wait=false || true
                    fi
                    CLEAN=1
                    if [ "${STATE_READY}" = 0 ] && [ "${DATA_READY}" = 1 ]; then
                      echo "FAILED: partial run (stamp ${STAMP}): ${STATE_PVC}=FAILED ${DATA_PVC}=OK; preserved ${NAME_PREFIX}-${STAMP}-${DATA_PVC}; retention skipped" >&2
                    else
                      echo "FAILED: snapshot run incomplete (stamp ${STAMP}): ${STATE_PVC}=$([ "${STATE_READY}" = 1 ] && echo OK || echo FAILED) ${DATA_PVC}=FAILED; retention skipped" >&2
                    fi
                    exit 1
                  fi

                  # 3. retention, only after the new pair is ready: keep the newest KEEP stamps, delete the rest.
                  # A failed or partial run never reaches here, so it never costs a good pair.
                  stamps="$(kubectl get volumesnapshot -l "${SEL}" -o jsonpath='{range .items[*]}{.metadata.labels.snapshot-stamp}{"\n"}{end}' | sort -u)"
                  old="$(printf '%s\n' "${stamps}" | grep -v '^$' | awk -v k="${KEEP}" '{a[NR]=$0} END{for(i=1;i<=NR-k;i++)print a[i]}')"
                  while IFS= read -r s; do
                    [ -z "${s}" ] && continue
                    echo "pruning pair ${s}"
                    kubectl delete volumesnapshot -l "${SEL},snapshot-stamp=${s}" --wait=false
                  done <<< "${old}"
                  kubectl get volumesnapshot -l "${SEL}" --sort-by=.metadata.creationTimestamp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
