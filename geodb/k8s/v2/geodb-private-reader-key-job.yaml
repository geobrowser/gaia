# One-shot Job: mints the api's private reader key INSIDE the cluster. The private key is generated by geodb-client
# in the pod's memory-backed volume and written straight into Secret geodb-private-reader-key through the API; it
# never reaches a terminal, a file on a laptop, or git. The Secret holds `key` (the seed) and `keyid` (public).
#
# What the key is for: derived collections 28 (user_topic_signals) and 29 (feed_user_seen_daily) hold per-person rows
# and are restricted (`derived_restricted = 27,28,29`, geo-db 9b871ed4e4). The shared reader key (geodb-reader-key) has
# no `derived_read=` and is mounted by every indexer, so it is not widened. Instead serve's supervisor, when
# GEODB_PRIVATE_READER_KEYID is set, registers
#   principal = <keyid> read=- write=- publish=- derived_read=28,29
# a key that reads those two restricted collections (and, like any authenticated session, the unrestricted ones) and
# no Space, no graph write, no publish. Only the api mounts it (api.yaml, Secret geodb-private-reader-key, optional).
#
# NOT in deploy-v2: applied by hand, in this order (each step is the lead's; none is applied by the PR that adds this):
#   1. Build a geodb image whose supervisor.sh has the GEODB_PRIVATE_READER_KEYID line (build-geodb-image), or confirm
#      the pinned one does.
#   2. Mint the key. Fill the image placeholder from geodb.yaml's pin:
#        GEODB_TAG=$(awk '/^ *- name: serve$/{s=1} s && /image: registry.digitalocean.com\/geo\/geodb:/{sub(/.*geodb:/,""); print; exit}' geodb.yaml)
#        sed -e "s|geodb:GEODB_TAG|geodb:$GEODB_TAG|" geodb-private-reader-key-job.yaml | kubectl apply -f -
#   3. Give serve the key id: add to geodb.yaml's serve env, beside GEODB_SCORES_KEYID,
#        - name: GEODB_PRIVATE_READER_KEYID
#          valueFrom:
#            secretKeyRef:
#              name: geodb-private-reader-key
#              key: keyid
#              optional: true
#      and roll serve (deploy-v2 geodb-feeder applies geodb.yaml). The binding then carries the principal.
#   4. Roll the api so its optional volume picks up the Secret, then set GEODB_PRIVATE_READERS_SHADOW=1.
#
# Idempotent: if the Secret exists the Job exits 0 and changes nothing (it never overwrites a key). To rotate,
# delete the Secret, delete the Job, apply again, then restart serve and the api. Delete the Job before applying
# it again: a Job's pod template is immutable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: geodb-private-reader-keygen
  namespace: gaia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geodb-private-reader-keygen
  namespace: gaia
rules:
  # create cannot be limited by name; it can only create, never read or change a Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geodb-private-reader-keygen
  namespace: gaia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: geodb-private-reader-keygen
subjects:
  - kind: ServiceAccount
    name: geodb-private-reader-keygen
    namespace: gaia
---
apiVersion: batch/v1
kind: Job
metadata:
  name: geodb-private-reader-key
  namespace: gaia
  labels:
    app: geodb-private-reader-key
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: geodb-private-reader-key
    spec:
      serviceAccountName: geodb-private-reader-keygen
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: scratch
          emptyDir:
            medium: Memory
      containers:
        - name: keygen
          image: registry.digitalocean.com/geo/geodb:GEODB_TAG
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              api="https://$KUBERNETES_SERVICE_HOST:${KUBERNETES_SERVICE_PORT:-443}/api/v1/namespaces/$(cat $SA/namespace)/secrets"
              cd /scratch
              geodb-client --key private-reader.key keygen > private-reader.keyid
              id=$(tr -d ' \n' < private-reader.keyid)
              case "$id" in *[!0-9a-f]*|"") echo "keygen printed something other than a key id; nothing written"; exit 1 ;; esac
              [ "${#id}" -eq 64 ] || { echo "key id is not 64 hex digits; nothing written"; exit 1; }
              body="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"geodb-private-reader-key\"},\"data\":{\"key\":\"$(base64 -w0 private-reader.key)\",\"keyid\":\"$(printf %s "$id" | base64 -w0)\"}}"
              code=$(printf %s "$body" | curl -s -o /dev/null -w '%{http_code}' --max-time 30 --cacert $SA/ca.crt \
                -H "Authorization: Bearer $(cat $SA/token)" -H 'Content-Type: application/json' \
                -X POST --data-binary @- "$api")
              rm -f private-reader.key private-reader.keyid
              case "$code" in
                201) echo "created Secret geodb-private-reader-key; key id $id" ;;
                409) echo "Secret geodb-private-reader-key already exists; left as is" ;;
                *) echo "create failed: HTTP $code"; exit 1 ;;
              esac
          volumeMounts:
            - name: scratch
              mountPath: /scratch
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
