# geo-db replay-edit: a one-shot Job that re-applies ONE edit kg-indexer dropped, through the feeder's own translator
# (plan 22 section 21 row B1; the geo-db twin of kg-indexer's `replay_edit`, with `check_replay_safety` built in).
# Same image, volume, keys and guards as geodb-held-repair-job.yaml. It fetches the payload from the IPFS gateway,
# translates it as the live consumer does, and REFUSES (exit 2) when any entity the edit touches already holds an
# `updatedAt` newer than the edit's block time, or holds none it can read. It reads and writes no Postgres and needs
# no Kafka. See geodb/RUNBOOK.md §2b-quater and geodb-feeder/src/replayEdit.ts.
#
# NOT in deploy-v2: it runs by hand. The first run is a dry run (it needs no stopped feeder); `--apply` needs the
# feeder scaled to 0, because the Job mounts the feeder's RWO state volume and writes its journals. Placeholders are
# replaced at run time and the Job refuses to start if one is left in:
#   sed -e "s|geodb-feeder:latest|geodb-feeder:$TAG|" -e "s|__URI__|ipfs://<cid>|" -e "s|__SPACE__|<gaia space id>|" \
#       -e "s|__BLOCK__|<n>|" -e "s|__CREATED_AT__|<unix seconds>|" -e "s|__MODE__|--dry-run|" \
#       geodb-replay-edit-job.yaml | kubectl apply -f -
# Delete the Job before applying it again: a Job's pod template is immutable. A rerun of an applied edit is a no-op
# (equal updatedAt passes the check, and each chunk is sent under an idempotency key).
apiVersion: batch/v1
kind: Job
metadata:
  name: geodb-replay-edit
  namespace: gaia
  labels:
    app: geodb-replay-edit
spec:
  # A failure stops here and is read from the logs; a rerun is a deliberate, fresh apply.
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        geodb-client: "true"
        app: geodb-replay-edit
    spec:
      serviceAccountName: geodb
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: geodb-feeder-state
        - name: geodb-bin
          emptyDir: {}
        - name: space-map
          configMap:
            name: geodb-space-map
            optional: true
        - name: writer-key
          secret:
            secretName: geodb-writer-key
            defaultMode: 0440
            items:
              - key: key
                path: writer.key
        # The read-back of known entities uses the api's read-only key: the same grant the card route reads with.
        - name: reader-key
          secret:
            secretName: geodb-reader-key
            defaultMode: 0440
            items:
              - key: key
                path: reader.key
      initContainers:
        # Same as the feeder's: the pinned geodb-client and a binding to serve's node id.
        - name: geodb-setup
          image: registry.digitalocean.com/geo/geodb:8cba4da996
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp /usr/local/bin/geodb-client /geodb/geodb-client
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -z "$node" ] || [ -z "$ip" ]; then
                echo "geodb-setup: serve has not published node-id yet, or no geodb Service"
                exit 1
              fi
              printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: replay-edit
          image: registry.digitalocean.com/geo/geodb-feeder:latest
          imagePullPolicy: Always
          command: ["node", "dist/replay-edit-main.js"]
          args: ["--uri", "__URI__", "--space", "__SPACE__", "--block", "__BLOCK__", "--created-at", "__CREATED_AT__", "__MODE__"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # The feeder's deployed values (geodb.yaml); the translation must match what the live consumer would write.
            - name: GEODB_ENTITY_TIMES
              value: "1"
            - name: GEODB_RELATION_POSITIONS
              value: "0"
            - name: GEODB_RECORD_KEYS
              value: "1"
            - name: REPLAY_EDIT_IPFS_GATEWAY
              value: https://gateway.mesh3.network/ipfs
            - name: ENVIRONMENT
              value: testnet
            - name: DATA_DIR
              value: /data
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_KEY_PATH
              value: /etc/geodb/writer-key/writer.key
            - name: GEODB_READER_KEY_PATH
              value: /etc/geodb/reader-key/reader.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            - name: GEODB_SEALER_FILE
              value: /etc/geodb/space-map/sealer-id
            - name: METRICS_PORT
              value: "9090"
          volumeMounts:
            - name: state
              mountPath: /data
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
            - name: writer-key
              mountPath: /etc/geodb/writer-key
              readOnly: true
            - name: reader-key
              mountPath: /etc/geodb/reader-key
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "3Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
