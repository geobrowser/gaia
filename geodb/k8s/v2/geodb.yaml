# geo-db read replica for entity cards (stage 1, testnet). See geodb/RUNBOOK.md.
#
# The serve half of the replica (deploy-v2 `service=geodb-serve`). The feeder half is geodb-feeder.yaml (deploy-v2
# `service=geodb-feeder`), split out so a feeder deploy cannot roll serve. ServiceAccount geodb and its Role are shared
# by both pods and stay here.
#
# Two workloads:
#   StatefulSet geodb          geodb-serve under geodb/supervisor.sh. It just runs: Spaces are founded online
#                              over the wire. The supervisor publishes serve's node-id and sealer-id (both
#                              public) to ConfigMap geodb-space-map.
#   Deployment geodb-feeder    (geodb-feeder.yaml) reads <env>.knowledge.edits and applies each edit to serve over TCP; founds Spaces
#                              with `geodb-client found`; publishes the gaia-Space -> geo-db-Space map
#                              (key space-map.json) to the same ConfigMap. State on its own PVC.
#
# Alongside, in their own files (geodb-feeder.yaml holds the feeder Deployment, its Service and PVC):
#   geodb-backfill-job.yaml    one-shot Job (by hand, feeder scaled to 0; not in deploy-v2): loads the state of
#                              entities the replica is missing from gaia Postgres. RUNBOOK §2b.
#   geodb-card-replay.yaml     Deployment: ~0.5 rps of card requests to Service api so the shadow compare has
#                              samples. Deployed with the feeder by deploy-v2.
#
# Secrets (created by hand, never in git; see the runbook for the commands):
#   geodb-feeder-kafka   KAFKA_BROKER, KAFKA_USERNAME, KAFKA_PASSWORD, KAFKA_SSL_CA_PEM  (dedicated user)
#   geodb-store-secret   secret.hex: 64 hex digits, the store secret (fixes Space ids; never rotate)
#   geodb-writer-key     key: the feeder's Ed25519 seed; keyid: its key id
#   geodb-reader-key     key: the api's read-only seed; keyid: its key id
#   geodb-cursor-key     optional; made in-cluster by geodb-cursor-key-job.yaml (RUNBOOK §10): hermes's key,
#                        derived collection 10 only
#   geodb-outbox-key     optional; made in-cluster by geodb-outbox-key-job.yaml (RUNBOOK §11): the
#                        notification-indexer's key, work class only
#   geodb-scores-key     optional; made in-cluster by geodb-scores-key-job.yaml (RUNBOOK §12): vote-indexer's and
#                        ranking-indexer's key, derived collections 0, 1 and 11 only
#
# The geodb image is pinned (deploy-v2 rewrites every :latest in a manifest to the gaia tag, which
# would point serve at a tag the geodb repository does not have). Only the feeder image is :latest.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: geodb
  namespace: gaia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geodb-feeder
  namespace: gaia
rules:
  # The supervisor (serve pod) and the feeder both write ConfigMap geodb-space-map (disjoint keys).
  # create cannot be limited by name.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["geodb-space-map"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geodb-feeder
  namespace: gaia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: geodb-feeder
subjects:
  - kind: ServiceAccount
    name: geodb
    namespace: gaia
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: geodb-serve-config
  namespace: gaia
data:
  # serve.cfg takes no comments (a "#" line fails the open as malformed_line), so they live here.
  # The Space cap. Raising it on an existing store must be done in steps, each a clean
  # open and close (256 -> 384 -> 512 -> 640 -> 768 -> 896 -> 1024): an open refuses with
  # ResourceExhausted when the last close kept more resident versions than the new cap
  # can load. Lowering it below a founded ordinal fails the open. See RUNBOOK §2d.
  # derived_rows_max turns on the derived class (plan 10.14; hermes cursors in collection 10, vote
  # cells and tallies, ranking_scores in 11): 12,582,912 rows x 144 B, about 1.81 GB carved at open.
  # Sized by plan 10.14 "Headroom rule": everything except entity_ranking_scores (Stage A 0, 1, 8, 9,
  # 10, 11 plus Stage B 2, 3, 4 plus the small collections, 7.06M rows counted 11-06) must sit under
  # 80% of the cap, so cap >= 8.82M. At the cap a whole frame of puts is refused, with no
  # per-collection quota. Serve used 1.0Gi of its 7Gi limit at 4,194,304; the extra 1.2 GB carve
  # fits inside the 5Gi request. Raising it on a live store is one restart (the
  # log replays under the larger bound). 0 or absent = class off and
  # every derived put refused InvalidConfig. work_rows_max turns on the work class (plan 10.16; the
  # notification outbox shadow): 4,000,000 is plan 10.16's 30-day sizing, about 600 MB at the cap.
  # Removing either key turns its class off again; the store keeps <root>/derived and <root>/work
  # and an open without the key ignores them. listen_before_open (geo-db 4b34261b7b, default false)
  # binds every endpoint before the store opens and answers a connection with the retryable
  # ResourceExhausted "opening" refusal until it has; an image without 4b34261b7b fails the open
  # on the unknown key, so this ConfigMap must only reach a pod on a pin that carries it. The probes below read
  # /data/ctl/serving, not the socket, so a bound-but-refusing listener does not make the pod Ready.
  serve.cfg: |
    version = 1
    server_rooms_carving = 67108864
    session_requests_in_flight = 8
    request_deadline_ms = 30000
    spaces = 2048
    derived_rows_max = 12582912
    work_rows_max = 4000000
    listen_before_open = true
---
apiVersion: v1
kind: Service
metadata:
  name: geodb
  namespace: gaia
  labels:
    app: geodb
spec:
  type: ClusterIP
  selector:
    app: geodb
  ports:
    - name: geodb
      port: 7447
      targetPort: geodb
      protocol: TCP
    # serve's GET /metrics (HTTP listener, anonymous only), scraped by the hermes-metrics ServiceMonitor.
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: geodb
  namespace: gaia
  labels:
    app: geodb
spec:
  replicas: 1
  serviceName: geodb
  selector:
    matchLabels:
      app: geodb
  # One writer on one volume: never two pods at once.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: geodb
    spec:
      serviceAccountName: geodb
      # The Service `geodb` would inject GEODB_PORT=tcp://<ip>:7447, which the supervisor reads as its
      # listen port, so serve refuses its binding. Off for every geodb pod.
      enableServiceLinks: false
      # serve drains on SIGINT and writes a final checkpoint; a kill mid-write costs a slower reopen.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: serve-config
          configMap:
            name: geodb-serve-config
        - name: store-secret
          secret:
            secretName: geodb-store-secret
            defaultMode: 0440
      containers:
        - name: serve
          # By tag again, like every other geodb pin. 8050918d2f is a new tag (67b6974a5e was rebuilt in place on 11-12 and
          # was pinned by digest while it was live); never rebuild a tag that is deployed, build a new one.
          image: registry.digitalocean.com/geo/geodb:8cba4da996
          imagePullPolicy: IfNotPresent
          # A panic's stack trace goes to stderr, and the kubelet keeps only the previous
          # container's log. This also copies the log's tail into the pod's
          # lastState.terminated.message, so `kubectl get pod` shows why serve died.
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: geodb
              containerPort: 7447
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            - name: DATA_DIR
              value: /data
            - name: GEODB_CONFIG
              value: /etc/geodb/serve.cfg
            # Opens the HTTP listener for GET /metrics. Needs a geodb image built with this supervisor.sh;
            # an older image ignores it and the scrape target just reads down.
            - name: GEODB_METRICS_PORT
              value: "9091"
            - name: GEODB_PROFILE
              value: medium
            - name: GEODB_STORE_SECRET_FILE
              value: /etc/geodb/store-secret/secret.hex
            - name: GEODB_WRITER_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-writer-key
                  key: keyid
            - name: GEODB_READER_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-reader-key
                  key: keyid
            # Optional: hermes's cursor key (derived collection 10 only; RUNBOOK §10). Absent = no such principal.
            - name: GEODB_CURSOR_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-cursor-key
                  key: keyid
                  optional: true
            # Optional: the notification-indexer's outbox key (work class only; RUNBOOK §11). Absent = no such principal.
            - name: GEODB_OUTBOX_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-outbox-key
                  key: keyid
                  optional: true
            # Optional: the score writers' key (derived collections 0, 1, 11 only; RUNBOOK section 12). Absent = no such principal.
            - name: GEODB_SCORES_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-scores-key
                  key: keyid
                  optional: true
            # Optional: the api's private reader key (k8s/v2/geodb-private-reader-key-job.yaml): derived_read=28,29 only, so
            # it can read the restricted per-user collections and nothing else. Absent = no such principal.
            - name: GEODB_PRIVATE_READER_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-private-reader-key
                  key: keyid
                  optional: true
            - name: GEODB_GRANT_TTL_S
              value: "300"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: serve-config
              mountPath: /etc/geodb/serve.cfg
              subPath: serve.cfg
              readOnly: true
            - name: store-secret
              mountPath: /etc/geodb/store-secret
              readOnly: true
          # Ready = serve has printed its node id (the supervisor writes ctl/serving) and accepts a
          # connection. A TCP check alone would pass while serve is still reopening the store.
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -e /data/ctl/serving"]
            # 1 s polling: the pod is Ready within a second of ctl/serving appearing, not up to 5 s later.
            # failureThreshold 30 x 1 s keeps the old 6 x 5 s = 30 s tolerance.
            periodSeconds: 1
            failureThreshold: 30
          startupProbe:
            exec:
              command: ["sh", "-c", "test -e /data/ctl/serving"]
            # Same 600 s budget as before (120 x 5 s), polled every second.
            periodSeconds: 1
            failureThreshold: 600
          resources:
            # The medium profile alone holds ~4 GiB resident (it sat at the old 4Gi limit with no data
            # growth). Plan 10.14 §10 Stage A: 5Gi/7Gi covers the 604 MB derived carve plus the backfill.
            requests:
              memory: "5Gi"
              cpu: "500m"
            limits:
              memory: "7Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 50Gi
---
# Who may reach serve. 7447 (the wire) is open to the gaia namespace only: every client of svc/geodb:7447
# (api, the feeder and its backfill Jobs, search-indexer, ranking-indexer and its CronJobs, notification-indexer,
# delivery-worker, hermes-pipeline, hermes-ipfs-cache, vote/topology indexers and sweeps, scoring-service,
# proposal-executor, the setup Jobs) runs in gaia; nothing in any other namespace dials it. The peer is
# namespace gaia AND pod label geodb-client=true (a single peer with both selectors). Every client pod template
# carries that label; scripts/check-geodb-ingress.py fails CI on a manifest that sets GEODB_* env without it. Roll
# the labelled workloads BEFORE applying this policy, or unlabelled live pods lose geo-db. Earlier it was a namespace
# rule, not a pod rule, on purpose: many CronJob and Job pods carry no app label, and a pod selector would
# silently cut off any workload added or re-labelled later. 9091 is serve's HTTP listener, which serves GET
# /metrics but is NOT metrics-only: an anonymous session reads the root Public Spaces, so only the monitoring
# namespace (Prometheus) may reach it. Same shape as api-cache-ingress. scripts/check-geodb-ingress.py (CI)
# fails if 7447 is ever opened to every namespace again. Rollback: re-apply the previous revision of this
# policy (git revert), or, to drop the policy entirely:
#   kubectl -n gaia delete networkpolicy geodb-ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geodb-ingress
  namespace: gaia
spec:
  podSelector:
    matchLabels:
      app: geodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gaia
          podSelector:
            matchLabels:
              geodb-client: "true"
      ports:
        - port: 7447
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9091
          protocol: TCP
