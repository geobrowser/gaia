# geo-db read replica for entity cards (stage 1, testnet). See geodb/RUNBOOK.md.
#
# Two workloads:
#   StatefulSet geodb          geodb-serve under geodb/supervisor.sh. It just runs: Spaces are founded online
#                              over the wire. The supervisor publishes serve's node-id and sealer-id (both
#                              public) to ConfigMap geodb-space-map.
#   Deployment geodb-feeder    reads <env>.knowledge.edits and applies each edit to serve over TCP; founds Spaces
#                              with `geodb-client found`; publishes the gaia-Space -> geo-db-Space map
#                              (key space-map.json) to the same ConfigMap. State on its own PVC.
#
# Alongside, in their own files:
#   geodb-backfill-job.yaml    one-shot Job (by hand, feeder scaled to 0; not in deploy-v2): loads the state of
#                              entities the replica is missing from gaia Postgres. RUNBOOK §2b.
#   geodb-card-replay.yaml     Deployment: ~0.5 rps of card requests to Service api so the shadow compare has
#                              samples. Deployed with this file by deploy-v2.
#
# Secrets (created by hand, never in git; see the runbook for the commands):
#   geodb-feeder-kafka   KAFKA_BROKER, KAFKA_USERNAME, KAFKA_PASSWORD, KAFKA_SSL_CA_PEM  (dedicated user)
#   geodb-store-secret   secret.hex: 64 hex digits, the store secret (fixes Space ids; never rotate)
#   geodb-writer-key     key: the feeder's Ed25519 seed; keyid: its key id
#   geodb-reader-key     key: the api's read-only seed; keyid: its key id
#   geodb-cursor-key     optional; made in-cluster by geodb-cursor-key-job.yaml (RUNBOOK §10): hermes's key,
#                        derived collection 10 only
#   geodb-outbox-key     optional; made in-cluster by geodb-outbox-key-job.yaml (RUNBOOK §11): the
#                        notification-indexer's key, work class only
#   geodb-scores-key     optional; made in-cluster by geodb-scores-key-job.yaml (RUNBOOK §12): vote-indexer's and
#                        ranking-indexer's key, derived collections 0, 1 and 11 only
#
# The geodb image is pinned (deploy-v2 rewrites every :latest in a manifest to the gaia tag, which
# would point serve at a tag the geodb repository does not have). Only the feeder image is :latest.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: geodb
  namespace: gaia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geodb-feeder
  namespace: gaia
rules:
  # The supervisor (serve pod) and the feeder both write ConfigMap geodb-space-map (disjoint keys).
  # create cannot be limited by name.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["geodb-space-map"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geodb-feeder
  namespace: gaia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: geodb-feeder
subjects:
  - kind: ServiceAccount
    name: geodb
    namespace: gaia
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: geodb-serve-config
  namespace: gaia
data:
  # serve.cfg takes no comments (a "#" line fails the open as malformed_line), so they live here.
  # The Space cap. Raising it on an existing store must be done in steps, each a clean
  # open and close (256 -> 384 -> 512 -> 640 -> 768 -> 896 -> 1024): an open refuses with
  # ResourceExhausted when the last close kept more resident versions than the new cap
  # can load. Lowering it below a founded ordinal fails the open. See RUNBOOK §2d.
  # derived_rows_max turns on the derived class (plan 10.14; hermes cursors in collection 10, vote
  # cells and tallies, ranking_scores in 11): 2,097,152 rows x 144 B, about 302 MB carved at open, sized
  # for type plus topic ranking (1.73M rows, plan 14 §9); raising it on a live store is one restart (the
  # log replays under the larger bound). 0 or absent = class off and
  # every derived put refused InvalidConfig. work_rows_max turns on the work class (plan 10.16; the
  # notification outbox shadow): 4,000,000 is plan 10.16's 30-day sizing, about 600 MB at the cap.
  # Removing either key turns its class off again; the store keeps <root>/derived and <root>/work
  # and an open without the key ignores them.
  serve.cfg: |
    version = 1
    server_rooms_carving = 67108864
    session_requests_in_flight = 8
    request_deadline_ms = 30000
    spaces = 2048
    derived_rows_max = 2097152
    work_rows_max = 4000000
---
apiVersion: v1
kind: Service
metadata:
  name: geodb
  namespace: gaia
  labels:
    app: geodb
spec:
  type: ClusterIP
  selector:
    app: geodb
  ports:
    - name: geodb
      port: 7447
      targetPort: geodb
      protocol: TCP
    # serve's GET /metrics (HTTP listener, anonymous only), scraped by the hermes-metrics ServiceMonitor.
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: geodb-feeder
  namespace: gaia
  labels:
    app: geodb-feeder
spec:
  type: ClusterIP
  selector:
    app: geodb-feeder
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: geodb
  namespace: gaia
  labels:
    app: geodb
spec:
  replicas: 1
  serviceName: geodb
  selector:
    matchLabels:
      app: geodb
  # One writer on one volume: never two pods at once.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: geodb
    spec:
      serviceAccountName: geodb
      # The Service `geodb` would inject GEODB_PORT=tcp://<ip>:7447, which the supervisor reads as its
      # listen port, so serve refuses its binding. Off for every geodb pod.
      enableServiceLinks: false
      # serve drains on SIGINT and writes a final checkpoint; a kill mid-write costs a slower reopen.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: serve-config
          configMap:
            name: geodb-serve-config
        - name: store-secret
          secret:
            secretName: geodb-store-secret
            defaultMode: 0440
      containers:
        - name: serve
          image: registry.digitalocean.com/geo/geodb:6b34f9feda
          imagePullPolicy: IfNotPresent
          # A panic's stack trace goes to stderr, and the kubelet keeps only the previous
          # container's log. This also copies the log's tail into the pod's
          # lastState.terminated.message, so `kubectl get pod` shows why serve died.
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: geodb
              containerPort: 7447
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            - name: DATA_DIR
              value: /data
            - name: GEODB_CONFIG
              value: /etc/geodb/serve.cfg
            # Opens the HTTP listener for GET /metrics. Needs a geodb image built with this supervisor.sh;
            # an older image ignores it and the scrape target just reads down.
            - name: GEODB_METRICS_PORT
              value: "9091"
            - name: GEODB_PROFILE
              value: medium
            - name: GEODB_STORE_SECRET_FILE
              value: /etc/geodb/store-secret/secret.hex
            - name: GEODB_WRITER_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-writer-key
                  key: keyid
            - name: GEODB_READER_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-reader-key
                  key: keyid
            # Optional: hermes's cursor key (derived collection 10 only; RUNBOOK §10). Absent = no such principal.
            - name: GEODB_CURSOR_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-cursor-key
                  key: keyid
                  optional: true
            # Optional: the notification-indexer's outbox key (work class only; RUNBOOK §11). Absent = no such principal.
            - name: GEODB_OUTBOX_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-outbox-key
                  key: keyid
                  optional: true
            # Optional: the score writers' key (derived collections 0, 1, 11 only; RUNBOOK section 12). Absent = no such principal.
            - name: GEODB_SCORES_KEYID
              valueFrom:
                secretKeyRef:
                  name: geodb-scores-key
                  key: keyid
                  optional: true
            - name: GEODB_GRANT_TTL_S
              value: "300"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: serve-config
              mountPath: /etc/geodb/serve.cfg
              subPath: serve.cfg
              readOnly: true
            - name: store-secret
              mountPath: /etc/geodb/store-secret
              readOnly: true
          # Ready = serve has printed its node id (the supervisor writes ctl/serving) and accepts a
          # connection. A TCP check alone would pass while serve is still reopening the store.
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -e /data/ctl/serving"]
            periodSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command: ["sh", "-c", "test -e /data/ctl/serving"]
            periodSeconds: 5
            failureThreshold: 120
          resources:
            # The medium profile alone holds ~4 GiB resident (it sat at the old 4Gi limit with no data
            # growth); 6Gi leaves room for the backfill.
            requests:
              memory: "4Gi"
              cpu: "500m"
            limits:
              memory: "6Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geodb-feeder-state
  namespace: gaia
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geodb-feeder
  namespace: gaia
  labels:
    app: geodb-feeder
spec:
  replicas: 1
  # One consumer on one RWO volume (offsets, journals): never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: geodb-feeder
  template:
    metadata:
      labels:
        app: geodb-feeder
    spec:
      serviceAccountName: geodb
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: geodb-feeder-state
        - name: geodb-bin
          emptyDir: {}
        # serve's node-id and sealer-id (public), written by the supervisor; the feeder's own space-map.json
        # lands here too. optional: the pod can start before serve has ever published.
        - name: space-map
          configMap:
            name: geodb-space-map
            optional: true
        - name: writer-key
          secret:
            secretName: geodb-writer-key
            defaultMode: 0440
            items:
              - key: key
                path: writer.key
      initContainers:
        # Copies geodb-client from the pinned geodb image and writes the client binding: a TCP listener
        # (the Service's ClusterIP, which the binding grammar needs as an address) pinned to serve's node id.
        # Exits 1 until serve has published its ids, so the pod retries rather than starting blind.
        - name: geodb-setup
          image: registry.digitalocean.com/geo/geodb:6b34f9feda
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp /usr/local/bin/geodb-client /geodb/geodb-client
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -z "$node" ] || [ -z "$ip" ]; then
                echo "geodb-setup: serve has not published node-id yet, or no geodb Service; retrying"
                exit 1
              fi
              printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: feeder
          image: registry.digitalocean.com/geo/geodb-feeder:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: testnet
            - name: KAFKA_GROUP_ID
              value: geodb-feeder-v1-testnet
            - name: DATA_DIR
              value: /data
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_KEY_PATH
              value: /etc/geodb/writer-key/writer.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            - name: GEODB_SEALER_FILE
              value: /etc/geodb/space-map/sealer-id
            - name: METRICS_PORT
              value: "9090"
            # Membership (space members and editors) into geo-db. Both are off: the feeder reads only "1" or
            # "true" as on (anything else, including "off", is off). To turn them on, in this order:
            #   1. run the membership backfill Job (geodb-membership-backfill-job.yaml, RUNBOOK §2c) with the
            #      feeder scaled to 0;
            #   2. set GEODB_MEMBERSHIP_DUAL_WRITE to "1" and roll the feeder: it consumes space.membership;
            #   3. once its lag is ~0, set GEODB_MEMBERSHIP_SHADOW_COMPARE to "1": it compares the member and
            #      editor id sets per Space against Postgres (geodb_feeder_membership_shadow_* metrics).
            - name: GEODB_MEMBERSHIP_DUAL_WRITE
              value: "1"
            - name: GEODB_MEMBERSHIP_SHADOW_COMPARE
              value: "1"
            # Keyed membership records (RUNBOOK §2c-bis): the keyed consumer replaces the legacy one, on its own
            # group, writing natural-key records into the governance system Space. On since 2026-11-05, after the
            # keyed membership backfill Job ran with the feeder at 0. Rollback: "0" (the legacy consumer resumes
            # from its own offsets).
            - name: GEODB_RECORD_KEYS
              value: "1"
            # Proposal system entities: the kg-indexer writes one per proposal straight to Postgres, no edit
            # carries it. The feeder consumes PROPOSAL_CREATED on space.governance (its own group, needs
            # consume on that topic) and writes them into Spaces geo-db already holds.
            - name: GEODB_PROPOSAL_ENTITIES
              value: "1"
            # Space system entities: the kg-indexer writes one per registered Space straight to Postgres, no
            # edit carries it. The feeder consumes space.creations (its own group, needs consume on that topic)
            # and writes them into Spaces geo-db holds; one for a Space not founded yet waits until it is.
            - name: GEODB_SPACE_ENTITIES
              value: "1"
            # Keyed user votes (curation.votes into the votes system Space). Takes effect only with
            # GEODB_RECORD_KEYS: RUNBOOK §2c-ter. On since 2026-11-05, after the votes backfill Job
            # (geodb-votes-backfill-job.yaml) ran with the feeder at 0. Rollback: "0".
            - name: GEODB_VOTES
              value: "1"
            # Keyed proposal votes (PROPOSAL_VOTED on space.governance, into the votes system Space). Takes
            # effect only with GEODB_RECORD_KEYS: RUNBOOK §2c-quater. On since 2026-11-05, after the
            # proposal-votes backfill Job (geodb-proposal-votes-backfill-job.yaml) ran with the feeder at 0
            # (49518 rows, 0 dead letters). Rollback: "0".
            - name: GEODB_PROPOSAL_VOTES
              value: "1"
            # Keyed proposal actions (PROPOSAL_CREATED / PROPOSAL_UPDATED on space.governance, into the governance
            # system Space). Takes effect only with GEODB_RECORD_KEYS: RUNBOOK §2c-quinquies. OFF until the
            # proposal-actions backfill Job (geodb-proposal-actions-backfill-job.yaml) has run with the feeder at 0.
            - name: GEODB_PROPOSAL_ACTIONS
              value: "0"
            # Keyed subspaces and subspace topics (TRUST_EXTENSION on space.trust.extensions, into the governance
            # system Space). Takes effect only with GEODB_RECORD_KEYS: RUNBOOK §2c-sexies. OFF until the
            # subspaces backfill Job (geodb-subspaces-backfill-job.yaml) has run with the feeder at 0.
            - name: GEODB_SUBSPACES
              value: "0"
            # Keyed space voting settings (VOTING_SETTINGS_UPDATED on space.governance, into the governance system
            # Space). Takes effect only with GEODB_RECORD_KEYS: RUNBOOK §2c-septies. OFF until the space-voting-settings
            # backfill Job (geodb-space-voting-settings-backfill-job.yaml) has run with the feeder at 0.
            - name: GEODB_SPACE_VOTING_SETTINGS
              value: "0"
            # Keyed proposal versions (PROPOSAL_CREATED / PROPOSAL_UPDATED, one record per (proposal, block) with the
            # voting settings). Takes effect only with GEODB_RECORD_KEYS: RUNBOOK §2c-octies. OFF until the
            # proposal-versions backfill Job (geodb-proposal-versions-backfill-job.yaml) has run with the feeder at 0.
            - name: GEODB_PROPOSAL_VERSIONS
              value: "0"
            # Keyed proposal status facts (executed_at from PROPOSAL_EXECUTED on space.governance, unexecutable_at from the
            # backfill only, into the governance system Space). Takes effect only with GEODB_RECORD_KEYS: RUNBOOK §2c-novies.
            # OFF until the proposal-status backfill Job (geodb-proposal-status-backfill-job.yaml) has run with the feeder at 0.
            - name: GEODB_PROPOSAL_STATUS
              value: "0"
            # Keyed ranking blocks, rankings and items (ranking-indexer's ranks tables, from knowledge.edits, into the votes
            # system Space). Takes effect only with GEODB_RECORD_KEYS: RUNBOOK §2c-decies.
            # OFF until the ranks backfill Job (geodb-ranks-backfill-job.yaml) has run with the feeder at 0.
            - name: GEODB_RANKS
              value: "0"
            # Relation positions (`.position` on a relation's add). Off until the geodb image carries a
            # geodb-client with ISS-587-318: an older client refuses the key, and every edit with a positioned
            # relation would fail. Turn on with the image bump that brings it.
            - name: GEODB_RELATION_POSITIONS
              value: "0"
            # Entity createdAt / updatedAt (RUNBOOK §2e). On since 2026-11-05, after the times backfill Job
            # stamped every existing entity (1579 Spaces, deadLettered 0). Flip only while the feeder is idle.
            - name: GEODB_ENTITY_TIMES
              value: "1"
            # Read only; used by the membership comparison, ignored while it is off.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: DATABASE_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_SSL_CA
            # The journals of what geo-db holds (known-entities/statements) are kept in memory and grow ~10x
            # after a backfill (RUNBOOK §2b): give the heap room below the limit.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: geodb-feeder-kafka
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: geodb-feeder-kafka
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geodb-feeder-kafka
                  key: KAFKA_PASSWORD
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: geodb-feeder-kafka
                  key: KAFKA_SSL_CA_PEM
          volumeMounts:
            - name: state
              mountPath: /data
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
            - name: writer-key
              mountPath: /etc/geodb/writer-key
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # No readinessProbe on purpose: the Service only scrapes metrics, and a Kafka outage must not make
          # the series vanish. /health/readiness is there for humans and for the alert on the feeder's series.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
# Who may reach serve. 7447 (the wire) stays open to every pod in every namespace, as it was before any
# policy existed (api, the feeder, notification-indexer, delivery-worker, the setup and backfill Jobs, the
# scoring CronJob all dial it by pod IP). 9091 is serve's HTTP listener, which serves GET /metrics but is NOT
# metrics-only: an anonymous session reads the root Public Spaces, so only the monitoring namespace
# (Prometheus) may reach it. Same shape as api-cache-ingress. Rollback:
#   kubectl -n gaia delete networkpolicy geodb-ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geodb-ingress
  namespace: gaia
spec:
  podSelector:
    matchLabels:
      app: geodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 7447
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9091
          protocol: TCP
