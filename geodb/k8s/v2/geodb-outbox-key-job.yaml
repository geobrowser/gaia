# One-shot Job: mints the notification-indexer's outbox key INSIDE the cluster. The private key is generated by geodb-client
# in the pod's memory-backed volume and written straight into Secret geodb-outbox-key through the API; it
# never reaches a terminal, a file on a laptop, or git. The Secret holds `key` (the seed) and `keyid`
# (public); serve's supervisor reads `keyid` and registers
#   principal = <keyid> read=- write=- publish=- work=*
# so the key can write the work class (the outbox shadow) and nothing else. RUNBOOK §11 has the order.
#
# NOT in deploy-v2: applied by hand. Fill the image placeholder from geodb.yaml's pin:
#   GEODB_TAG=$(awk '/^ *- name: serve$/{s=1} s && /image: registry.digitalocean.com\/geo\/geodb:/{sub(/.*geodb:/,""); print; exit}' geodb.yaml)
#   sed -e "s|geodb:GEODB_TAG|geodb:$GEODB_TAG|" geodb-outbox-key-job.yaml | kubectl apply -f -
#
# Idempotent: if the Secret exists the Job exits 0 and changes nothing (it never overwrites a key). To rotate,
# delete the Secret, delete the Job, apply again, then restart serve and notification-indexer. Delete the Job before applying
# it again: a Job's pod template is immutable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: geodb-outbox-keygen
  namespace: gaia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geodb-outbox-keygen
  namespace: gaia
rules:
  # create cannot be limited by name; it can only create, never read or change a Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geodb-outbox-keygen
  namespace: gaia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: geodb-outbox-keygen
subjects:
  - kind: ServiceAccount
    name: geodb-outbox-keygen
    namespace: gaia
---
apiVersion: batch/v1
kind: Job
metadata:
  name: geodb-outbox-key
  namespace: gaia
  labels:
    app: geodb-outbox-key
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: geodb-outbox-key
    spec:
      serviceAccountName: geodb-outbox-keygen
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: scratch
          emptyDir:
            medium: Memory
      containers:
        - name: keygen
          image: registry.digitalocean.com/geo/geodb:GEODB_TAG
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              api="https://$KUBERNETES_SERVICE_HOST:${KUBERNETES_SERVICE_PORT:-443}/api/v1/namespaces/$(cat $SA/namespace)/secrets"
              cd /scratch
              geodb-client --key outbox.key keygen > outbox.keyid
              id=$(tr -d ' \n' < outbox.keyid)
              case "$id" in *[!0-9a-f]*|"") echo "keygen printed something other than a key id; nothing written"; exit 1 ;; esac
              [ "${#id}" -eq 64 ] || { echo "key id is not 64 hex digits; nothing written"; exit 1; }
              body="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"geodb-outbox-key\"},\"data\":{\"key\":\"$(base64 -w0 outbox.key)\",\"keyid\":\"$(printf %s "$id" | base64 -w0)\"}}"
              code=$(printf %s "$body" | curl -s -o /dev/null -w '%{http_code}' --max-time 30 --cacert $SA/ca.crt \
                -H "Authorization: Bearer $(cat $SA/token)" -H 'Content-Type: application/json' \
                -X POST --data-binary @- "$api")
              rm -f outbox.key outbox.keyid
              case "$code" in
                201) echo "created Secret geodb-outbox-key; key id $id" ;;
                409) echo "Secret geodb-outbox-key already exists; left as is" ;;
                *) echo "create failed: HTTP $code"; exit 1 ;;
              esac
          volumeMounts:
            - name: scratch
              mountPath: /scratch
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
