[package]
name = "hermes-ipfs-cache"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-ipfs-cache"
path = "src/main.rs"

[dependencies]
hermes-instrumentation = { path = "../hermes-instrumentation" }
hermes-codec = { path = "../hermes-codec" }
hermes-amp = { path = "../hermes-amp" }
hermes-relay = { path = "../hermes-relay" }
ipfs = { path = "../ipfs" }
wire = { path = "../wire" }
grc-20 = { git = "https://github.com/geobrowser/grc-20" }

anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
dotenv = "0.15"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "json",
    "uuid",
    "tls-rustls",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = "1"
tracing = "0.1"
