apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-ipfs-cache
  namespace: knowledge-staging
  labels:
    app: hermes-ipfs-cache
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-ipfs-cache
  template:
    metadata:
      labels:
        app: hermes-ipfs-cache
        environment: staging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: ssl-certs
          emptyDir: {}
      initContainers:
        - name: setup-certs
          image: registry.digitalocean.com/geo/hermes-ipfs-cache:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "$DATABASE_SSL_CA" > /ssl/ca.crt
          env:
            - name: DATABASE_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_SSL_CA
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: hermes-ipfs-cache
          image: registry.digitalocean.com/geo/hermes-ipfs-cache:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
              readOnly: true
          env:
            - name: PGSSLROOTCERT
              value: /ssl/ca.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: SUBSTREAMS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SUBSTREAMS_ENDPOINT
            - name: SUBSTREAMS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SUBSTREAMS_API_TOKEN
            - name: SUBSTREAMS_START_BLOCK
              value: "82656"
            - name: IPFS_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: IPFS_GATEWAY_URL
            - name: RUST_LOG
              value: "hermes_ipfs_cache=info"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_TRACES_SAMPLE_RATE
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SENTRY_TRACES_SAMPLE_RATE
                  optional: true
            - name: SENTRY_SEND_DEFAULT_PII
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SENTRY_SEND_DEFAULT_PII
                  optional: true
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SENTRY_ENVIRONMENT
                  optional: true
            - name: SENTRY_RELEASE
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SENTRY_RELEASE
                  optional: true
            - name: SENTRY_DEBUG
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SENTRY_DEBUG
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      restartPolicy: Always
