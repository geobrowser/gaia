apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-ipfs-cache
  namespace: knowledge
  labels:
    app: hermes-ipfs-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-ipfs-cache
  template:
    metadata:
      labels:
        app: hermes-ipfs-cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: ssl-certs
          emptyDir: {}
      initContainers:
        - name: setup-certs
          image: registry.digitalocean.com/geo/hermes-ipfs-cache:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "$DATABASE_SSL_CA" > /ssl/ca.crt
          env:
            - name: DATABASE_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_SSL_CA
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: hermes-ipfs-cache
          image: registry.digitalocean.com/geo/hermes-ipfs-cache:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
              readOnly: true
          env:
            - name: PGSSLROOTCERT
              value: /ssl/ca.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: SUBSTREAMS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SUBSTREAMS_ENDPOINT
            - name: SUBSTREAMS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SUBSTREAMS_API_TOKEN
            - name: SUBSTREAMS_START_BLOCK
              value: "81809"
            - name: IPFS_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: IPFS_GATEWAY_URL
            - name: RUST_LOG
              value: "hermes_ipfs_cache=info"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always
