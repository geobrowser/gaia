# Image Pruner DaemonSet
# =====================================================================
# WHY
# ---------------------------------------------------------------------
# DigitalOcean managed Kubernetes (DOKS) does not expose kubelet
# configuration, so the built-in image GC thresholds (which only watch
# disk **bytes**, not inodes) cannot be tuned. Container images
# accumulate over the life of a node and eventually exhaust inodes
# well before disk bytes are full, triggering the
# NodeFilesystemFilesFillingUp alert. This DaemonSet automates the
# `crictl rmi --prune` cleanup that we'd otherwise have to run manually.
#
# HOW IT WORKS
# ---------------------------------------------------------------------
# 1. The DaemonSet schedules one privileged pod per node (incl. tainted
#    nodes via `tolerations: operator=Exists`).
# 2. On startup each pod downloads a pinned `crictl` binary into the
#    container, then enters a loop that wakes every CHECK_INTERVAL_SECONDS
#    (default 10 min) and checks the wall clock.
# 3. When `date -u +%u` (day-of-week, 1=Mon..7=Sun) matches TARGET_DOW
#    *and* `date -u +%H` matches TARGET_HOUR, the pod runs the prune.
#    Default schedule: Mon 06:00 UTC = Sun 22:00 PT (low-traffic).
# 4. A LAST_RUN_KEY (today's date in UTC) prevents repeat runs within
#    the same hour-window if the loop checks multiple times.
# 5. The prune itself is two passes of `crictl -t 5m rmi --prune`:
#       - pass 1 frees references on unused images
#       - pass 2 reaps orphaned layers exposed by pass 1
#    The 5-minute timeout is necessary because containerd rmi calls
#    get slow under inode pressure (the default 2s yields
#    DeadlineExceeded errors).
# 6. Each run logs structured events to stdout that flow through the
#    cluster's existing log shipper into Axiom:
#       event=run_start
#       event=before  images=N used=N free=N used_pct=N%
#       event=after   images=N used=N free=N used_pct=N%
#       event=summary before(...) -> after(...)
#       event=run_complete
#    Plus the raw `df -i /host-root` output before and after each run.
#
# WHY DAEMONSET INSTEAD OF CRONJOB
# ---------------------------------------------------------------------
# A native CronJob runs a single pod per schedule fire. To prune every
# node you'd need either one CronJob per node (clunky) or pod-affinity
# tricks. A DaemonSet with an internal scheduler is simpler, survives
# node replacement automatically, and gives consistent observability.
#
# VERIFYING WITHOUT WAITING FOR SUNDAY
# ---------------------------------------------------------------------
# Option 1 — Force an immediate one-shot prune on a single node:
#   POD=$(kubectl -n kube-system get pod -l app=image-pruner \
#     -o jsonpath='{.items[0].metadata.name}')
#   kubectl -n kube-system exec -it "$POD" -- \
#     crictl -t 5m rmi --prune
#
# Option 2 — Temporarily override the schedule to the current UTC
# day/hour so the loop fires within ~10 minutes on every node:
#   kubectl -n kube-system set env ds/image-pruner \
#     TARGET_DOW=$(date -u +%u) TARGET_HOUR=$(date -u +%H)
#   kubectl -n kube-system rollout status ds/image-pruner
#   kubectl -n kube-system logs -f ds/image-pruner
#   # When done, revert:
#   kubectl -n kube-system set env ds/image-pruner \
#     TARGET_DOW=1 TARGET_HOUR=06
#
# VIEWING PAST RUNS
# ---------------------------------------------------------------------
#   # Latest from the live pods
#   kubectl -n kube-system logs ds/image-pruner --tail=200
#
#   # Just the summary lines from the last week
#   kubectl -n kube-system logs ds/image-pruner --since=8d \
#     | grep 'event=summary'
#
#   # Durable history → query Axiom for `kubernetes.labels.app=image-pruner`
#   # and filter on `message contains "event=run_complete"`.
#
# OPERATIONAL NOTES
# ---------------------------------------------------------------------
# - CRICTL_VERSION must track the cluster's k8s minor version. Bump
#   alongside cluster upgrades.
# - To change schedule timezone: TARGET_DOW uses 1=Mon..7=Sun (UTC),
#   TARGET_HOUR is 00-23 (UTC).
# - Resource limits are intentionally tight; the work is rare and bursty.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-pruner
  namespace: kube-system
  labels:
    app: image-pruner
    managed-by: gha-maintenance-deploy
spec:
  selector:
    matchLabels:
      app: image-pruner
  template:
    metadata:
      labels:
        app: image-pruner
        managed-by: gha-maintenance-deploy
    spec:
      # Tolerate all taints so the pruner runs even on tainted/dedicated nodes
      tolerations:
        - operator: Exists
      # Privileged so we can talk to containerd's socket on the host
      containers:
        - name: pruner
          image: alpine:3.20
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Pin crictl version. Must be compatible with the cluster's k8s
            # minor version (currently 1.33). Bump alongside cluster upgrades.
            - name: CRICTL_VERSION
              value: v1.33.0
            # Schedule: weekly on TARGET_DOW at TARGET_HOUR (UTC).
            # 1 = Monday in `date -u +%u` (busybox/POSIX). Monday 06:00 UTC =
            # Sunday 23:00 PT / 22:00 PST — low-traffic window in US west.
            - name: TARGET_DOW
              value: "1"
            - name: TARGET_HOUR
              value: "06"
            # How often to wake and check the clock (seconds).
            - name: CHECK_INTERVAL_SECONDS
              value: "600"
            # Per-call crictl timeout. When the fs is inode-pressured,
            # containerd rmi calls get slow; the default 2s is too short.
            - name: CRICTL_TIMEOUT
              value: 5m
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache curl ca-certificates >/dev/null
              curl -fsSL "https://github.com/kubernetes-sigs/cri-tools/releases/download/${CRICTL_VERSION}/crictl-${CRICTL_VERSION}-linux-amd64.tar.gz" \
                | tar -xz -C /usr/local/bin
              crictl --version   # fail fast if binary is missing or broken
              export CONTAINER_RUNTIME_ENDPOINT=unix:///run/containerd/containerd.sock

              log() { echo "[$(date -u +%FT%TZ)] [${NODE_NAME}] $*"; }
              # stats prints: images=<N> used=<N> free=<N> used_pct=<N%>
              stats() {
                imgs=$(crictl images -q 2>/dev/null | wc -l | tr -d ' ')
                set -- $(df -i /host-root | awk 'NR==2 {print $3, $4, $5}')
                echo "images=${imgs} used=$1 free=$2 used_pct=$3"
              }

              run_prune() {
                log "==== image-pruner run starting (event=run_start) ===="
                BEFORE=$(stats)
                log "event=before ${BEFORE}"
                log "df -i BEFORE:"
                df -i /host-root

                log "running: crictl -t ${CRICTL_TIMEOUT} rmi --prune (pass 1)"
                crictl -t "${CRICTL_TIMEOUT}" rmi --prune 2>&1 | tail -20 | sed "s/^/[${NODE_NAME}] /" || log "pass 1 returned non-zero (continuing)"

                log "running: crictl -t ${CRICTL_TIMEOUT} rmi --prune (pass 2)"
                crictl -t "${CRICTL_TIMEOUT}" rmi --prune 2>&1 | tail -20 | sed "s/^/[${NODE_NAME}] /" || log "pass 2 returned non-zero (continuing)"

                AFTER=$(stats)
                log "event=after  ${AFTER}"
                log "df -i AFTER:"
                df -i /host-root

                log "event=summary before(${BEFORE}) -> after(${AFTER})"
                log "==== run complete (event=run_complete) ===="
              }

              # Init succeeded. Disable -e for the main loop: crictl rmi --prune
              # can return non-zero when individual images timeout, which is expected
              # and handled by the || log fallback. We don't want that to kill the pod.
              set +e
              log "image-pruner started; schedule=DOW=${TARGET_DOW} HOUR=${TARGET_HOUR} (UTC), check_interval=${CHECK_INTERVAL_SECONDS}s"
              LAST_RUN_KEY=""
              while true; do
                NOW_DOW=$(date -u +%u)
                NOW_HOUR=$(date -u +%H)
                NOW_KEY=$(date -u +%Y-%m-%d)
                if [ "${NOW_DOW}" = "${TARGET_DOW}" ] && [ "${NOW_HOUR}" = "${TARGET_HOUR}" ] && [ "${LAST_RUN_KEY}" != "${NOW_KEY}" ]; then
                  run_prune
                  LAST_RUN_KEY="${NOW_KEY}"
                fi
                sleep "${CHECK_INTERVAL_SECONDS}"
              done
          volumeMounts:
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
            - name: host-root
              mountPath: /host-root
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: host-root
          hostPath:
            path: /
            type: Directory
