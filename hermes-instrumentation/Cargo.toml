[package]
name = "hermes-instrumentation"
version = "0.1.0"
edition = "2024"
description = "Unified telemetry for the Hermes ecosystem"

[dependencies]
# Tracing core
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-stdout = { version = "0.31", features = ["trace"] }

# Sentry
sentry = { version = "0.46", default-features = false, features = ["backtrace", "contexts", "opentelemetry", "panic", "reqwest", "rustls", "tracing"] }

# Error handling
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
