[package]
name = "e2e-score-lookup"
version = "0.1.0"
edition = "2024"

# Not part of the workspace - this is a standalone test tool
[workspace]

[[bin]]
name = "e2e-score-lookup"
path = "src/main.rs"

[dependencies]
# Kafka client
rdkafka = { version = "0.37", features = ["cmake-build", "ssl", "sasl"] }

# Protobuf
prost = "0.13.5"
hermes-schema = { path = "../../../hermes-schema" }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "tls-rustls"] }

# HTTP client for search API
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Core dependencies
tokio = { version = "1.44", features = ["full"] }
uuid = { version = "1.11", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
