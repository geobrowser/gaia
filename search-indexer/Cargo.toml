[package]
name = "search-indexer"
version = "0.1.0"
edition = "2021"
description = "Search indexer for the Geo Knowledge Graph - consumes events from Kafka and indexes into OpenSearch"

[dependencies]
# Workspace dependencies
search-indexer-shared = { path = "../search-indexer-shared" }
search-indexer-repository = { path = "../search-indexer-repository" }
hermes-schema = { path = "../hermes-schema" }
hermes-instrumentation = { path = "../hermes-instrumentation" }
hermes-kafka = { path = "../hermes-kafka" }
indexer_utils = { path = "../indexer_utils" }
sdk = { path = "../sdk" }

# GRC-20 decoding
grc-20 = "0.4.1"

# Kafka
rdkafka = { version = "0.38.0", features = ["cmake-build", "zstd", "ssl"] }

# Async runtime
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
futures = "0.3.31"
async-trait = "0.1.88"

# HTTP server for health checks
axum = "0.8.8"

# Serialization
prost = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
hex = "0.4"

# Error handling
thiserror = "2.0.17"

# Database (Postgres lookup for score indexing)
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "tls-rustls"] }

# Utilities
chrono = "0.4.41"
uuid = { version = "1.17.0", features = ["v4"] }
dotenv = "0.15.0"

# Tracing (required for #[instrument] macro)
tracing = "0.1.41"

# Relation map (SQLite persistence + LRU cache for fast DeleteRelation lookups)
rusqlite = { version = "0.32", features = ["bundled"] }
lru = "0.18"

[dev-dependencies]
serial_test = "3.4.0"
temp-env = { version = "0.3", features = ["async_closure"] }
tempfile = "3"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "test-util"] }
