---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-create-index
  namespace: search-staging
  labels:
    app: opensearch-admin
    task: create-index
    environment: staging
spec:
  ttlSecondsAfterFinished: 86400  # 24 hours
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: opensearch-admin
        task: create-index
        environment: staging
    spec:
      imagePullSecrets:
      - name: regcred
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: create-index
        image: registry.digitalocean.com/geo/search-admin:latest
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: OPENSEARCH_URL
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: OPENSEARCH_URL
        - name: ENVIRONMENT
          value: "staging"
        - name: INDEX_ALIAS
          value: "entities"
        - name: INDEX_VERSION
          value: "4"  # CHANGE THIS: Set to the new index version
        - name: RUST_LOG
          value: "info"
        command:
        - search-admin
        - create-index
        - --version
        - "$(INDEX_VERSION)"
        - --skip-if-exists
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
