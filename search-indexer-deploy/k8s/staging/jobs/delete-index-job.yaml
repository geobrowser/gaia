---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-delete-index
  namespace: search-staging
  labels:
    app: opensearch-admin
    task: delete-index
    environment: staging
spec:
  ttlSecondsAfterFinished: 86400  # 24 hours
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: opensearch-admin
        task: delete-index
        environment: staging
    spec:
      imagePullSecrets:
      - name: regcred
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: delete-index
        image: registry.digitalocean.com/geo/search-admin:latest
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: OPENSEARCH_URL
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: OPENSEARCH_URL
        - name: ENVIRONMENT
          value: "staging"
        - name: INDEX_ALIAS
          value: "entities"
        - name: INDEX_VERSION
          value: "2"  # CHANGE THIS: Set to the index version to DELETE
        - name: CONFIRM_DELETE
          value: "false"  # CHANGE THIS to "true" to actually delete (safety check)
        - name: RUST_LOG
          value: "info"
        command:
        - /bin/sh
        - -c
        - |
          if [ "$CONFIRM_DELETE" = "true" ]; then
            search-admin delete-index \
              --version "$INDEX_VERSION" \
              --confirm \
              --yes
          else
            echo "SAFETY CHECK FAILED"
            echo ""
            echo "This is a destructive operation."
            echo "Set CONFIRM_DELETE to 'true' to proceed."
            exit 1
          fi
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
