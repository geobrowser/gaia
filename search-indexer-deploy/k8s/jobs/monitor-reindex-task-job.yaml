---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-monitor-reindex
  namespace: search
  labels:
    app: opensearch-admin
    task: monitor-reindex
spec:
  # Keep job history for debugging
  ttlSecondsAfterFinished: 86400  # 24 hours
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: opensearch-admin
        task: monitor-reindex
    spec:
      restartPolicy: Never
      containers:
      - name: monitor-reindex
        image: registry.digitalocean.com/geo/search-admin:latest  # Update with your registry
        env:
        - name: OPENSEARCH_URL
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: OPENSEARCH_URL
        - name: TASK_ID
          value: ""  # CHANGE THIS: Set to the task ID from reindex job output
        - name: POLL_INTERVAL_SECONDS
          value: "10"  # Check status every 10 seconds
        - name: MAX_WAIT_SECONDS
          value: "3600"  # Maximum wait time: 1 hour
        - name: RUST_LOG
          value: "info"
        command:
        - search-admin
        - monitor-reindex
        - --task-id
        - "$(TASK_ID)"
        - --poll-interval
        - "$(POLL_INTERVAL_SECONDS)"
        - --max-wait
        - "$(MAX_WAIT_SECONDS)"
        - --wait
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
