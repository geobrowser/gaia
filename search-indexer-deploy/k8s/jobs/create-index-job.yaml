---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-create-index
  namespace: search
  labels:
    app: opensearch-admin
    task: create-index
spec:
  # Keep job history for debugging
  ttlSecondsAfterFinished: 86400  # 24 hours
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: opensearch-admin
        task: create-index
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-index
        image: registry.digitalocean.com/geo/search-admin:latest  # Update with your registry
        env:
        - name: OPENSEARCH_URL
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: OPENSEARCH_URL
        - name: INDEX_ALIAS
          value: "entities"  # Default alias name
        - name: INDEX_VERSION
          value: "3"  # CHANGE THIS: Set to the new index version
        - name: RUST_LOG
          value: "info"
        command:
        - search-admin
        - create-index
        - --version
        - "$(INDEX_VERSION)"
        - --skip-if-exists
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
