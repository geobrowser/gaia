---
apiVersion: batch/v1
kind: Job
metadata:
  name: test-permissions
  namespace: search
  labels:
    app: opensearch-admin
    task: test
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: opensearch-admin
        task: test
    spec:
      restartPolicy: Never
      containers:
      - name: test
        image: curlimages/curl:latest
        env:
        - name: OPENSEARCH_URL
          valueFrom:
            secretKeyRef:
              name: search-indexer-secrets
              key: OPENSEARCH_URL
        command:
        - sh
        - -c
        - |
          echo "Testing OpenSearch connection..."
          echo "OpenSearch URL: $OPENSEARCH_URL"
          echo ""
          echo "=== Cluster Health ==="
          curl -s "$OPENSEARCH_URL/_cluster/health?pretty"
          echo ""
          echo "=== Indices List ==="
          curl -s "$OPENSEARCH_URL/_cat/indices/entities*?v"
          echo ""
          echo "=== Aliases ==="
          curl -s "$OPENSEARCH_URL/_cat/aliases/entities?v"
          echo ""
          echo "✓ Test complete!"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
