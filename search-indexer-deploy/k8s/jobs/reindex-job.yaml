---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-reindex
  namespace: search
  labels:
    app: opensearch-admin
    task: reindex
spec:
  # Keep job history for debugging
  ttlSecondsAfterFinished: 86400  # 24 hours
  backoffLimit: 1  # Reindex should not retry automatically
  template:
    metadata:
      labels:
        app: opensearch-admin
        task: reindex
    spec:
      restartPolicy: Never
      containers:
      - name: reindex
        image: registry.digitalocean.com/geo/search-admin:latest  # Update with your registry
        env:
        - name: OPENSEARCH_URL
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: OPENSEARCH_URL
        - name: INDEX_ALIAS
          value: "entities"  # Default alias name
        - name: SOURCE_INDEX_VERSION
          value: "2"  # CHANGE THIS: Current/old index version
        - name: TARGET_INDEX_VERSION
          value: "3"  # CHANGE THIS: New index version
        - name: WAIT_FOR_COMPLETION
          value: "false"  # Set to "true" for synchronous reindex (blocks until complete)
        - name: RUST_LOG
          value: "info"
        command:
        - /bin/sh
        - -c
        - |
          if [ "$WAIT_FOR_COMPLETION" = "true" ]; then
            search-admin reindex \
              --source-version "$SOURCE_INDEX_VERSION" \
              --target-version "$TARGET_INDEX_VERSION" \
              --wait-for-completion
          else
            search-admin reindex \
              --source-version "$SOURCE_INDEX_VERSION" \
              --target-version "$TARGET_INDEX_VERSION"
          fi
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
