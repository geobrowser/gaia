---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-reindex
  namespace: search
  labels:
    app: opensearch-admin
    task: reindex
spec:
  # Keep job history for debugging
  ttlSecondsAfterFinished: 86400  # 24 hours
  backoffLimit: 1  # Don't retry automatically - reindex is expensive
  template:
    metadata:
      labels:
        app: opensearch-admin
        task: reindex
    spec:
      restartPolicy: Never
      containers:
      - name: reindex
        image: registry.digitalocean.com/geo/search-admin:latest  # Update with your registry
        env:
        - name: OPENSEARCH_URL
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: OPENSEARCH_URL
        - name: INDEX_ALIAS
          value: "entities"  # Default alias name
        - name: SOURCE_VERSION
          value: "2"  # CHANGE THIS: Source index version to copy from
        - name: TARGET_VERSION
          value: "3"  # CHANGE THIS: Target index version to copy to
        - name: WAIT_FOR_COMPLETION
          value: "true"  # Set to "false" for async mode (get task ID only)
        - name: RUST_LOG
          value: "info"
        command:
        - search-admin
        - reindex
        - --source-version
        - "$(SOURCE_VERSION)"
        - --target-version
        - "$(TARGET_VERSION)"
        - --wait-for-completion
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
