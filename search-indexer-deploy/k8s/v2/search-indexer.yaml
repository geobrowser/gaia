# =============================================================================
# Search Indexer Headless Service (required by StatefulSet)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: search-indexer
  namespace: gaia
  labels:
    app: search-indexer
    # Copied onto every scraped series by the hermes-metrics ServiceMonitor's
    # `targetLabels`, the same as kg-indexer and atlas.
    gaia_namespace: gaia
spec:
  clusterIP: None
  selector:
    app: search-indexer
  ports:
    - name: http
      port: 8080
      targetPort: health
    # Scraped by the hermes-metrics ServiceMonitor. A headless Service still
    # publishes Endpoints, which is all Prometheus needs.
    - name: metrics
      port: 9464
      targetPort: metrics
---
# =============================================================================
# Search Indexer StatefulSet
# =============================================================================
# Consumes messages from Kafka and indexes them into OpenSearch
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: search-indexer
  namespace: gaia
  labels:
    app: search-indexer
spec:
  serviceName: search-indexer
  replicas: 1
  selector:
    matchLabels:
      app: search-indexer
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: search-indexer
    spec:
      imagePullSecrets:
        - name: geo
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # geo-db shadow (SEARCH_INDEXER_GEODB_SHADOW). Same pattern as the api: copy geodb-client out of
        # the pinned geodb image and write a binding from the geodb-feeder's node-id. Always exits 0, so
        # an absent geodb never blocks a pod start; with no binding the shadow reads as unusable and the
        # SQL lookups run untouched. Pinned, never :latest: deploy-v2 rewrites every :latest to the service tag.
        - name: geodb-setup
          image: registry.digitalocean.com/geo/geodb:2eab4e170c
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -n "$node" ] && [ -n "$ip" ]; then
                printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
              else
                echo "geodb-setup: no node id or no geodb Service; the geo-db shadow stays idle"
              fi
              exit 0
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: geodb-bin
          emptyDir: {}
        - name: geodb-space-map
          configMap:
            # Written by the geodb-feeder (space-map.json, node-id, system-spaces.json). Not shipped here.
            name: geodb-space-map
            optional: true
        - name: geodb-key
          secret:
            secretName: geodb-reader-key
            optional: true
            defaultMode: 0440
            items:
              - key: key
                path: reader.key
      containers:
        - name: search-indexer
          image: registry.digitalocean.com/geo/search-indexer:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # OpenSearch connection (managed DigitalOcean OpenSearch)
            - name: OPENSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: OPENSEARCH_URL
            # Index version (defaults to 0 if not set). Must equal the index the
            # `testnet_entities` alias points at, or the indexer refuses to start.
            # Raise it only in the same change that flips the alias (GEO-3047 runbook).
            # 7 = stemmed name/description siblings (GEO-3047), live since the v7 reindex.
            - name: ENTITIES_INDEX_VERSION
              value: "7"
            # Kafka connection (managed Kafka with SSL)
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_PASSWORD
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_SSL_CA_PEM
            # Database (Postgres lookup for fast score indexing)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: search-indexer-secrets
                  key: DATABASE_URL
            - name: DATABASE_MAX_CONNECTIONS
              value: "5"
            # Relation map (SQLite-backed, for fast DeleteRelation lookups)
            - name: RELATION_MAP_DB_PATH
              value: "/data/relation_map.sqlite"
            - name: RELATION_MAP_CACHE_SIZE
              value: "500000"
            # Kafka consumer configuration
            - name: ENVIRONMENT
              value: "testnet"
            - name: KAFKA_GROUP_EDITS_ID
              value: "search-indexer-group-edits-v4"
            - name: KAFKA_GROUP_SCORES_ID
              value: "search-indexer-group-scores-v3"
            - name: KAFKA_GROUP_SPACE_TOPICS_ID
              value: "search-indexer-group-space-topics-v3"
            # Logging
            - name: RUST_LOG
              value: "info"
              # Set with kubectl for debugging: "info,search_indexer=debug,search_indexer_repository=debug"
            - name: METRICS_PORT
              value: "9464"
            # geo-db shadow: after a SQL lookup succeeds, a small sample is re-read from geo-db and compared
            # (search_indexer_geodb_shadow_*). Never changes what is indexed; SQL stays the source.
            - name: SEARCH_INDEXER_GEODB_SHADOW
              value: "1"
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_KEY_PATH
              value: /etc/geodb/key/reader.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            - name: GEODB_SPACE_MAP_PATH
              value: /etc/geodb/space-map/space-map.json
            # Sentry telemetry and monitoring
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: search-indexer-secrets
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_ENVIRONMENT
              value: "testnet"
            - name: SENTRY_RELEASE
              value: "search-indexer@1.0.0"
            - name: SENTRY_TRACES_SAMPLE_RATE
              value: "0.1"
            - name: SENTRY_SEND_DEFAULT_PII
              value: "false"
            - name: SENTRY_DEBUG
              value: "false"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          resources:
            requests:
              # Steady state is ~840Mi; the 2Gi request reserved more than twice
              # what it uses and made this the largest single consumer of
              # schedulable memory on a 3-node pool, pushing total requests past
              # single-node-failure tolerance (KubeMemoryOvercommit).
              # The 4Gi limit is unchanged, so bulk-reindex bursts still have
              # room — requests govern scheduling, limits govern runtime.
              memory: "1Gi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "500m"
          volumeMounts:
            - name: topology-data
              mountPath: /data
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
            - name: geodb-key
              mountPath: /etc/geodb/key
              readOnly: true
          # Liveness probe - checks if the process is alive and can respond to HTTP requests
          # Used by Kubernetes to restart the container if it becomes unresponsive
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe - checks if the service is ready to accept traffic
          # Verifies healthy OpenSearch connectivity before routing traffic to the pod
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
  volumeClaimTemplates:
    - metadata:
        name: topology-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
