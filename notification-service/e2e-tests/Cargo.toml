[package]
name = "notification-e2e-tests"
version = "0.1.0"
edition = "2021"
description = "End-to-end tests for the notification service pipeline"

[dependencies]
hermes-schema = { path = "../../hermes-schema" }
hermes-kafka = { path = "../../hermes-kafka" }
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "zstd"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
axum = "0.7"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
prost = "0.13.5"
grc-20 = "0.4.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.17.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
