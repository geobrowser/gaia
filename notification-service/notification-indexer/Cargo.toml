[package]
name = "notification-indexer"
version = "0.1.0"
edition = "2021"
description = "Notification indexer that consumes governance events from Kafka and writes to the notification outbox"

[dependencies]
hermes-schema = { path = "../../hermes-schema" }
hermes-instrumentation = { path = "../../hermes-instrumentation" }
hermes-kafka = { path = "../../hermes-kafka" }
# Canonical knowledge-graph system/content IDs.
sdk = { path = "../../sdk" }
# Best-effort shadow of the outbox into geo-db (off unless GEODB_OUTBOX_MIRROR=1).
geodb-outbox = { path = "../../geodb-outbox" }
# Best-effort mirror of the poll cursors into geo-db collection 10 (off unless GEODB_CURSOR_MIRROR=1).
geodb-cursor = { path = "../../geodb-cursor" }
grc-20 = "0.4.1"
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "zstd"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "process", "io-util"] }
axum = "0.7"
futures = "0.3.31"
async-trait = "0.1.88"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "tls-rustls"] }
chrono = "0.4.41"
prost = "0.13.5"
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
dotenv = "0.15.0"
tracing = "0.1.41"

# Metrics (recorder and /metrics listener installed via hermes-instrumentation)
metrics = "0.24"

[dev-dependencies]
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
