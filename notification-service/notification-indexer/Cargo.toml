[package]
name = "notification-indexer"
version = "0.1.0"
edition = "2021"
description = "Notification indexer that consumes governance events from Kafka and writes to the notification outbox"

[dependencies]
hermes-schema = { path = "../../hermes-schema" }
hermes-instrumentation = { path = "../../hermes-instrumentation" }
hermes-kafka = { path = "../../hermes-kafka" }
grc-20 = "0.4.1"
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "zstd"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
axum = "0.7"
futures = "0.3.31"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "tls-rustls"] }
prost = "0.13.5"
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
dotenv = "0.15.0"
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "test-util"] }
