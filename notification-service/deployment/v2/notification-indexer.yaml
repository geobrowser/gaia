# Notification Indexer Deployment (v2 / testnet)
#
# Consumes governance events from Kafka and writes to the notification outbox.
# Also polls for expired proposals to generate rejection notifications.
#
# ENVIRONMENT=testnet makes hermes_kafka::get_topic_prefix() return "testnet.",
# so this indexer consumes the testnet.* Kafka topics; consumer groups are
# suffixed -testnet-v1 to keep offsets isolated from staging/production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-indexer
  namespace: gaia
  labels:
    app: notification-indexer
    environment: testnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-indexer
  template:
    metadata:
      labels:
        app: notification-indexer
        environment: testnet
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        # geodb-client for the outbox shadow (geodb-outbox, GEODB_OUTBOX_MIRROR). Dormant while the flag
        # is "off": nothing below is read and every reference is optional or fails soft, so an absent
        # geodb never blocks a rollout. Same wiring as hermes-pipeline.yaml, with the OUTBOX key: a
        # principal that may write the work class and nothing else (geodb-outbox-key-job.yaml).
        - name: geodb-bin
          emptyDir: {}
        - name: geodb-space-map
          configMap:
            # Written by the geodb-feeder / serve. Not shipped in these manifests.
            name: geodb-space-map
            optional: true
        - name: geodb-key
          secret:
            secretName: geodb-outbox-key
            optional: true
            defaultMode: 0440
            items:
              - key: key
                path: outbox.key
      initContainers:
        - name: geodb-setup
          # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
          image: registry.digitalocean.com/geo/geodb:27e919248f
          imagePullPolicy: IfNotPresent
          # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
          # binding and the mirror stays disabled even if the flag is turned on.
          command:
            - sh
            - -c
            - |
              cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -n "$node" ] && [ -n "$ip" ]; then
                printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
              else
                echo "geodb-setup: no node id or no geodb Service; outbox mirror stays off"
              fi
              exit 0
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: notification-indexer
          image: registry.digitalocean.com/geo/notification-indexer:latest
          imagePullPolicy: Always
          env:
            # Database configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            # Kafka configuration
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kg-indexer-secrets
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kg-indexer-secrets
                  key: KAFKA_USERNAME
                  optional: true
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kg-indexer-secrets
                  key: KAFKA_PASSWORD
                  optional: true
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: kg-indexer-secrets
                  key: KAFKA_SSL_CA_PEM
                  optional: true
            # Consumer configuration
            - name: ENVIRONMENT
              value: "testnet"
            - name: KAFKA_GROUP_ID_GOVERNANCE
              value: "notification-indexer-governance-testnet-v1"
            - name: KAFKA_GROUP_ID_KNOWLEDGE_EDITS
              value: "notification-indexer-knowledge-edits-testnet-v1"
            - name: REJECTION_POLL_INTERVAL_SECS
              value: "60"
            # Rejection notifications were dead on this cluster for its whole
            # life (the query read `proposals.end_time`, which governance-v2
            # moved to `proposal_versions`), so switching them on finds every
            # proposal the chain migration replayed: 3,241 expired-unnotified
            # proposals dating back to 1970 when measured on 2026-07-30. This
            # bounds the first run to the preceding 10 hours — 10 real
            # proposals — and is then persisted, so this value has no further
            # effect on a database that already has a floor.
            - name: REJECTION_BACKFILL_HOURS
              value: "10"
            # Shadow every new outbox row into geo-db's work class (geodb-outbox). OFF: none of the
            # GEODB_* values below is read. Postgres stays the source of truth and readers stay on it.
            # Turn on only after the work key is minted, serve has `work_rows_max` set and has
            # registered it (a serve roll), RUNBOOK section 11; then deploy this service with "1".
            - name: GEODB_OUTBOX_MIRROR
              value: "off"
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_OUTBOX_KEY_PATH
              value: /etc/geodb/key/outbox.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            # Logging
            - name: RUST_LOG
              value: "info,notification_indexer=debug"
            - name: METRICS_PORT
              value: "9464"
          ports:
            - containerPort: 8080
              name: health
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: geodb-key
              mountPath: /etc/geodb/key
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-indexer
  namespace: gaia
  labels:
    app: notification-indexer
    # Copied onto every scraped series by the hermes-metrics ServiceMonitor's
    # `targetLabels`, the same as kg-indexer and atlas.
    gaia_namespace: gaia
spec:
  type: ClusterIP
  selector:
    app: notification-indexer
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
