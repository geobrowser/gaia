# Notification Indexer Deployment (v2 / testnet)
#
# Consumes governance events from Kafka and writes to the notification outbox.
# Also polls for expired proposals to generate rejection notifications.
#
# ENVIRONMENT=testnet makes hermes_kafka::get_topic_prefix() return "testnet.",
# so this indexer consumes the testnet.* Kafka topics; consumer groups are
# suffixed -testnet-v1 to keep offsets isolated from staging/production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-indexer
  namespace: gaia
  labels:
    app: notification-indexer
    environment: testnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-indexer
  template:
    metadata:
      labels:
        app: notification-indexer
        environment: testnet
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        # geodb-client for the outbox shadow (geodb-outbox, GEODB_OUTBOX_MIRROR). Dormant while the flag
        # is "off": nothing below is read and every reference is optional or fails soft, so an absent
        # geodb never blocks a rollout. Same wiring as hermes-pipeline.yaml, with the OUTBOX key: a
        # principal that may write the work class and nothing else (geodb-outbox-key-job.yaml).
        - name: geodb-bin
          emptyDir: {}
        - name: geodb-space-map
          configMap:
            # Written by the geodb-feeder / serve. Not shipped in these manifests.
            name: geodb-space-map
            optional: true
        - name: geodb-key
          secret:
            secretName: geodb-outbox-key
            optional: true
            defaultMode: 0440
            items:
              - key: key
                path: outbox.key
        # Read-only key for the chain-table twin (NOTIFICATION_INDEXER_GEODB_TWIN), the same shared
        # reader seed the api and search-indexer use. Optional: absent, the volume is empty and, with the
        # flag at "0", nothing reads it.
        - name: geodb-reader-key
          secret:
            secretName: geodb-reader-key
            optional: true
            defaultMode: 0440
            items:
              - key: key
                path: reader.key
        # app_webhooks out of Postgres (APP_WEBHOOKS_FILE). The Secret is optional: absent, the volume is
        # empty and nothing reads it, so a rollout never depends on it. Create it with
        # notification-service/scripts/export-app-webhooks.sh, then uncomment APP_WEBHOOKS_FILE below.
        - name: app-webhooks
          secret:
            secretName: app-webhooks
            optional: true
            defaultMode: 0440
      initContainers:
        - name: geodb-setup
          # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
          image: registry.digitalocean.com/geo/geodb:2eab4e170c
          imagePullPolicy: IfNotPresent
          # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
          # binding and the mirror stays disabled even if the flag is turned on.
          command:
            - sh
            - -c
            - |
              cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -n "$node" ] && [ -n "$ip" ]; then
                printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
              else
                echo "geodb-setup: no node id or no geodb Service; outbox mirror stays off"
              fi
              exit 0
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: notification-indexer
          image: registry.digitalocean.com/geo/notification-indexer:latest
          imagePullPolicy: Always
          env:
            # Database configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            # Kafka configuration
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kg-indexer-secrets
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kg-indexer-secrets
                  key: KAFKA_USERNAME
                  optional: true
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kg-indexer-secrets
                  key: KAFKA_PASSWORD
                  optional: true
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: kg-indexer-secrets
                  key: KAFKA_SSL_CA_PEM
                  optional: true
            # Consumer configuration
            - name: ENVIRONMENT
              value: "testnet"
            - name: KAFKA_GROUP_ID_GOVERNANCE
              value: "notification-indexer-governance-testnet-v1"
            - name: KAFKA_GROUP_ID_KNOWLEDGE_EDITS
              value: "notification-indexer-knowledge-edits-testnet-v1"
            - name: REJECTION_POLL_INTERVAL_SECS
              value: "60"
            # Rejection notifications were dead on this cluster for its whole
            # life (the query read `proposals.end_time`, which governance-v2
            # moved to `proposal_versions`), so switching them on finds every
            # proposal the chain migration replayed: 3,241 expired-unnotified
            # proposals dating back to 1970 when measured on 2026-07-30. This
            # bounds the first run to the preceding 10 hours — 10 real
            # proposals — and is then persisted, so this value has no further
            # effect on a database that already has a floor.
            - name: REJECTION_BACKFILL_HOURS
              value: "10"
            # Shadow every new outbox row into geo-db's work class (geodb-outbox). ON since 2026-11-06:
            # the work key is minted (geodb-outbox-key) and serve registered it (RUNBOOK section 11).
            # Postgres stays the source of truth and every reader stays on it; a geo-db failure is
            # counted and swallowed, never fails the outbox insert. "off" turns it back off.
            - name: GEODB_OUTBOX_MIRROR
              value: "1"
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_OUTBOX_KEY_PATH
              value: /etc/geodb/key/outbox.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            # geo-db twin of the chain-table reads (members, editors, proposals, votes, expiry scan): after a
            # Postgres read answers, the same question is put to geo-db and counted
            # (notification_indexer_geodb_twin_total). Postgres stays the source. "0" = off; set "1" to turn
            # it on once the reader key, space map and system-spaces.json are in place.
            - name: NOTIFICATION_INDEXER_GEODB_TWIN
              value: "1"
            - name: GEODB_KEY_PATH
              value: /etc/geodb/reader/reader.key
            - name: GEODB_SPACE_MAP_PATH
              value: /etc/geodb/space-map/space-map.json
            # Shadow read of the notification_poll cursors against geo-db's cursors collection (10), counted in
            # notification_indexer_geodb_poll_cursor_shadow_total. Postgres stays the source. Reads with the
            # reader key above (GEODB_KEY_PATH); collection 10 is not in the binding's derived_restricted list,
            # so that key may read it. "0" = off; flipping it to "1" is a separate decision.
            - name: NOTIFICATION_INDEXER_GEODB_POLL_CURSOR_SHADOW
              value: "0"
            # Read app_webhooks from the mounted `app-webhooks` Secret instead of Postgres (ON since 2026-11-06).
            # Re-run scripts/export-app-webhooks.sh after any webhook change. To go back to the table,
            # comment these two lines out and redeploy.
            - name: APP_WEBHOOKS_FILE
              value: /etc/app-webhooks/webhooks.json
            # Logging
            - name: RUST_LOG
              value: "info,notification_indexer=debug"
            - name: METRICS_PORT
              value: "9464"
          ports:
            - containerPort: 8080
              name: health
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: geodb-key
              mountPath: /etc/geodb/key
              readOnly: true
            - name: geodb-reader-key
              mountPath: /etc/geodb/reader
              readOnly: true
            # space-map.json and system-spaces.json, written by the geodb-feeder.
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
            - name: app-webhooks
              mountPath: /etc/app-webhooks
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-indexer
  namespace: gaia
  labels:
    app: notification-indexer
    # Copied onto every scraped series by the hermes-metrics ServiceMonitor's
    # `targetLabels`, the same as kg-indexer and atlas.
    gaia_namespace: gaia
spec:
  type: ClusterIP
  selector:
    app: notification-indexer
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
