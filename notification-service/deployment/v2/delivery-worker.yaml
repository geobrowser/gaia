# Delivery Worker Deployment (v2 / testnet)
#
# Polls the notification outbox for pending deliveries and POSTs
# to registered webhooks with HMAC-SHA256 signatures.
#
# The worker is environment-scoped purely by the DATABASE_URL it points at
# (the v2 KG DB, from the shared `api-secrets` secret) — it doesn't consume
# Kafka, so it needs no ENVIRONMENT/topic-prefix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-worker
  namespace: gaia
  labels:
    app: delivery-worker
    environment: testnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-worker
  template:
    metadata:
      labels:
        app: delivery-worker
        environment: testnet
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        # geodb-client for the outbox shadow reader (geodb-outbox, GEODB_OUTBOX_SHADOW_READ). Dormant
        # while the flag is "off": nothing below is read and every reference is optional or fails
        # soft, so an absent geodb never blocks a rollout. Same wiring and the same principal as
        # notification-indexer.yaml (the OUTBOX key, `work=*`, geodb-outbox-key-job.yaml): no new secret.
        - name: geodb-bin
          emptyDir: {}
        - name: geodb-space-map
          configMap:
            # Written by the geodb-feeder / serve. Not shipped in these manifests.
            name: geodb-space-map
            optional: true
        - name: geodb-key
          secret:
            secretName: geodb-outbox-key
            optional: true
            defaultMode: 0440
            items:
              - key: key
                path: outbox.key
      initContainers:
        - name: geodb-setup
          # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
          # The reader needs a geodb-client with the work pipe's claim and complete verbs (geo-db
          # final from the commit "client: work pipe takes claim, complete, retry and fail"); bump
          # this tag to an image built from there before the flag is turned on. An older client
          # answers those verbs `want enter|note|...`, which the reader counts as a claim error.
          image: registry.digitalocean.com/geo/geodb:27e919248f
          imagePullPolicy: IfNotPresent
          # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
          # binding and the shadow stays disabled even if the flag is turned on.
          command:
            - sh
            - -c
            - |
              cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -n "$node" ] && [ -n "$ip" ]; then
                printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
              else
                echo "geodb-setup: no node id or no geodb Service; outbox shadow reader stays off"
              fi
              exit 0
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: delivery-worker
          image: registry.digitalocean.com/geo/delivery-worker:latest
          imagePullPolicy: Always
          env:
            # Database configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            # Worker configuration
            - name: POLL_INTERVAL_MS
              value: "5000"
            - name: MAX_RETRIES
              value: "100"
            - name: BATCH_SIZE
              value: "50"
            # Compare each terminal delivery with geo-db's mirrored unit and complete the unit
            # (delivery_worker_shadow_total{result}). OFF: none of the GEODB_* values below is read.
            # Measurement only: it never delivers and never writes Postgres. Turn on after the
            # indexer's mirror (GEODB_OUTBOX_MIRROR) has run, RUNBOOK section 11; rows delivered
            # before the mirror started count as `miss`.
            - name: GEODB_OUTBOX_SHADOW_READ
              value: "off"
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_OUTBOX_KEY_PATH
              value: /etc/geodb/key/outbox.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            # Logging
            - name: RUST_LOG
              value: "info,delivery_worker=debug"
            - name: METRICS_PORT
              value: "9464"
          ports:
            - containerPort: 8080
              name: health
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: geodb-key
              mountPath: /etc/geodb/key
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-worker
  namespace: gaia
  labels:
    app: delivery-worker
    # Copied onto every scraped series by the hermes-metrics ServiceMonitor's
    # `targetLabels`, the same as kg-indexer and atlas.
    gaia_namespace: gaia
spec:
  type: ClusterIP
  selector:
    app: delivery-worker
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
