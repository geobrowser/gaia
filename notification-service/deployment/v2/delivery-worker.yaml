# Delivery Worker Deployment (v2 / testnet)
#
# Polls the notification outbox for pending deliveries and POSTs
# to registered webhooks with HMAC-SHA256 signatures.
#
# The worker is environment-scoped purely by the DATABASE_URL it points at
# (the testnet `notification-service-credentials` secret) — it doesn't consume
# Kafka, so it needs no ENVIRONMENT/topic-prefix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-worker
  namespace: gaia-v2
  labels:
    app: delivery-worker
    environment: testnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-worker
  template:
    metadata:
      labels:
        app: delivery-worker
        environment: testnet
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      containers:
        - name: delivery-worker
          image: registry.digitalocean.com/geo/delivery-worker:latest
          imagePullPolicy: Always
          env:
            # Database configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            # Worker configuration
            - name: POLL_INTERVAL_MS
              value: "5000"
            - name: MAX_RETRIES
              value: "100"
            - name: BATCH_SIZE
              value: "50"
            # Logging
            - name: RUST_LOG
              value: "info,delivery_worker=debug"
          ports:
            - containerPort: 8080
              name: health
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
