# Notification Indexer Deployment (Staging)
#
# Consumes governance events from Kafka and writes to the notification outbox.
# Also polls for expired proposals to generate rejection notifications.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-indexer
  namespace: notifications-staging
  labels:
    app: notification-indexer
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-indexer
  template:
    metadata:
      labels:
        app: notification-indexer
        environment: staging
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: regcred
      containers:
        - name: notification-indexer
          image: registry.digitalocean.com/geo/notification-indexer:latest
          imagePullPolicy: Always
          env:
            # Database configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scoring-service-credentials
                  key: DATABASE_URL
            # Kafka configuration
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_USERNAME
                  optional: true
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_PASSWORD
                  optional: true
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_SSL_CA_PEM
                  optional: true
            # Consumer configuration
            - name: ENVIRONMENT
              value: "staging"
            - name: KAFKA_GROUP_ID
              value: "notification-indexer-staging"
            - name: REJECTION_POLL_INTERVAL_SECS
              value: "60"
            # Logging
            - name: RUST_LOG
              value: "info,notification_indexer=debug"
          startupProbe:
            exec:
              command: ["pgrep", "-x", "notification-in"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pgrep", "-x", "notification-in"]
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
