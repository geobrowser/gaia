apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-cache
  namespace: api
  labels:
    app: api-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-cache
  template:
    metadata:
      labels:
        app: api-cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          args:
            # Ephemeral cache — no persistence, no disk writes
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            # Memory limit: conservative for ~15 cached responses at up to 25MB each
            - "--maxmemory"
            - "512mb"
            # LRU eviction: evict least-recently-used keys when memory is full
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - containerPort: 6379
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "640Mi"
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: api-cache
  namespace: api
  labels:
    app: api-cache
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: api-cache
