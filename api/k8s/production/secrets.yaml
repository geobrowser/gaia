# Template - DO NOT commit actual secrets
#
# Create secrets manually:
#
# kubectl create secret generic api-secrets \
#   --namespace=api \
#   --from-literal=DATABASE_URL='postgresql://...pooler...' \
#   --from-literal=DATABASE_URL_DIRECT='postgresql://...' \
#   --from-literal=DATABASE_SSL_CA="$(doctl databases ca <db-id> --output text)" \
#   --from-literal=IPFS_KEY='...' \
#   --from-literal=IPFS_GATEWAY_WRITE='https://...' \
#   --from-literal=IPFS_ALTERNATIVE_GATEWAY_KEY='...' \
#   --from-literal=IPFS_ALTERNATIVE_GATEWAY_WRITE='https://...' \
#   --from-literal=TELEMETRY_TOKEN='...' \
#   --from-literal=OPENSEARCH_URL='https://...'
#
# kubectl create secret docker-registry regcred \
#   --namespace=api \
#   --docker-server=registry.digitalocean.com \
#   --docker-username=<do-token> \
#   --docker-password=<do-token>

apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: api
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"  # Connection pooler URL for queries
  DATABASE_URL_DIRECT: "REPLACE_ME"  # Direct DB connection for migrations
  IPFS_KEY: "REPLACE_ME"
  IPFS_GATEWAY_WRITE: "REPLACE_ME"
  IPFS_ALTERNATIVE_GATEWAY_KEY: "REPLACE_ME"
  IPFS_ALTERNATIVE_GATEWAY_WRITE: "REPLACE_ME"
  TELEMETRY_TOKEN: "REPLACE_ME"
  OPENSEARCH_URL: "REPLACE_ME"
