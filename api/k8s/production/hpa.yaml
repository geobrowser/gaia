apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: External
      external:
        metric:
          name: api_ingress_p95_latency_seconds_2m
        target:
          type: Value
          value: "1"
    - type: External
      external:
        metric:
          name: api_ingress_p99_latency_seconds_2m
        target:
          type: Value
          value: "2"
    # DB-pressure-adjacent trigger via ingress 503 ratio.
    # Target 1.5% (15m = 0.015) sustained error ratio.
    - type: External
      external:
        metric:
          name: api_ingress_503_ratio_rate5m
        target:
          type: Value
          value: 15m
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: gaia_api_graphql_pool_saturated
        target:
          type: AverageValue
          averageValue: 100m
