apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: gaia
  labels:
    app: api
spec:
  # Matches the `api` HorizontalPodAutoscaler's max (min 4 / max 8), which is the
  # real owner of this Deployment's scale. This said 1 until 2026-08-19, so every
  # apply scaled live 8 -> 1 and left the HPA to claw it back — spawning exactly
  # the cold pods that the rollout-safety settings above exist to avoid.
  #
  # Deleting the field outright would be cleaner, but does NOT work by itself:
  # `replicas` is recorded in the live object's last-applied-configuration, so
  # removing it makes kubectl apply delete the field and fall back to the default
  # of 1 — verified with `kubectl diff` on 2026-08-19. Going field-less needs one
  # controlled apply (or a switch to server-side apply), which should not ride
  # along with an unrelated deploy. Until then, keep this equal to the HPA max.
  replicas: 8
  # Rollout safety. A fresh pod is at its most fragile — cold JIT, cold caches —
  # and the default 25%/25% lets two pods leave rotation while their cold
  # replacements take a full share of traffic, which is how a routine rollout can
  # reproduce the 2026-08-06 and 2026-08-17 cascades on its own.
  #
  # maxUnavailable 0 keeps all 8 replicas serving throughout (surge adds new pods
  # before old ones go), and minReadySeconds makes a pod prove it can stay ready
  # for 30s before the rollout advances — so a pod that OOMs 39s after boot (as
  # three did on 2026-08-17) halts the rollout instead of taking the next one down
  # with it. Surge needs headroom for 2 extra pods at 768Mi requests; the cluster
  # has ~8Gi free.
  #
  # NOTE: this protects ROLLOUTS only. It does not protect a pod that restarts on
  # its own after an OOM, because kube-proxy/Cilium sends traffic as soon as
  # readiness passes regardless of minReadySeconds. Steady-state cold-start
  # protection comes from GRAPHQL_MAX_CONCURRENT_EXPENSIVE below, which caps what
  # a cold pod can be hit with. Do not raise readinessProbe.initialDelaySeconds
  # hoping to fix that — it only postpones traffic, it does not warm the pod, and
  # it sheds that load onto the surviving replicas in the meantime.
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Spread replicas across nodes instead of leaving placement to the scheduler.
      #
      # Without this the api packed unevenly — 7/5/7/5 across four nodes at 22
      # replicas — and a scale-out landed several pods on one node at once. Each
      # new pod boots a Next.js server, and enough of them starting together
      # drove node 10.100.0.6 to load1 26.43 (3.30 per core) for ~20 minutes on
      # 2026-09-16, firing NodeSystemSaturation. It was transient and iowait
      # stayed at zero, but it is avoidable.
      #
      # whenUnsatisfiable is ScheduleAnyway ON PURPOSE. DoNotSchedule would let a
      # skew constraint block a scale-out, and the incident that morning was the
      # HPA being UNABLE to add replicas — turning a soft preference into a hard
      # gate would risk reproducing exactly that. Even placement is worth having;
      # it is not worth refusing to scale for.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
        # Backstop: hard cap so no node ever holds more than 3 more api pods than
        # the emptiest node, whatever the soft scores say. Loose enough (3) that it
        # cannot block a scale-out while other nodes have room.
        - maxSkew: 3
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: api
      # Prefer the node that runs geodb-0. A card read over the geodb-client pipe is
      # 1.43 ms p50 from a pod on that node and 2.41 ms from another node
      # (geo-db plan 10.09). PREFERRED, never required: a full node must not block
      # a scale-out (same reasoning as the spread constraint above), and geodb-0 is
      # a single pod, so a hard rule would pin every api replica to one node.
      # Weight 20: at 100 it outweighed the spread constraint and put 9 of 12 pods
      # on geodb-0's node (2026-11-04), so one node loss took geodb and most of the
      # api. Low enough that the maxSkew-1 spread above still wins most placements.
      # Applies at scheduling time only, so existing pods move on their next roll.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 20
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: geodb
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: ssl-certs
          emptyDir: {}
        # geo-db entity cards (docs/geodb-entity-cards.md, geodb/RUNBOOK.md). Dormant while
        # GEODB_ENTITY_CARDS is "off": nothing below is read, and every reference is optional or
        # fails soft, so an absent geodb never blocks an api rollout.
        - name: geodb-bin
          emptyDir: {}
        - name: geodb-space-map
          configMap:
            # Written by the geodb-feeder (space-map.json + node-id). Not shipped in these manifests.
            name: geodb-space-map
            optional: true
        - name: geodb-key
          secret:
            secretName: geodb-reader-key
            optional: true
            defaultMode: 0440
            items:
              - key: key
                path: reader.key
      initContainers:
        - name: geodb-setup
          # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to the api tag.
          image: registry.digitalocean.com/geo/geodb:6b34f9feda
          imagePullPolicy: IfNotPresent
          # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
          # binding and the api reads the flag as unusable and answers from Postgres.
          command:
            - sh
            - -c
            - |
              cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -n "$node" ] && [ -n "$ip" ]; then
                printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
              else
                echo "geodb-setup: no node id or no geodb Service; geo-db entity cards stay on Postgres"
              fi
              exit 0
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: setup-certs
          image: registry.digitalocean.com/geo/api:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "$DATABASE_SSL_CA" > /ssl/ca.crt
          env:
            - name: DATABASE_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_SSL_CA
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: migrate
          image: registry.digitalocean.com/geo/api:latest
          imagePullPolicy: Always
          command: ["bun", "run", "db:migrate"]
          env:
            - name: DATABASE_URL_DIRECT
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL_DIRECT
            - name: NODE_EXTRA_CA_CERTS
              value: /ssl/ca.crt
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: api
          image: registry.digitalocean.com/geo/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
              readOnly: true
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
            - name: geodb-key
              mountPath: /etc/geodb/key
              readOnly: true
          env:
            # geo-db entity cards. OFF: the route is not mounted and none of the GEODB_* values
            # below is read. Turn on in two steps (geodb/RUNBOOK.md): "shadow", then "on".
            - name: GEODB_ENTITY_CARDS
              value: "shadow"
            # GraphQL gateway. "on" sends /graphql through the field classifier; every field
            # below stays in shadow, so responses still come from Postgres and a sample
            # (GRAPHQL_GATEWAY_SHADOW_SAMPLE, default 1%) is compared against geo-db.
            - name: GRAPHQL_GATEWAY
              value: "on"
            # space = spaces' comparison on one Space; metas (indexer cursors) has no geo-db home and is only counted unsupported.
            - name: GRAPHQL_GATEWAY_FIELDS
              value: "entity=shadow,entities=shadow,relation=shadow,relations=shadow,search=shadow,searchConnection=shadow,entitiesConnection=shadow,entitiesOrderedByProperty=shadow,spaces=shadow,space=shadow,metas=shadow"
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_KEY_PATH
              value: /etc/geodb/key/reader.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            - name: GEODB_SPACE_MAP_PATH
              value: /etc/geodb/space-map/space-map.json
            # Wide gateway reads in one `geodb-client pipe` line (needs the geodb image above, geo-db
            # 353ab26313 or later; an older client refuses the line). Read by api at or past gaia#1083.
            - name: GEODB_MULTI_SPACE_READS
              value: "on"
            # Light entity shadow reads EntityExists / null-filter EntityTypes across every loaded
            # Space, budgeted 0.5/s, burst 3 (gaia#1104).
            - name: GEODB_EVERY_SPACE_READS
              value: "on"
            # The every-Space lookup first asks geo-db which Spaces hold the entity (`.args.holders`, geo-db 48739dfef5
            # or later) and reads the card only there (gaia#1322). A serve that refuses it is read around for 5 minutes.
            - name: GEODB_HOLDERS_LOOKUP
              value: "on"
            # Shadow EntityNames-shaped `entities` lists with one sampled every-Space read (gaia#1110), and
            # EntityBacklinksPage against geo-db's card backlinks (gaia#1109). Both ride the budgets above.
            - name: GEODB_EVERY_SPACE_ENTITIES
              value: "on"
            - name: GEODB_BACKLINK_READS
              value: "on"
            # The search shadow drops the types Postgres excludes (default block/media types, Comment, Claim) from geo-db's
            # hits before comparing, so the overlap is like for like. "off" compares unfiltered. Shadow only.
            - name: GEODB_SEARCH_TYPE_FILTER
              value: "on"
            # The search shadow asks geo-db once and lets its typeahead run the word leg (gaia#1295), with a 6 s limit
            # because a cold multi-word query takes 2-5 s (gaia#1316). Shadow only.
            - name: GEODB_SEARCH_WORD_LEG
              value: "engine"
            - name: GEODB_SEARCH_TIMEOUT_MS
              value: "6000"
            # Shadow a light `entities` page (one Space, one type, no orderBy) with geo-db's `.args.types` scan and compare the ids
            # in order (gaia#1324). Needs serve at c2f9d09cfa or later. Shadow only.
            - name: GEODB_TYPE_SCAN_SHADOW
              value: "on"
            # Shadow geogenesis's EntitiesBatch `entities` selection (gaia#1115). Needs that PR's api image.
            - name: GEODB_ENTITIES_BATCH_SHADOW
              value: "on"
            # Shadow-only widenings of what the `entities` shadow compares; none changes a response.
            # Typed relations lists that select no type (#1150).
            - name: GEODB_RELATIONS_TYPE_FILTER_SHADOW
              value: "on"
            # Accept the Postgres vote-score fields, counted `derived_fields`, uncompared (#1151).
            - name: GEODB_DERIVED_FIELDS_SHADOW
              value: "on"
            # Every-Space reads over more loaded Spaces than one line holds, split and concatenated (#1152, #1154).
            # Was off 2026-11-06 (#1174): serial chunks over all 1579 Spaces passed 500 ms and starved other shadow
            # reads. Back on with serve b16bfb6400 (ISS-602-731, ISS-604-259) and parallel chunks (#1177).
            # Shadow-only; set "off" again if entity shadow failures pass ~5%.
            - name: GEODB_EVERY_SPACE_CHUNKS
              value: "on"
            # An every-Space shadow read names 1579 Spaces; about 20 a hour passed the pool's 500 ms and counted as `failed`
            # (2026-11-06 logs: every one a timeout). Shadow reads only; serving keeps GEODB_TIMEOUT_MS.
            - name: GEODB_EVERY_SPACE_TIMEOUT_MS
              value: "1500"
            # CREATED_AT/UPDATED_AT ordered pages via `.pick`/`.ties`; needs serve at or past geo-db d3967dffbf
            # (serve runs 6b34f9feda).
            - name: GEODB_ORDER_PICK_SHADOW
              value: "on"
            # Relation targets' own valuesList vs geo-db cards of the targets, read in one batch (#1214); needs serve
            # at or past geo-db 8df213cbac (serve runs 17be320ede). Shadow-only; set "off" if entity shadow failures pass ~5%.
            - name: GEODB_NESTED_TARGET_VALUES_SHADOW
              value: "on"
            # Per-pod token buckets for the gateway shadow's geo-db reads. 11-06: 75 of the entity shadow's 85 refusals were
            # `throttled` at the old 1 read/s (burst 5) and 0.5/s (burst 3) every-Space; serve sat at ~23m CPU. Raised 3x.
            # Worst case is 11 pods x 3 reads/s. Lower these to shed load.
            - name: GATEWAY_SHADOW_READS_PER_SECOND
              value: "3"
            - name: GATEWAY_SHADOW_READS_BURST
              value: "15"
            - name: GATEWAY_SHADOW_EVERY_SPACE_PER_SECOND
              value: "1.5"
            - name: GATEWAY_SHADOW_EVERY_SPACE_BURST
              value: "6"
            # Proposal status computed from geo-db's keyed governance records after a proposal is served,
            # counted against the served status (gaia_api_governance_shadow_total). OFF; never changes a
            # response. Needs the geodb-feeder's proposal status records (GEODB_PROPOSAL_STATUS backfill) first.
            - name: GEODB_GOVERNANCE_SHADOW
              value: "0"
            # Background samplers that feed the shadows above without waiting for traffic. All off until flipped.
            - name: GEODB_GOVERNANCE_SHADOW_SAMPLER
              value: "0"
            # Twins the proposal list, detail (actions, votes) and active-check reads from the same records
            # (gaia_api_governance_queries_shadow_total). ON; never changes a response; counts only.
            - name: GEODB_GOVERNANCE_QUERIES_SHADOW
              value: "1"
            - name: GEODB_KEYED_RECORDS_SHADOW
              value: "0"
            - name: GATEWAY_PROBE
              value: "0"
            # Compares the served /profile response with geo-db's front page card in the background (never changes the
            # response); the MAX_* limits stay at their defaults.
            - name: GEODB_PROFILE_SHADOW
              value: "on"
            # A nested property, Type or relation-target name that geo-db prints as none because it is named in a Space
            # outside the read is settled from its Name in every Space (one batch read of at most 64 ids, under the
            # every-Space budget). A name no Space holds stays uncompared, never a mismatch. Shadow only (gaia#1257).
            - name: GEODB_CROSS_SPACE_NAMES_SHADOW
              value: "on"
            # Count every executed entities/entitiesConnection root field ordered by RANKING_SCORE_* or QUALITY_SCORE_*,
            # labelled by how it is typed, narrowed and paged (gaia#1259). Counting only: no geo-db reads, no shadow.
            - name: GEODB_RANK_TYPED_SHADOW
              value: "count"
            # The for_you_config record in geo-db's config Space read back after the For you route reads its
            # settings, counted against them (gaia_api_for_you_config_shadow_total). ON (backfills ran 2026-11-06); never changes a
            # response. Needs the geodb-feeder's for_you_config backfill (GEODB_FOR_YOU_CONFIG) run first.
            - name: GEODB_FOR_YOU_CONFIG_SHADOW
              value: "1"
            # The same for entity_ranking_config's tau_seconds, the one value the api serves from that table
            # (gaia_api_entity_ranking_config_shadow_total). ON (backfills ran 2026-11-06); never changes a response. Needs the geodb-feeder's
            # entity_ranking_config backfill (GEODB_ENTITY_RANKING_CONFIG) run first.
            - name: GEODB_ENTITY_RANKING_CONFIG_SHADOW
              value: "1"
            # The same for the feed experiment the route served: active, arms and the hash assignment against geo-db's
            # record (gaia_api_feed_experiment_shadow_total); a member's value is compared with the member record. ON (backfills ran 2026-11-06); never
            # changes a response. Needs the geodb-feeder's feed_experiments and feed_experiment_members backfills
            # (GEODB_FEED_EXPERIMENTS, GEODB_FEED_EXPERIMENT_MEMBERS) run first.
            - name: GEODB_FEED_EXPERIMENT_SHADOW
              value: "1"
            # The same for pair-fit's account weights: a sample of each request's candidates (at most every
            # GEODB_ACCOUNT_WEIGHTS_SHADOW_INTERVAL_MS, default 10 s; _SAMPLE candidates, default 5) against geo-db's
            # derived collection 5 (gaia_api_account_weights_shadow_total), read over `geodb-client derived pipe`. ON; never
            # changes a response. The account-weights cronjob's GEODB_DERIVED_MIRROR is on and has filled collection 5.
            - name: GEODB_ACCOUNT_WEIGHTS_SHADOW
              value: "1"
            # Also compare each sampled candidate's `excluded` with geo-db's derived collection 12
            # (gaia_api_account_exclusions_shadow_total). Needs GEODB_ACCOUNT_WEIGHTS_SHADOW on, serve rolled to a build that
            # registers collection 12, and the account-exclusions-sync cronjob's GEODB_DERIVED_MIRROR run once. OFF.
            - name: GEODB_ACCOUNT_EXCLUSIONS_SHADOW
              value: "1"
            # Samples global_scores / local_scores / space_scores rows from Postgres (_SAMPLE per table, default 20, every
            # GEODB_SCORES_SHADOW_INTERVAL_MS, default 60 s) against geo-db's derived collections 2/3/4
            # (gaia_api_scores_shadow_total{table,result}). ON; background only, never changes a response. The scores snapshot
            # Job backfilled 2/3/4 and the scoring cronjob's GEODB_DERIVED_MIRROR keeps them current; the reader key reads them.
            - name: GEODB_SCORES_SHADOW
              value: "1"
            # Samples entity_ranking_scores against geo-db's engaged-only overlay in derived collection 21 (the first
            # _SAMPLE overlay rows into Postgres, and _SAMPLE random Postgres rows into the overlay; default 20 every
            # GEODB_RANKING_SCORES_SHADOW_INTERVAL_MS, default 60 s): gaia_api_ranking_scores_shadow_total{result}. OFF until
            # the overlay writer (GEODB_DERIVED_MIRROR of the scoring service) has run once; background only.
            - name: GEODB_RANKING_SCORES_SHADOW
              value: "0"
            # Holds topic_feed_type_counts to geo-db's DerivedScan count mode (collection 1; _TOPICS topics, default 5, every
            # GEODB_TYPE_COUNTS_SHADOW_INTERVAL_MS, default 300 s): gaia_api_type_counts_shadow_total{result}. OFF until the geodb
            # serve AND the geodb-client in this image are at wire frame revision 13 (serve first: it accepts older clients, an
            # older serve refuses a newer client's every read); background only.
            - name: GEODB_TYPE_COUNTS_SHADOW
              value: "0"
            - name: NODE_EXTRA_CA_CERTS
              value: /ssl/ca.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: PG_CONNECTION_TIMEOUT_MS
              value: "3000"
            - name: PG_STATEMENT_TIMEOUT_MS
              value: "30000"
            - name: PG_QUERY_TIMEOUT_MS
              value: "35000"
            - name: PG_POOL_PRESSURE_WAITING_THRESHOLD
              value: "5"
            - name: PG_POOL_PRESSURE_UTILIZATION_THRESHOLD
              value: "90"
            - name: PG_POOL_PRESSURE_TIMEOUT_THRESHOLD
              value: "2"
            - name: PG_POOL_ACQUIRE_TIMEOUT_WINDOW_MS
              value: "30000"
            - name: PG_POOL_SATURATION_ACTIVATION_MS
              value: "15000"
            - name: PG_POOL_SATURATION_RELEASE_MS
              value: "30000"
            # Admission control concurrency cap. The default of 48 (see
            # api/src/kg/admissionControl.ts) is unsafe against this pod's 2Gi
            # limit: baseline working set is ~550Mi, leaving ~1500Mi of headroom,
            # so 48 concurrent expensive operations budgets only ~31Mi each while
            # observed serialized responses already reach 32MB and their
            # pre-serialization object graphs are far larger.
            #
            # Proven on 2026-08-17 via container_memory_working_set_bytes: pods
            # hold a FLAT 480-600Mi for hours, then go vertical — api-7d55b7b59b-7cjwf
            # read 587Mi at 22:54:30 and was OOMKilled at 22:54:55, i.e. ~1.5GB
            # allocated in under 25s. Not a leak; a concurrency burst. Every dying
            # pod's last log lines were bursts of cost 202-334 queries
            # (AllEntitiesConnection, entitiesConnection, relations, entities).
            #
            # The limiter never fired because the pod dies before reaching 48, which
            # is why the rejection counter read zero. The cost CEILING
            # (GRAPHQL_COST_REJECT_THRESHOLD, default 500) is already armed and also
            # never fires — cost score badly underestimates memory for these shapes.
            # Do not lower that ceiling to 200 instead: 3,913 queries in 6h scored
            # >=200, so it would reject normal traffic. Concurrency is the right axis.
            #
            # MEASURED 2026-08-18, replacing the earlier estimate. 0.5s-resolution
            # cgroup capture of five separate OOM deaths (18:00:22-18:01:43Z) shows
            # a FLAT baseline then an 11-18s RAMP, never a single-sample spike — so
            # this is concurrent accumulation, not one runaway query:
            #
            #   pod     baseline   peak    climb    ramp
            #   b2z8z     535Mi   1976Mi  1441Mi   18.2s
            #   48pcj     567Mi   2045Mi  1477Mi   12.7s
            #   5lrsn     551Mi   1951Mi  1400Mi   11.6s
            #   285hk     562Mi   1928Mi  1365Mi   11.6s
            #   zqm79     530Mi   2041Mi  1510Mi   10.6s
            #
            # Mean climb 1439Mi at a cap of 10 => ~144Mi per concurrent expensive
            # query, against ~1498Mi of headroom (2048 limit - ~550Mi baseline).
            #
            # That reading led to 6 (10 x 144Mi = 1440Mi is 96% of headroom, 6 x 144Mi
            # = 864Mi leaves ~40% margin). CORRECTED 2026-08-19 — see below: the
            # per-query figure was derived by dividing ONE request's cost by the cap,
            # so it overstated concurrency's role by roughly the cap itself.
            #
            # Deaths fire ~20s apart in strict sequence: one pod dies, its load
            # shifts to the next, which ramps and dies. Rejecting a request fails one
            # caller; an OOM kill fails every in-flight request on that pod and starts
            # that chain.
            #
            # CORRECTED 2026-08-19 by direct measurement on an isolated canary pod
            # (labelled app: api-canary, so the Service cannot route to it). ONE request
            # of the shape in the logs — entitiesConnection(first:1000) with a nested
            # relations(first:1000), over the Episode type — returns 62.9MB and allocates
            # +1,569Mi over 33.3 SECONDS.
            #
            # That refutes the "11-18s ramp => concurrent accumulation" inference above.
            # A 33s single-request serialization produces exactly that ramp, and its
            # +1,569Mi is the mean 1439Mi climb those five deaths recorded. So the ramp
            # was one query building one giant JSON string, not N queries accumulating,
            # and ~144Mi/query was that single request divided by the cap.
            #
            # Consequences, both measured:
            #   - Concurrency is the WRONG axis. A cap cannot stop a single-request kill;
            #     no value of this variable prevents one 1.5GB response.
            #   - 6 has a real cost: 503s doubled to 1414/h (vs 696/h at 10) with NO
            #     reduction in OOMs. So 6 rejects ~2x the callers and buys nothing.
            #
            # Hence 10. The source of those requests was a bulk ontology sweep in
            # geo-explorers/postgres_to_geo opening every page at root first:1000; fixed
            # at the source in their PR #36 (2026-08-19), after which OOMs stopped.
            # The durable server-side fix is a runtime abort that counts bytes as they
            # serialize (~10-15MB), NOT a static per-field or concurrency limit.
            - name: GRAPHQL_MAX_CONCURRENT_EXPENSIVE
              value: "10"
            # Refuse a GraphQL response once it measures this many bytes (#902).
            # Phase 2: the plugin has been measuring since it shipped and the
            # ceiling has been 0 (enforcement off) until now.
            #
            # 40 MB, chosen from production data rather than picked round. Over
            # 973 measured responses: p50 1.4 MB, p95 6.4 MB, max 17.9 MB. So
            # this is 2.2x the largest response the api has ever been observed
            # to serve, and 6x p95 — it should never fire on legitimate traffic.
            #
            # And it is well under what kills a pod. The canary runs in #902 put
            # a 62.9 MB response at +1,569 Mi RSS against this pod's 2 GiB limit;
            # ~25 Mi per MB of response means 40 MB caps a single response near
            # 1 GiB, half the limit. The incident that prompted the issue — one
            # client at ~19 req/min allocating ~1.5 GB each — would be refused.
            #
            # If this is wrong it says so immediately and cheaply:
            # gaia_api_graphql_response_budget_refused_total at /health/metrics
            # counts refusals, and tuning is this value, not a code change.
            - name: GRAPHQL_RESPONSE_BYTE_CEILING
              value: "40000000"
            - name: IPFS_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: IPFS_KEY
            - name: IPFS_GATEWAY_WRITE
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: IPFS_GATEWAY_WRITE
            # Required so the API resolves the correct alias/index in the shared OpenSearch cluster.
            - name: ENVIRONMENT
              value: "testnet"
            - name: OPENSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: OPENSEARCH_URL
            - name: TOPOLOGY_SERVICE_URL
              value: "http://search-indexer:8080"
            # Response cache. Disabled in #655 after a stuck "Create Personal
            # Space" modal: a client polling for its new space cached the
            # pre-indexing empty result for 60s and kept being served it.
            # Re-enabled here now that #867 refuses to cache empty results.
            # Writes land out of band (chain -> indexer -> Postgres), so the
            # cache's mutation-driven invalidation never fires — not caching
            # "nothing here" is what makes read-after-write polling safe.
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: api-cache-secrets
                  key: VALKEY_URL
            # GEO-3140: shared secret for the private /internal/for-you route, called only by the
            # web app's server. Optional: without it the route is not mounted (404).
            - name: GAIA_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-internal
                  key: GAIA_INTERNAL_TOKEN
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: api-sentry
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_TRACES_SAMPLE_RATE
              valueFrom:
                secretKeyRef:
                  name: api-sentry
                  key: SENTRY_TRACES_SAMPLE_RATE
                  optional: true
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: api-sentry
                  key: SENTRY_ENVIRONMENT
                  optional: true
            - name: SENTRY_RELEASE
              valueFrom:
                secretKeyRef:
                  name: api-sentry
                  key: SENTRY_RELEASE
                  optional: true
            - name: SENTRY_DEBUG
              valueFrom:
                secretKeyRef:
                  name: api-sentry
                  key: SENTRY_DEBUG
                  optional: true
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
          # Liveness answers "is this process wedged?", not "is it busy?".
          # At timeoutSeconds 3 / failureThreshold 3 it answered the second
          # question: ~30s of event-loop stall killed a pod sitting at
          # 400-534Mi of the 2Gi limit. That is actively harmful under load —
          # the kill drops the pod's in-flight requests (straight 5xx), sheds
          # its share of traffic onto the surviving pods, and brings it back
          # with a cold JIT, so one burst of expensive queries cascaded into
          # five dead pods in 30 seconds on 2026-08-06.
          #
          # 10s x 6 means ~60s of *consecutive* unresponsiveness before a
          # restart, which still catches a genuinely wedged process while
          # leaving a merely saturated one alone. Readiness below is
          # deliberately left tighter: a slow pod should leave the
          # load-balancer rotation and recover, not be destroyed.
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: gaia
  labels:
    app: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: api
---
# HTTP routing via the shared Envoy Gateway (`geo-api-envoy` in the geo-chat
# namespace — one LB / IP for the whole cluster, per-service HTTPRoutes).
# Companion Gateway-side change (geo-chat repo): listeners for
# testnet-api-v2.geobrowser.io and api-testnet.geobrowser.io (HTTP + HTTPS
# with a cert-manager cert) and allowedRoutes opened to the gaia namespace;
# DNS for both hosts points at the shared Gateway LB.
# This backend route attaches only to the HTTPS listeners. The geo-chat
# Gateway manifest owns the HTTP-to-HTTPS redirect route for both hosts,
# using a 308 (method-preserving) redirect — this required upgrading
# geo-testnet-k8s's Gateway API CRDs from v1.2.1 to v1.6.1, since 308
# only graduated to Core support in the RequestRedirect filter as of
# Gateway API v1.6.0.
# Note: the old nginx server-snippet gzip and proxy-body-size tuning have no
# HTTPRoute equivalent — response compression falls to the api process.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: gaia
spec:
  parentRefs:
    # Envoy Gateway, serving these hosts over HTTP/2 (geo-chat
    # infra/k8s/overlays/testnet/platform/envoy-gateway.yaml).
    - name: geo-api-envoy
      namespace: geo-chat
      sectionName: gaia-api-https
    - name: geo-api-envoy
      namespace: geo-chat
      sectionName: gaia-api-alias-https
  hostnames:
    - testnet-api-v2.geobrowser.io
    - api-testnet.geobrowser.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 3000
