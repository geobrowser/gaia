apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hermes-lag-observability
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: hermes.lag
      rules:
        # atlas publishes the same gauge and is deliberately included here. Its
        # cold-start replay is large in blocks (~1,750) but short in time (19s
        # measured), so the `for: 5m` clause absorbs it without a threshold
        # carve-out. This tip-relative rule is also immune to chain 55516's
        # multi-hour idle windows, which is why it — and not a staleness rule — is
        # the primary signal for a wedged substream.
        - alert: HermesBehindChainTip
          expr: |
            (
              label_replace(
                max by (gaia_namespace) (chain_tip_block_number),
                "namespace", "$1", "gaia_namespace", "(.*)"
              )
              -
              on(namespace) group_right
              max by (namespace, service) (hermes_latest_processed_block)
            ) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: hermes {{ $labels.service }} is behind chain tip
            description: hermes {{ $labels.service }} in {{ $labels.namespace }} is {{ $value }} blocks behind chain tip for over 5 minutes.
