apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-ingress-observability
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: api.ingress
      rules:
        - record: api:ingress_requests_per_second:rate5m
          expr: |
            sum(rate(nginx_ingress_controller_requests{host="testnet-api.geobrowser.io"}[5m]))

        - record: api:ingress_5xx_per_second:rate5m
          expr: |
            sum(rate(nginx_ingress_controller_requests{host="testnet-api.geobrowser.io",status=~"5.."}[5m]))

        - record: api:ingress_5xx_ratio:rate5m
          expr: |
            api:ingress_5xx_per_second:rate5m
            /
            clamp_min(api:ingress_requests_per_second:rate5m, 1)

        - record: api:ingress_status_requests_per_second:rate5m
          expr: |
            sum by (status) (
              rate(nginx_ingress_controller_requests{host="testnet-api.geobrowser.io"}[5m])
            )

        - record: api:ingress_p95_latency_seconds:5m
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(nginx_ingress_controller_request_duration_seconds_bucket{host="testnet-api.geobrowser.io"}[5m])
              )
            )

        - record: api:ingress_p50_latency_seconds:5m
          expr: |
            histogram_quantile(
              0.50,
              sum by (le) (
                rate(nginx_ingress_controller_request_duration_seconds_bucket{host="testnet-api.geobrowser.io"}[5m])
              )
            )

        - record: api:ingress_p75_latency_seconds:5m
          expr: |
            histogram_quantile(
              0.75,
              sum by (le) (
                rate(nginx_ingress_controller_request_duration_seconds_bucket{host="testnet-api.geobrowser.io"}[5m])
              )
            )

        - record: api:ingress_p99_latency_seconds:5m
          expr: |
            histogram_quantile(
              0.99,
              sum by (le) (
                rate(nginx_ingress_controller_request_duration_seconds_bucket{host="testnet-api.geobrowser.io"}[5m])
              )
            )

        - record: api:ingress_route_requests_per_second:rate5m
          expr: |
            sum by (path) (
              rate(nginx_ingress_controller_requests{host="testnet-api.geobrowser.io"}[5m])
            )

        - record: api:ingress_route_p99_latency_seconds:5m
          expr: |
            histogram_quantile(
              0.99,
              sum by (le, path) (
                rate(nginx_ingress_controller_request_duration_seconds_bucket{host="testnet-api.geobrowser.io"}[5m])
              )
            )
