              "expr": "1000 * (sum(rate(elasticsearch_indices_search_query_time_seconds[5m])) / sum(rate(elasticsearch_indices_search_query_total[5m])))",
              "legendFormat": "latency",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 200
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "Total Docs",
          "id": 42,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 86
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum(elasticsearch_indices_docs{index!~\"\\\\..*\"})",
              "legendFormat": "docs",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "Cluster Health",
          "description": "1 = healthy (green), 0 = degraded",
          "id": 43,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 86
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum(elasticsearch_cluster_health_status{color=\"green\"})",
              "legendFormat": "green",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DEGRADED",
                      "color": "red"
                    },
                    "1": {
                      "text": "GREEN",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          }
        },
        {
          "type": "stat",
          "title": "Unassigned Shards",
          "id": 44,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 86
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "elasticsearch_cluster_health_unassigned_shards",
              "legendFormat": "unassigned",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "Last Snapshot Age",
          "id": 45,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 86
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "(time() - max(elasticsearch_snapshot_stats_latest_snapshot_timestamp_seconds)) / 3600",
              "legendFormat": "hours",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 24
                  },
                  {
                    "color": "red",
                    "value": 48
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          }
        },
        {
          "type": "timeseries",
          "title": "Search QPS by Index",
          "id": 46,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 90
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "rate(elasticsearch_indices_search_query_total[5m])",
              "legendFormat": "{{index}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Indexing Rate & Failures",
          "id": 47,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 90
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum(rate(elasticsearch_indices_indexing_index_total[5m]))",
              "legendFormat": "index ops/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(elasticsearch_indices_indexing_index_failed_total[5m]))",
              "legendFormat": "failed ops/s",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "failed ops/s"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "JVM Heap Usage vs Max",
          "id": 48,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 98
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum(elasticsearch_jvm_memory_used_bytes{area=\"heap\"})",
              "legendFormat": "heap used",
              "refId": "A"
            },
            {
              "expr": "sum(elasticsearch_jvm_memory_max_bytes{area=\"heap\"})",
              "legendFormat": "heap max",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "GC Time & Frequency (5m rate)",
          "id": 49,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 98
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum(rate(elasticsearch_jvm_gc_collection_seconds_sum[5m]))",
              "legendFormat": "GC time (s/s)",
              "refId": "A"
            },
            {
              "expr": "sum(rate(elasticsearch_jvm_gc_collection_seconds_count[5m]))",
              "legendFormat": "GC runs (/s)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Thread Pool Rejections (5m rate)",
          "id": 50,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 106
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "rate(elasticsearch_thread_pool_rejected_count[5m])",
              "legendFormat": "{{node}} {{type}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Circuit Breaker Trips (5m rate)",
          "id": 51,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 106
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "rate(elasticsearch_breakers_tripped[5m])",
              "legendFormat": "{{name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "row",
          "id": 107,
          "title": "GraphQL Query Cost (shadow mode)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 76
          },
          "panels": []
        },
        {
          "id": 14,
          "type": "heatmap",
          "title": "GraphQL Query Cost Distribution (5m rate)",
          "description": "Histogram of GraphQL query cost over the last 5 minutes. Dark cells = many queries in that cost bucket.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 77
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (le) (rate(gaia_api_graphql_query_cost_bucket[5m]))",
              "format": "heatmap",
              "legendFormat": "{{le}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "calculate": false,
            "yAxis": {
              "axisLabel": "cost bucket",
              "unit": "short"
            },
            "cellGap": 1,
            "color": {
              "mode": "scheme",
              "scheme": "Spectral",
              "steps": 64,
              "exponent": 0.5
            }
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "GraphQL Query Cost p50 / p95 / p99 (5m)",
          "description": "Percentiles of GraphQL query cost over the rolling 5-minute window. Spikes indicate callers sending more expensive queries.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 77
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(gaia_api_graphql_query_cost_bucket[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gaia_api_graphql_query_cost_bucket[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(gaia_api_graphql_query_cost_bucket[5m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    app: kube-prometheus-stack-grafana
    grafana_dashboard: "1"
    release: kube-prometheus-stack
  name: gaia-overview-dashboard
  namespace: monitoring
