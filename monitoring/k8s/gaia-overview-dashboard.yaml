          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"gaia\", deployment=~\"api|api-cache|atlas|hermes-pipeline|hermes-ipfs-cache|kg-indexer|vote-indexer|topology-indexer|ranking-indexer|notification-indexer|delivery-worker\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "kube_deployment_spec_replicas{namespace=\"gaia\", deployment=~\"api|api-cache|atlas|hermes-pipeline|hermes-ipfs-cache|kg-indexer|vote-indexer|topology-indexer|ranking-indexer|notification-indexer|delivery-worker\"}",
