            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "kube_deployment_spec_replicas{namespace=\"gaia\",deployment=\"atlas\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "search-indexer Ready / Desired",
          "id": 37,
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 0,
            "y": 68
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "kube_statefulset_status_replicas_ready{namespace=\"gaia\",statefulset=\"search-indexer\"}",
              "legendFormat": "ready",
              "refId": "A"
            },
            {
              "expr": "kube_statefulset_replicas{namespace=\"gaia\",statefulset=\"search-indexer\"}",
              "legendFormat": "desired",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "description": "search-indexer runs as a StatefulSet, so it is not in the Deployment table."
        },
        {
          "type": "row",
          "id": 107,
          "title": "GraphQL Query Cost (shadow mode)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 76
          },
          "panels": []
        },
        {
          "id": 14,
          "type": "heatmap",
          "title": "GraphQL Query Cost Distribution (5m rate)",
          "description": "Histogram of GraphQL query cost over the last 5 minutes. Dark cells = many queries in that cost bucket.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 77
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (le) (rate(gaia_api_graphql_query_cost_bucket[5m]))",
              "format": "heatmap",
              "legendFormat": "{{le}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "calculate": false,
            "yAxis": {
              "axisLabel": "cost bucket",
              "unit": "short"
            },
            "cellGap": 1,
            "color": {
              "mode": "scheme",
              "scheme": "Spectral",
              "steps": 64,
              "exponent": 0.5
            }
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "GraphQL Query Cost p50 / p95 / p99 (5m)",
          "description": "Percentiles of GraphQL query cost over the rolling 5-minute window. Spikes indicate callers sending more expensive queries.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 77
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(gaia_api_graphql_query_cost_bucket[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gaia_api_graphql_query_cost_bucket[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(gaia_api_graphql_query_cost_bucket[5m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "row",
          "id": 108,
          "title": "GraphQL Response Size (sampled when durationMs ≥ 1s)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 85
          },
          "panels": []
        },
        {
          "id": 16,
          "type": "heatmap",
          "title": "GraphQL Response Size Distribution (5m rate)",
          "description": "Histogram of GraphQL response sizes (in bytes) over the last 5 minutes. Sampled only for queries with durationMs ≥ 1000ms — the population that contributes to OOM / payload pressure.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 86
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (le) (rate(gaia_api_graphql_response_size_bytes_bucket[5m]))",
              "format": "heatmap",
              "legendFormat": "{{le}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "calculate": false,
            "yAxis": {
              "axisLabel": "size bucket (bytes)",
              "unit": "bytes"
            },
            "cellGap": 1,
            "color": {
              "mode": "scheme",
              "scheme": "Spectral",
              "steps": 64,
              "exponent": 0.5
            }
          }
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "GraphQL Response Size p50 / p95 / p99 (5m)",
          "description": "Percentiles of GraphQL response size (bytes) over the rolling 5-minute window. Sampled only for queries with durationMs ≥ 1000ms.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 86
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(gaia_api_graphql_response_size_bytes_bucket[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gaia_api_graphql_response_size_bytes_bucket[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(gaia_api_graphql_response_size_bytes_bucket[5m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "row",
          "title": "Indexers",
          "id": 109,
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 103
          }
        },
        {
          "type": "timeseries",
          "title": "Indexer throughput (per second)",
          "id": 120,
          "description": "Work done per second by each consumer. Their topics only carry messages when someone acts, so zero in a quiet stretch is normal; Kafka lag is on the Kafka Consumer Lag dashboard.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 104
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum(rate(kg_indexer_blocks_processed_total{namespace=\"gaia\"}[5m]))",
              "legendFormat": "kg-indexer blocks",
              "refId": "A"
            },
            {
              "expr": "sum(rate(kg_indexer_events_processed_total{namespace=\"gaia\"}[5m]))",
              "legendFormat": "kg-indexer events",
              "refId": "B"
            },
            {
              "expr": "sum(rate(search_indexer_documents_indexed_total{namespace=\"gaia\"}[5m]))",
              "legendFormat": "search-indexer docs",
              "refId": "C"
            },
            {
              "expr": "sum(rate(vote_indexer_votes_processed_total{namespace=\"gaia\"}[5m]))",
              "legendFormat": "vote-indexer votes",
              "refId": "D"
            },
            {
              "expr": "sum(rate(topology_indexer_diffs_applied_total{namespace=\"gaia\"}[5m]))",
              "legendFormat": "topology-indexer diffs",
              "refId": "E"
            },
            {
              "expr": "sum(rate(ranking_indexer_messages_processed_total{namespace=\"gaia\"}[5m]))",
              "legendFormat": "ranking-indexer messages",
              "refId": "F"
            },
            {
              "expr": "sum(rate(notification_indexer_events_processed_total{namespace=\"gaia\"}[5m]))",
              "legendFormat": "notification-indexer events",
              "refId": "G"
            },
            {
              "expr": "sum(rate(delivery_worker_deliveries_total{namespace=\"gaia\"}[5m]))",
              "legendFormat": "delivery-worker deliveries",
              "refId": "H"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Data dropped or failed (15m increase)",
          "id": 121,
          "description": "Same series as KgIndexerBlockDropped and IndexerDroppedData (monitoring/k8s/v2/*-alerts.yaml). Any non-zero value is data that did not land.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 104
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum by (transient) (increase(kg_indexer_blocks_dropped_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "kg-indexer blocks dropped (transient={{transient}})",
              "refId": "A"
            },
            {
              "expr": "sum(increase(vote_indexer_votes_dropped_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "vote-indexer votes dropped",
              "refId": "B"
            },
            {
              "expr": "sum(increase(topology_indexer_diffs_dropped_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "topology-indexer diffs dropped",
              "refId": "C"
            },
            {
              "expr": "sum by (reason) (increase(notification_indexer_events_failed_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "notification-indexer failed ({{reason}})",
              "refId": "D"
            },
            {
              "expr": "sum(increase(delivery_worker_deliveries_total{namespace=\"gaia\", outcome=\"failed\"}[15m]))",
              "legendFormat": "delivery-worker failed deliveries",
              "refId": "E"
            },
            {
              "expr": "sum(increase(search_indexer_operations_failed_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "search-indexer operations failed",
              "refId": "F"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Retries, rejects and unparseable messages (15m increase)",
          "id": 122,
          "description": "Recoverable trouble: retried, skipped by design, or rejected as malformed. A rising line here usually precedes the dropped panel.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 112
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum(increase(kg_indexer_batch_retries_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "kg-indexer batch retries",
              "refId": "A"
            },
            {
              "expr": "sum(increase(kg_indexer_messages_unparseable_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "kg-indexer unparseable",
              "refId": "B"
            },
            {
              "expr": "sum by (topic) (increase(ranking_indexer_transient_retries_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "ranking-indexer retries ({{topic}})",
              "refId": "C"
            },
            {
              "expr": "sum by (topic) (increase(ranking_indexer_messages_skipped_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "ranking-indexer skipped ({{topic}})",
              "refId": "D"
            },
            {
              "expr": "sum by (reason) (increase(vote_indexer_messages_rejected_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "vote-indexer rejected ({{reason}})",
              "refId": "E"
            },
            {
              "expr": "sum(increase(topology_indexer_messages_unparseable_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "topology-indexer unparseable",
              "refId": "F"
            },
            {
              "expr": "sum(increase(delivery_worker_claim_errors_total{namespace=\"gaia\"}[15m]))",
              "legendFormat": "delivery-worker claim errors",
              "refId": "G"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Delivery queue",
          "id": 123,
          "description": "Notification deliveries waiting in Postgres. Reads 0 when idle.",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 112
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum(delivery_worker_pending_deliveries{namespace=\"gaia\"})",
              "legendFormat": "pending",
              "refId": "A"
            },
            {
              "expr": "sum(delivery_worker_in_progress_deliveries{namespace=\"gaia\"})",
              "legendFormat": "in progress",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "search-indexer bulk latency (avg ms per bulk call)",
          "id": 124,
          "description": "OpenSearch-reported `took` versus the indexer's own wall-clock time per bulk request. A widening gap is network or client-side queueing.",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 112
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "sum(rate(search_indexer_bulk_took_milliseconds_total{namespace=\"gaia\"}[5m])) / sum(rate(search_indexer_bulk_calls_total{namespace=\"gaia\"}[5m]))",
              "legendFormat": "OpenSearch took",
              "refId": "A"
            },
            {
              "expr": "sum(rate(search_indexer_bulk_wall_milliseconds_total{namespace=\"gaia\"}[5m])) / sum(rate(search_indexer_bulk_calls_total{namespace=\"gaia\"}[5m]))",
              "legendFormat": "wall clock",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Indexer scrape up",
          "id": 125,
          "description": "1 = scraped. KgIndexerMetricsMissing and IndexerMetricsMissing fire when these disappear.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 120
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "up{namespace=\"gaia\", job=~\"kg-indexer|search-indexer|vote-indexer|topology-indexer|ranking-indexer|notification-indexer|delivery-worker\"}",
              "legendFormat": "{{job}} {{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    app: kube-prometheus-stack-grafana
    grafana_dashboard: "1"
    release: kube-prometheus-stack
  name: gaia-overview-dashboard
  namespace: monitoring
