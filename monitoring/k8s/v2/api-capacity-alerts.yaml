# API capacity alerts for the gaia namespace.
#
# The old cluster's copy defines three alerts twice (once for `api`, once for
# `api-staging`). The new cluster runs a single `gaia` namespace, so the
# staging duplicate is dropped.
#
# The two latency/error alerts were originally backed by
# nginx_ingress_controller_* metrics. This cluster serves through a Cilium
# Gateway, so they are now backed by the api:gateway_* recording rules in
# gateway-metrics.yaml, which derive from Cilium's Envoy.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-capacity-observability
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: api.capacity
      rules:
        - alert: ApiReadinessDegraded
          expr: |
            (
              sum(kube_pod_status_ready{namespace="gaia", condition="true", pod=~"api-.*"})
              /
              clamp_min(sum(kube_pod_status_phase{namespace="gaia", phase="Running", pod=~"api-.*"}), 1)
            ) < 0.75
          for: 5m
          labels:
            severity: warning
            service: api
          annotations:
            summary: API readiness ratio is degraded
            description: Fewer than 75% of running API pods are ready for 5 minutes.

        # Restores the old cluster's pairing: saturation alone is normal and
        # self-correcting, saturation WITH a latency tail is not. Firing on the
        # replica count by itself produced false alarms on a healthy API.
        #
        # Threshold raised from the old cluster's 2s to 5s: p99 here measures
        # only the Envoy -> pod leg but currently sits at ~4.4s against a p50 of
        # 0.03s and p90 of 0.31s. That tail is a real problem worth fixing, but
        # it is the steady state today, so alerting at 2s would page constantly.
        # Lower this to 2s once the tail is addressed.
        - alert: ApiHpaMaxedWithHighP99
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="gaia", horizontalpodautoscaler="api"}
            >=
            kube_horizontalpodautoscaler_spec_max_replicas{namespace="gaia", horizontalpodautoscaler="api"}
            and api:gateway_p99_latency_seconds:5m > 5
          for: 10m
          labels:
            severity: critical
            service: api
          annotations:
            summary: API HPA is maxed while p99 latency is high
            description: >-
              API is at max replicas with sustained p99 latency above 5s. Unlike
              a bare max-replicas condition this means requests are actually
              suffering, not merely that the autoscaler has hit its ceiling.

        # Added 2026-08-19 after a 5-pod OOM cascade that NOTHING alerted on.
        # The existing three alerts all missed it: readiness recovered too fast
        # to breach 0.75, the HPA/p99 pair needs a latency tail, and the 5xx
        # alert names the gateway rather than pod memory. The generic
        # KubePodCrashLooping does not cover it either — it requires
        # CrashLoopBackOff, and a pod that OOM-kills and restarts cleanly never
        # enters that state.
        #
        # NOTE the difference from AtlasRestartingRepeatedly, which this is
        # otherwise modelled on: that one is per-pod (`increase(...) >= 3`),
        # which suits a single-replica service restarting over and over. The api
        # failure signature is the opposite shape — N *different* pods each
        # restarting ONCE as load shifts from a dying pod to the next. On
        # 2026-08-19 that was 5 pods x 1 restart in ~2 minutes, which a per-pod
        # rule scores as 1 and ignores. Hence `sum(...)` across the fleet.
        #
        # Rollouts do not trip this: replacements start at restartCount 0 and
        # retired pods simply stop exporting their series, so neither produces a
        # counter increase.
        #
        # 3/hour is deliberately above a lone isolated restart (not worth waking
        # anyone for) and far below the 19-54/day seen 08-16..08-19.
        - alert: ApiRestartingRepeatedly
          expr: |
            sum(increase(kube_pod_container_status_restarts_total{namespace="gaia", container="api"}[1h])) >= 3
          for: 5m
          labels:
            severity: warning
            service: api
          annotations:
            summary: API pods are restarting repeatedly
            description: >-
              {{ $value | printf "%.0f" }} api container restarts in the last hour.
              Confirm the cause with `kubectl get pods -n gaia -l app=api -o
              jsonpath='{range .items[*]}{.status.containerStatuses[0].lastState.terminated.reason}{"\n"}{end}'`.
              If OOMKilled: this has always been a SINGLE-REQUEST serialization
              kill, not capacity and not concurrency. One bulk query can allocate
              ~1.5GB against the 2Gi limit. Find the caller in the pod logs —
              grep for '"first":1000' and for nested `relations(first: 1000)`,
              then read `clientIp` / `userAgent` on the "High GraphQL query cost"
              lines. Do NOT add nodes (this is a cgroup limit, not node
              pressure) and do NOT lower GRAPHQL_MAX_CONCURRENT_EXPENSIVE
              (measured 2026-08-19: 6 doubled 503s to 1414/h with no OOM
              reduction). Precedent: geo-explorers/postgres_to_geo was sweeping
              at root first:1000, fixed in their PR #36.

        - alert: Api5xxRateHigh
          expr: api:gateway_5xx_ratio:rate5m > 0.02
          for: 10m
          labels:
            severity: warning
            service: api
          annotations:
            summary: API 5xx rate above 2%
            description: More than 2% of gateway responses for the API have been 5xx for 10 minutes.
