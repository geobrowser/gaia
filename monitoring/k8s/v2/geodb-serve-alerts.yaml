# Alerts on geo-db serve's own figures and the notification-indexer's outbox mirror. Series come from
# the hermes-metrics ServiceMonitor: serve's GET /metrics (Service geodb, port 9091, job "geodb") and
# notification-indexer's /metrics on 9464 (job "notification-indexer"). Runbook: geodb/RUNBOOK.md.
#
#   GeoDbDerivedRowsHigh      geodb_derived_rows above 80% of geodb_derived_rows_max for 15m
#   GeoDbOutboxMirrorErrors   geodb_outbox_mirror_errors_total rose in the last 15m
#   GeoDbOutboxMirrorDropped  geodb_outbox_mirror_dropped_total rose in the last 15m
#   GeoDbOutboxMirrorBacklog  geodb_outbox_mirror_backlog above 0 for 10m (needs gaia#1491, flag
#                             GEODB_OUTBOX_MIRROR_BACKLOG on; the series does not exist before)
#   GeoDbOutboxMirrorBacklogDropped
#                             geodb_outbox_mirror_backlog_dropped_total or _expired_total rose in the last 15m
#   GeoDbVotesCountMirrorLag  vote-indexer's votes_count mirror (collections 26 and 33) more than 10m
#                             behind the newest source row for 15m (vote_indexer_votes_count_mirror_lag_seconds)
#
#   GeoDbWorkRowsHigh         geodb_work_rows above 80% of geodb_work_rows_max for 15m (serve >= geo-db
#                             5fbf4ad5ee; printed only while the work class is on)
#   GeoDbClaimsNearPeak       geodb_claims_in_use at 90% of geodb_claims_in_use_max (a high-water mark) and at
#                             least 4 claims, for 10m, per claim_class (serve >= geo-db 2103bd8335)
#   GeoDbClaimsRefused        geodb_claims_refused_total rose in the last 15m, per claim_class
#   GeoDbClaimParkedSustained geodb_requests_claim_parked_total above 0.2/s for 10m, per class
#
#   kubectl apply -f monitoring/k8s/v2/geodb-serve-alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: geodb-serve
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: geodb.serve
      rules:
        - alert: GeoDbDerivedRowsHigh
          # The cap is its own series, so this follows a raised derived_rows_max (2097152 today).
          expr: |
            max(geodb_derived_rows{namespace="gaia", job="geodb"})
              / max(geodb_derived_rows_max{namespace="gaia", job="geodb"}) > 0.8
          for: 15m
          labels:
            severity: warning
            service: geodb
            namespace: gaia
          annotations:
            summary: geo-db's derived class holds more than 80% of derived_rows_max
            description: >-
              Writes past the cap are refused (geodb_derived_refused_cap_total) and the writer drops or
              retries them. See geodb_derived_collection_rows{collection} for which collection grew, then
              raise derived_rows_max in the geodb-serve-config ConfigMap (one serve restart; RUNBOOK 2d).

        - alert: GeoDbWorkRowsHigh
          # ledger + payload + noted + delivered + failed rows, the figure work_rows_max bounds.
          expr: |
            max(geodb_work_rows{namespace="gaia", job="geodb"})
              / max(geodb_work_rows_max{namespace="gaia", job="geodb"}) > 0.8
          for: 15m
          labels:
            severity: warning
            service: geodb
            namespace: gaia
          annotations:
            summary: geo-db's work class holds more than 80% of work_rows_max
            description: >-
              Units past the cap are refused, so the outbox mirror starts counting errors. Check
              geodb_work_pending / geodb_work_delivered for a stalled consumer, then raise work_rows_max in
              serve.cfg (one serve restart).

        - alert: GeoDbOutboxMirrorErrors
          # A counter is created at its first increment, so the first-ever error has no earlier sample for
          # increase() to subtract; the second clause catches a series that appeared in the window.
          expr: |
            sum(increase(geodb_outbox_mirror_errors_total{namespace="gaia", job="notification-indexer"}[15m])) > 0
            or
            sum(geodb_outbox_mirror_errors_total{namespace="gaia", job="notification-indexer"}
                unless geodb_outbox_mirror_errors_total{namespace="gaia", job="notification-indexer"} offset 15m) > 0
          labels:
            severity: warning
            service: notification-indexer
            namespace: gaia
          annotations:
            summary: The notification-indexer's geo-db outbox mirror is failing
            description: >-
              The mirror's geodb-client pipe errored (serve unreachable, key refused, work class off). The
              shadow loses rows meanwhile; Postgres delivery is unaffected. Read the indexer log for
              geodb_outbox.mirror_failed and geodb_outbox.pipe_started (RUNBOOK section 11).

        - alert: GeoDbOutboxMirrorDropped
          expr: |
            sum(increase(geodb_outbox_mirror_dropped_total{namespace="gaia", job="notification-indexer"}[15m])) > 0
            or
            sum(geodb_outbox_mirror_dropped_total{namespace="gaia", job="notification-indexer"}
                unless geodb_outbox_mirror_dropped_total{namespace="gaia", job="notification-indexer"} offset 15m) > 0
          labels:
            severity: warning
            service: notification-indexer
            namespace: gaia
          annotations:
            summary: The notification-indexer's outbox mirror is dropping rows
            description: >-
              The bounded queue (4096) was full or its worker is gone, so enqueues were dropped from the
              shadow (geodb_outbox_mirror_queue shows the depth). Postgres delivery is unaffected, but
              the work class is now missing rows and a later shadow-read comparison will show them.

        - alert: GeoDbOutboxMirrorBacklog
          # Units wait here only while serve refuses or is unreachable; a serve roll clears in under a
          # minute, so 10m means a real outage, not a roll.
          expr: |
            max(geodb_outbox_mirror_backlog{namespace="gaia", job="notification-indexer"}) > 0
          for: 10m
          labels:
            severity: warning
            service: notification-indexer
            namespace: gaia
          annotations:
            summary: The notification-indexer's outbox mirror has held unsent units for 10 minutes
            description: >-
              Units whose geo-db enter failed are kept and retried oldest first (bounded; default 3000).
              A backlog that does not drain means serve is down or refusing the work key; once the bound
              is hit the oldest units are dropped (GeoDbOutboxMirrorBacklogDropped). Fix serve, then check
              the backlog falls to 0 (RUNBOOK section 11).

        - alert: GeoDbOutboxMirrorBacklogDropped
          # Overflow drops (backlog_dropped) and refused-head expiry (backlog_expired) both lose a
          # unit from the shadow. Same counter shape as the alerts above: the second clause catches a
          # series that first appeared inside the window.
          expr: |
            sum(increase({__name__=~"geodb_outbox_mirror_backlog_(dropped|expired)_total", namespace="gaia", job="notification-indexer"}[15m])) > 0
            or
            sum({__name__=~"geodb_outbox_mirror_backlog_(dropped|expired)_total", namespace="gaia", job="notification-indexer"}
                unless {__name__=~"geodb_outbox_mirror_backlog_(dropped|expired)_total", namespace="gaia", job="notification-indexer"} offset 15m) > 0
          labels:
            severity: warning
            service: notification-indexer
            namespace: gaia
          annotations:
            summary: The notification-indexer's outbox mirror backlog is dropping units
            description: >-
              Units were dropped from the backlog: it hit its bound during an outage (backlog_dropped), or
              a unit geo-db kept refusing was expired from the head (backlog_expired; needs gaia#1507).
              Postgres delivery is unaffected. Check which counter rose, then replay the window with
              outbox-replay once serve is healthy (RUNBOOK section 11).

        - alert: GeoDbVotesCountMirrorLag
          # The gauge is the newest votes_count updated_at the mirror was asked to send minus the newest
          # whose rows (26 and its 33 pair) geo-db acknowledged, set after every mirror call. It is 0
          # while the mirror is off, and holds its last value through a quiet spell, so a stall that
          # starts with no vote after it shows as the next vote's lag, not as a rising line.
          expr: |
            max(vote_indexer_votes_count_mirror_lag_seconds{namespace="gaia"}) > 600
          for: 15m
          labels:
            severity: warning
            service: vote-indexer
            namespace: gaia
          annotations:
            summary: The vote-indexer's votes_count geo-db mirror is more than 10 minutes behind
            description: >-
              geo-db's collections 26 (votes_count) and 33 (votes_count_updates) trail Postgres, so the
              notification poller and any vote-tally read from geo-db are stale. Postgres is unaffected.
              Check vote_indexer_votes_count_mirror_rows_total{collection} is rising, and
              geodb_derived_mirror_errors_total / _unacknowledged_total / _dropped_total{table="votes_count"}
              for why. A vote-indexer restart re-copies the whole table (the start-up snapshot).

        # The claim region (serve >= geo-db 2103bd8335; live serve geodb:8050918d2f does not export these,
        # so all three stay silent until the pin lands). Baseline, from geo-db ISS-675-721 (Metrics) and
        # tests/server/http.zig: in_use returns at idle to a standing value, the live room's one
        # long-lived claim (0 or 1 a class), never the requests' own. in_use_max is the high-water mark
        # since open, not a capacity, so a ratio to it only means "at the peak this process has seen";
        # the floor of 4 claims keeps a quiet node (in_use == in_use_max == baseline) from reading as 1.0.
        - alert: GeoDbClaimsNearPeak
          expr: |
            max by (claim_class) (
              geodb_claims_in_use{namespace="gaia", job="geodb"}
                / geodb_claims_in_use_max{namespace="gaia", job="geodb"}
            ) >= 0.9
            and
            max by (claim_class) (geodb_claims_in_use{namespace="gaia", job="geodb"}) >= 4
          for: 10m
          labels:
            severity: warning
            service: geodb
            namespace: gaia
          annotations:
            summary: geo-db's {{ $labels.claim_class }} claim region has held its peak number of claims for 10 minutes
            description: >-
              At least 4 claims held, within 10% of the most this process has held at once, for 10m. Requests
              are done in seconds, so claims that stay held are leaked or lent to parked requests (ISS-675-721:
              parked records filled the region and a running request waited 10s for its own claim). Check
              geodb_requests_claim_parked_total and geodb_claims_refused_total; a serve restart clears it.

        - alert: GeoDbClaimsRefused
          # The rows print at 0 from the first scrape, so increase() always has an earlier sample.
          expr: |
            sum by (claim_class) (increase(geodb_claims_refused_total{namespace="gaia", job="geodb"}[15m])) > 0
          labels:
            severity: warning
            service: geodb
            namespace: gaia
          annotations:
            summary: geo-db refused a {{ $labels.claim_class }} claim in the last 15m
            description: >-
              An acquisition found no room and returned ResourceExhausted, so a request failed or a job
              backed off. Look at geodb_claims_in_use{claim_class} against geodb_claims_in_use_max and at
              geodb_requests_claim_parked_total; the region is full or held by parked requests (ISS-675-721).

        - alert: GeoDbClaimParkedSustained
          # Above 0.2 a second for 10m is 120 parks in the window; the claim wait ends at ten seconds.
          expr: |
            sum by (class) (rate(geodb_requests_claim_parked_total{namespace="gaia", job="geodb"}[10m])) > 0.2
          for: 10m
          labels:
            severity: warning
            service: geodb
            namespace: gaia
          annotations:
            summary: geo-db is parking {{ $labels.class }} requests for want of a claim, steadily
            description: >-
              Requests wait for a claim in the region instead of taking one. A burst is normal; ten minutes
              of it means the region is too small for the load or claims are held too long. Compare
              geodb_claims_in_use{claim_class} with its _max and check geodb_claims_refused_total.
