# Alerts for the geo-db read replica's feeder (geodb/, geodb-feeder/). Series come from the feeder
# Deployment through the hermes-metrics ServiceMonitor (job "geodb-feeder"). Runbook: geodb/RUNBOOK.md.
#
#   GeoDbFeederDown        no feeder series, or serve/consumer reported down, for 10m
#   GeoDbFeederStalled     messages are waiting but none has been applied for 15m
#   GeoDbFeederLagHigh     more than 5000 messages behind for 30m (a first catch-up from the start of
#                          the topic trips this once; it should clear)
#   GeoDbFeederDeadLetters the feeder skipped a message or intent (errors.jsonl on the volume)
#   GeoDbFeederMembershipStalled  space.membership messages have waited unapplied for 30m
#   GeoDbFeederVotesStalled  curation.votes messages waiting and none applied for 30m
#   GeoDbFeederProposalVotesStalled  space.governance messages waiting and none handled by the proposal-votes consumer for 30m
#   GeoDbFeederProposalActionsStalled  same, for the proposal-actions consumer
#   GeoDbFeederSubspacesStalled  space.trust.extensions messages waiting and none handled by the subspaces consumer for 30m
#   GeoDbFeederSpaceVotingSettingsStalled  same, for the space-voting-settings consumer
#   GeoDbFeederProposalVersionsStalled same, for the proposal-versions consumer
#   GeoDbFeederProposalStatusStalled  same, for the proposal-status consumer
#
#   kubectl apply -f monitoring/k8s/v2/geodb-feeder-alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: geodb-feeder
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: geodb.feeder
      rules:
        - alert: GeoDbFeederDown
          expr: |
            absent(geodb_feeder_serve_up{namespace="gaia", job="geodb-feeder"})
            or min(geodb_feeder_serve_up{namespace="gaia", job="geodb-feeder"}) == 0
            or min(geodb_feeder_consumer_running{namespace="gaia", job="geodb-feeder"}) == 0
          for: 10m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder or geodb-serve is down
            description: >-
              Cards read from geo-db are going stale (mode on falls back to Postgres only when geo-db
              errors, not when it is merely behind). Check kubectl -n gaia get pod geodb-0 and
              the feeder pod (app=geodb-feeder), and their logs. serve_up 0 means serve is down or refusing; consumer_running 0
              means Kafka (credentials, ACL on the group geodb-feeder-v1-testnet).

        - alert: GeoDbFeederStalled
          expr: |
            sum(geodb_feeder_consumer_lag{namespace="gaia", job="geodb-feeder"}) > 0
            and
            (time() - max(geodb_feeder_last_applied_timestamp_seconds{namespace="gaia", job="geodb-feeder"})) > 900
          for: 5m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder has work waiting and is applying nothing
            description: >-
              No message applied for 15m while the topic is ahead. The feeder retries a failing apply
              forever instead of skipping it, so look at the feeder log for the repeating error
              (kind transient = serve unreachable; exhausted = serve is out of a per-process resource and needs
              kubectl -n gaia rollout restart statefulset/geodb, which drains it cleanly).

        - alert: GeoDbFeederLagHigh
          expr: sum(geodb_feeder_consumer_lag{namespace="gaia", job="geodb-feeder"}) > 5000
          for: 30m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder is more than 5000 messages behind
            description: >-
              The replica lags the topic. Shadow comparisons will show only_postgres rows for recent
              edits until it catches up. A first catch-up from the start of the topic is expected to
              trip this once.

        - alert: GeoDbFeederMembershipStalled
          expr: sum(geodb_feeder_membership_consumer_lag{namespace="gaia", job="geodb-feeder"}) > 0
          for: 30m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder's membership consumer has applied nothing for 30m
            description: >-
              space.membership messages are waiting. Membership retries a failing message forever: with
              GEODB_RECORD_KEYS a ResourceExhausted founding the governance system Space holds the partition
              rather than skipping the family (geodb/RUNBOOK.md 2c-bis). Read the feeder log for the repeating
              error; if founded is at the serve config's spaces, raise the cap (RUNBOOK 2d).

        - alert: GeoDbFeederVotesStalled
          # Waiting and not moving: curation.votes is busy enough that lag alone is often above 0 between polls.
          expr: |
            sum(geodb_feeder_votes_consumer_lag{namespace="gaia", job="geodb-feeder"}) > 0
            unless sum(increase(geodb_feeder_vote_events_total{namespace="gaia", job="geodb-feeder"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder's votes consumer has applied nothing for 30m
            description: >-
              curation.votes messages are waiting. The votes consumer retries a failing message forever: a
              ResourceExhausted founding the votes system Space holds the partition rather than skipping the
              family (geodb/RUNBOOK.md 2c-ter). Read the feeder log for the repeating error; if founded is at the
              serve config's spaces, raise the cap (RUNBOOK 2d).

        - alert: GeoDbFeederProposalVotesStalled
          # Same shape as VotesStalled. Every space.governance message counts as handled (ignored ones too), so
          # nothing handled while lag is above 0 means a message is being retried in place.
          expr: |
            sum(geodb_feeder_proposal_votes_consumer_lag{namespace="gaia", job="geodb-feeder"}) > 0
            unless sum(increase(geodb_feeder_proposal_vote_events_total{namespace="gaia", job="geodb-feeder"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder's proposal-votes consumer has handled nothing for 30m
            description: >-
              space.governance messages are waiting. The proposal-votes consumer retries a failing message forever:
              a ResourceExhausted founding the votes system Space holds the partition rather than skipping the
              family (geodb/RUNBOOK.md 2c-quater). Read the feeder log for the repeating error; if founded is at the
              serve config's spaces, raise the cap (RUNBOOK 2d).

        - alert: GeoDbFeederProposalActionsStalled
          # Same shape as ProposalVotesStalled. Every space.governance message counts as handled (ignored ones too), so
          # nothing handled while lag is above 0 means a message is being retried in place.
          expr: |
            sum(geodb_feeder_proposal_actions_consumer_lag{namespace="gaia", job="geodb-feeder"}) > 0
            unless sum(increase(geodb_feeder_proposal_action_events_total{namespace="gaia", job="geodb-feeder"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder's proposal-actions consumer has handled nothing for 30m
            description: >-
              space.governance messages are waiting. The proposal-actions consumer retries a failing message forever:
              a ResourceExhausted founding the governance system Space holds the partition rather than skipping the
              family (geodb/RUNBOOK.md 2c-quinquies). Read the feeder log for the repeating error; if founded is at the
              serve config's spaces, raise the cap (RUNBOOK 2d).

        - alert: GeoDbFeederSubspacesStalled
          # Same shape as ProposalVotesStalled. Every message counts as handled (ignored ones too), so
          # nothing handled while lag is above 0 means a message is being retried in place.
          expr: |
            sum(geodb_feeder_subspaces_consumer_lag{namespace="gaia", job="geodb-feeder"}) > 0
            unless sum(increase(geodb_feeder_subspace_events_total{namespace="gaia", job="geodb-feeder"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder's subspaces consumer has handled nothing for 30m
            description: >-
              space.trust.extensions messages are waiting. The subspaces consumer retries a failing message forever:
              a ResourceExhausted founding the governance system Space holds the partition rather than skipping the
              family (geodb/RUNBOOK.md 2c-sexies). Read the feeder log for the repeating error; if founded is at the
              serve config's spaces, raise the cap (RUNBOOK 2d).

        - alert: GeoDbFeederSpaceVotingSettingsStalled
          # Same shape as ProposalActionsStalled: every space.governance message counts as handled (ignored ones too).
          expr: |
            sum(geodb_feeder_space_voting_settings_consumer_lag{namespace="gaia", job="geodb-feeder"}) > 0
            unless sum(increase(geodb_feeder_space_voting_settings_events_total{namespace="gaia", job="geodb-feeder"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder's space-voting-settings consumer has handled nothing for 30m
            description: >-
              space.governance messages are waiting. The space-voting-settings consumer retries a failing message
              forever: a ResourceExhausted founding the governance system Space holds the partition rather than
              skipping the family (geodb/RUNBOOK.md 2c-septies). Read the feeder log for the repeating error; if
              founded is at the serve config's spaces, raise the cap (RUNBOOK 2d).

        - alert: GeoDbFeederProposalVersionsStalled
          # Same shape as ProposalActionsStalled. Every space.governance message counts as handled (ignored ones too), so
          # nothing handled while lag is above 0 means a message is being retried in place.
          expr: |
            sum(geodb_feeder_proposal_versions_consumer_lag{namespace="gaia", job="geodb-feeder"}) > 0
            unless sum(increase(geodb_feeder_proposal_version_events_total{namespace="gaia", job="geodb-feeder"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder's proposal-versions consumer has handled nothing for 30m
            description: >-
              space.governance messages are waiting. The proposal-versions consumer retries a failing message forever:
              a ResourceExhausted founding the governance system Space holds the partition rather than skipping the
              family (geodb/RUNBOOK.md 2c-octies). Read the feeder log for the repeating error; if founded is at the
              serve config's spaces, raise the cap (RUNBOOK 2d).

        - alert: GeoDbFeederProposalStatusStalled
          # Same shape as ProposalActionsStalled: every space.governance message counts as handled (ignored ones too).
          expr: |
            sum(geodb_feeder_proposal_status_consumer_lag{namespace="gaia", job="geodb-feeder"}) > 0
            unless sum(increase(geodb_feeder_proposal_status_events_total{namespace="gaia", job="geodb-feeder"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder's proposal-status consumer has handled nothing for 30m
            description: >-
              space.governance messages are waiting. The proposal-status consumer retries a failing message
              forever: a ResourceExhausted founding the governance system Space holds the partition rather than
              skipping the family (geodb/RUNBOOK.md 2c-novies). Read the feeder log for the repeating error; if
              founded is at the serve config's spaces, raise the cap (RUNBOOK 2d).

        - alert: GeoDbFeederConsumerStartFailed
          # Only a labelled series can fire: the gauge has one only for an optional consumer that is enabled
          # (membership_keyed with GEODB_RECORD_KEYS, votes with GEODB_VOTES, proposal_votes with GEODB_PROPOSAL_VOTES, proposal_actions with GEODB_PROPOSAL_ACTIONS, subspaces with GEODB_SUBSPACES, space_voting_settings with GEODB_SPACE_VOTING_SETTINGS, proposal_versions with GEODB_PROPOSAL_VERSIONS, proposal_status with GEODB_PROPOSAL_STATUS),
          # so this is inert flag-off.
          expr: max by (consumer) (geodb_feeder_consumer_start_failed{namespace="gaia", job="geodb-feeder", consumer!=""}) > 0
          for: 10m
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: "The geo-db feeder's {{ $labels.consumer }} consumer failed to start"
            description: >-
              An enabled optional consumer threw at boot and is not running (the edits consumer is unaffected).
              It has no lag series, so its stall alert cannot fire. The expected cause is a missing Kafka ACL on
              its topic or consumer group (geodb/RUNBOOK.md 2c-bis / 2c-ter activation steps). Read the feeder log
              for "consumer failed to start", fix the cause, then restart the feeder.

        - alert: GeoDbFeederDeadLetters
          expr: increase(geodb_feeder_dead_letters_total{namespace="gaia", job="geodb-feeder"}[30m]) > 0
          labels:
            severity: warning
            service: geodb-feeder
            namespace: gaia
          annotations:
            summary: The geo-db feeder skipped an edit or an intent
            description: >-
              A message could not be decoded or geo-db refused an intent for good; it is written to
              /data/feeder/errors.jsonl and skipped. Read it with
              kubectl -n gaia exec deploy/geodb-feeder -- tail /data/feeder/errors.jsonl. Each skipped item
              is a card that can differ in shadow mode.
