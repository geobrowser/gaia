rule_files:
  - __RULES__
evaluation_interval: 1m
tests:
  - name: fires once the count stays above zero for 15m; two pods do not double it
    interval: 1m
    input_series:
      - series: 'geo_chat_debate_recordings_finalize_given_up{namespace="geo-chat", job="geo-chat-api", pod="a"}'
        values: '0x5 1x40'
      - series: 'geo_chat_debate_recordings_finalize_given_up{namespace="geo-chat", job="geo-chat-api", pod="b"}'
        values: '0x5 1x40'
    alert_rule_test:
      - {eval_time: 15m, alertname: GeoChatRecordingFinalizeGivenUp, exp_alerts: []}
      - eval_time: 25m
        alertname: GeoChatRecordingFinalizeGivenUp
        exp_alerts:
          - exp_labels: {severity: warning, service: geo-chat-api, namespace: geo-chat}
            exp_annotations:
              summary: A debate recording has no seekable file because its finalize gave up
              description: >-
                A recording has no seekable file and needs its finalize_error read (see the finalization
                section of debate-media-processing.md in geo-chat docs). The gauge
                geo_chat_debate_recordings_finalize_given_up counts recordings whose finalize failed 5
                times; the healthy value is 0. Runbook: docs/runbooks/observability.md in geo-chat.

  - name: a healthy zero stays silent
    interval: 1m
    input_series:
      - series: 'geo_chat_debate_recordings_finalize_given_up{namespace="geo-chat", job="geo-chat-api", pod="a"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 45m, alertname: GeoChatRecordingFinalizeGivenUp, exp_alerts: []}
