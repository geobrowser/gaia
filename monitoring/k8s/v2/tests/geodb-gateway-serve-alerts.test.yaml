rule_files:
  - __RULES__
evaluation_interval: 1m
tests:
  # Series exist only once a field is served (mode on). With every field off or in shadow nothing is exported.
  - name: silent when no gateway serve series exist
    interval: 1m
    input_series:
      - series: 'up{namespace="gaia", job="api"}'
        values: '1x60'
    alert_rule_test:
      - {eval_time: 30m, alertname: GatewayServeFallbackHigh, exp_alerts: []}
      - {eval_time: 30m, alertname: GatewayServeLatencyHigh, exp_alerts: []}
      - {eval_time: 30m, alertname: GatewayReadSourceAutoReverted, exp_alerts: []}

  # Registered at zero when the field is switched on, before any traffic.
  - name: silent at zero
    interval: 1m
    input_series:
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="entity", source="geodb"}'
        values: '0x60'
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="entity", source="postgres"}'
        values: '0x60'
      - series: 'gaia_api_gateway_serve_fallback_total{namespace="gaia", job="api", field="entity", reason="timeout"}'
        values: '0x60'
      - series: 'gaia_api_gateway_read_source_reverted{namespace="gaia", job="api", field="entity"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 30m, alertname: GatewayServeFallbackHigh, exp_alerts: []}
      - {eval_time: 30m, alertname: GatewayServeLatencyHigh, exp_alerts: []}
      - {eval_time: 30m, alertname: GatewayReadSourceAutoReverted, exp_alerts: []}

  # search: 10 operations a minute, 3 of them fall back on a geo-db timeout, 7 are answered by geo-db.
  # entity: 10 a minute, 5 of them decline because the query is not one geo-db answers (args): not a failure.
  # relations: healthy.
  - name: failure-class fallback over 10 percent fires for that field only
    interval: 1m
    input_series:
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="search", source="geodb"}'
        values: '0+7x60'
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="search", source="postgres"}'
        values: '0+3x60'
      - series: 'gaia_api_gateway_serve_fallback_total{namespace="gaia", job="api", field="search", reason="timeout"}'
        values: '0+3x60'
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="entity", source="geodb"}'
        values: '0+5x60'
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="entity", source="postgres"}'
        values: '0+5x60'
      - series: 'gaia_api_gateway_serve_fallback_total{namespace="gaia", job="api", field="entity", reason="args"}'
        values: '0+5x60'
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="relations", source="geodb"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="relations", source="postgres"}'
        values: '0+0x60'
      - series: 'gaia_api_gateway_serve_fallback_total{namespace="gaia", job="api", field="relations", reason="error"}'
        values: '0+0x60'
    alert_rule_test:
      - {eval_time: 4m, alertname: GatewayServeFallbackHigh, exp_alerts: []}
      - eval_time: 30m
        alertname: GatewayServeFallbackHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              namespace: gaia
              field: search
            exp_annotations:
              summary: More than 10% of served search operations are falling back to Postgres on a geo-db failure
              description: >-
                The field is in mode on but geo-db is failing queries it could have answered (timeout,
                overloaded, client_failed, bad_request, error, id_map). Break it down with
                sum by (reason) (increase(gaia_api_gateway_serve_fallback_total{field="search"}[15m])).
                RUNBOOK section 13.

  # Under 20 operations in the window the ratio is noise: 1 a minute, all failing.
  - name: failure-class fallback under 20 operations stays silent
    interval: 1m
    input_series:
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="search", source="postgres"}'
        values: '0+1x60'
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="search", source="geodb"}'
        values: '0+0x60'
      - series: 'gaia_api_gateway_serve_fallback_total{namespace="gaia", job="api", field="search", reason="error"}'
        values: '0+1x60'
    alert_rule_test:
      - {eval_time: 30m, alertname: GatewayServeFallbackHigh, exp_alerts: []}

  # entities: 10 served a minute, every one in the 0.25 to 0.5 s bucket, so p99 is over the 250 ms serve timeout.
  # search: 10 a minute, all under 10 ms. relations: slow but 1 a minute, under the floor of 20.
  # entity: slow, but only the fallback outcome (the PostgreSQL hand-off is not a served latency).
  - name: served p99 over the serve timeout fires for that field only
    interval: 1m
    input_series:
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="entities", outcome="served", le="0.01"}'
        values: '0x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="entities", outcome="served", le="0.25"}'
        values: '0x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="entities", outcome="served", le="0.5"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="entities", outcome="served", le="+Inf"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="search", outcome="served", le="0.01"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="search", outcome="served", le="0.25"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="search", outcome="served", le="0.5"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="search", outcome="served", le="+Inf"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="relations", outcome="served", le="0.25"}'
        values: '0x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="relations", outcome="served", le="0.5"}'
        values: '0+1x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="relations", outcome="served", le="+Inf"}'
        values: '0+1x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="entity", outcome="fallback", le="0.25"}'
        values: '0x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="entity", outcome="fallback", le="0.5"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_serve_seconds_bucket{namespace="gaia", job="api", field="entity", outcome="fallback", le="+Inf"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_serve_seconds_count{namespace="gaia", job="api", field="entities", outcome="served"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_serve_seconds_count{namespace="gaia", job="api", field="search", outcome="served"}'
        values: '0+10x60'
      - series: 'gaia_api_gateway_serve_seconds_count{namespace="gaia", job="api", field="relations", outcome="served"}'
        values: '0+1x60'
      - series: 'gaia_api_gateway_serve_seconds_count{namespace="gaia", job="api", field="entity", outcome="fallback"}'
        values: '0+10x60'
    alert_rule_test:
      - {eval_time: 4m, alertname: GatewayServeLatencyHigh, exp_alerts: []}
      - eval_time: 30m
        alertname: GatewayServeLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              namespace: gaia
              field: entities
            exp_annotations:
              summary: Served entities p99 is over the 250 ms serve timeout
              description: >-
                The gateway's time on the field before answering from geo-db has a p99 above the serve
                timeout (GRAPHQL_GATEWAY_SERVE_TIMEOUT_MS, default 250), so operations are near the point
                where they hand over to Postgres. See histogram_quantile(0.99, sum by (le)
                (rate(gaia_api_gateway_serve_seconds_bucket{field="entities", outcome="served"}[15m]))).
                RUNBOOK section 13.

  # gaia_api_gateway_shadow_total (shadow reads, not the served path). Threshold 500 in 30m per field, for 30m.
  # search: 20 failed a minute (600 in 30m) fires. entity: 10 failed + 10 mismatch a minute (600) fires.
  # relation: 10 failed a minute (300) is under the threshold. searchConnection: 100 refused_busy and 100
  # unsupported_selection a minute are excluded by name. entities: 20 failed a minute for only 20 minutes
  # does not outlast the 30m for.
  - name: shadow failed or mismatch over threshold fires for that field only, refused_busy and unsupported_selection excluded
    interval: 1m
    input_series:
      - series: 'gaia_api_gateway_shadow_total{namespace="gaia", job="api", field="search", result="failed"}'
        values: '0+20x90'
      - series: 'gaia_api_gateway_shadow_total{namespace="gaia", job="api", field="entity", result="failed"}'
        values: '0+10x90'
      - series: 'gaia_api_gateway_shadow_total{namespace="gaia", job="api", field="entity", result="mismatch"}'
        values: '0+10x90'
      - series: 'gaia_api_gateway_shadow_total{namespace="gaia", job="api", field="relation", result="failed"}'
        values: '0+10x90'
      - series: 'gaia_api_gateway_shadow_total{namespace="gaia", job="api", field="searchConnection", result="refused_busy"}'
        values: '0+100x90'
      - series: 'gaia_api_gateway_shadow_total{namespace="gaia", job="api", field="searchConnection", result="unsupported_selection"}'
        values: '0+100x90'
      - series: 'gaia_api_gateway_shadow_total{namespace="gaia", job="api", field="entities", result="failed"}'
        values: '0+20x20 400x70'
    alert_rule_test:
      - {eval_time: 20m, alertname: GatewayShadowFailing, exp_alerts: []}
      - eval_time: 75m
        alertname: GatewayShadowFailing
        exp_alerts:
          - exp_labels: {severity: warning, service: api, namespace: gaia, field: entity}
            exp_annotations:
              summary: Gateway shadow reads of entity are failing or mismatching (over 500 in 30m)
              description: >-
                geo-db shadow reads for the field returned failed or mismatch results above 500 in 30m, sustained
                for 30m. refused_busy (the typeahead share taken) and unsupported_selection (a shape geo-db
                declines) are not counted. Break it down with
                sum by (result) (increase(gaia_api_gateway_shadow_total{field="entity"}[30m])) and
                sum by (reason) (increase(gaia_api_gateway_shadow_failed_total{field="entity"}[30m])).
                RUNBOOK section 7.
          - exp_labels: {severity: warning, service: api, namespace: gaia, field: search}
            exp_annotations:
              summary: Gateway shadow reads of search are failing or mismatching (over 500 in 30m)
              description: >-
                geo-db shadow reads for the field returned failed or mismatch results above 500 in 30m, sustained
                for 30m. refused_busy (the typeahead share taken) and unsupported_selection (a shape geo-db
                declines) are not counted. Break it down with
                sum by (result) (increase(gaia_api_gateway_shadow_total{field="search"}[30m])) and
                sum by (reason) (increase(gaia_api_gateway_shadow_failed_total{field="search"}[30m])).
                RUNBOOK section 7.

  # refused_busy and definite_refusal are non-failure declines and must never fire GatewayServeFallbackHigh.
  - name: refused_busy and definite_refusal fallbacks stay silent
    interval: 1m
    input_series:
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="search", source="geodb"}'
        values: '0+2x60'
      - series: 'gaia_api_gateway_served_total{namespace="gaia", job="api", field="search", source="postgres"}'
        values: '0+8x60'
      - series: 'gaia_api_gateway_serve_fallback_total{namespace="gaia", job="api", field="search", reason="refused_busy"}'
        values: '0+4x60'
      - series: 'gaia_api_gateway_serve_fallback_total{namespace="gaia", job="api", field="search", reason="definite_refusal"}'
        values: '0+4x60'
    alert_rule_test:
      - {eval_time: 30m, alertname: GatewayServeFallbackHigh, exp_alerts: []}

  # gaia_api_gateway_read_source_reverted: 1 when latched back to Postgres after an auto-revert, 0 when normal.
  # entity: latched (1) fires for that field only. entities: normal (0) stays silent.
  # search: latched for 10m then cleared (0) resolves and does not fire at 30m.
  - name: read-source auto-revert latch fires per field and resolves when cleared
    interval: 1m
    input_series:
      - series: 'gaia_api_gateway_read_source_reverted{namespace="gaia", job="api", field="entity", pod="api-0"}'
        values: '1x60'
      - series: 'gaia_api_gateway_read_source_reverted{namespace="gaia", job="api", field="entity", pod="api-1"}'
        values: '0x60'
      - series: 'gaia_api_gateway_read_source_reverted{namespace="gaia", job="api", field="entities", pod="api-0"}'
        values: '0x60'
      - series: 'gaia_api_gateway_read_source_reverted{namespace="gaia", job="api", field="search", pod="api-0"}'
        values: '1x10 0x50'
    alert_rule_test:
      - eval_time: 30m
        alertname: GatewayReadSourceAutoReverted
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              namespace: gaia
              field: entity
            exp_annotations:
              summary: Gateway field entity auto-reverted from geo-db back to Postgres
              description: >-
                The runtime read-source switch latched entity back to Postgres after crossing the auto-revert
                error-rate or latency threshold, and it stays on Postgres until an operator clears
                reverted.entity in ConfigMap geodb-read-source. Check the reason with
                sum by (reason) (increase(gaia_api_gateway_read_source_auto_revert_total{field="entity"}[1h])).
                RUNBOOK section 13.
