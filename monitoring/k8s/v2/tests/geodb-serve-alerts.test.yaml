rule_files:
  - __RULES__
evaluation_interval: 1m
tests:
  - name: derived rows at 70% stay silent, at 85% fire after 15m
    interval: 1m
    input_series:
      - series: 'geodb_derived_rows{namespace="gaia", job="geodb"}'
        values: '700x20 850x40'
      - series: 'geodb_derived_rows_max{namespace="gaia", job="geodb"}'
        values: '1000x60'
    alert_rule_test:
      - {eval_time: 19m, alertname: GeoDbDerivedRowsHigh, exp_alerts: []}
      - {eval_time: 30m, alertname: GeoDbDerivedRowsHigh, exp_alerts: []}
      - eval_time: 45m
        alertname: GeoDbDerivedRowsHigh
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db's derived class holds more than 80% of derived_rows_max
              description: >-
                Writes past the cap are refused (geodb_derived_refused_cap_total) and the writer drops or
                retries them. See geodb_derived_collection_rows{collection} for which collection grew, then
                raise derived_rows_max in the geodb-serve-config ConfigMap (one serve restart; RUNBOOK 2d).

  - name: work rows at 70% stay silent, at 85% fire after 15m
    interval: 1m
    input_series:
      - series: 'geodb_work_rows{namespace="gaia", job="geodb"}'
        values: '700x20 850x40'
      - series: 'geodb_work_rows_max{namespace="gaia", job="geodb"}'
        values: '1000x60'
    alert_rule_test:
      - {eval_time: 19m, alertname: GeoDbWorkRowsHigh, exp_alerts: []}
      - {eval_time: 30m, alertname: GeoDbWorkRowsHigh, exp_alerts: []}
      - eval_time: 45m
        alertname: GeoDbWorkRowsHigh
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db's work class holds more than 80% of work_rows_max
              description: >-
                Units past the cap are refused, so the outbox mirror starts counting errors. Check
                geodb_work_pending / geodb_work_delivered for a stalled consumer, then raise work_rows_max in
                serve.cfg (one serve restart).

  - name: outbox mirror errors fire on increase and clear, and fire when the counter first appears
    interval: 1m
    input_series:
      - series: 'geodb_outbox_mirror_errors_total{namespace="gaia", job="notification-indexer", pod="a"}'
        values: '0x10 1+1x4 5x45'
      # Series created at its first increment (no earlier sample for increase() to subtract).
      - series: 'geodb_outbox_mirror_errors_total{namespace="gaia", job="notification-indexer", pod="b"}'
        values: '_x40 1x30'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbOutboxMirrorErrors, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbOutboxMirrorErrors
        exp_alerts:
          - exp_labels: {severity: warning, service: notification-indexer, namespace: gaia}
            exp_annotations:
              summary: The notification-indexer's geo-db outbox mirror is failing
              description: >-
                The mirror's geodb-client pipe errored (serve unreachable, key refused, work class off). The
                shadow loses rows meanwhile; Postgres delivery is unaffected. Read the indexer log for
                geodb_outbox.mirror_failed and geodb_outbox.pipe_started (RUNBOOK section 11).
      - {eval_time: 35m, alertname: GeoDbOutboxMirrorErrors, exp_alerts: []}
      - eval_time: 42m
        alertname: GeoDbOutboxMirrorErrors
        exp_alerts:
          - exp_labels: {severity: warning, service: notification-indexer, namespace: gaia}
            exp_annotations:
              summary: The notification-indexer's geo-db outbox mirror is failing
              description: >-
                The mirror's geodb-client pipe errored (serve unreachable, key refused, work class off). The
                shadow loses rows meanwhile; Postgres delivery is unaffected. Read the indexer log for
                geodb_outbox.mirror_failed and geodb_outbox.pipe_started (RUNBOOK section 11).
      - {eval_time: 65m, alertname: GeoDbOutboxMirrorErrors, exp_alerts: []}

  - name: outbox mirror dropped fires on increase and on first appearance, then clears
    interval: 1m
    input_series:
      - series: 'geodb_outbox_mirror_dropped_total{namespace="gaia", job="notification-indexer", pod="a"}'
        values: '0x10 1+1x4 5x45'
      - series: 'geodb_outbox_mirror_dropped_total{namespace="gaia", job="notification-indexer", pod="b"}'
        values: '_x40 1x30'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbOutboxMirrorDropped, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbOutboxMirrorDropped
        exp_alerts:
          - exp_labels: {severity: warning, service: notification-indexer, namespace: gaia}
            exp_annotations:
              summary: The notification-indexer's outbox mirror is dropping rows
              description: >-
                The bounded queue (4096) was full or its worker is gone, so enqueues were dropped from the
                shadow (geodb_outbox_mirror_queue shows the depth). Postgres delivery is unaffected, but
                the work class is now missing rows and a later shadow-read comparison will show them.
      - {eval_time: 35m, alertname: GeoDbOutboxMirrorDropped, exp_alerts: []}
      - eval_time: 42m
        alertname: GeoDbOutboxMirrorDropped
        exp_alerts:
          - exp_labels: {severity: warning, service: notification-indexer, namespace: gaia}
            exp_annotations:
              summary: The notification-indexer's outbox mirror is dropping rows
              description: >-
                The bounded queue (4096) was full or its worker is gone, so enqueues were dropped from the
                shadow (geodb_outbox_mirror_queue shows the depth). Postgres delivery is unaffected, but
                the work class is now missing rows and a later shadow-read comparison will show them.
      - {eval_time: 65m, alertname: GeoDbOutboxMirrorDropped, exp_alerts: []}

  - name: outbox mirror backlog ignores short serve-roll spikes and fires after 10m sustained
    interval: 1m
    input_series:
      - series: 'geodb_outbox_mirror_backlog{namespace="gaia", job="notification-indexer"}'
        values: '0x5 5x3 0x10 12x30'
    alert_rule_test:
      - {eval_time: 10m, alertname: GeoDbOutboxMirrorBacklog, exp_alerts: []}
      - {eval_time: 25m, alertname: GeoDbOutboxMirrorBacklog, exp_alerts: []}
      - eval_time: 35m
        alertname: GeoDbOutboxMirrorBacklog
        exp_alerts:
          - exp_labels: {severity: warning, service: notification-indexer, namespace: gaia}
            exp_annotations:
              summary: The notification-indexer's outbox mirror has held unsent units for 10 minutes
              description: >-
                Units whose geo-db enter failed are kept and retried oldest first (bounded; default 3000).
                A backlog that does not drain means serve is down or refusing the work key; once the bound
                is hit the oldest units are dropped (GeoDbOutboxMirrorBacklogDropped). Fix serve, then check
                the backlog falls to 0 (RUNBOOK section 11).

  - name: outbox mirror backlog dropped fires for both dropped and expired counters and clears
    interval: 1m
    input_series:
      - series: 'geodb_outbox_mirror_backlog_dropped_total{namespace="gaia", job="notification-indexer"}'
        values: '0x10 1+1x4 5x45'
      - series: 'geodb_outbox_mirror_backlog_expired_total{namespace="gaia", job="notification-indexer"}'
        values: '_x40 1x30'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbOutboxMirrorBacklogDropped, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbOutboxMirrorBacklogDropped
        exp_alerts:
          - exp_labels: {severity: warning, service: notification-indexer, namespace: gaia}
            exp_annotations:
              summary: The notification-indexer's outbox mirror backlog is dropping units
              description: >-
                Units were dropped from the backlog: it hit its bound during an outage (backlog_dropped), or
                a unit geo-db kept refusing was expired from the head (backlog_expired; needs gaia#1507).
                Postgres delivery is unaffected. Check which counter rose, then replay the window with
                outbox-replay once serve is healthy (RUNBOOK section 11).
      - {eval_time: 35m, alertname: GeoDbOutboxMirrorBacklogDropped, exp_alerts: []}
      - eval_time: 42m
        alertname: GeoDbOutboxMirrorBacklogDropped
        exp_alerts:
          - exp_labels: {severity: warning, service: notification-indexer, namespace: gaia}
            exp_annotations:
              summary: The notification-indexer's outbox mirror backlog is dropping units
              description: >-
                Units were dropped from the backlog: it hit its bound during an outage (backlog_dropped), or
                a unit geo-db kept refusing was expired from the head (backlog_expired; needs gaia#1507).
                Postgres delivery is unaffected. Check which counter rose, then replay the window with
                outbox-replay once serve is healthy (RUNBOOK section 11).
      - {eval_time: 65m, alertname: GeoDbOutboxMirrorBacklogDropped, exp_alerts: []}

  - name: votes_count mirror lag fires only after 15m over 10m
    interval: 1m
    input_series:
      - series: 'vote_indexer_votes_count_mirror_lag_seconds{namespace="gaia", job="vote-indexer"}'
        values: '0x10 700x40'
    alert_rule_test:
      - {eval_time: 20m, alertname: GeoDbVotesCountMirrorLag, exp_alerts: []}
      - eval_time: 30m
        alertname: GeoDbVotesCountMirrorLag
        exp_alerts:
          - exp_labels: {severity: warning, service: vote-indexer, namespace: gaia}
            exp_annotations:
              summary: The vote-indexer's votes_count geo-db mirror is more than 10 minutes behind
              description: >-
                geo-db's collections 26 (votes_count) and 33 (votes_count_updates) trail Postgres, so the
                notification poller and any vote-tally read from geo-db are stale. Postgres is unaffected.
                Check vote_indexer_votes_count_mirror_rows_total{collection} is rising, and
                geodb_derived_mirror_errors_total / _unacknowledged_total / _dropped_total{table="votes_count"}
                for why. A vote-indexer restart re-copies the whole table (the start-up snapshot).

  - name: a mirror that is level stays silent
    interval: 1m
    input_series:
      - series: 'vote_indexer_votes_count_mirror_lag_seconds{namespace="gaia", job="vote-indexer"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 45m, alertname: GeoDbVotesCountMirrorLag, exp_alerts: []}

  # Claim-region alerts. Idle baseline is 1 claim in query_eval (the live room's), 0 elsewhere.
  - name: claims at the idle baseline stay silent, even when in_use equals its own high-water mark
    interval: 1m
    input_series:
      - series: 'geodb_claims_in_use{namespace="gaia", job="geodb", claim_class="query_eval"}'
        values: '1x60'
      - series: 'geodb_claims_in_use_max{namespace="gaia", job="geodb", claim_class="query_eval"}'
        values: '1x60'
      - series: 'geodb_claims_in_use{namespace="gaia", job="geodb", claim_class="construction"}'
        values: '0x60'
      - series: 'geodb_claims_in_use_max{namespace="gaia", job="geodb", claim_class="construction"}'
        values: '0x60'
      - series: 'geodb_claims_refused_total{namespace="gaia", job="geodb", claim_class="query_eval"}'
        values: '0x60'
      - series: 'geodb_requests_claim_parked_total{namespace="gaia", job="geodb", class="live"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 50m, alertname: GeoDbClaimsNearPeak, exp_alerts: []}
      - {eval_time: 50m, alertname: GeoDbClaimsRefused, exp_alerts: []}
      - {eval_time: 50m, alertname: GeoDbClaimParkedSustained, exp_alerts: []}

  - name: a busy spell that drains back to baseline stays silent
    interval: 1m
    input_series:
      - series: 'geodb_claims_in_use{namespace="gaia", job="geodb", claim_class="query_eval"}'
        values: '1 8 8 8 8 8 1x50'
      - series: 'geodb_claims_in_use_max{namespace="gaia", job="geodb", claim_class="query_eval"}'
        values: '1 8x55'
    alert_rule_test:
      - {eval_time: 40m, alertname: GeoDbClaimsNearPeak, exp_alerts: []}

  - name: claims ramped to the peak and held fire after 10m
    interval: 1m
    input_series:
      - series: 'geodb_claims_in_use{namespace="gaia", job="geodb", claim_class="query_eval"}'
        values: '1 2 4 6 8x40'
      - series: 'geodb_claims_in_use_max{namespace="gaia", job="geodb", claim_class="query_eval"}'
        values: '1 2 4 6 8x40'
    alert_rule_test:
      - {eval_time: 10m, alertname: GeoDbClaimsNearPeak, exp_alerts: []}
      - eval_time: 20m
        alertname: GeoDbClaimsNearPeak
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia, claim_class: query_eval}
            exp_annotations:
              summary: geo-db's query_eval claim region has held its peak number of claims for 10 minutes
              description: >-
                At least 4 claims held, within 10% of the most this process has held at once, for 10m. Requests
                are done in seconds, so claims that stay held are leaked or lent to parked requests (ISS-675-721:
                parked records filled the region and a running request waited 10s for its own claim). Check
                geodb_requests_claim_parked_total and geodb_claims_refused_total; a serve restart clears it.

  - name: a refusal burst fires and clears once the window passes
    interval: 1m
    input_series:
      - series: 'geodb_claims_refused_total{namespace="gaia", job="geodb", claim_class="maintenance"}'
        values: '0x5 3x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: GeoDbClaimsRefused
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia, claim_class: maintenance}
            exp_annotations:
              summary: geo-db refused a maintenance claim in the last 15m
              description: >-
                An acquisition found no room and returned ResourceExhausted, so a request failed or a job
                backed off. Look at geodb_claims_in_use{claim_class} against geodb_claims_in_use_max and at
                geodb_requests_claim_parked_total; the region is full or held by parked requests (ISS-675-721).
      - {eval_time: 40m, alertname: GeoDbClaimsRefused, exp_alerts: []}

  - name: a sustained park rate fires after 10m, a short burst does not
    interval: 1m
    input_series:
      - series: 'geodb_requests_claim_parked_total{namespace="gaia", job="geodb", class="query"}'
        values: '0+30x40'
      - series: 'geodb_requests_claim_parked_total{namespace="gaia", job="geodb", class="live"}'
        values: '0 100 100x39'
    alert_rule_test:
      - eval_time: 30m
        alertname: GeoDbClaimParkedSustained
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia, class: query}
            exp_annotations:
              summary: geo-db is parking query requests for want of a claim, steadily
              description: >-
                Requests wait for a claim in the region instead of taking one. A burst is normal; ten minutes
                of it means the region is too small for the load or claims are held too long. Compare
                geodb_claims_in_use{claim_class} with its _max and check geodb_claims_refused_total.

  - name: absent claim series (serve before 2103bd8335) fire nothing
    interval: 1m
    input_series:
      - series: 'geodb_derived_rows{namespace="gaia", job="geodb"}'
        values: '1x60'
    alert_rule_test:
      - {eval_time: 50m, alertname: GeoDbClaimsNearPeak, exp_alerts: []}
      - {eval_time: 50m, alertname: GeoDbClaimsRefused, exp_alerts: []}
      - {eval_time: 50m, alertname: GeoDbClaimParkedSustained, exp_alerts: []}

  - name: new-metric rules, absent series fire nothing
    interval: 1m
    input_series:
      - series: 'geodb_derived_rows{namespace="gaia", job="geodb"}'
        values: '1x400'
    alert_rule_test:
      - {eval_time: 380m, alertname: GeoDbSpacesNearCap, exp_alerts: []}
      - {eval_time: 380m, alertname: GeoDbRoomsNearCap, exp_alerts: []}
      - {eval_time: 380m, alertname: GeoDbRoomsAtCap, exp_alerts: []}
      - {eval_time: 380m, alertname: GeoDbParkWaitSustained, exp_alerts: []}
      - {eval_time: 380m, alertname: GeoDbWorkerQueueGrowing, exp_alerts: []}
      - {eval_time: 380m, alertname: GeoDbHostPoolHeadroomLow, exp_alerts: []}
      - {eval_time: 380m, alertname: GeoDbHostPoolRefused, exp_alerts: []}
      - {eval_time: 380m, alertname: GeoDbStoreFoldRefused, exp_alerts: []}

  - name: spaces at 80% stay silent, at 95% fire after 15m
    interval: 1m
    input_series:
      - series: 'geodb_spaces_in_use{namespace="gaia", job="geodb"}'
        values: '1638x20 1946x40'
      - series: 'geodb_spaces_max{namespace="gaia", job="geodb"}'
        values: '2047x60'
    alert_rule_test:
      - {eval_time: 19m, alertname: GeoDbSpacesNearCap, exp_alerts: []}
      - {eval_time: 30m, alertname: GeoDbSpacesNearCap, exp_alerts: []}
      - eval_time: 45m
        alertname: GeoDbSpacesNearCap
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db's Space table is more than 90% full
              description: >-
                A founding past geodb_spaces_max is refused ResourceExhausted, so the feeder dead-letters
                space_cap and a new Space gets no geo-db copy. Raise spaces in the geodb-serve-config ConfigMap
                (serve.cfg; one serve restart; RUNBOOK capacity section) before the table fills.

  - name: rooms near cap warn after 10m, at cap go critical after 5m, below stay silent
    interval: 1m
    input_series:
      - series: 'geodb_rooms_taken{namespace="gaia", job="geodb"}'
        values: '10x10 92x20 100x30'
      - series: 'geodb_rooms_max{namespace="gaia", job="geodb"}'
        values: '100x60'
    alert_rule_test:
      - {eval_time: 9m, alertname: GeoDbRoomsNearCap, exp_alerts: []}
      - {eval_time: 15m, alertname: GeoDbRoomsNearCap, exp_alerts: []}
      - eval_time: 25m
        alertname: GeoDbRoomsNearCap
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db has 90% of its rooms taken
              description: >-
                Each open connection or session holds a room; at the cap a new connection is refused. Compare
                geodb_sessions_open and look for a client that leaks connections (a feeder or api pod that
                reconnects without closing), then raise the room count only if the load is real.
      - {eval_time: 25m, alertname: GeoDbRoomsAtCap, exp_alerts: []}
      - eval_time: 40m
        alertname: GeoDbRoomsAtCap
        exp_alerts:
          - exp_labels: {severity: critical, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db has no free room; new connections are refused
              description: >-
                geodb_rooms_taken has equalled geodb_rooms_max for 5m, so every new connection or handshake
                is refused. Find the client holding the rooms (geodb_sessions_open, the feeder and api logs),
                restart it, and if it is real load raise the room carving in serve.cfg (one serve restart).

  - name: park wait mean 50 ms stays silent, 300 ms fires per class
    interval: 1m
    input_series:
      # query: 10 parks a minute at 5 ms each (50 ms mean needs 50000us/park: 500000us/min)
      - series: 'geodb_requests_park_wait_us_sum{namespace="gaia", job="geodb", class="query"}'
        values: '0+500000x60'
      - series: 'geodb_requests_park_wait_us_count{namespace="gaia", job="geodb", class="query"}'
        values: '0+10x60'
      # write: 10 parks a minute at 300 ms each
      - series: 'geodb_requests_park_wait_us_sum{namespace="gaia", job="geodb", class="write"}'
        values: '0+3000000x60'
      - series: 'geodb_requests_park_wait_us_count{namespace="gaia", job="geodb", class="write"}'
        values: '0+10x60'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbParkWaitSustained, exp_alerts: []}
      - eval_time: 30m
        alertname: GeoDbParkWaitSustained
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia, class: write}
            exp_annotations:
              summary: geo-db write requests wait over 100 ms parked, on average
              description: >-
                Requests park until a claim or a worker is free. A mean above 100 ms for 10m means the claim
                region or the worker pool is short for the load. Check geodb_requests_parked_now and
                geodb_requests_park_wait_us_max by class, geodb_claims_in_use against its _max,
                geodb_query_region_free_bytes and geodb_worker_queue_depth; slow requests log park_wait_us=.

  - name: park wait with no ended park (count flat) stays silent
    interval: 1m
    input_series:
      - series: 'geodb_requests_park_wait_us_sum{namespace="gaia", job="geodb", class="query"}'
        values: '0x60'
      - series: 'geodb_requests_park_wait_us_count{namespace="gaia", job="geodb", class="query"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 40m, alertname: GeoDbParkWaitSustained, exp_alerts: []}

  - name: worker queue rising with workers pinned fires; busy below its ceiling stays silent
    interval: 1m
    input_series:
      - series: 'geodb_worker_queue_depth{namespace="gaia", job="geodb", pod="a"}'
        values: '0x20 1+1x60'
      - series: 'geodb_workers_busy{namespace="gaia", job="geodb", pod="a"}'
        values: '2x80'
      # b: queue rising but workers were at 4 earlier and now only 2, so not pinned
      - series: 'geodb_worker_queue_depth{namespace="gaia", job="geodb", pod="b"}'
        values: '0x20 1+1x60'
      - series: 'geodb_workers_busy{namespace="gaia", job="geodb", pod="b"}'
        values: '4x10 2x70'
    alert_rule_test:
      - {eval_time: 25m, alertname: GeoDbWorkerQueueGrowing, exp_alerts: []}
      - eval_time: 60m
        alertname: GeoDbWorkerQueueGrowing
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia, job: geodb, pod: a}
            exp_annotations:
              summary: geo-db's worker queue is growing with every worker busy
              description: >-
                Jobs queue faster than the pool finishes them, so requests wait and park
                (GeoDbParkWaitSustained). Look for a slow or stuck job (geodb_request_duration_us by class,
                slow=1 request-log lines), then raise the reactor worker count if the load is real.

  - name: worker queue flat above zero stays silent
    interval: 1m
    input_series:
      - series: 'geodb_worker_queue_depth{namespace="gaia", job="geodb"}'
        values: '3x80'
      - series: 'geodb_workers_busy{namespace="gaia", job="geodb"}'
        values: '2x80'
    alert_rule_test:
      - {eval_time: 60m, alertname: GeoDbWorkerQueueGrowing, exp_alerts: []}

  - name: worker pool saturated fires only when the queue peak and the ceiling hold for 25m
    interval: 1m
    input_series:
      # a: busy peak at 8 (its ceiling) and a queue peak of 3 from minute 30 on
      - series: 'geodb_workers_busy_max{namespace="gaia", job="geodb", pod="a"}'
        values: '6x20 8x80'
      - series: 'geodb_worker_queue_depth_max{namespace="gaia", job="geodb", pod="a"}'
        values: '0x30 3x70'
      # b: today's shape, queue peak above 0 but busy peak 1 to 2 under its ceiling most minutes
      - series: 'geodb_workers_busy_max{namespace="gaia", job="geodb", pod="b"}'
        values: '8x5 6 7 6 7 6x70'
      - series: 'geodb_worker_queue_depth_max{namespace="gaia", job="geodb", pod="b"}'
        values: '4x80'
      # c: pool pinned at a ceiling of 2, under the floor of 4
      - series: 'geodb_workers_busy_max{namespace="gaia", job="geodb", pod="c"}'
        values: '2x80'
      - series: 'geodb_worker_queue_depth_max{namespace="gaia", job="geodb", pod="c"}'
        values: '5x80'
    alert_rule_test:
      - {eval_time: 40m, alertname: GeoDbWorkerPoolSaturated, exp_alerts: []}
      - eval_time: 70m
        alertname: GeoDbWorkerPoolSaturated
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia, job: geodb, pod: a}
            exp_annotations:
              summary: geo-db's worker pool has been saturated with jobs waiting for 25m
              description: >-
                For 15m every scrape showed all workers busy at some point in its minute and a queue peak above 0, and it held 10m more. Requests wait and park (GeoDbParkWaitSustained). Look for a slow or stuck job (geodb_request_duration_us by class, slow=1 request-log lines), then raise the reactor worker count if the load is real. Plot geodb:workers_busy_max:max5m and geodb:worker_queue_depth_max:max5m.

  - name: pool-peaks recording rules keep the 5m peak after a 1m spike drops
    interval: 1m
    input_series:
      - series: 'geodb_workers_busy_max{namespace="gaia", job="geodb"}'
        values: '2x10 8 2x20'
      - series: 'geodb_worker_queue_depth_max{namespace="gaia", job="geodb"}'
        values: '0x10 5 0x20'
    promql_expr_test:
      - expr: geodb:workers_busy_max:max5m
        eval_time: 13m
        exp_samples:
          - labels: 'geodb:workers_busy_max:max5m{namespace="gaia", job="geodb"}'
            value: 8
      - expr: geodb:workers_busy_max:max5m
        eval_time: 20m
        exp_samples:
          - labels: 'geodb:workers_busy_max:max5m{namespace="gaia", job="geodb"}'
            value: 2
      - expr: geodb:worker_queue_depth_max:max5m
        eval_time: 13m
        exp_samples:
          - labels: 'geodb:worker_queue_depth_max:max5m{namespace="gaia", job="geodb"}'
            value: 5
      - expr: geodb:worker_queue_depth_max:max5m
        eval_time: 20m
        exp_samples:
          - labels: 'geodb:worker_queue_depth_max:max5m{namespace="gaia", job="geodb"}'
            value: 0

  # session="" on park wait and claim parked: serve prints the node's fold (no session label) and one
  # row per live session, so a sum by (class) over both counts each live room twice.
  - name: park wait counts the node row once; a slow session row beside a fast node row stays silent
    interval: 1m
    input_series:
      # node fold: 10 parks a minute at 50 ms each
      - series: 'geodb_requests_park_wait_us_sum{namespace="gaia", job="geodb", class="query"}'
        values: '0+500000x60'
      - series: 'geodb_requests_park_wait_us_count{namespace="gaia", job="geodb", class="query"}'
        values: '0+10x60'
      # one live session's own row: 10 parks a minute at 300 ms. Unfiltered, the two rows would sum to
      # a 175 ms mean and fire; with session="" only the node row is read (50 ms).
      - series: 'geodb_requests_park_wait_us_sum{namespace="gaia", job="geodb", class="query", session="7"}'
        values: '0+3000000x60'
      - series: 'geodb_requests_park_wait_us_count{namespace="gaia", job="geodb", class="query", session="7"}'
        values: '0+10x60'
    alert_rule_test:
      - {eval_time: 40m, alertname: GeoDbParkWaitSustained, exp_alerts: []}

  - name: claim parked counts the node row once; node at 0.15/s with a session row beside it stays silent
    interval: 1m
    input_series:
      - series: 'geodb_requests_claim_parked_total{namespace="gaia", job="geodb", class="query"}'
        values: '0+9x60'
      - series: 'geodb_requests_claim_parked_total{namespace="gaia", job="geodb", class="query", session="7"}'
        values: '0+9x60'
    alert_rule_test:
      - {eval_time: 40m, alertname: GeoDbClaimParkedSustained, exp_alerts: []}

  - name: claim parked above 0.2/s on the node row fires
    interval: 1m
    input_series:
      - series: 'geodb_requests_claim_parked_total{namespace="gaia", job="geodb", class="query"}'
        values: '0+18x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: GeoDbClaimParkedSustained
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia, class: query}
            exp_annotations:
              summary: geo-db is parking query requests for want of a claim, steadily
              description: >-
                Requests wait for a claim in the region instead of taking one. A burst is normal; ten minutes
                of it means the region is too small for the load or claims are held too long. Compare
                geodb_claims_in_use{claim_class} with its _max and check geodb_claims_refused_total.

  # Counter rules: rows print at 0 from the first scrape, then move.
  - name: wire revision refusals fire on a rise and stay silent when flat
    interval: 1m
    input_series:
      - series: 'geodb_wire_refused_total{namespace="gaia", job="geodb", reason="revision"}'
        values: '0x10 1+1x10 11x40'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbWireRevisionRefused, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbWireRevisionRefused
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db refused a client for its wire revision in the last 15m
              description: >-
                A client outside the serve's accepted revision range (7..18) connected. This is a stray client (newer than the serve, or older than 7), not a rollback check: a rollback to a tag at 15 or 17 is inside the range and does not move the counter. Read the counter, not the log line, which is rate limited. Find the client by its "serve refused wire revision" line.
      - {eval_time: 50m, alertname: GeoDbWireRevisionRefused, exp_alerts: []}

  - name: other wire refusals fire on a rise in any non-revision reason and stay silent for revision or flat
    interval: 1m
    input_series:
      - series: 'geodb_wire_refused_total{namespace="gaia", job="geodb", reason="opcode"}'
        values: '0x10 1+1x10 11x40'
      - series: 'geodb_wire_refused_total{namespace="gaia", job="geodb", reason="revision"}'
        values: '0+5x60'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbWireRefusedOther, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbWireRefusedOther
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db refused handshakes or frames for a reason other than wire revision in the last 10m
              description: >-
                The other geodb_wire_refused_total rows count malformed or refused handshakes and frames (opcode, auth_*, grammar, binding and the rest). Group the counter by reason to see which row moved, and read that row in the geo-db note SERVE-WIRE-REFUSED-OTHER-HANDSHAKE-REFUSALS-COUNTED-DIAG. In a pin roll in the documented order every one of these stays 0; a rise names a client or its config disagreeing with the serve. handshake_timeout, magic and header_crc are left out here because a bare connect or a non-geodb peer on the wire port moves them without a fault; GeoDbWireRefusedProbeSustained covers those.
      - {eval_time: 50m, alertname: GeoDbWireRefusedOther, exp_alerts: []}

  - name: revision refusals alone do not fire the other-reasons rule
    interval: 1m
    input_series:
      - series: 'geodb_wire_refused_total{namespace="gaia", job="geodb", reason="revision"}'
        values: '0+3x60'
      - series: 'geodb_wire_refused_total{namespace="gaia", job="geodb", reason="magic"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 30m, alertname: GeoDbWireRefusedOther, exp_alerts: []}

  - name: roll-expected refusal reasons do not fire the other-reasons rule but a sustained rate fires the probe rule
    interval: 1m
    input_series:
      - series: 'geodb_wire_refused_total{namespace="gaia", job="geodb", reason="handshake_timeout"}'
        values: '0+20x120'
      - series: 'geodb_wire_refused_total{namespace="gaia", job="geodb", reason="magic"}'
        values: '0+2x120'
      - series: 'geodb_wire_refused_total{namespace="gaia", job="geodb", reason="header_crc"}'
        values: '0+2x120'
    alert_rule_test:
      - {eval_time: 60m, alertname: GeoDbWireRefusedOther, exp_alerts: []}
      - {eval_time: 20m, alertname: GeoDbWireRefusedProbeSustained, exp_alerts: []}
      - eval_time: 60m
        alertname: GeoDbWireRefusedProbeSustained
        exp_alerts:
          - exp_labels: {severity: info, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db has refused more than one bare or non-geodb connection every 5s for 30m
              description: >-
                handshake_timeout (a connect closed by the idle bound before a session opened), magic and header_crc (a non-geodb peer on the wire port) move without a fault, so a few during a pin roll are expected. A sustained rate is a scanner, a probe loop or a broken health check dialing the wire port. Group the counter by reason to see which row, then find the dialer (a TCP probe on the wire port, a client pointed at the wrong port).

  - name: a few roll-time bare connects stay below the probe rate
    interval: 1m
    input_series:
      - series: 'geodb_wire_refused_total{namespace="gaia", job="geodb", reason="handshake_timeout"}'
        values: '0 0 3 3 6 6 6 9x100'
      - series: 'geodb_wire_refused_total{namespace="gaia", job="geodb", reason="magic"}'
        values: '0x4 1x100'
    alert_rule_test:
      - {eval_time: 90m, alertname: GeoDbWireRefusedProbeSustained, exp_alerts: []}
      - {eval_time: 90m, alertname: GeoDbWireRefusedOther, exp_alerts: []}

  - name: serve restart dip in sessions recovers inside 30m and stays silent
    interval: 1m
    input_series:
      - series: 'geodb_sessions_by_wire_payload{namespace="gaia", job="geodb", revision="18"}'
        values: '40x10 0x15 40x60'
      - series: 'geodb_sessions_by_wire_payload{namespace="gaia", job="geodb", revision="19"}'
        values: '0x85'
      - series: 'geodb_sessions_by_wire_payload{namespace="gaia", job="geodb", revision="21"}'
        values: '0x85'
    alert_rule_test:
      - {eval_time: 24m, alertname: GeoDbSessionsAllGone, exp_alerts: []}
      - {eval_time: 60m, alertname: GeoDbSessionsAllGone, exp_alerts: []}

  - name: sessions all gone for 30m fires
    interval: 1m
    input_series:
      - series: 'geodb_sessions_by_wire_payload{namespace="gaia", job="geodb", revision="18"}'
        values: '40x10 0x80'
      - series: 'geodb_sessions_by_wire_payload{namespace="gaia", job="geodb", revision="21"}'
        values: '0x90'
    alert_rule_test:
      - {eval_time: 30m, alertname: GeoDbSessionsAllGone, exp_alerts: []}
      - eval_time: 50m
        alertname: GeoDbSessionsAllGone
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db has had no open client session for 30m
              description: >-
                Every geodb_sessions_by_wire_payload row sums to 0. A serve restart empties the gauge and the clients reconnect on their own, so a short dip after the serve step of a pin roll is expected and is shorter than the 30m this waits. A longer gap means no client reconnected: check the clients' restarts and stderr, geodb_wire_refused_total by reason and geodb_handshakes_by_wire_payload_total.

  - name: sessions at revision 18 are silent through the roll day and fire after 24h
    interval: 1m
    input_series:
      - series: 'geodb_sessions_by_wire_payload{namespace="gaia", job="geodb", revision="18"}'
        values: '40x1000 20x1000'
      - series: 'geodb_sessions_by_wire_payload{namespace="gaia", job="geodb", revision="21"}'
        values: '0x2000'
    alert_rule_test:
      - {eval_time: 23h, alertname: GeoDbSessionsAtOldestRevision, exp_alerts: []}
      - eval_time: 25h
        alertname: GeoDbSessionsAtOldestRevision
        exp_alerts:
          - exp_labels: {severity: info, service: geodb, namespace: gaia}
            exp_annotations:
              summary: a geo-db client has held or opened a session at wire_payload 18 for 24h
              description: >-
                Revision 18 is the oldest of the support window (18 to 21) and the revision of the pin before the roll. Sessions at 18 are expected right after the serve step and fall to 0 as each client is rolled, so this waits 24h from the serve restart. After that, a client still at 18 is one the roll missed (a service never re-applied, a CronJob template, a client rolled back), and payload_min_supported may not be raised past 18 while it lives. Read the gauge with the handshake counter at revision 18, then find the client by its geodb image tag (kubectl get sts,deploy,cronjob -A, the geodb-setup tag). Delete or change this rule when payload_min_supported moves.

  - name: revision 18 sessions that reach 0 during the roll stay silent
    interval: 1m
    input_series:
      - series: 'geodb_sessions_by_wire_payload{namespace="gaia", job="geodb", revision="18"}'
        values: '40x600 0x2000'
      - series: 'geodb_handshakes_by_wire_payload_total{namespace="gaia", job="geodb", revision="18"}'
        values: '40x2600'
      - series: 'geodb_sessions_by_wire_payload{namespace="gaia", job="geodb", revision="21"}'
        values: '0x600 40x2000'
    alert_rule_test:
      - {eval_time: 20h, alertname: GeoDbSessionsAtOldestRevision, exp_alerts: []}
      - {eval_time: 40h, alertname: GeoDbSessionsAtOldestRevision, exp_alerts: []}

  - name: a client reconnecting at revision 18 after the sessions are gone fires
    interval: 1m
    input_series:
      - series: 'geodb_sessions_by_wire_payload{namespace="gaia", job="geodb", revision="18"}'
        values: '0x3000'
      - series: 'geodb_handshakes_by_wire_payload_total{namespace="gaia", job="geodb", revision="18"}'
        values: '0+1x3000'
    alert_rule_test:
      - {eval_time: 23h, alertname: GeoDbSessionsAtOldestRevision, exp_alerts: []}
      - eval_time: 26h
        alertname: GeoDbSessionsAtOldestRevision
        exp_alerts:
          - exp_labels: {severity: info, service: geodb, namespace: gaia}
            exp_annotations:
              summary: a geo-db client has held or opened a session at wire_payload 18 for 24h
              description: >-
                Revision 18 is the oldest of the support window (18 to 21) and the revision of the pin before the roll. Sessions at 18 are expected right after the serve step and fall to 0 as each client is rolled, so this waits 24h from the serve restart. After that, a client still at 18 is one the roll missed (a service never re-applied, a CronJob template, a client rolled back), and payload_min_supported may not be raised past 18 while it lives. Read the gauge with the handshake counter at revision 18, then find the client by its geodb image tag (kubectl get sts,deploy,cronjob -A, the geodb-setup tag). Delete or change this rule when payload_min_supported moves.

  - name: claims short fires on a rise in query_eval and stays silent flat
    interval: 1m
    input_series:
      - series: 'geodb_claims_short_total{namespace="gaia", job="geodb", claim_class="query_eval"}'
        values: '0x10 1+1x5 6x40'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbClaimsShort, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbClaimsShort
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db cut a request mid-flight for want of its claim in the last 15m
              description: >-
                The query region was too small at execution although admission passed the request. Steady state is zero. Compare geodb_claims_in_use{claim_class="query_eval"} with its _max and check geodb_requests_claim_parked_total.
      - {eval_time: 50m, alertname: GeoDbClaimsShort, exp_alerts: []}

  - name: admission refusals split by cause, ceiling at warning and claim_over_clamp at info
    interval: 1m
    input_series:
      - series: 'geodb_claims_refused_by_cause_total{namespace="gaia", job="geodb", cause="ceiling"}'
        values: '0x10 1+1x5 6x40'
      - series: 'geodb_claims_refused_by_cause_total{namespace="gaia", job="geodb", cause="claim_over_clamp"}'
        values: '0x10 1+1x5 6x40'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbAdmissionCeiling, exp_alerts: []}
      - {eval_time: 8m, alertname: GeoDbAdmissionClaimOverClamp, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbAdmissionCeiling
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db refused a request at admission for a class ceiling in the last 15m
              description: >-
                A class hit its admission ceiling, so requests were refused. This is load, not a bug; check geodb_requests_refused_total by class and geodb_claims_in_use against its _max. Separate from geodb_claims_refused_total (the pool) and geodb_claims_short_total (mid-flight).
      - eval_time: 15m
        alertname: GeoDbAdmissionClaimOverClamp
        exp_alerts:
          - exp_labels: {severity: info, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db refused a read whose priced need passed the service claim in the last 15m
              description: >-
                A read priced above the service's claim is refused by design, so one oversized query makes this nonzero legitimately. Info until a week of scrapes gives a baseline; tighten to warning after that.
      - {eval_time: 50m, alertname: GeoDbAdmissionCeiling, exp_alerts: []}
      - {eval_time: 50m, alertname: GeoDbAdmissionClaimOverClamp, exp_alerts: []}

  - name: admission refusal causes do not cross-fire
    interval: 1m
    input_series:
      - series: 'geodb_claims_refused_by_cause_total{namespace="gaia", job="geodb", cause="ceiling"}'
        values: '0x10 1+1x5 6x40'
      - series: 'geodb_claims_refused_by_cause_total{namespace="gaia", job="geodb", cause="claim_over_clamp"}'
        values: '0x56'
    alert_rule_test:
      - {eval_time: 15m, alertname: GeoDbAdmissionClaimOverClamp, exp_alerts: []}

  - name: derived image refused fires at info after 1m
    interval: 1m
    input_series:
      - series: 'geodb_derived_image_outcome{namespace="gaia", job="geodb", outcome="epoch"}'
        values: '1x30'
    alert_rule_test:
      - {eval_time: 30s, alertname: GeoDbDerivedImageNotUsed, exp_alerts: []}
      - eval_time: 10m
        alertname: GeoDbDerivedImageNotUsed
        exp_alerts:
          - exp_labels: {severity: info, service: geodb, namespace: gaia, outcome: epoch}
            exp_annotations:
              summary: geo-db found a derived image at start and refused it (epoch)
              description: >-
                The derived table was replayed from the log instead (a slow start, not data loss). The row is published once at start, so this stays up for the process life and clears on the next restart. absent (first start) and off (switch off) are excluded.

  - name: derived image loaded, off and absent stay silent
    interval: 1m
    input_series:
      - series: 'geodb_derived_image_outcome{namespace="gaia", job="geodb", outcome="loaded"}'
        values: '1x30'
      - series: 'geodb_derived_image_outcome{namespace="gaia", job="geodb", outcome="off"}'
        values: '1x30'
      - series: 'geodb_derived_image_outcome{namespace="gaia", job="geodb", outcome="absent"}'
        values: '1x30'
    alert_rule_test:
      - {eval_time: 20m, alertname: GeoDbDerivedImageNotUsed, exp_alerts: []}

  - name: derived refused cap, view failures and work open rows
    interval: 1m
    input_series:
      - series: 'geodb_derived_refused_cap_total{namespace="gaia", job="geodb"}'
        values: '0x10 1+1x5 6x40'
      - series: 'geodb_derived_view_failures_total{namespace="gaia", job="geodb"}'
        values: '0x60'
      - series: 'geodb_work_open_rows{namespace="gaia", job="geodb"}'
        values: '90x60'
      - series: 'geodb_work_open_rows_max{namespace="gaia", job="geodb"}'
        values: '100x60'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbDerivedRefusedCap, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbDerivedRefusedCap
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db refused a derived write past the table cap in the last 15m
              description: >-
                GeoDbDerivedRowsHigh warns at 80%; this fires if it was missed. Raise derived_rows_max in the geodb-serve-config ConfigMap (one serve restart; RUNBOOK 2d).
      - {eval_time: 50m, alertname: GeoDbDerivedRefusedCap, exp_alerts: []}
      - {eval_time: 50m, alertname: GeoDbDerivedViewFailures, exp_alerts: []}
      - {eval_time: 10m, alertname: GeoDbWorkOpenRowsHigh, exp_alerts: []}
      - eval_time: 30m
        alertname: GeoDbWorkOpenRowsHigh
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db's work class holds more than 80% of work_open_rows_max
              description: >-
                Open (pending plus in-progress) units are near their cap, so new units will be refused. Check geodb_work_pending and geodb_work_in_progress for a stalled consumer, then raise the cap in serve.cfg (one serve restart).

  - name: derived view failures fire on a rise and clear after 15m
    interval: 1m
    input_series:
      - series: 'geodb_derived_view_failures_total{namespace="gaia", job="geodb"}'
        values: '0x10 1+1x5 6x40'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbDerivedViewFailures, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbDerivedViewFailures
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db derived view failures in the last 15m
              description: >-
                geodb_derived_view_failures_total rose. Read the serve log for the failing view and check geodb_derived_collection_rows{collection}.
      - {eval_time: 50m, alertname: GeoDbDerivedViewFailures, exp_alerts: []}

  - name: work open rows at 70% or with cap 0 stay silent
    interval: 1m
    input_series:
      - series: 'geodb_work_open_rows{namespace="gaia", job="geodb", pod="a"}'
        values: '70x60'
      - series: 'geodb_work_open_rows_max{namespace="gaia", job="geodb", pod="a"}'
        values: '100x60'
    alert_rule_test:
      - {eval_time: 40m, alertname: GeoDbWorkOpenRowsHigh, exp_alerts: []}

  - name: work open rows with zero cap stays silent
    interval: 1m
    input_series:
      - series: 'geodb_work_open_rows{namespace="gaia", job="geodb"}'
        values: '10x60'
      - series: 'geodb_work_open_rows_max{namespace="gaia", job="geodb"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 40m, alertname: GeoDbWorkOpenRowsHigh, exp_alerts: []}

  - name: store fenced fires at 1, silent at 0
    interval: 1m
    input_series:
      - series: 'geodb_store_fenced{namespace="gaia", job="geodb"}'
        values: '0x10 1x20'
    alert_rule_test:
      - {eval_time: 9m, alertname: GeoDbStoreFenced, exp_alerts: []}
      - {eval_time: 10m, alertname: GeoDbStoreFenced, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbStoreFenced
        exp_alerts:
          - exp_labels: {severity: critical, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db's store has fenced; every write is refused
              description: >-
                geodb_store_fenced is 1. Serve printed one stderr line, "store fenced: <cause>; every write is refused StoreFenced until the store reopens", so read the cause there. Writes stay refused until the store reopens (a serve restart); reads are unaffected.

  - name: store fenced silent when the series is absent
    interval: 1m
    input_series:
      - series: 'geodb_sessions_open{namespace="gaia", job="geodb"}'
        values: '1x30'
    alert_rule_test:
      - {eval_time: 20m, alertname: GeoDbStoreFenced, exp_alerts: []}

  - name: host pool peak at 50% stays silent, at 90% fires after 15m
    interval: 1m
    input_series:
      - series: 'geodb_host_pool_priced_peak{namespace="gaia", job="geodb"}'
        values: '3000x20 5900x40'
      - series: 'geodb_host_pool_records_max{namespace="gaia", job="geodb"}'
        values: '6416x60'
    alert_rule_test:
      - {eval_time: 19m, alertname: GeoDbHostPoolHeadroomLow, exp_alerts: []}
      - {eval_time: 30m, alertname: GeoDbHostPoolHeadroomLow, exp_alerts: []}
      - eval_time: 45m
        alertname: GeoDbHostPoolHeadroomLow
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: An Edit priced more than 80% of geo-db's host pool since the last open
              description: >-
                A statement id hosted by many Spaces lengthens each host chain, so one Edit's price grows
                with the Space count touching its statements. An Edit priced past geodb_host_pool_records_max
                is refused ResourceExhausted (owner=identity_table row=none) for good, and no checkpoint makes
                room. Split the feeder's largest Edits, or raise the pool's share of the store (serve.cfg
                carving; one serve restart).

  - name: a host pool refusal fires, a flat zero counter stays silent
    interval: 1m
    input_series:
      - series: 'geodb_host_pool_refused_total{namespace="gaia", job="geodb"}'
        values: '0x10 1+1x5 6x40'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbHostPoolRefused, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbHostPoolRefused
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db refused an Edit for a price past its host pool in the last 15m
              description: >-
                The refusal is by design and terminal (owner=identity_table row=none): the Edit's host
                records exceed the pool's slots, so a retry is refused the same way. Compare
                geodb_host_pool_priced_peak with geodb_host_pool_records_max, then split the Edit at the
                feeder or enlarge the pool (one serve restart).
      - {eval_time: 50m, alertname: GeoDbHostPoolRefused, exp_alerts: []}

  - name: a store fold refusal fires, flat zero stays silent, and it clears after 15m
    interval: 1m
    input_series:
      - series: 'geodb_store_fold_refused_total{namespace="gaia", job="geodb"}'
        values: '0x10 1+1x5 6x40'
    alert_rule_test:
      - {eval_time: 8m, alertname: GeoDbStoreFoldRefused, exp_alerts: []}
      - eval_time: 15m
        alertname: GeoDbStoreFoldRefused
        exp_alerts:
          - exp_labels: {severity: warning, service: geodb, namespace: gaia}
            exp_annotations:
              summary: geo-db refused an atomic Branch fold during Phase 1 staging in the last 15m
              description: >-
                geodb_store_fold_refused_total rose above 0 (must stay 0). Phase 1 staging rejected a
                commitSerial Branch fold before any log write or shared mutation, so the store did not fence
                (geodb_store_fenced remains 0; see ISS-837 and ISS-838-417). Inspect serve logs and
                owner-capacity metrics to find why staging refused the fold.
      - {eval_time: 50m, alertname: GeoDbStoreFoldRefused, exp_alerts: []}
