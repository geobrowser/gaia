# Atlas canonical-graph observability.
#
# Why these exist: on 2026-08-10 atlas's Pinax substream died in a way the client
# never treated as fatal — it logged `h2 protocol error: error reading a body from
# connection`, then `Blockstreams disconnected` / `Blockstreams connected`, and no
# block ever arrived again. The process stayed healthy (0 restarts in 8 days), so
# nothing restarted it, and the canonical graph sat frozen at block 27694 for two
# days while the chain reached 29448. Personal spaces silently stopped becoming
# canonical, and search quietly stopped returning people.
#
# The root cause of the two-day silence was not a missing watchdog: it was that
# **atlas published no metrics at all**. It now publishes the shared
# hermes_latest_processed_block{,_timestamp} gauges, which puts it under
# HermesBehindChainTip in ../hermes-lag-alerts.yaml — a tip-relative rule that
# would have fired on day one.
#
# Deliberately NOT here: a block-staleness rule ("atlas has seen no recent
# block"). Chain 55516 only produces blocks on demand — measured over a week:
# ~894 blocks/day, median gap 2 minutes, p90 8 minutes, longest genuinely-idle
# window 130 minutes, confirmed against two independent series. A 15-minute
# staleness rule would have fired 81 times that week on a perfectly healthy
# atlas. Lag against the tip is the cadence-independent signal; see the same
# hazard called out on chain-tip-exporter's LATEST_BLOCK_BEHIND_THRESHOLD_SECS.
#
# Coverage split:
#   HermesBehindChainTip (../hermes-lag-alerts.yaml)  — atlas is behind the tip
#   AtlasRestartingRepeatedly (here)                  — self-healing is flapping
#   AtlasMetricsMissing (here)                        — the signal itself is gone
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: atlas-lag-observability
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: atlas.lag
      rules:
        # atlas now exits on a confirmed stall so the pod restarts by itself. A
        # self-healing loop that flaps silently is its own outage, so surface a
        # chronically unstable upstream rather than hiding it behind recovery.
        - alert: AtlasRestartingRepeatedly
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="gaia", container="atlas"}[1h]) >= 3
          for: 5m
          labels:
            severity: warning
            service: atlas
          annotations:
            summary: Atlas is restarting repeatedly
            description: >-
              Atlas has restarted {{ $value }} times in the last hour, most likely its
              stall detector firing on a substream that keeps dropping. Recovery is
              working, but the upstream (Pinax) needs investigating. If atlas is NOT
              actually behind the chain tip, suspect the detector itself and set
              ATLAS_STALL_TIMEOUT_SECS=0 to disable it while diagnosing.

        # Belt and braces: if atlas stops publishing metrics entirely — crash-looping
        # before it serves /metrics, or the Service/ServiceMonitor wiring breaks —
        # HermesBehindChainTip goes stale rather than firing, because its series
        # vanishes. That is precisely the two-day-silence failure mode, so alert on
        # the absence itself.
        - alert: AtlasMetricsMissing
          expr: |
            absent(hermes_latest_processed_block{service="atlas"})
          for: 15m
          labels:
            severity: warning
            service: atlas
          annotations:
            summary: Atlas is not reporting metrics
            description: >-
              No atlas block metrics for 15 minutes. Either atlas is not running or the
              Service / ServiceMonitor scrape is broken — which would also blind
              HermesBehindChainTip, so treat this as the canonical graph being
              unmonitored.
