# Alerts for the long-running indexers that gained /metrics in GEO-2959, after
# kg-indexer (./kg-indexer-alerts.yaml): search-indexer, vote-indexer,
# topology-indexer, ranking-indexer, notification-indexer and delivery-worker.
#
# Each one serves /metrics on 9464 and is scraped through
# hermes-metrics-servicemonitor.yaml, so `up` and every series below carry
# service="<name>" (the Service name) and namespace="gaia".
#
# Write-failure policy (GEO-2884, GEO-3101), shared by kg-indexer, vote-indexer,
# topology-indexer and notification-indexer (each crate's src/write_retry.rs):
#   * transient (connection, timeout, serialization, deadlock, and anything not
#     proven permanent): retried with backoff (default 5 attempts over ~30s; 3 for
#     kg-indexer), then the process HALTS: it sets <service>_halted to 1, holds for
#     30s so Prometheus scrapes that, and exits 1 without committing, so the pod
#     restarts on the same offset. A persistent fault is a visible crash-loop.
#   * permanent (undecodable payload, SQLSTATE 22 data exception, 23 constraint
#     violation): the one poison message is skipped, committed past, and counted
#     in the *_dropped / db_error counters below. More than 10 in a row halts too,
#     because that is a systemic fault, not a poison message.
#
# Coverage split:
#   IndexerMetricsMissing (here)       — the signal itself is gone
#   IndexerHalted (here)               — an indexer stopped on a write it could not
#                                        make; fires within a scrape of the first halt
#   IndexerDroppedData (here)          — a poison message was skipped (permanent
#                                        error); data is missing until replayed
#   IndexerRestartingRepeatedly (here) — the crash-loop itself, for every indexer
#       that exits on failure: the four above when they halt, search-indexer on any
#       NACKed batch, ranking-indexer on a transient error that outlasts its
#       retries. Their counters die with the process, so the restart count is the
#       signal.
#   Kafka consumer lag (../kafka-consumer-lag-alerts.yaml) — per-partition lag for
#       the five Kafka consumers, which still works when a pod is dead. None of
#       these services publishes a position gauge: their topics only carry
#       messages when someone acts, so a "last processed" value would stall in
#       quiet stretches. delivery-worker reads Postgres, not Kafka; its
#       delivery_worker_pending_deliveries gauge is the backlog signal there.
#
# Apply after every service listed here is running an image that serves
# /metrics, or IndexerMetricsMissing fires in between:
#   kubectl apply -f monitoring/k8s/v2/indexer-alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: indexer-observability
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: indexers
      rules:
        # One rule for all six, keyed on the workload rather than on six absent()
        # calls. It fires for a Deployment or StatefulSet that kube-state-metrics
        # says should be running (replicas > 0) and that has no `up == 1` target,
        # so it catches a crash-looping pod, a pod that never serves /metrics, and
        # broken Service / ServiceMonitor wiring, but stays quiet while a service
        # is deliberately scaled to 0 (the Kafka replay procedure does this).
        # label_replace writes the workload name into `service` so it joins on the
        # scrape target's Service name, which is the same for every entry here.
        - alert: IndexerMetricsMissing
          expr: |
            (
              label_replace(
                max by (namespace, deployment) (
                  kube_deployment_spec_replicas{namespace="gaia", deployment=~"vote-indexer|topology-indexer|ranking-indexer|notification-indexer|delivery-worker"}
                ) > 0,
                "service", "$1", "deployment", "(.*)"
              )
              or
              label_replace(
                max by (namespace, statefulset) (
                  kube_statefulset_replicas{namespace="gaia", statefulset="search-indexer"}
                ) > 0,
                "service", "$1", "statefulset", "(.*)"
              )
            )
            unless on (namespace, service)
              max by (namespace, service) (up{namespace="gaia"} == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }} is not reporting metrics"
            description: >-
              {{ $labels.service }} should be running in {{ $labels.namespace }}, but
              Prometheus has had no healthy scrape of it for 15 minutes. Either no pod is
              ready (a Service only publishes ready pods, so a failing readiness probe
              counts), or the Service / ServiceMonitor wiring is broken. Either way
              IndexerDroppedData is blind for it until this clears.

        # The halting indexer sets its gauge to 1 and holds for 30s (two scrapes)
        # before exiting, so max_over_time sees it even though the series vanishes
        # with the process. No `for`: the first halt is the thing worth knowing,
        # and the 15m window keeps the alert up through a crash-loop's backoff.
        # kg-indexer can take ~15 minutes to halt when the cause is a 300s
        # statement timeout (3 attempts), so this fires well before
        # IndexerRestartingRepeatedly would for it.
        - alert: IndexerHalted
          expr: |
            max by (namespace, service) (
              max_over_time({__name__=~"kg_indexer_halted|vote_indexer_halted|topology_indexer_halted|notification_indexer_halted", namespace="gaia"}[15m])
            ) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }} halted on a write it could not make"
            description: >-
              {{ $labels.service }} failed to write a message to Postgres on every retry and
              exited without committing its offset, so Kubernetes restarts it on the same
              message (GEO-2884 / GEO-3101). Nothing is lost, but the consumer makes no
              progress until the cause clears: expect Kafka lag to grow and the pod to
              crash-loop. The error is in the previous container's log (look for
              `.halting`):
              kubectl -n gaia logs deploy/{{ $labels.service }} --previous | grep -E 'halting|retrying'

        # No `for`: each of these counters only moves when data is lost, and one
        # event is already the thing worth knowing. Every counter is registered at
        # zero on startup, so increase() sees the first event rather than treating
        # it as the series' first sample.
        #
        # Since GEO-3101 the three indexer counters only move for a PERMANENT
        # error: a message that can never be written (SQLSTATE 22/23, or a value
        # out of range), skipped so it does not block the partition forever. A
        # transient failure halts instead (IndexerHalted) and loses nothing.
        #
        #   vote_indexer_votes_dropped_total: votes that could never be written. A
        #     batch with one such vote is rewritten vote by vote, so only it is lost.
        #   topology_indexer_diffs_dropped_total: diffs that could never apply.
        #   notification_indexer_events_failed_total{reason="db_error"}: events
        #     whose notifications hit a permanent database error.
        #   delivery_worker_deliveries_total{outcome="failed"}: a webhook delivery
        #     given up on for good.
        - alert: IndexerDroppedData
          expr: |
            sum by (namespace, service) (
                 increase(vote_indexer_votes_dropped_total{namespace="gaia"}[15m])
              or increase(topology_indexer_diffs_dropped_total{namespace="gaia"}[15m])
              or increase(notification_indexer_events_failed_total{namespace="gaia", reason="db_error"}[15m])
              or increase(delivery_worker_deliveries_total{namespace="gaia", outcome="failed"}[15m])
            ) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }} dropped data"
            description: >-
              {{ $labels.service }} lost {{ $value | humanize }} item(s) in the last 15
              minutes that it will not retry. For the indexers this is a permanent,
              data-level error (a value the schema rejects, a constraint violation): the
              message can never be written, so it was skipped rather than blocking the
              partition. vote-indexer: votes. topology-indexer: canonical-graph diffs.
              notification-indexer: events whose notifications hit that kind of database
              error. delivery-worker: webhook deliveries marked failed for good. They stay
              missing until the cause is fixed and the topic replayed (or, for
              delivery-worker, the rows are reset to pending). The cause is in the logs:
              kubectl -n gaia logs deploy/{{ $labels.service }} --since=1h | grep -iE 'dropped|error|failed'

        # Mirrors AtlasRestartingRepeatedly / ApiRestartingRepeatedly. The stock
        # KubePodCrashLooping only fires once a pod is in CrashLoopBackOff, which a
        # pod that exits every half hour and starts cleanly never reaches.
        #
        # A halting indexer (default policy) exits ~60s after it starts: ~30s of
        # retries plus the 30s hold. With CrashLoopBackOff's 10s/20s/40s delays the
        # third restart lands ~4-5 minutes in, so with `for: 5m` this fires within
        # ~10 minutes of the first failure. IndexerHalted fires sooner.
        - alert: IndexerRestartingRepeatedly
          expr: |
            sum by (namespace, container) (
              increase(kube_pod_container_status_restarts_total{namespace="gaia", container=~"kg-indexer|search-indexer|vote-indexer|topology-indexer|ranking-indexer|notification-indexer|delivery-worker"}[1h])
            ) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.container }} is restarting repeatedly"
            description: >-
              {{ $labels.container }} has restarted {{ $value | humanize }} times in the last
              hour. kg-indexer, vote-indexer, topology-indexer and notification-indexer
              halt (exit without committing) when a database write fails on every retry;
              search-indexer exits whenever a batch is NACKed (an OpenSearch bulk failure
              or a processing error) so Kafka redelivers it; ranking-indexer exits when a
              transient database or Kafka error outlasts its retries. All converge on
              restart, but a loop means the same message keeps failing. Read the previous
              container's log:
              kubectl -n gaia logs <pod> -c {{ $labels.container }} --previous
