# Grafana dashboard for the api's security signals (securitySignalsPlugin.ts).
# Loaded by the Grafana sidecar via the grafana_dashboard label. Alerts: ./api-security-alerts.yaml.
# Runbook: docs/runbooks/graphql-probing.md.
#   kubectl apply -f monitoring/k8s/v2/api-security-dashboard.yaml
apiVersion: v1
data:
  gaia-api-security.json: |-
    {
      "id": null,
      "uid": "gaia-api-security",
      "title": "Gaia API Security Signals",
      "tags": [
        "api",
        "security",
        "observability"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": true,
              "text": "Prometheus",
              "value": "Prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Is anyone probing us?",
          "id": 1,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Hidden-surface probes (24h)",
          "description": "Requests for schema we deliberately removed. No first-party client sends these; anything above zero is someone mapping the api. Alert: ApiHiddenSurfaceProbed.",
          "id": 2,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(increase(gaia_api_graphql_hidden_surface_probe_total{namespace=\"gaia\", job=\"api\"}[24h])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Unparseable + unknown-field requests/s",
          "description": "Current rate of requests that are not GraphQL or name fields the schema lacks. Alert: ApiGraphqlRejectionSurge above 1/s for 10m.",
          "id": 3,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(rate(gaia_api_graphql_rejected_total{namespace=\"gaia\", job=\"api\", reason=~\"parse|unknown_field\"}[5m])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Schema introspection (24h)",
          "description": "Successful __schema / __type queries. Normal for GraphiQL and codegen; a scanner's first step. Context, not an alert.",
          "id": 4,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(increase(gaia_api_graphql_introspection_total{namespace=\"gaia\", job=\"api\"}[24h])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Detection failures (24h)",
          "description": "Times detection itself threw. Requests are unaffected, but nonzero means the panels above under-count. Alert: ApiSecuritySignalsDegraded.",
          "id": 5,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(increase(gaia_api_security_signal_internal_errors_total{namespace=\"gaia\", job=\"api\"}[24h])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "What is being sent",
          "id": 6,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Rejected requests by reason",
          "description": "parse: not GraphQL. unknown_field: names a field or type the schema lacks (how scanners map an api, and how a client broken by a schema change looks). other_validation: bad arguments or variables, usually a client bug.",
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum by (reason) (rate(gaia_api_graphql_rejected_total{namespace=\"gaia\", job=\"api\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{reason}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Hidden-surface probes by target",
          "description": "Which hidden table or mutation was asked for. The caller is in the log line and the Sentry issue, never a metric label.",
          "id": 8,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum by (target) (increase(gaia_api_graphql_hidden_surface_probe_total{namespace=\"gaia\", job=\"api\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "{{target}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 40,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Introspection by kind",
          "description": "__schema (full schema dump) vs __type (single type lookup).",
          "id": 9,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum by (kind) (rate(gaia_api_graphql_introspection_total{namespace=\"gaia\", job=\"api\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{kind}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Signal log lines withheld",
          "description": "Signals counted but not logged because a source exhausted its log budget (20 in full, then one per 5s) or the global ceiling (20/s per pod). Sustained values mean a flood; counts above are still exact.",
          "id": 10,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(rate(gaia_api_security_signal_log_suppressed_total{namespace=\"gaia\", job=\"api\"}[5m]))",
              "refId": "A",
              "legendFormat": "withheld/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "row",
          "title": "Detector health",
          "id": 11,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Sources tracked per pod",
          "description": "Distinct caller addresses held for log rate limiting. Capped at 10,000 per pod; the least recently seen is evicted beyond that.",
          "id": 12,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "gaia_api_security_signal_sources{namespace=\"gaia\", job=\"api\"}",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Source evictions",
          "description": "Nonzero means more than 10,000 distinct addresses are active on a pod: an address-rotating flood. Memory stays bounded either way.",
          "id": 13,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(rate(gaia_api_security_signal_source_evictions_total{namespace=\"gaia\", job=\"api\"}[5m]))",
              "refId": "A",
              "legendFormat": "evictions/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Detection failures",
          "description": "Should be flat at zero.",
          "id": 14,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(increase(gaia_api_security_signal_internal_errors_total{namespace=\"gaia\", job=\"api\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "failures"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 40,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "text",
          "title": "Where to look next",
          "id": 15,
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 32
          },
          "options": {
            "mode": "markdown",
            "content": "**Who is it?** `kubectl -n gaia logs -l app=api --since=30m --prefix | grep '\"GraphQL security signal\"'`: each line has `signal`, `clientIp`, `userAgent`, `origin`, `unknownFields`, `hiddenSurface`, and `suppressedSinceLastEmit` for what a flood's budget withheld.\n\n**Hidden-surface probes** also raise the Sentry issue *Hidden GraphQL surface probed* (at most once per address per hour).\n\n**Runbook:** `docs/runbooks/graphql-probing.md` in geobrowser/gaia."
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    app: kube-prometheus-stack-grafana
    grafana_dashboard: "1"
    release: kube-prometheus-stack
  name: gaia-api-security-dashboard
  namespace: monitoring
