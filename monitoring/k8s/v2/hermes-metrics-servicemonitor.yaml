apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hermes-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - monitoring
      - gaia
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - hermes-pipeline
          - hermes-ipfs-cache
          - chain-tip-exporter
          # atlas publishes the same hermes_latest_processed_block gauge and is
          # covered by the same HermesBehindChainTip thresholds. Before this it
          # published no metrics at all, which is why a two-day substream wedge
          # went unnoticed. See monitoring/k8s/v2/atlas-lag-alerts.yaml.
          - atlas
          # kg-indexer publishes the same gauge, advanced on every block summary it
          # reads (empty blocks included), plus its own kg_indexer_* counters. See
          # monitoring/k8s/v2/kg-indexer-alerts.yaml.
          - kg-indexer
          # The rest of the long-running indexers (GEO-2959). None publishes the
          # hermes_latest_processed_block gauge, so HermesBehindChainTip ignores
          # them; each has its own <service>_* counters. See
          # monitoring/k8s/v2/indexer-alerts.yaml.
          - search-indexer
          - vote-indexer
          - topology-indexer
          - ranking-indexer
          - notification-indexer
          - delivery-worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
  targetLabels:
    - gaia_namespace
