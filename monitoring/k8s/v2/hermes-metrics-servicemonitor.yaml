apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hermes-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - monitoring
      - gaia
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - hermes-pipeline
          - hermes-ipfs-cache
          - chain-tip-exporter
          # atlas publishes the same hermes_latest_processed_block gauge and is
          # covered by the same HermesBehindChainTip thresholds. Before this it
          # published no metrics at all, which is why a two-day substream wedge
          # went unnoticed. See monitoring/k8s/v2/atlas-lag-alerts.yaml.
          - atlas
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
  targetLabels:
    - gaia_namespace
