apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hermes-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - monitoring
      - gaia
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - hermes-pipeline
          - hermes-ipfs-cache
          - chain-tip-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
  targetLabels:
    - gaia_namespace
