# Alert rules for Kafka consumer-group lag.
#
# Sourced from kafka_exporter (see monitoring/k8s/kafka-exporter.yaml). Lag
# observability is centralised in the exporter so these rules fire even when
# the consumer pod itself is dead — exactly when in-process gauges go silent.
#
# Thresholds: aggressive defaults — tune after observing staging for a week.
#
# One exclusion applies to every rule: geo-chat's gateway joins with one
# consumer group PER POD (geo-chat-gateway-<env>-<pod name>), so every past pod
# leaves an abandoned group whose lag grows forever until the broker expires its
# offsets. Those groups are not a signal; a dead geo-chat pod shows up in its
# own readiness.
#
# Apply:
#   kubectl apply -f monitoring/k8s/kafka-consumer-lag-alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kafka-consumer-lag
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kafka.consumer.lag
      rules:
        - alert: KafkaConsumerLagHigh
          expr: |
            max by (consumergroup, topic) (
              kafka_consumergroup_lag{consumergroup!~".*search-indexer-group-scores-.*|geo-chat-gateway-.*"}
            ) > 1000
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Kafka consumer group {{ $labels.consumergroup }} is lagging
            description: |
              Consumer group {{ $labels.consumergroup }} has lag {{ $value }}
              messages on topic {{ $labels.topic }} for over 2 minutes.

        # Scores consumers receive bursty input from the daily scoring cron,
        # which can dump thousands of messages at once. Use a longer `for:` so
        # the burst drains before alerting, while keeping the same lag
        # threshold as other consumers.
        - alert: KafkaSearchIndexerScoresLagHigh
          expr: |
            max by (consumergroup, topic) (
              kafka_consumergroup_lag{consumergroup=~".*search-indexer-group-scores-.*"}
            ) > 1000
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: Kafka consumer group {{ $labels.consumergroup }} is lagging
            description: |
              Consumer group {{ $labels.consumergroup }} has lag {{ $value }}
              messages on topic {{ $labels.topic }} for over 2 hours.

        - alert: KafkaConsumerLagCritical
          expr: |
            max by (consumergroup, topic) (
              kafka_consumergroup_lag{consumergroup!~"geo-chat-gateway-.*"}
            ) > 10000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Kafka consumer group {{ $labels.consumergroup }} is severely lagging
            description: |
              Consumer group {{ $labels.consumergroup }} has lag {{ $value }}
              messages on topic {{ $labels.topic }} for over 5 minutes —
              consumer is falling behind faster than it can catch up.

        # Stuck = committed offset has not advanced while there are unprocessed
        # messages. The floor is > 10, not > 0: transactional producers write a
        # commit marker that occupies an offset but is never delivered, so a
        # caught-up consumer on a quiet topic sits at lag 1-2 indefinitely
        # (seen on testnet.space.governance). Catches a hung consumer that's still holding its group
        # membership but not making progress (deadlock, long-running query,
        # external dependency outage).
        - alert: KafkaConsumerStuck
          expr: |
            (
              kafka_consumergroup_lag{consumergroup!~"geo-chat-gateway-.*"} > 10
              and on(consumergroup, topic, partition)
              (changes(kafka_consumergroup_current_offset[1m]) == 0)
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Kafka consumer group {{ $labels.consumergroup }} is stuck
            description: |
              Consumer group {{ $labels.consumergroup }} has not advanced its
              committed offset for topic {{ $labels.topic }} partition
              {{ $labels.partition }} in 5 minutes, but {{ $value }} messages
              are unprocessed.

        # Lag -1 is kafka_exporter's sentinel for "this group has NO committed
        # offset on this partition" (v1.8.0: `if offsetFetchResponseBlock.Offset
        # == -1 { lag = -1 }`). It is not a lag value, so every rule above,
        # which compares lag against a positive threshold, can never fire on it.
        #
        # Usually it is harmless. testnet.topology.canonical has two partitions,
        # but atlas keys every message by the canonical root space id, so all of
        # them land on partition 1 and partition 0 stays empty (head 0).
        # topology-indexer and the search-indexer topology group have nothing to
        # commit there, and report -1 on it permanently. Their partition 1 is
        # still watched normally.
        #
        # The case worth an alert is -1 on a partition that DOES hold messages:
        # the group is consuming (or meant to be) but has never committed, so
        # the lag rules are blind to it. Over the 7 days before this rule was
        # added that only ever showed up as single 30s samples during restarts,
        # hence the long `for:`.
        - alert: KafkaConsumerPartitionNeverCommitted
          expr: |
            (
              kafka_consumergroup_lag{consumergroup!~"geo-chat-gateway-.*"} == -1
              and on(topic, partition)
              (kafka_topic_partition_current_offset > kafka_topic_partition_oldest_offset)
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Kafka consumer group {{ $labels.consumergroup }} has no committed offset
            description: |
              Consumer group {{ $labels.consumergroup }} has never committed an
              offset on topic {{ $labels.topic }} partition {{ $labels.partition }},
              although that partition holds messages. Lag cannot be measured, so
              the other lag alerts cannot fire for it.

        # Group is registered with the broker but has no active members. Means
        # all consumers crashed or were scaled to 0 — distinct from "stuck"
        # because there's no heartbeat at all.
        - alert: KafkaConsumerGroupEmpty
          expr: kafka_consumergroup_members{consumergroup!~"geo-chat-gateway-.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Kafka consumer group {{ $labels.consumergroup }} has no members
            description: |
              Consumer group {{ $labels.consumergroup }} has zero active members
              for over 2 minutes. Consumer pods are likely down or scaled to 0.
