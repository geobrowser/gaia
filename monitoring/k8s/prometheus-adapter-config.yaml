apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: metrics-adapter
    app.kubernetes.io/name: prometheus-adapter
    app.kubernetes.io/version: 0.12.0
  name: adapter-config
  namespace: monitoring
data:
  config.yaml: |-
    rules:
      - seriesQuery: 'gaia_api_graphql_pool_saturated{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace:
              resource: namespace
            pod:
              resource: pod
        name:
          matches: '^gaia_api_graphql_pool_saturated$'
          as: 'gaia_api_graphql_pool_saturated'
        metricsQuery: |
          max(gaia_api_graphql_pool_saturated{<<.LabelMatchers>>}) by (<<.GroupBy>>)

    resourceRules:
      cpu:
        containerLabel: container
        containerQuery: |
          sum by (<<.GroupBy>>) (
            irate (
                container_cpu_usage_seconds_total{<<.LabelMatchers>>,container!="",pod!=""}[4m]
            )
          )
        nodeQuery: |
          sum by (<<.GroupBy>>) (
            irate(
                node_cpu_usage_seconds_total{<<.LabelMatchers>>}[4m]
            )
          )
        resources:
          overrides:
            namespace:
              resource: namespace
            node:
              resource: node
            pod:
              resource: pod
      memory:
        containerLabel: container
        containerQuery: |
          sum by (<<.GroupBy>>) (
            container_memory_working_set_bytes{<<.LabelMatchers>>,container!="",pod!=""}
          )
        nodeQuery: |
          sum by (<<.GroupBy>>) (
            node_memory_working_set_bytes{<<.LabelMatchers>>}
          )
        resources:
          overrides:
            node:
              resource: node
            namespace:
              resource: namespace
            pod:
              resource: pod
      window: 5m

    externalRules:
      - seriesQuery: '{__name__="nginx_ingress_controller_requests",exported_namespace="api",ingress="api",exported_service="api"}'
        name:
          as: api_ingress_503_ratio_rate5m
        metricsQuery: |
          (sum(rate(nginx_ingress_controller_requests{exported_namespace="api",ingress="api",exported_service="api",status="503"}[5m])) or vector(0))
          /
          clamp_min(sum(rate(nginx_ingress_controller_requests{exported_namespace="api",ingress="api",exported_service="api"}[5m])), 1)
        resources:
          namespaced: false
      - seriesQuery: '{__name__="api:ingress_p95_latency_seconds:2m",exported_namespace="api",ingress="api",exported_service="api"}'
        name:
          as: api_ingress_p95_latency_seconds_2m
        metricsQuery: |
          api:ingress_p95_latency_seconds:2m{exported_namespace="api",ingress="api",exported_service="api"}
        resources:
          namespaced: false
      - seriesQuery: '{__name__="api:ingress_p99_latency_seconds:2m",exported_namespace="api",ingress="api",exported_service="api"}'
        name:
          as: api_ingress_p99_latency_seconds_2m
        metricsQuery: |
          api:ingress_p99_latency_seconds:2m{exported_namespace="api",ingress="api",exported_service="api"}
        resources:
          namespaced: false
      - seriesQuery: '{__name__="kube_deployment_status_replicas_available",namespace="api",deployment="api"}'
        name:
          as: api_ready_replica_pressure
        metricsQuery: |
          (
            clamp_min(
              max(kube_deployment_spec_replicas{namespace="api",deployment="api"})
              -
              max(kube_deployment_status_replicas_available{namespace="api",deployment="api"}),
              0
            )
            /
            clamp_min(max(kube_deployment_spec_replicas{namespace="api",deployment="api"}), 1)
          ) or vector(0)
        resources:
          namespaced: false
