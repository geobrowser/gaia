apiVersion: v1
kind: ConfigMap
metadata:
  name: api-ingress-observability-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: kube-prometheus-stack-grafana
    release: kube-prometheus-stack
data:
  api-ingress-observability.json: |-
    {
      "title": "API Ingress Observability",
      "uid": "api-ingress-observability",
      "schemaVersion": 39,
      "version": 8,
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": true,
              "text": "Prometheus",
              "value": "Prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Key Health Indicators",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 10,
          "type": "stat",
          "title": "API RPS",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_requests_per_second:rate5m",
              "legendFormat": "req/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"],
              "fields": ""
            },
            "graphMode": "area",
            "textMode": "auto",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "p95 Latency",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 5,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_p95_latency_seconds:5m",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 2}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"],
              "fields": ""
            },
            "graphMode": "area",
            "textMode": "auto",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "p99 Latency",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 10,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_p99_latency_seconds:5m",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 2},
                  {"color": "red", "value": 5}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"],
              "fields": ""
            },
            "graphMode": "area",
            "textMode": "auto",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "5xx Ratio",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 15,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_5xx_ratio:rate5m",
              "legendFormat": "5xx"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.01},
                  {"color": "red", "value": 0.05}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"],
              "fields": ""
            },
            "graphMode": "area",
            "textMode": "auto",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 14,
          "type": "stat",
          "title": "API HPA Replicas",
          "description": "Current vs max replicas for the api HorizontalPodAutoscaler.",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 19,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"api\", horizontalpodautoscaler=\"api\"}",
              "legendFormat": "current"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"api\", horizontalpodautoscaler=\"api\"}",
              "legendFormat": "max"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"],
              "fields": ""
            },
            "graphMode": "none",
            "textMode": "value_and_name",
            "colorMode": "value",
            "justifyMode": "auto",
            "orientation": "horizontal"
          }
        },
        {
          "id": 101,
          "type": "row",
          "title": "API Traffic & Latency",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "panels": []
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "Ingress Request Rate (RPS)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_requests_per_second:rate5m",
              "legendFormat": "total"
            },
            {
              "refId": "B",
              "expr": "api:ingress_5xx_per_second:rate5m",
              "legendFormat": "5xx"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "5xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Ingress 5xx Ratio",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_5xx_ratio:rate5m",
              "legendFormat": "5xx ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Ingress Latency Percentiles (p50/p75/p95/p99)",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_p50_latency_seconds:5m",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "api:ingress_p75_latency_seconds:5m",
              "legendFormat": "p75"
            },
            {
              "refId": "C",
              "expr": "api:ingress_p95_latency_seconds:5m",
              "legendFormat": "p95"
            },
            {
              "refId": "D",
              "expr": "api:ingress_p99_latency_seconds:5m",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Ingress p99 by Method",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_method_p99_latency_seconds:5m",
              "legendFormat": "{{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request Rate by Method",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_method_requests_per_second:rate5m",
              "legendFormat": "{{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Ingress Response Codes (RPS by Status)",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_status_requests_per_second:rate5m",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Ingress Response Codes (24h Totals)",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 40
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (increase(nginx_ingress_controller_requests{host=\"testnet-api.geobrowser.io\"}[24h]))",
              "format": "table",
              "instant": true,
              "legendFormat": "{{status}}"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value #A": false,
                  "status": false
                },
                "indexByName": {
                  "status": 0,
                  "Value #A": 1
                },
                "renameByName": {
                  "Value #A": "responses_24h"
                }
              }
            }
          ],
          "options": {
            "showHeader": true,
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Failure-Class Proxy Rates (499/500/503)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 48
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_499_per_second:rate5m",
              "legendFormat": "499"
            },
            {
              "refId": "B",
              "expr": "api:ingress_500_per_second:rate5m",
              "legendFormat": "500"
            },
            {
              "refId": "C",
              "expr": "api:ingress_503_per_second:rate5m",
              "legendFormat": "503"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Error Rate by Status (4xx/5xx)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 48
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "api:ingress_error_status_requests_per_second:rate5m",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
