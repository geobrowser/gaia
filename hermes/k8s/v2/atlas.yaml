apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas
  namespace: gaia
  labels:
    app: atlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas
  template:
    metadata:
      labels:
        app: atlas
    spec:
      restartPolicy: Always
      imagePullSecrets:
        - name: regcred
      containers:
        - name: atlas
          image: registry.digitalocean.com/geo/atlas:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            # Publishes hermes_latest_processed_block{,_timestamp} so monitoring can
            # see how far behind the chain atlas is. Without this atlas was invisible:
            # it wedged for two days on a dropped Pinax stream and no alert could fire.
            - name: METRICS_PORT
              value: "9464"
            # Substream stall detection. Exits so the pod restarts and resumes from
            # its persisted cursor — a restart was the entire remedy the one time
            # this happened, and took ~20s.
            #
            # Measured against the chain tip, NOT against time since the last block:
            # chain 55516 only produces blocks on demand, and genuinely-idle windows
            # reach 130 minutes (see chain-tip-exporter's
            # LATEST_BLOCK_BEHIND_THRESHOLD_SECS for the same hazard). A silence
            # timeout would restart a healthy atlas dozens of times a day.
            #
            # Thresholds come from measured healthy behaviour: a working consumer on
            # this chain sits at lag 0 (p99 1, max 8 over a week), so 10 blocks
            # sustained for 20 minutes has ~2 orders of magnitude of headroom, while
            # a real wedge trips inside an hour.
            - name: ATLAS_STALL_LAG_BLOCKS
              value: "10"
            - name: ATLAS_STALL_TIMEOUT_SECS
              value: "1200"
            # The tip to compare against. `optional` on purpose: without it the
            # detector disables itself with a warning rather than guessing, so a
            # deploy that lands before the secret key exists degrades to the
            # previous behaviour instead of crash-looping.
            #
            # Seed the key from the RPC URL already in the cluster (copied as
            # base64 so the value is never written out in plaintext):
            #   kubectl -n gaia patch secret atlas-secrets --type=merge -p \
            #     "{\"data\":{\"RPC_URL\":\"$(kubectl -n gaia get secret \
            #       proposal-executor-credentials -o jsonpath='{.data.RPC_URL}')\"}}"
            - name: RPC_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-secrets
                  key: RPC_URL
                  optional: true
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_PASSWORD
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_SSL_CA_PEM
            - name: ENVIRONMENT
              value: "testnet"
            - name: KAFKA_TOPIC
              value: "topology.canonical"
            - name: USE_MOCK
              value: "false"
            - name: SUBSTREAMS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SUBSTREAMS_ENDPOINT
            - name: SUBSTREAMS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SUBSTREAMS_API_TOKEN
                  optional: true
            # 0 = stream from genesis — safe on the fresh chain (non-numeric values are
            # silently ignored and fall back to the OLD testnet block 82655).
            # Deploy block of the self-owned SpaceRegistry (0xcf13491802747e759e1bb8e364bc43045398d1dd)
            # on chain 55516. MUST NOT be 0: the Substreams server enforces
            # limit-processed-blocks=10000 per request, so a start block of 0 against a chain
            # past ~10k blocks never begins streaming. It fails silently — the pod stays Running
            # and repeats one unchanging "Progress (Jobs: 0, Bytes: [...]) map_actions: 1000
            # blocks" line, produces nothing to Kafka, and logs no error. Re-tighten this
            # whenever the registry is redeployed.
            - name: SUBSTREAMS_START_BLOCK
              value: "14339"
            - name: ROOT_SPACE_ID
              valueFrom:
                secretKeyRef:
                  name: atlas-secrets
                  key: ROOT_SPACE_ID
            - name: ATLAS_CHECKPOINT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: ATLAS_INDEXER_ID
              value: "atlas-testnet"
            - name: ATLAS_RUNTIME_COMPATIBILITY_MARKER
              value: "atlas-v1"
            - name: ATLAS_FAIL_OPEN_BOUND
              value: "10"
            - name: ATLAS_CHECKPOINT_RETRY_ATTEMPTS
              value: "3"
            - name: ATLAS_CHECKPOINT_RETRY_BACKOFF_MS
              value: "200"
            - name: ATLAS_PAUSE_RECOVERY_MAX_ATTEMPTS
              value: "120"
            - name: ATLAS_CHECKPOINT_ALLOW_FRESH_START
              value: "false"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: atlas-otel
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_TRACES_SAMPLE_RATE
              valueFrom:
                secretKeyRef:
                  name: atlas-otel
                  key: SENTRY_TRACES_SAMPLE_RATE
                  optional: true
            - name: SENTRY_SEND_DEFAULT_PII
              valueFrom:
                secretKeyRef:
                  name: atlas-otel
                  key: SENTRY_SEND_DEFAULT_PII
                  optional: true
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: atlas-otel
                  key: SENTRY_ENVIRONMENT
                  optional: true
            - name: SENTRY_RELEASE
              valueFrom:
                secretKeyRef:
                  name: atlas-otel
                  key: SENTRY_RELEASE
                  optional: true
            - name: SENTRY_DEBUG
              valueFrom:
                secretKeyRef:
                  name: atlas-otel
                  key: SENTRY_DEBUG
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: atlas
  namespace: gaia
  labels:
    app: atlas
    # Lifted into the metrics by the ServiceMonitor's `targetLabels`, which is what
    # joins them to chain_tip_block_number in the lag alerts.
    gaia_namespace: gaia
spec:
  type: ClusterIP
  selector:
    app: atlas
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
