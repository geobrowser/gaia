apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-pipeline
  namespace: gaia
  labels:
    app: hermes-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-pipeline
  template:
    metadata:
      labels:
        app: hermes-pipeline
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: ssl-certs
          emptyDir: {}
        # geodb-client for the substreams cursor mirror (geodb-cursor, GEODB_CURSOR_MIRROR). Dormant while
        # the flag is "off": nothing below is read, and every reference is optional or fails soft, so an
        # absent geodb never blocks a rollout. Same wiring as api/k8s/v2/api.yaml, but with the feeder's
        # CURSOR key: a principal that may write derived collection 10 and nothing else (geodb-cursor-key-job.yaml).
        - name: geodb-bin
          emptyDir: {}
        - name: geodb-space-map
          configMap:
            # Written by the geodb-feeder / serve. Not shipped in these manifests.
            name: geodb-space-map
            optional: true
        - name: geodb-key
          secret:
            secretName: geodb-cursor-key
            optional: true
            defaultMode: 0440
            items:
              - key: key
                path: cursor.key
      initContainers:
        - name: geodb-setup
          # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
          image: registry.digitalocean.com/geo/geodb:6b34f9feda
          imagePullPolicy: IfNotPresent
          # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
          # binding and the mirror stays disabled even if the flag is turned on.
          command:
            - sh
            - -c
            - |
              cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -n "$node" ] && [ -n "$ip" ]; then
                printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
              else
                echo "geodb-setup: no node id or no geodb Service; cursor mirror stays off"
              fi
              exit 0
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: setup-certs
          image: registry.digitalocean.com/geo/hermes-pipeline:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "$DATABASE_SSL_CA" > /ssl/ca.crt
          env:
            - name: DATABASE_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_SSL_CA
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: hermes-pipeline
          image: registry.digitalocean.com/geo/hermes-pipeline:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
              readOnly: true
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
            - name: geodb-key
              mountPath: /etc/geodb/key
              readOnly: true
          env:
            # Object-store home for the Postgres blob tables (zero-Postgres, plan 10.22 section 6). Every flag is
            # "0": nothing reads or writes the bucket until one is flipped to "1". Credentials come only from the
            # geodb-blob-key Secret (optional, so a pod starts without it while the flags are off).
            - name: IPFS_CACHE_BLOB_SHADOW_READ
              value: "0"
            - name: BLOB_BACKEND
              value: s3
            - name: BLOB_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: geodb-blob-key
                  key: endpoint
                  optional: true
            - name: BLOB_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: geodb-blob-key
                  key: bucket
                  optional: true
            - name: BLOB_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: geodb-blob-key
                  key: access_key
                  optional: true
            - name: BLOB_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: geodb-blob-key
                  key: secret_key
                  optional: true
            # Mirror the substreams `meta` cursor into geo-db (geodb-cursor), best-effort, after the Postgres
            # cursor write: each put is bounded by 2 s, a failure is logged and counted and never fails the
            # block, then a cool-down. ON since serve registered the cursor key (RUNBOOK section 10); "0" turns it off.
            - name: GEODB_CURSOR_MIRROR
              value: "1"
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_KEY_PATH
              value: /etc/geodb/key/cursor.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            # Shadow read of the IPFS warmer's meta block (hermes_ipfs_cache) from geo-db's cursors collection
            # (10), counted in geodb_meta_block_shadow_total. Postgres stays the source. Reads with the cursor
            # key above (GEODB_KEY_PATH, derived=10); collection 10 is not restricted, so any authenticated key
            # may read it. "0" = off; flipping it to "1" is a separate decision.
            - name: GEODB_META_BLOCK_SHADOW
              value: "0"
            - name: PGSSLROOTCERT
              value: /ssl/ca.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: ENVIRONMENT
              value: "testnet"
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: KAFKA_PASSWORD
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: KAFKA_SSL_CA_PEM
            - name: SUBSTREAMS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SUBSTREAMS_ENDPOINT
            - name: SUBSTREAMS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SUBSTREAMS_API_TOKEN
            # 0 = stream from genesis — safe on the fresh chain (non-numeric values are
            # silently ignored and fall back to the OLD testnet block 82655).
            # Deploy block of the self-owned SpaceRegistry (0xcf13491802747e759e1bb8e364bc43045398d1dd)
            # on chain 55516. MUST NOT be 0: the Substreams server enforces
            # limit-processed-blocks=10000 per request, so a start block of 0 against a chain
            # past ~10k blocks never begins streaming. It fails silently — the pod stays Running
            # and repeats one unchanging "Progress (Jobs: 0, Bytes: [...]) map_actions: 1000
            # blocks" line, produces nothing to Kafka, and logs no error. Re-tighten this
            # whenever the registry is redeployed.
            - name: SUBSTREAMS_START_BLOCK
              value: "14339"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_TRACES_SAMPLE_RATE
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_TRACES_SAMPLE_RATE
                  optional: true
            - name: SENTRY_SEND_DEFAULT_PII
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_SEND_DEFAULT_PII
                  optional: true
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_ENVIRONMENT
                  optional: true
            - name: SENTRY_RELEASE
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_RELEASE
                  optional: true
            - name: SENTRY_DEBUG
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_DEBUG
                  optional: true
            - name: AXIOM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: AXIOM_TOKEN
                  optional: true
            - name: AXIOM_DATASET
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: AXIOM_DATASET
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-pipeline
  namespace: gaia
  labels:
    app: hermes-pipeline
spec:
  type: ClusterIP
  selector:
    app: hermes-pipeline
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
