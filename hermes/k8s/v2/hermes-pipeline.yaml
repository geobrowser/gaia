apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-pipeline
  namespace: gaia-v2
  labels:
    app: hermes-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-pipeline
  template:
    metadata:
      labels:
        app: hermes-pipeline
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: ssl-certs
          emptyDir: {}
      nodeSelector:
        doks.digitalocean.com/node-pool: gaia-v2-pool
      tolerations:
        - key: dedicated
          value: gaia-v2
          effect: NoSchedule
      initContainers:
        - name: setup-certs
          image: registry.digitalocean.com/geo/hermes-pipeline:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "$DATABASE_SSL_CA" > /ssl/ca.crt
          env:
            - name: DATABASE_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_SSL_CA
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: hermes-pipeline
          image: registry.digitalocean.com/geo/hermes-pipeline:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
              readOnly: true
          env:
            - name: PGSSLROOTCERT
              value: /ssl/ca.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: ENVIRONMENT
              value: "testnet"
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: KAFKA_PASSWORD
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: KAFKA_SSL_CA_PEM
            - name: SUBSTREAMS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SUBSTREAMS_ENDPOINT
            - name: SUBSTREAMS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-ipfs-cache-secrets
                  key: SUBSTREAMS_API_TOKEN
            # 0 = stream from genesis — safe on the fresh chain (non-numeric values are
            # silently ignored and fall back to the OLD testnet block 82655).
            # Tighten to the V2 SpaceRegistry deploy block at deploy time (runbook Step 9).
            - name: SUBSTREAMS_START_BLOCK
              value: "0"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_TRACES_SAMPLE_RATE
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_TRACES_SAMPLE_RATE
                  optional: true
            - name: SENTRY_SEND_DEFAULT_PII
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_SEND_DEFAULT_PII
                  optional: true
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_ENVIRONMENT
                  optional: true
            - name: SENTRY_RELEASE
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_RELEASE
                  optional: true
            - name: SENTRY_DEBUG
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: SENTRY_DEBUG
                  optional: true
            - name: AXIOM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: AXIOM_TOKEN
                  optional: true
            - name: AXIOM_DATASET
              valueFrom:
                secretKeyRef:
                  name: hermes-pipeline-secrets
                  key: AXIOM_DATASET
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-pipeline
  namespace: gaia-v2
  labels:
    app: hermes-pipeline
spec:
  type: ClusterIP
  selector:
    app: hermes-pipeline
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
