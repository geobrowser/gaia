# OTEL credentials for hermes-pipeline
#
# To create the secret:
#   kubectl create secret generic hermes-pipeline-otel \
#     --namespace=knowledge \
#     --from-literal=OTEL_URL=<endpoint> \
#     --from-literal=OTEL_TOKEN=<token> \
#     --from-literal=OTEL_DATASET=hermes-pipeline
#
# DO NOT commit actual credentials to version control.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-pipeline-otel
  namespace: knowledge
type: Opaque
stringData:
  OTEL_URL: "<endpoint>"
  OTEL_TOKEN: "<token>"
  OTEL_DATASET: "hermes-pipeline"
