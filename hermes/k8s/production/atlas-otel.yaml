# Sentry credentials for atlas
#
# To create the secret:
#   kubectl create secret generic atlas-otel \
#     --namespace=kafka \
#     --from-literal=SENTRY_DSN=<dsn> \
#     --from-literal=SENTRY_TRACES_SAMPLE_RATE=1.0 \
#     --from-literal=SENTRY_SEND_DEFAULT_PII=false \
#     --from-literal=SENTRY_ENVIRONMENT=prod \
#     --from-literal=SENTRY_RELEASE=atlas@<version> \
#     --from-literal=SENTRY_DEBUG=false
#
# DO NOT commit actual credentials to version control.
apiVersion: v1
kind: Secret
metadata:
  name: atlas-otel
  namespace: kafka
type: Opaque
stringData:
  SENTRY_DSN: "<dsn>"
  SENTRY_TRACES_SAMPLE_RATE: "1.0"
  SENTRY_SEND_DEFAULT_PII: "false"
  SENTRY_ENVIRONMENT: "prod"
  SENTRY_RELEASE: "atlas@<version>"
  SENTRY_DEBUG: "false"
