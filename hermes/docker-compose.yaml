services:
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # Protobuf serde for space.creations topic
      kafka.clusters.0.serde.0.name: SpaceCreations
      kafka.clusters.0.serde.0.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.0.topicValuesPattern: "space.creations"
      kafka.clusters.0.serde.0.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.0.properties.protobufMessageName: space.HermesCreateSpace
      # Protobuf serde for space.trust.extensions topic
      kafka.clusters.0.serde.1.name: SpaceTrustExtensions
      kafka.clusters.0.serde.1.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.1.topicValuesPattern: "space.trust.extensions"
      kafka.clusters.0.serde.1.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.1.properties.protobufMessageName: space.HermesSpaceTrustExtension
      # Protobuf serde for knowledge.edits topic
      kafka.clusters.0.serde.2.name: KnowledgeEdits
      kafka.clusters.0.serde.2.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.2.topicValuesPattern: "knowledge.edits"
      kafka.clusters.0.serde.2.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.2.properties.protobufMessageName: knowledge.HermesEdit
      # Protobuf serde for topology.canonical topic
      kafka.clusters.0.serde.3.name: TopologyCanonical
      kafka.clusters.0.serde.3.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.3.topicValuesPattern: "topology.canonical"
      kafka.clusters.0.serde.3.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.3.properties.protobufMessageName: topology.CanonicalGraphUpdated
      # Protobuf serde for curation.scores topic
      kafka.clusters.0.serde.4.name: CurationScores
      kafka.clusters.0.serde.4.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.4.topicValuesPattern: "curation.scores"
      kafka.clusters.0.serde.4.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.4.properties.protobufMessageName: scoring.HermesScoresBatch
      # Protobuf serde for hermes.blocks topic
      kafka.clusters.0.serde.5.name: BlockSummary
      kafka.clusters.0.serde.5.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.5.topicValuesPattern: "hermes.blocks"
      kafka.clusters.0.serde.5.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.5.properties.protobufMessageName: block_summary.HermesBlockSummary
      # Protobuf serdes for space.membership topic
      kafka.clusters.0.serde.6.name: SpaceMembershipRoleGranted
      kafka.clusters.0.serde.6.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.6.topicValuesPattern: "space.membership"
      kafka.clusters.0.serde.6.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.6.properties.protobufMessageName: membership.HermesRoleGranted
      kafka.clusters.0.serde.7.name: SpaceMembershipRoleRevoked
      kafka.clusters.0.serde.7.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.7.topicValuesPattern: "space.membership"
      kafka.clusters.0.serde.7.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.7.properties.protobufMessageName: membership.HermesRoleRevoked
      kafka.clusters.0.serde.8.name: SpaceMembershipSpaceLeft
      kafka.clusters.0.serde.8.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.8.topicValuesPattern: "space.membership"
      kafka.clusters.0.serde.8.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.8.properties.protobufMessageName: membership.HermesSpaceLeft
      # Protobuf serdes for space.moderation topic
      kafka.clusters.0.serde.9.name: SpaceModerationEditorFlagged
      kafka.clusters.0.serde.9.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.9.topicValuesPattern: "space.moderation"
      kafka.clusters.0.serde.9.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.9.properties.protobufMessageName: moderation.HermesEditorFlagged
      kafka.clusters.0.serde.10.name: SpaceModerationEditorUnflagged
      kafka.clusters.0.serde.10.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.10.topicValuesPattern: "space.moderation"
      kafka.clusters.0.serde.10.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.10.properties.protobufMessageName: moderation.HermesEditorUnflagged
      kafka.clusters.0.serde.11.name: SpaceModerationContentFlagged
      kafka.clusters.0.serde.11.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.11.topicValuesPattern: "space.moderation"
      kafka.clusters.0.serde.11.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.11.properties.protobufMessageName: moderation.HermesContentFlagged
      kafka.clusters.0.serde.12.name: SpaceModerationContentUnflagged
      kafka.clusters.0.serde.12.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.12.topicValuesPattern: "space.moderation"
      kafka.clusters.0.serde.12.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.12.properties.protobufMessageName: moderation.HermesContentUnflagged
      # Protobuf serde for space.topics topic
      kafka.clusters.0.serde.13.name: SpaceTopicsDeclared
      kafka.clusters.0.serde.13.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.13.topicValuesPattern: "space.topics"
      kafka.clusters.0.serde.13.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.13.properties.protobufMessageName: topics.HermesTopicDeclared
      # Protobuf serdes for space.governance topic
      kafka.clusters.0.serde.14.name: GovernanceProposalCreated
      kafka.clusters.0.serde.14.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.14.topicValuesPattern: "space.governance"
      kafka.clusters.0.serde.14.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.14.properties.protobufMessageName: governance.HermesProposalCreated
      kafka.clusters.0.serde.15.name: GovernanceProposalUpdated
      kafka.clusters.0.serde.15.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.15.topicValuesPattern: "space.governance"
      kafka.clusters.0.serde.15.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.15.properties.protobufMessageName: governance.HermesProposalUpdated
      kafka.clusters.0.serde.16.name: GovernanceProposalVoted
      kafka.clusters.0.serde.16.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.16.topicValuesPattern: "space.governance"
      kafka.clusters.0.serde.16.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.16.properties.protobufMessageName: governance.HermesProposalVoted
      kafka.clusters.0.serde.17.name: GovernanceProposalExecuted
      kafka.clusters.0.serde.17.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.17.topicValuesPattern: "space.governance"
      kafka.clusters.0.serde.17.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.17.properties.protobufMessageName: governance.HermesProposalExecuted
      # Protobuf serde for curation.votes topic
      kafka.clusters.0.serde.18.name: CurationVotes
      kafka.clusters.0.serde.18.className: com.provectus.kafka.ui.serdes.builtin.ProtobufFileSerde
      kafka.clusters.0.serde.18.topicValuesPattern: "curation.votes"
      kafka.clusters.0.serde.18.properties.protobufFilesDir: /proto/
      kafka.clusters.0.serde.18.properties.protobufMessageName: voting.HermesVoteCast
    volumes:
      - ../wire/proto/grc20.proto:/proto/grc20.proto:ro
      - ../hermes-schema/proto/block_summary.proto:/proto/block_summary.proto:ro
      - ../hermes-schema/proto/blockchain_metadata.proto:/proto/blockchain_metadata.proto:ro
      - ../hermes-schema/proto/governance.proto:/proto/governance.proto:ro
      - ../hermes-schema/proto/knowledge.proto:/proto/knowledge.proto:ro
      - ../hermes-schema/proto/membership.proto:/proto/membership.proto:ro
      - ../hermes-schema/proto/moderation.proto:/proto/moderation.proto:ro
      - ../hermes-schema/proto/scoring.proto:/proto/scoring.proto:ro
      - ../hermes-schema/proto/space.proto:/proto/space.proto:ro
      - ../hermes-schema/proto/topics.proto:/proto/topics.proto:ro
      - ../hermes-schema/proto/topology.proto:/proto/topology.proto:ro
      - ../hermes-schema/proto/voting.proto:/proto/voting.proto:ro
    depends_on:
      kafka:
        condition: service_healthy

  hermes-pipeline:
    build:
      context: ..
      dockerfile: hermes-pipeline/Dockerfile
    environment:
      KAFKA_BROKER: kafka:29092
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_DEBUG: ${SENTRY_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/postgres}
      SUBSTREAMS_ENDPOINT: ${SUBSTREAMS_ENDPOINT:-http://host.docker.internal:9000}
      SUBSTREAMS_START_BLOCK: ${SUBSTREAMS_START_BLOCK:-0}
      SUBSTREAMS_END_BLOCK: ${SUBSTREAMS_END_BLOCK:-0}
    depends_on:
      kafka:
        condition: service_healthy

  atlas:
    build:
      context: ..
      dockerfile: atlas/Dockerfile
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: topology.canonical
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_DEBUG: ${SENTRY_DEBUG:-false}
    depends_on:
      kafka:
        condition: service_healthy

  ipfs-cache-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ipfs_cache
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ipfs-cache-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ipfs_cache"]
      interval: 5s
      timeout: 5s
      retries: 5

  hermes-ipfs-cache:
    build:
      context: ..
      dockerfile: hermes-ipfs-cache/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@ipfs-cache-postgres:5432/ipfs_cache
      IPFS_GATEWAY: https://gateway.ipfs.io/ipfs/
      SUBSTREAMS_ENDPOINT: ${SUBSTREAMS_ENDPOINT}
      SUBSTREAMS_API_TOKEN: ${SUBSTREAMS_API_TOKEN}
      START_BLOCK: ${START_BLOCK:-0}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_DEBUG: ${SENTRY_DEBUG:-false}
      RUST_LOG: info,hermes_ipfs_cache=debug
    depends_on:
      ipfs-cache-postgres:
        condition: service_healthy

volumes:
  kafka-data:
  ipfs-cache-data:
