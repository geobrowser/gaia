specVersion: v0.1.0
package:
  name: "hermes_substream"
  version: v0.1.0

protobuf:
  files:
    - schema.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/hermes_substream.wasm

modules:
  - name: hermes_out
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:hermes.HermesOutput

network: polygon
