[package]
name = "atlas"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "atlas"
path = "src/main.rs"

[[bench]]
name = "transitive"
harness = false

[[bench]]
name = "canonical"
harness = false

[dependencies]
hermes-instrumentation = { path = "../hermes-instrumentation" }
hermes-kafka = { path = "../hermes-kafka" }
hermes-relay = { path = "../hermes-relay" }
hermes-schema = { path = "../hermes-schema" }
hex = "0.4"
prost = "0.13.5"
rdkafka = { version = "0.36", features = ["cmake-build", "zstd", "ssl"] }
# Chain-tip polling for the substream stall detector. Mirrors
# chain-tip-exporter's feature set so both hit the same RPC the same way.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
dotenvy = "0.15"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "graph_diff"
harness = false
