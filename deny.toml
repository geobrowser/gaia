# cargo-deny configuration — supply-chain advisories/bans/sources for the Rust workspace.
# Run locally and in CI: `cargo deny check advisories bans sources`
# (.github/workflows/cargo-deny.yml)

[graph]
# Check the default feature set / host target — i.e. what actually ships. Deps
# behind disabled features (e.g. rsa, quinn-proto) therefore aren't flagged.
all-features = false

[advisories]
version = 2
# Baseline of advisories accepted as of this PR. Only pre-existing
# unmaintained/unsound advisories on transitive deps are ignored, plus ONE
# vulnerability with a written exposure argument and a removal condition
# (RUSTSEC-2026-0459 below), so a newly-introduced vulnerable crate still
# fails CI. Revisit as the parents upgrade.
#
# RUSTSEC-2023-0071 (rsa — Marvin timing side-channel) is deliberately NOT
# ignored: it has no upstream fix, but `rsa` is feature-gated out of the default
# build graph, so cargo-deny doesn't flag it today. Leaving it un-ignored means
# that if `rsa` ever enters the shipped graph, CI fails and forces a fresh
# decision — rather than a global ignore silently masking a no-fix vulnerability.
ignore = [
    # Unmaintained (transitive, no action available without upstreams moving):
    "RUSTSEC-2021-0141", # dotenv unmaintained (use dotenvy — follow-up)
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained
    "RUSTSEC-2026-0173", # rustls-pemfile unmaintained
    # Unsound (transitive, low-severity):
    # RUSTSEC-2026-0002 (lru IterMut) and RUSTSEC-2026-0012 (keccak) went away with
    # the lru 0.18 and keccak 0.1.6 upgrades below — cargo-deny reported them as
    # `advisory-not-detected` afterwards, i.e. dead config.
    "RUSTSEC-2026-0097", # rand unsound (custom-logger edge case)
    # Vulnerability, accepted with a removal condition:
    # RUSTSEC-2026-0459 (bundled SQLite < 3.54 can return uninitialized page-cache
    # memory when it opens a database + `-wal` that a less trusted party wrote).
    # The only user is search-indexer's relation map (rusqlite 0.32), which opens
    # a file on its own pod volume that only it writes, so the exposed case cannot
    # arise. The fix (libsqlite3-sys >= 0.39, rusqlite >= 0.39) cannot resolve
    # alongside sqlx 0.8, whose optional sqlx-sqlite pins libsqlite3-sys 0.30 via
    # `links = "sqlite3"`. REMOVE this line with the sqlx 0.9 upgrade.
    "RUSTSEC-2026-0459",
]

[bans]
# Duplicate/incompatible version pairings (the class behind the time/sentry-types
# E0119) — surfaced as warnings to start; tighten to "deny" once cleaned up.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
