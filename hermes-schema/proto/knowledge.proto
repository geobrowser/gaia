syntax = "proto3";

package knowledge;

import "grc20.proto";

message HermesEdit {
  bytes id = 1;
  string name = 2;
  repeated grc20.Op ops = 3;
  repeated bytes authors = 4;
  optional bytes language = 5;
  // Space Topology metadata
  string space_id = 6;
  bool is_canonical = 7;
  // Blockchain Metadata
  string created_at = 8;
  bytes created_by = 9;
  uint64 block_number = 10;
  string cursor = 11;
}
