syntax = "proto3";

package topology;

import "blockchain_metadata.proto";

// Emitted when the canonical graph changes.
// The canonical graph represents the "trusted" portion of the topology,
// where trust flows only through explicit edges (Verified, Related).
message CanonicalGraphUpdated {
  // Root space this graph was computed from
  bytes root_id = 1;

  // Tree representation with edge metadata.
  // The tree structure preserves distance from root, which matters
  // for downstream consumers.
  CanonicalTreeNode tree = 2;

  // Flat set of all canonical space IDs.
  // Useful for quick membership checks without traversing the tree.
  repeated bytes canonical_space_ids = 3;

  // Block metadata from the event that triggered this update
  blockchain_metadata.BlockchainMetadata meta = 4;
}

// A node in the canonical tree.
// Represents a space and how it was reached from its parent.
message CanonicalTreeNode {
  // The space this node represents
  bytes space_id = 1;

  // How this node was reached from its parent.
  // Uses oneof to enforce that topic_id is only present for topic edges.
  oneof edge {
    // Root node has no incoming edge
    RootEdge root = 2;

    // Verified trust relationship (explicit edge)
    VerifiedEdge verified = 3;

    // Related trust relationship (explicit edge)
    RelatedEdge related = 4;

    // Topic-based membership (resolved from SubtopicExtension)
    TopicEdge topic = 5;

    // Editor membership in a DAO (canonical-granting)
    EditorEdge editor = 6;

    // Member membership in a DAO (canonical-granting)
    MemberEdge member = 7;
  }

  // Children of this node in the traversal
  repeated CanonicalTreeNode children = 8;
}

// Root node edge - no additional data needed
message RootEdge {}

// Verified trust relationship edge - no additional data needed
message VerifiedEdge {}

// Related trust relationship edge - no additional data needed  
message RelatedEdge {}

// Topic-based membership edge - includes the topic ID
message TopicEdge {
  // The topic through which this space was reached
  bytes topic_id = 1;
}

// Editor membership edge - no additional data needed
message EditorEdge {}

// Member membership edge - no additional data needed
message MemberEdge {}

// =============================================================================
// Graph Diff Messages (RFC 0002)
// =============================================================================

// Incremental diff for canonical graph changes.
// Replaces full CanonicalGraphUpdated snapshots with efficient diffs.
message CanonicalGraphDiff {
  // Root space this diff applies to
  bytes root_id = 1;

  // List of node changes (ADDED, REMOVED, MOVED)
  repeated NodeChange changes = 2;

  // Block metadata from the event that triggered this diff
  blockchain_metadata.BlockchainMetadata meta = 3;
}

// A single node change in a diff
message NodeChange {
  // The space that changed
  bytes space_id = 1;

  // Type of change
  ChangeType change_type = 2;

  // Distance from root (present for ADDED/MOVED)
  optional uint32 distance = 3;

  // Information about the edge used to reach this node (present for ADDED/MOVED)
  optional EdgeInfo parent_edge = 4;
}

// Information about the edge connecting a node to its parent
message EdgeInfo {
  // Parent node's space_id
  bytes parent_id = 1;

  // Type of edge used to reach the node
  oneof edge_type {
    VerifiedEdge verified = 2;
    RelatedEdge related = 3;
    TopicEdge topic = 4;
    EditorEdge editor = 5;
    MemberEdge member = 6;
  }
}

// Type of change in a diff
enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_ADDED = 1;
  CHANGE_TYPE_REMOVED = 2;
  CHANGE_TYPE_MOVED = 3;
}
