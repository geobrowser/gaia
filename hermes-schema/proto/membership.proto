syntax = "proto3";

package membership;

import "blockchain_metadata.proto";

// Role types for membership changes
enum MembershipRole {
  EDITOR = 0;
  MEMBER = 1;
}

// HermesRoleGranted - editor or member added to a space
// ZC16: topic = bytes32(memberSpaceId), data = abi.encode(memberAddress)
message HermesRoleGranted {
  bytes space_id = 1;           // 16 bytes - space granting role (from_id)
  bytes account = 2;            // 20 bytes - address receiving role (from data)
  MembershipRole role = 3;      // EDITOR or MEMBER
  blockchain_metadata.BlockchainMetadata meta = 4;
  bytes member_space_id = 5;    // 16 bytes - member's space ID (from topic)
}

// HermesRoleRevoked - editor or member removed from a space
// ZC16: topic = bytes32(memberSpaceId), data = abi.encode(memberAddress)
message HermesRoleRevoked {
  bytes space_id = 1;           // 16 bytes - space revoking role (from_id)
  bytes account = 2;            // 20 bytes - address losing role (from data)
  MembershipRole role = 3;      // EDITOR or MEMBER
  blockchain_metadata.BlockchainMetadata meta = 4;
  bytes member_space_id = 5;    // 16 bytes - member's space ID (from topic)
}

// HermesSpaceLeft - member voluntarily left a space
message HermesSpaceLeft {
  bytes member_id = 1;          // 16 bytes - member's space ID
  bytes space_id = 2;           // 16 bytes - space being left
  blockchain_metadata.BlockchainMetadata meta = 3;
}
