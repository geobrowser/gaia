syntax = "proto3";

package moderation;

import "blockchain_metadata.proto";

// HermesEditorFlagged - editor restricted from fast path
// ZC16: topic = bytes32(editorSpaceId), data = abi.encode(editorAddress)
message HermesEditorFlagged {
  bytes space_id = 1;              // 16 bytes - DAO space where action occurs (from_id)
  bytes editor_account = 2;        // 20 bytes - editor's account address (from data)
  blockchain_metadata.BlockchainMetadata meta = 3;
  bytes editor_space_id = 4;       // 16 bytes - editor's space ID (from topic)
}

// HermesEditorUnflagged - editor unrestricted from fast path
// ZC16: topic = bytes32(editorSpaceId), data = abi.encode(editorAddress)
message HermesEditorUnflagged {
  bytes space_id = 1;              // 16 bytes - DAO space where action occurs (from_id)
  bytes editor_account = 2;        // 20 bytes - editor's account address (from data)
  blockchain_metadata.BlockchainMetadata meta = 3;
  bytes editor_space_id = 4;       // 16 bytes - editor's space ID (from topic)
}

// HermesContentFlagged - content flagged by a space
// Topic field: bytes32(TOPIC_UUID) - optional
// Data encoding: abi.encode(bytes(flaggedUri))
message HermesContentFlagged {
  bytes flagger_id = 1;         // 16 bytes - space flagging content
  bytes target_space_id = 2;    // 16 bytes - space whose content is flagged
  bytes topic_id = 3;           // 32 bytes - optional topic UUID
  string uri = 4;               // Decoded URI of flagged content
  blockchain_metadata.BlockchainMetadata meta = 5;
}

// HermesContentUnflagged - content unflagged by a space
// Topic field: bytes32(TOPIC_UUID) - optional
// Data encoding: abi.encode(bytes(unflaggedUri))
message HermesContentUnflagged {
  bytes unflagger_id = 1;       // 16 bytes - space unflagging content
  bytes target_space_id = 2;    // 16 bytes - space whose content is unflagged
  bytes topic_id = 3;           // 32 bytes - optional topic UUID
  string uri = 4;               // Decoded URI of unflagged content
  blockchain_metadata.BlockchainMetadata meta = 5;
}
