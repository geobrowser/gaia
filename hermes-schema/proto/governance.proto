syntax = "proto3";

package governance;

import "blockchain_metadata.proto";

// Voting mode for proposals
enum VotingMode {
  VOTING_MODE_FAST = 0;   // Fast path - threshold-based, immediate execution
  VOTING_MODE_SLOW = 1;   // Slow path - majority voting with voting window
}

// Vote option for governance proposals
enum ProposalVoteOption {
  VOTE_OPTION_NONE = 0;
  VOTE_OPTION_YES = 1;
  VOTE_OPTION_NO = 2;
  VOTE_OPTION_ABSTAIN = 3;
}

// Type of action in a proposal, decoded from calldata function selector
enum ProposalActionType {
  PROPOSAL_ACTION_UNKNOWN = 0;
  PROPOSAL_ACTION_ADD_MEMBER = 1;
  PROPOSAL_ACTION_REMOVE_MEMBER = 2;
  PROPOSAL_ACTION_ADD_EDITOR = 3;
  PROPOSAL_ACTION_REMOVE_EDITOR = 4;
  PROPOSAL_ACTION_PUBLISH = 5;
  PROPOSAL_ACTION_FLAG = 6;
  PROPOSAL_ACTION_UNFLAG = 7;
  PROPOSAL_ACTION_UNFLAG_EDITOR = 8;
  PROPOSAL_ACTION_UPDATE_VOTING_SETTINGS = 9;
  reserved 10;  // Was PROPOSAL_ACTION_PING — never emitted, now sub-classified into 11-16
  PROPOSAL_ACTION_SUBSPACE_VERIFIED = 11;
  PROPOSAL_ACTION_SUBSPACE_UNVERIFIED = 12;
  PROPOSAL_ACTION_SUBSPACE_RELATED = 13;
  PROPOSAL_ACTION_SUBSPACE_UNRELATED = 14;
  PROPOSAL_ACTION_SUBSPACE_TOPIC_DECLARED = 15;
  PROPOSAL_ACTION_SUBSPACE_TOPIC_REMOVED = 16;
  PROPOSAL_ACTION_SET_TOPIC = 17;
  PROPOSAL_ACTION_UNSET_TOPIC = 18;
}

// Decoded action: add a member to the space
message AddMemberAction {
  bytes target_address = 1;  // 20 bytes - address to add as member
}

// Decoded action: remove a member from the space
message RemoveMemberAction {
  bytes target_address = 1;  // 20 bytes - address to remove
}

// Decoded action: add an editor to the space
message AddEditorAction {
  bytes target_address = 1;  // 20 bytes - address to add as editor
}

// Decoded action: remove an editor from the space
message RemoveEditorAction {
  bytes target_address = 1;  // 20 bytes - address to remove
}

// Decoded action: unflag an editor
message UnflagEditorAction {
  bytes target_address = 1;  // 20 bytes - editor address to unflag
}

// Decoded action: publish content
message PublishAction {
  string content_uri = 1;  // Content URI (IPFS hash)
  bytes metadata = 2;      // Edit metadata
  string name = 3;         // Edit name (extracted from IPFS cache)
}

// Decoded action: flag content
message FlagAction {
  bytes content_id = 1;  // Content identifier being flagged
}

// Decoded action: unflag content
message UnflagAction {
  bytes content_id = 1;  // Content identifier being unflagged
}

// Decoded action: update voting settings (V2 — 7 fields matching contract VotingSettings)
message UpdateVotingSettingsAction {
  reserved 1, 2, 3, 4;
  reserved "fast_threshold", "slow_threshold";
  uint64 partial_percentage_support_threshold = 5;      // Slow path late execution (0..RATIO_BASE)
  uint64 universal_percentage_support_threshold = 6;    // Slow path early execution (0..RATIO_BASE)
  uint64 flat_support_threshold = 7;                    // Fast path absolute YES votes
  uint64 quorum = 8;                                    // Minimum participating votes for slow path
  uint64 duration = 9;                                  // Voting window duration in seconds
  bool disable_fast_path_access_for_new_members = 10;   // Whether new members get fast-path access
  uint64 execution_grace_period = 11;                   // Seconds after lastDate that execution is allowed
}

// Decoded action: subspace edge operation (add/remove verified or related edge)
// The specific operation type is determined by the ProposalActionType enum value.
message SubspaceEdgeAction {
  bytes target_space_id = 1;  // 16 bytes - target child space
}

// Decoded action: subspace topic operation (declare/remove topic)
// The specific operation type is determined by the ProposalActionType enum value.
message SubspaceTopicAction {
  bytes target_topic_id = 1;  // 16 bytes - topic entity ID
}

// Decoded action: set the space topic
message SetTopicAction {
  bytes target_topic_id = 1;  // 16 bytes - topic entity ID
}

// Decoded action: unset the current space topic
message UnsetTopicAction {
  bytes target_topic_id = 1;  // 16 bytes - topic entity ID
}

// Action to be executed when proposal passes
message ProposalAction {
  bytes to = 1;        // 20 bytes - target contract address
  bytes value = 2;     // 32 bytes - uint256 ETH value to send
  bytes data = 3;      // calldata (function selector + encoded args)

  // Decoded action (based on function selector in calldata)
  oneof action {
    AddMemberAction add_member = 10;
    RemoveMemberAction remove_member = 11;
    AddEditorAction add_editor = 12;
    RemoveEditorAction remove_editor = 13;
    UnflagEditorAction unflag_editor = 14;
    PublishAction publish = 15;
    FlagAction flag = 16;
    UnflagAction unflag = 17;
    UpdateVotingSettingsAction update_voting_settings = 18;
    SubspaceEdgeAction subspace_verified = 19;
    SubspaceEdgeAction subspace_unverified = 20;
    SubspaceEdgeAction subspace_related = 21;
    SubspaceEdgeAction subspace_unrelated = 22;
    SubspaceTopicAction subspace_topic_declared = 23;
    SubspaceTopicAction subspace_topic_removed = 24;
    SetTopicAction set_topic = 25;
    UnsetTopicAction unset_topic = 26;
  }
}

// Voting settings for a proposal, from PROPOSAL_SETTINGS_SELECTED event.
// V2 — 8 fields matching contract ProposalParameters, with per-proposal executeBy.
message ProposalSettings {
  reserved 1, 2, 3, 4, 5, 6;
  reserved "flat_threshold", "percentage_threshold";
  VotingMode voting_mode = 7;                           // Slow (0) or Fast (1)
  uint64 partial_percentage_support_threshold = 8;      // Slow path late execution (0..RATIO_BASE)
  uint64 universal_percentage_support_threshold = 9;    // Slow path early execution (0..RATIO_BASE)
  uint64 flat_support_threshold = 10;                   // Fast path absolute YES votes
  uint64 quorum = 11;                                   // Minimum participating votes for slow path
  uint64 start_date = 12;                               // Block timestamp when voting starts
  uint64 last_date = 13;                                // Block timestamp when voting ends
  uint64 execute_by = 14;                               // Inclusive upper bound timestamp for execution
}

// HermesProposalCreated - squashed from PROPOSAL_CREATED + PROPOSAL_SETTINGS_USED
// Contains all actions in a single message with voting settings.
// Data encoding: abi.encode(bytes16 proposalId, VotingMode, Action[])
// Note: If PROPOSAL_SETTINGS_USED is missing, both events should be discarded with an error.
message HermesProposalCreated {
  bytes space_id = 1;                                   // 16 bytes - space owning the proposal (to_id)
  bytes proposer_id = 2;                                // 16 bytes - space creating the proposal (from_id)
  bytes proposal_id = 3;                                // 16 bytes - unique proposal identifier
  VotingMode voting_mode = 4;                           // Fast or Slow path
  repeated ProposalAction actions = 5;                  // All actions in the proposal
  ProposalSettings settings = 6;                        // Voting settings (from PROPOSAL_SETTINGS_USED)
  blockchain_metadata.BlockchainMetadata meta = 10;
}

// HermesProposalUpdated - squashed from PROPOSAL_UPDATED + PROPOSAL_SETTINGS_USED
// Contains all actions in a single message with voting settings.
// Data encoding: abi.encode(bytes16 proposalId, VotingMode, Action[])
// Note: If PROPOSAL_SETTINGS_USED is missing, both events should be discarded with an error.
message HermesProposalUpdated {
  bytes space_id = 1;                                   // 16 bytes - space owning the proposal (to_id)
  bytes proposer_id = 2;                                // 16 bytes - space updating the proposal (from_id)
  bytes proposal_id = 3;                                // 16 bytes - unique proposal identifier
  VotingMode voting_mode = 4;                           // Fast or Slow path
  repeated ProposalAction actions = 5;                  // All actions in the proposal
  ProposalSettings settings = 6;                        // Voting settings (from PROPOSAL_SETTINGS_USED)
  blockchain_metadata.BlockchainMetadata meta = 10;
}

// HermesProposalVoted - emitted when a vote is cast on a proposal
// Data encoding: abi.encode(bytes16 proposalId, uint8 proposalVersion, VoteOption)
message HermesProposalVoted {
  bytes voter_id = 1;                                   // 16 bytes - space casting the vote (from from_id)
  bytes space_id = 2;                                   // 16 bytes - space that owns the proposal (from to_id)
  bytes proposal_id = 3;                                // 16 bytes - proposal being voted on
  ProposalVoteOption vote = 4;                          // The vote cast
  blockchain_metadata.BlockchainMetadata meta = 5;
  uint32 proposal_version = 6;                          // Proposal version being voted on (uint8 on-chain)
}

// HermesProposalExecuted - emitted when a passed proposal is executed
// Data encoding: abi.encode(bytes16 proposalId)
message HermesProposalExecuted {
  bytes space_id = 1;                                   // 16 bytes - space executing the proposal
  bytes proposal_id = 2;                                // 16 bytes - executed proposal identifier
  blockchain_metadata.BlockchainMetadata meta = 3;
}

// HermesProposalSettingsUpdated - emitted for orphaned PROPOSAL_SETTINGS_SELECTED events.
// This occurs when a NO vote on a fast-path proposal escalates it to slow path:
// the contract emits PROPOSAL_SETTINGS_SELECTED (via ping) with new settings but
// does NOT emit PROPOSAL_UPDATED. The pipeline detects these orphaned settings and
// emits them as a settings-only update so the indexer can update the proposal in place.
message HermesProposalSettingsUpdated {
  bytes space_id = 1;                                   // 16 bytes - space owning the proposal (from_id)
  bytes proposal_id = 2;                                // 16 bytes - proposal identifier
  ProposalSettings settings = 3;                        // Updated voting settings
  blockchain_metadata.BlockchainMetadata meta = 4;
}

// HermesVotingSettingsUpdated - emitted when DAO-global voting settings change.
// Data encoding: abi.encode(VotingSettings) — the full 7-field V2 struct.
// Subject topic is bytes32(0) since this is a space-level (not proposal-level) event.
message HermesVotingSettingsUpdated {
  bytes space_id = 1;                                   // 16 bytes - space whose settings changed (from_id)
  uint64 partial_percentage_support_threshold = 2;      // Slow path late execution threshold (0..RATIO_BASE)
  uint64 universal_percentage_support_threshold = 3;    // Slow path early execution threshold (0..RATIO_BASE)
  uint64 flat_support_threshold = 4;                    // Fast path absolute YES votes needed
  uint64 quorum = 5;                                    // Minimum participating votes for slow path
  uint64 duration = 6;                                  // Voting window duration in seconds
  bool disable_fast_path_access_for_new_members = 7;    // Whether newly added members get fast-path access
  uint64 execution_grace_period = 8;                    // Seconds after lastDate that execution is allowed
  blockchain_metadata.BlockchainMetadata meta = 9;
}
