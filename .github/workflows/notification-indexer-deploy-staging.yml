name: Deploy Notification Indexer (Staging)

on:
  push:
    branches:
      - dev
    paths:
      - 'notification-service/notification-indexer/**'
      - 'notification-service/deployment/staging/notification-indexer.yaml'
      - 'notification-service/deployment/staging/namespace.yaml'
      - 'hermes-schema/**'
      - 'hermes-kafka/**'
      - '.github/workflows/notification-indexer-deploy-staging.yml'

concurrency:
  group: notification-indexer-staging
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: notification-indexer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install doctl
        uses: digitalocean/action-doctl@6374d029dfd5f449281f186d65663779c706c994 # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging \
                       -f notification-service/notification-indexer/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

      - name: Set up kubectl
        uses: azure/setup-kubectl@15650b3ad78fff148532a140b8a4c821796b2d7b # v5.0.0

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f notification-service/deployment/staging/namespace.yaml
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/notification-indexer:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' notification-service/deployment/staging/notification-indexer.yaml
          kubectl apply -f notification-service/deployment/staging/notification-indexer.yaml

      - name: Restart deployment to pick up new image
        run: |
          kubectl rollout restart deployment/notification-indexer -n notifications-staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/notification-indexer -n notifications-staging --timeout=120s

      - name: Show deployment status
        run: |
          echo "=== Notification Indexer Deployment ==="
          kubectl get deployment notification-indexer -n notifications-staging
          echo ""
          echo "=== Notification Indexer Pods ==="
          kubectl get pods -n notifications-staging -l app=notification-indexer
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n notifications-staging --sort-by='.lastTimestamp' | grep notification-indexer | tail -10 || true
