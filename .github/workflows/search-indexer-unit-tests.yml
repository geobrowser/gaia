name: Search Indexer Unit Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'search-indexer/**'
      - 'search-indexer-repository/**'
      - 'hermes-schema/**'
      - 'hermes-kafka/**'
      - 'wire/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'search-indexer/**'
      - 'search-indexer-repository/**'
      - 'hermes-schema/**'
      - 'hermes-kafka/**'
      - 'wire/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            cmake \
            libclang-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run search-indexer unit tests
        run: cargo test -p search-indexer -p search-indexer-repository
        env:
          RUST_BACKTRACE: 1

      - name: Run clippy
        run: cargo clippy -p search-indexer -p search-indexer-repository -- -D warnings
