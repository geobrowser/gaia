name: API Check

on:
  push:
    branches: [main, dev]
    paths:
      - 'api/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'api/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      
      - name: Install dependencies
        run: bun install
        
      - name: Check formatting
        run: bun run format:check
        
      - name: Run linter
        run: bun run lint
        
      - name: Type check
        run: bun run check