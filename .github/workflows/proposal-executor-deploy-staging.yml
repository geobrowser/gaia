name: Deploy Proposal Executor (Staging)

on:
  push:
    branches:
      - dev
    paths:
      - 'proposal-executor/**'
      - '.github/workflows/proposal-executor-deploy-staging.yml'

concurrency:
  group: proposal-executor-staging
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: proposal-executor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging \
                       -f proposal-executor/Dockerfile proposal-executor
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

      - name: Set up kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/proposal-executor:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' proposal-executor/deployment/staging/cronjob.yaml
          kubectl apply -f proposal-executor/deployment/staging/cronjob.yaml

      - name: Show deployment status
        run: |
          echo "=== Proposal Executor CronJob (Staging) ==="
          kubectl get cronjob proposal-executor -n knowledge || echo "CronJob not found"
          echo ""
          echo "=== Recent Jobs ==="
          kubectl get jobs -n knowledge -l app.kubernetes.io/name=proposal-executor --sort-by='.metadata.creationTimestamp' | tail -5
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n knowledge --sort-by='.lastTimestamp' | tail -10
