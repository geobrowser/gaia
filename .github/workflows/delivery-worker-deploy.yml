name: Deploy Delivery Worker (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'notification-service/delivery-worker/**'
      - 'notification-service/deployment/production/delivery-worker.yaml'
      - 'notification-service/deployment/production/namespace.yaml'
      - '.github/workflows/delivery-worker-deploy.yml'

concurrency:
  group: delivery-worker-production
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: delivery-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -f notification-service/delivery-worker/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@15650b3ad78fff148532a140b8a4c821796b2d7b # v5.0.0

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f notification-service/deployment/production/namespace.yaml
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/delivery-worker:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' notification-service/deployment/production/delivery-worker.yaml
          kubectl apply -f notification-service/deployment/production/delivery-worker.yaml

      - name: Restart deployment to pick up new image
        run: |
          kubectl rollout restart deployment/delivery-worker -n notifications

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/delivery-worker -n notifications --timeout=120s

      - name: Show deployment status
        run: |
          echo "=== Delivery Worker Deployment ==="
          kubectl get deployment delivery-worker -n notifications
          echo ""
          echo "=== Delivery Worker Pods ==="
          kubectl get pods -n notifications -l app=delivery-worker
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n notifications --sort-by='.lastTimestamp' | grep delivery-worker | tail -10 || true
