name: Atlas Unit Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'atlas/**'
      - 'hermes-relay/**'
      - 'hermes-substream/**'
      - 'stream/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'atlas/**'
      - 'hermes-relay/**'
      - 'hermes-substream/**'
      - 'stream/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          libclang-dev \
          libcurl4-openssl-dev \
          libssl-dev \
          pkg-config

    - name: Cache cargo registry
      uses: actions/cache@v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Run unit tests
      run: cargo test --lib --bins -- --test-threads=1
      working-directory: ./atlas
      env:
        RUST_BACKTRACE: 1

    - name: Run doc tests
      run: cargo test --doc -- --test-threads=1
      working-directory: ./atlas
      env:
        RUST_BACKTRACE: 1

    - name: Check benchmarks compile
      run: cargo build --benches
      working-directory: ./atlas
