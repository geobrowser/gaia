name: Deploy Atlas

on:
  push:
    branches:
      - main
    paths:
      - 'atlas/**'
      - 'hermes-schema/**'
      - 'wire/**'
      - 'hermes/k8s/atlas.yaml'
      - '.github/workflows/atlas-deploy.yml'

env:
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: atlas

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -f atlas/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Apply k8s manifests
        run: |
          kubectl apply -k hermes/k8s

      - name: Restart atlas deployment
        run: |
          kubectl rollout restart deployment/atlas -n kafka

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/atlas -n kafka --timeout=120s

      - name: Show deployment status
        run: |
          echo "=== Atlas Deployment ==="
          kubectl get deployment atlas -n kafka
          echo ""
          echo "=== Atlas Pods ==="
          kubectl get pods -n kafka -l app=atlas
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n kafka --sort-by='.lastTimestamp' | tail -10
