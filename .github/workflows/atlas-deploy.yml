name: Deploy Atlas (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'atlas/**'
      - 'hermes-instrumentation/**'
      - 'hermes-relay/**'
      - 'hermes-schema/**'
      - 'hermes-substream/**'
      - 'stream/**'
      - 'wire/**'
      - 'hermes/k8s/production/atlas.yaml'
      - 'hermes/k8s/production/atlas-monitoring.yaml'
      - '.github/workflows/atlas-deploy.yml'

concurrency:
  group: atlas-production
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: atlas

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -f atlas/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Cleanup old atlas workload locations
        run: |
          kubectl delete job atlas -n kafka --ignore-not-found=true
          kubectl delete deployment atlas -n kafka --ignore-not-found=true
          kubectl delete job atlas -n knowledge --ignore-not-found=true

      - name: Deploy to Kubernetes
        run: |
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/atlas:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' hermes/k8s/production/atlas.yaml
          kubectl apply -f hermes/k8s/production/atlas.yaml
          kubectl apply -f hermes/k8s/production/atlas-monitoring.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/atlas -n knowledge --timeout=180s

      - name: Show deployment status
        run: |
          echo "=== Atlas Deployment ==="
          kubectl get deployment atlas -n knowledge || echo "Deployment not found"
          echo ""
          echo "=== Atlas Pods ==="
          kubectl get pods -n knowledge -l app=atlas
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n knowledge --sort-by='.lastTimestamp' | tail -10
