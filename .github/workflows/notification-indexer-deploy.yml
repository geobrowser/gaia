name: Deploy Notification Indexer (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'notification-service/notification-indexer/**'
      - 'notification-service/deployment/production/notification-indexer.yaml'
      - 'notification-service/deployment/production/namespace.yaml'
      - 'hermes-schema/**'
      - 'hermes-kafka/**'
      - 'wire/**'
      - '.github/workflows/notification-indexer-deploy.yml'

concurrency:
  group: notification-indexer-production
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: notification-indexer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -f notification-service/notification-indexer/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f notification-service/deployment/production/namespace.yaml
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/notification-indexer:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' notification-service/deployment/production/notification-indexer.yaml
          kubectl apply -f notification-service/deployment/production/notification-indexer.yaml

      - name: Restart deployment to pick up new image
        run: |
          kubectl rollout restart deployment/notification-indexer -n notifications

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/notification-indexer -n notifications --timeout=120s

      - name: Show deployment status
        run: |
          echo "=== Notification Indexer Deployment ==="
          kubectl get deployment notification-indexer -n notifications
          echo ""
          echo "=== Notification Indexer Pods ==="
          kubectl get pods -n notifications -l app=notification-indexer
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n notifications --sort-by='.lastTimestamp' | grep notification-indexer | tail -10 || true
