name: geodb-feeder Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'geodb-feeder/**'
      - '.github/workflows/geodb-feeder-tests.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # For pgSource.votes.test.ts: the votes backfill's keyset paging against a real Postgres (ICU collation).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./geodb-feeder

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: geodb-feeder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Run tests
        run: npm test
        env:
          GEODB_FEEDER_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: npm run build
