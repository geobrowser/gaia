name: Delivery Worker Unit Tests

on:
  workflow_dispatch:
  push:
    branches: [main, dev, feat/notification-service]  # TODO: remove feat branch before merge
    paths:
      - 'notification-service/delivery-worker/**'
      - '.github/workflows/delivery-worker-tests.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'notification-service/delivery-worker/**'
      - '.github/workflows/delivery-worker-tests.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.92.0"
          components: clippy, rustfmt

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            cmake \
            libclang-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -p delivery-worker --check

      - name: Run clippy
        run: cargo clippy -p delivery-worker -- -D warnings

      - name: Run unit tests
        run: cargo test -p delivery-worker
        env:
          RUST_BACKTRACE: 1
