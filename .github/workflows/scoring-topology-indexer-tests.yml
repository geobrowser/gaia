name: Scoring Topology Indexer Unit Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'scoring-service/topology-indexer/**'
      - 'hermes-schema/**'
      - 'wire/**'
      - '.github/workflows/scoring-topology-indexer-tests.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'scoring-service/topology-indexer/**'
      - 'hermes-schema/**'
      - 'wire/**'
      - '.github/workflows/scoring-topology-indexer-tests.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            cmake \
            libclang-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test -p topology-indexer
        env:
          RUST_BACKTRACE: 1
