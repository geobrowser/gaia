name: Deploy Kafka UI (Staging)

on:
  push:
    branches:
      - dev
    paths:
      - "hermes/k8s/staging/kafka-ui.yaml"
      - "hermes-schema/proto/**"
      - "wire/proto/grc20.proto"
      - ".github/workflows/kafka-ui-deploy-staging.yml"

concurrency:
  group: kafka-ui-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Apply k8s manifests
        run: |
          kubectl apply -f hermes/k8s/staging/namespace.yaml
          kubectl create configmap protobuf-schemas \
            --from-file=block_summary.proto=hermes-schema/proto/block_summary.proto \
            --from-file=blockchain_metadata.proto=hermes-schema/proto/blockchain_metadata.proto \
            --from-file=governance.proto=hermes-schema/proto/governance.proto \
            --from-file=knowledge.proto=hermes-schema/proto/knowledge.proto \
            --from-file=membership.proto=hermes-schema/proto/membership.proto \
            --from-file=moderation.proto=hermes-schema/proto/moderation.proto \
            --from-file=scoring.proto=hermes-schema/proto/scoring.proto \
            --from-file=space.proto=hermes-schema/proto/space.proto \
            --from-file=topics.proto=hermes-schema/proto/topics.proto \
            --from-file=topology.proto=hermes-schema/proto/topology.proto \
            --from-file=voting.proto=hermes-schema/proto/voting.proto \
            --namespace=kafka-staging \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f hermes/k8s/staging/kafka-ui.yaml

      - name: Wait for deployment to be ready
        run: |
          kubectl rollout status deployment/kafka-ui -n kafka-staging --timeout=120s

      - name: Show deployment status
        run: |
          echo "=== Kafka UI Deployment ==="
          kubectl get deployment kafka-ui -n kafka-staging
          echo ""
          echo "=== Kafka UI Pods ==="
          kubectl get pods -n kafka-staging -l app=kafka-ui
