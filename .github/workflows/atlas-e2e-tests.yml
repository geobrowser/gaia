name: Atlas E2E Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'atlas/**'
      - 'hermes-relay/**'
      - 'hermes-substream/**'
      - 'stream/**'
      - '.github/workflows/atlas-e2e-tests.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'atlas/**'
      - 'hermes-relay/**'
      - 'hermes-substream/**'
      - 'stream/**'
      - '.github/workflows/atlas-e2e-tests.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    services:
      kafka:
        image: apache/kafka:4.1.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,PLAINTEXT://0.0.0.0:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
          - 9093:9093

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          libclang-dev \
          libcurl4-openssl-dev \
          libssl-dev \
          pkg-config

    - name: Cache cargo registry
      uses: actions/cache@v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Run graph E2E tests
      run: cargo test --test e2e -- --test-threads=1
      working-directory: ./atlas
      env:
        RUST_BACKTRACE: 1

    - name: Wait for Kafka
      run: |
        echo "Waiting for Kafka to be ready..."
        for i in {1..60}; do
          if nc -z localhost 9092; then
            echo "Kafka port 9092 is open, waiting for broker startup..."
            sleep 5
            echo "Kafka is ready"
            exit 0
          fi
          echo "Waiting for Kafka... ($i/60)"
          sleep 2
        done
        echo "ERROR: Kafka failed to become ready within 120 seconds"
        exit 1

    - name: Build atlas binary
      run: cargo build --bin atlas
      working-directory: ./atlas

    - name: Run Kafka E2E test
      run: cargo test --test kafka_e2e -- --test-threads=1
      working-directory: ./atlas
      env:
        RUST_BACKTRACE: 1
        KAFKA_E2E: 1
        KAFKA_BROKER: localhost:9092
        ENVIRONMENT: staging
