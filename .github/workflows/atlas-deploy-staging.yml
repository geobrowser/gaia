name: Deploy Atlas (Staging)

on:
  push:
    branches:
      - dev
    paths:
      - 'atlas/**'
      - 'hermes-instrumentation/**'
      - 'hermes-relay/**'
      - 'hermes-schema/**'
      - 'hermes-substream/**'
      - 'stream/**'
      - 'wire/**'
      - 'hermes/k8s/staging/atlas.yaml'
      - 'hermes/k8s/staging/atlas-monitoring.yaml'
      - '.github/workflows/atlas-deploy-staging.yml'

concurrency:
  group: atlas-staging
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: atlas

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging \
                       -f atlas/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Cleanup old atlas workload locations
        run: |
          kubectl delete job atlas -n kafka-staging --ignore-not-found=true
          kubectl delete deployment atlas -n kafka-staging --ignore-not-found=true
          kubectl delete job atlas -n knowledge-staging --ignore-not-found=true

      - name: Deploy to Kubernetes
        run: |
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/atlas:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' hermes/k8s/staging/atlas.yaml
          kubectl apply -f hermes/k8s/staging/atlas.yaml
          kubectl apply -f hermes/k8s/staging/atlas-monitoring.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/atlas -n knowledge-staging --timeout=180s

      - name: Show deployment status
        run: |
          echo "=== Atlas Deployment ==="
          kubectl get deployment atlas -n knowledge-staging || echo "Deployment not found"
          echo ""
          echo "=== Atlas Pods ==="
          kubectl get pods -n knowledge-staging -l app=atlas
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n knowledge-staging --sort-by='.lastTimestamp' | tail -10
