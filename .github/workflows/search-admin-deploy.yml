name: Deploy Search Admin CLI

on:
  push:
    branches:
      - main
    paths:
      - 'search-admin-cli/**'
      - 'search-indexer-repository/**'
      - 'search-indexer-shared/**'
      - '.github/workflows/search-admin-deploy.yml'

env:
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: search-admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -f search-admin-cli/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Show build summary
        run: |
          echo "=== Search Admin CLI Build Complete ==="
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "SHA: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo ""
          echo "To use the CLI locally via kubectl:"
          echo "  ./search-indexer-deploy/k8s/jobs/search-admin.sh list-indices"
          echo ""
          echo "Or run commands directly:"
          echo "  kubectl run search-admin-temp --rm -i --restart=Never \\"
          echo "    --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \\"
          echo "    --env=\"OPENSEARCH_URL=\$(kubectl get secret opensearch-credentials -n search -o jsonpath='{.data.OPENSEARCH_URL}' | base64 -d)\" \\"
          echo "    -n search -- list-indices"
