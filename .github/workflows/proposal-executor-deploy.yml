name: Deploy Proposal Executor (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'proposal-executor/**'
      - '.github/workflows/proposal-executor-deploy.yml'

concurrency:
  group: proposal-executor-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: proposal-executor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install doctl
        uses: digitalocean/action-doctl@v2.5.1
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -f proposal-executor/Dockerfile proposal-executor
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: Azure/setup-kubectl@v5

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/proposal-executor:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' proposal-executor/deployment/production/cronjob.yaml
          kubectl apply -f proposal-executor/deployment/production/cronjob.yaml

      - name: Show deployment status
        run: |
          echo "=== Proposal Executor CronJob (Production) ==="
          kubectl get cronjob proposal-executor -n knowledge || echo "CronJob not found"
          echo ""
          echo "=== Recent Jobs ==="
          kubectl get jobs -n knowledge -l app.kubernetes.io/name=proposal-executor --sort-by='.metadata.creationTimestamp' | tail -5
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n knowledge --sort-by='.lastTimestamp' | tail -10
