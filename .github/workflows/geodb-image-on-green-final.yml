name: Build geodb image on green final

# Keeps registry.digitalocean.com/geo/geodb:<first 10 hex> built for the newest geo-db `final`
# commit whose CI passed, so a pin roll never has to wait on a 10-minute image build first.
#
# Every 20 minutes (and on demand) it asks geo-db for its newest successful `ci` run on a
# push to `final`. If the registry already has that commit's tag, it stops. Otherwise it
# calls build-geodb-image.yml with that SHA. `final` moves every few minutes, so this builds
# at most one image per tick: the newest green one, never a backlog.
#
# Build-and-push only. It changes no manifest and no pin, and deploys nothing; rolling the
# geodb serve to a new tag stays the manual pin roll (geodb/RUNBOOK.md).
#
# Credentials: GEO_DB_READ_TOKEN (already used by build-geodb-image.yml to clone geo-db) must
# also be able to read geo-db's Actions runs: on a fine-grained token that is the
# "Actions: read" repository permission on geobrowser/geo-db. Without it the lookup fails
# with a 403/404 and says so. DIGITALOCEAN_ACCESS_TOKEN lists the registry tags.
#
# Pause: set the repository variable GEODB_IMAGE_ON_GREEN_FINAL=off.

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch: {}
  # On a PR that edits this file, only the lookup runs (proves the token can read geo-db's
  # runs and the registry); the build is skipped.
  pull_request:
    paths:
      - '.github/workflows/geodb-image-on-green-final.yml'
      - '.github/workflows/build-geodb-image.yml'

permissions:
  contents: read

concurrency:
  group: geodb-image-on-green-final-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  find:
    if: vars.GEODB_IMAGE_ON_GREEN_FINAL != 'off'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      build: ${{ steps.find.outputs.build }}
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Newest green final commit, and is it built?
        id: find
        env:
          GH_TOKEN: ${{ secrets.GEO_DB_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret GEO_DB_READ_TOKEN is not set."
            exit 1
          fi
          if ! sha="$(gh api 'repos/geobrowser/geo-db/actions/workflows/ci.yml/runs?branch=final&event=push&status=success&per_page=1' \
                --jq '.workflow_runs[0].head_sha // empty' 2>err.txt)"; then
            cat err.txt
            echo "::error::Could not list geo-db's ci runs. GEO_DB_READ_TOKEN needs the \"Actions: read\" permission on geobrowser/geo-db."
            exit 1
          fi
          if [ -z "$sha" ]; then
            echo "::warning::geo-db has no successful ci run on final; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${sha:0:10}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if ! tags="$(doctl registry repository list-tags geodb)"; then
            echo "::error::doctl failed listing geodb tags (registry or auth problem)."
            exit 1
          fi
          if echo "$tags" | awk -v t="$tag" '$1==t{found=1} END{exit !found}'; then
            build=false
            echo "geodb:$tag is already in the registry (geo-db $sha); nothing to do."
          else
            build=true
            echo "::notice::geodb:$tag (green geo-db final $sha) is not in the registry; building it."
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          {
            echo "## geodb image on green final"
            echo "Newest green final: \`$sha\` (tag \`$tag\`). Build needed: $build."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: find
    if: needs.find.outputs.build == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/build-geodb-image.yml
    with:
      geodb_ref: ${{ needs.find.outputs.sha }}
    secrets: inherit
