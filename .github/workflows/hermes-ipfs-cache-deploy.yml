name: Deploy Hermes IPFS Cache (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'hermes-ipfs-cache/**'
      - 'hermes-relay/**'
      - 'hermes-substream/**'
      - 'hermes-instrumentation/**'
      - 'stream/**'
      - 'wire/**'
      - 'ipfs/**'
      - '.github/workflows/hermes-ipfs-cache-deploy.yml'

concurrency:
  group: hermes-ipfs-cache-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: hermes-ipfs-cache

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -f hermes-ipfs-cache/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f hermes-ipfs-cache/k8s/production/namespace.yaml
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/hermes-ipfs-cache:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' hermes-ipfs-cache/k8s/production/hermes-ipfs-cache.yaml
          kubectl apply -f hermes-ipfs-cache/k8s/production/hermes-ipfs-cache.yaml

      - name: Restart deployment to pick up new image
        run: |
          kubectl rollout restart deployment/hermes-ipfs-cache -n knowledge

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/hermes-ipfs-cache -n knowledge --timeout=120s

      - name: Show deployment status
        run: |
          echo "=== Hermes IPFS Cache Deployment ==="
          kubectl get deployment hermes-ipfs-cache -n knowledge
          echo ""
          echo "=== Hermes IPFS Cache Pods ==="
          kubectl get pods -n knowledge -l app=hermes-ipfs-cache
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n knowledge --sort-by='.lastTimestamp' | grep hermes-ipfs-cache | tail -10
