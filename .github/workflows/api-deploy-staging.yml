name: Deploy API (Staging)

on:
  push:
    branches:
      - dev
    paths:
      - 'api/**'
      - '.github/workflows/api-deploy-staging.yml'

concurrency:
  group: api-staging
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging \
                       -f api/Dockerfile ./api
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f api/k8s/staging/namespace.yaml
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/api:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' api/k8s/staging/api.yaml
          kubectl apply -f api/k8s/staging/api.yaml

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/api -n api-staging --timeout=300s

      - name: Show deployment status
        run: |
          kubectl get pods -n api-staging
          kubectl get svc -n api-staging
