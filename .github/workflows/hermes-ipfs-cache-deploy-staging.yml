name: Deploy Hermes IPFS Cache (Staging)

on:
  push:
    branches:
      - dev
    paths:
      - 'hermes-ipfs-cache/**'
      - 'hermes-relay/**'
      - 'hermes-substream/**'
      - 'hermes-instrumentation/**'
      - 'stream/**'
      - 'wire/**'
      - 'ipfs/**'
      - '.github/workflows/hermes-ipfs-cache-deploy-staging.yml'

concurrency:
  group: hermes-ipfs-cache-staging
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: hermes-ipfs-cache

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging \
                       -f hermes-ipfs-cache/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f hermes-ipfs-cache/k8s/staging/namespace.yaml
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/hermes-ipfs-cache:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' hermes-ipfs-cache/k8s/staging/hermes-ipfs-cache.yaml
          kubectl apply -f hermes-ipfs-cache/k8s/staging/hermes-ipfs-cache.yaml

      - name: Restart deployment to pick up new image
        run: |
          kubectl rollout restart deployment/hermes-ipfs-cache -n knowledge-staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/hermes-ipfs-cache -n knowledge-staging --timeout=120s

      - name: Show deployment status
        run: |
          echo "=== Hermes IPFS Cache Deployment ==="
          kubectl get deployment hermes-ipfs-cache -n knowledge-staging
          echo ""
          echo "=== Hermes IPFS Cache Pods ==="
          kubectl get pods -n knowledge-staging -l app=hermes-ipfs-cache
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n knowledge-staging --sort-by='.lastTimestamp' | grep hermes-ipfs-cache | tail -10
