name: KG Indexer Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'kg-indexer/**'
      - 'hermes-schema/**'
      - 'wire/**'
      - 'indexer_utils/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'kg-indexer/**'
      - 'hermes-schema/**'
      - 'wire/**'
      - 'indexer_utils/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test --lib --bins
        working-directory: ./kg-indexer
        env:
          RUST_BACKTRACE: 1

      - name: Run doc tests
        run: cargo test --doc
        working-directory: ./kg-indexer
        env:
          RUST_BACKTRACE: 1
