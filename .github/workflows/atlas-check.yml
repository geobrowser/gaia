name: Atlas Check

on:
  push:
    branches: [main, dev]
    paths:
      - 'atlas/**'
      - 'hermes-instrumentation/**'
      - 'hermes-relay/**'
      - 'hermes-substream/**'
      - 'stream/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'atlas/**'
      - 'hermes-instrumentation/**'
      - 'hermes-relay/**'
      - 'hermes-substream/**'
      - 'stream/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./atlas

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libclang-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ./atlas

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings -A clippy::doc_overindented_list_items

      - name: Build
        run: cargo build --verbose
