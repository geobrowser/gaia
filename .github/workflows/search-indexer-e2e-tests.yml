name: Search Indexer E2E Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'search-indexer/**'
      - 'search-indexer-repository/**'
      - 'hermes-schema/**'
      - 'hermes-kafka/**'
      - 'wire/**'
      - 'api/**'
      - 'search-indexer/tests/load-test/**'
      - '.github/workflows/search-indexer-e2e-tests.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'search-indexer/**'
      - 'search-indexer-repository/**'
      - 'hermes-schema/**'
      - 'hermes-kafka/**'
      - 'wire/**'
      - 'api/**'
      - 'search-indexer/tests/load-test/**'
      - '.github/workflows/search-indexer-e2e-tests.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://test_user:test_password@localhost:5432/gaia_test
  KAFKA_BROKER: localhost:9092
  OPENSEARCH_URL: http://localhost:9200

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gaia_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      kafka:
        image: apache/kafka:4.1.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,PLAINTEXT://0.0.0.0:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_MESSAGE_MAX_BYTES: 10485760
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
          - 9093:9093

      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: E2eTest@SecurePass789!
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 9200:9200

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            cmake \
            libclang-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libsasl2-dev \
            pkg-config

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./search-indexer
            ./search-indexer-repository
            ./search-indexer/tests/load-test

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install API dependencies
        working-directory: ./api
        run: bun install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test_user; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "ERROR: PostgreSQL failed to become ready within 60 seconds"
          exit 1
        env:
          PGPASSWORD: test_password

      - name: Create pg_trgm extension
        run: |
          psql -h localhost -p 5432 -U test_user -d gaia_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
        env:
          PGPASSWORD: test_password

      - name: Run database migrations
        working-directory: ./api
        run: bun run db:migrate

      - name: Seed values and relations tables for Postgres lookups
        run: |
          psql -h localhost -p 5432 -U test_user -d gaia_test \
            -f search-indexer/tests/e2e-kafka-search-api/seed-values.sql
        env:
          PGPASSWORD: test_password

      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka to be ready..."
          for i in {1..60}; do
            if nc -z localhost 9092; then
              echo "Kafka port 9092 is open, waiting for broker to be ready..."
              sleep 5
              echo "Kafka is ready"
              exit 0
            fi
            echo "Waiting for Kafka... ($i/60)"
            sleep 2
          done
          echo "ERROR: Kafka failed to become ready within 120 seconds"
          exit 1

      - name: Wait for OpenSearch
        run: |
          echo "Waiting for OpenSearch to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green"\|"status":"yellow"'; then
              echo "OpenSearch is ready"
              exit 0
            fi
            echo "Waiting for OpenSearch... ($i/60)"
            sleep 2
          done
          echo "ERROR: OpenSearch failed to become ready within 120 seconds"
          curl -s http://localhost:9200/_cluster/health || true
          exit 1

      - name: Build search-indexer
        run: cargo build --package search-indexer --release --features search-indexer-repository/auto_index_creation

      - name: Setup Rust nightly for e2e test generator
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Search API
        working-directory: ./api
        run: |
          bun run main.ts &
          echo $! > /tmp/api.pid
          # Wait for API to be ready
          for i in {1..30}; do
            if curl -s http://localhost:3000/search/health > /dev/null 2>&1; then
              echo "Search API is ready"
              break
            fi
            echo "Waiting for Search API... ($i/30)"
            sleep 2
            if [ $i -eq 30 ]; then
              echo "ERROR: Search API failed to become ready within 60 seconds"
              curl -s http://localhost:3000/search/health || true
              exit 1
            fi
          done
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/gaia_test
          OPENSEARCH_URL: http://localhost:9200
          ENVIRONMENT: staging
          IPFS_KEY: dummy-key-for-e2e-tests
          IPFS_GATEWAY_WRITE: http://localhost:5001
          TOPOLOGY_SERVICE_URL: http://localhost:8080

      - name: Run search-indexer in background
        run: |
          ENVIRONMENT=staging \
          DATABASE_URL=${{ env.DATABASE_URL }} \
          DATABASE_MAX_CONNECTIONS=5 \
          KAFKA_BROKER=localhost:9092 \
          OPENSEARCH_URL=http://localhost:9200 \
          KAFKA_GROUP_EDITS_ID=search-indexer-group-edits-e2e \
          KAFKA_GROUP_SCORES_ID=search-indexer-group-scores-e2e \
          KAFKA_GROUP_SPACE_TOPICS_ID=search-indexer-group-space-topics-e2e \
          KAFKA_GROUP_TOPOLOGY_ID=search-indexer-group-topology-e2e \
          TOPOLOGY_STATE_PATH=/tmp/topology_state.json \
          HEALTH_PORT=8080 \
          RUST_LOG=search_indexer=info,search_indexer_repository=debug \
          ./target/release/search-indexer > /tmp/search-indexer.log 2>&1 &
          echo $! > /tmp/search-indexer.pid

          echo "Waiting for search-indexer to be ready..."
          for i in {1..30}; do
            # Check if process is still running
            if ! kill -0 $(cat /tmp/search-indexer.pid) 2>/dev/null; then
              echo "ERROR: search-indexer process exited unexpectedly"
              exit 1
            fi
            # Check readiness endpoint
            if curl -s http://localhost:8080/readyz | grep -q "ready"; then
              echo "search-indexer is ready"
              exit 0
            fi
            echo "Waiting for search-indexer... ($i/30)"
            sleep 2
          done
          echo "ERROR: search-indexer failed to become ready within 60 seconds"
          curl -s http://localhost:8080/readyz || true
          exit 1

      - name: Run E2E tests
        working-directory: ./search-indexer/tests/e2e-kafka-search-api
        run: |
          # Set nightly as default for this crate (uses edition 2024)
          rustup default nightly
          ./run-test.sh
        env:
          ENVIRONMENT: staging
          KAFKA_BROKER: localhost:9092
          SEARCH_API_URL: http://localhost:3000
          INDEXER_URL: http://localhost:8080

      - name: Stop indexer for NACK crash test
        run: |
          if [ -f /tmp/search-indexer.pid ]; then
            kill $(cat /tmp/search-indexer.pid) 2>/dev/null || true
            sleep 2
          fi
          # Also stop the API — NACK test doesn't need it
          if [ -f /tmp/api.pid ]; then
            kill $(cat /tmp/api.pid) 2>/dev/null || true
          fi

      - name: Run NACK crash test
        working-directory: ./search-indexer/tests/e2e-nack-crash
        run: |
          KAFKA_CONTAINER=$(docker ps --format '{{.Names}}' | grep -i kafka | grep -v ui | head -1)
          echo "Using Kafka container: $KAFKA_CONTAINER"
          KAFKA_CONTAINER="$KAFKA_CONTAINER" ./run-test.sh
        env:
          ENVIRONMENT: staging
          KAFKA_BROKER: localhost:9092
          OPENSEARCH_URL: http://localhost:9200

      - name: Upload NACK crash test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nack-crash-test-logs
          path: /tmp/e2e-nack-crash.*/
          retention-days: 3

      - name: Run topology restart test
        working-directory: ./search-indexer/tests/e2e-topology-restart
        run: |
          KAFKA_CONTAINER=$(docker ps --format '{{.Names}}' | grep -i kafka | grep -v ui | head -1)
          KAFKA_CONTAINER="$KAFKA_CONTAINER" ./run-test.sh
        env:
          ENVIRONMENT: staging
          KAFKA_BROKER: localhost:9092
          OPENSEARCH_URL: http://localhost:9200

      - name: Upload topology restart test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: topology-restart-test-logs
          path: /tmp/e2e-topology-restart.*/
          if-no-files-found: warn
          retention-days: 3

      - name: Clean OpenSearch for load test
        run: |
          CONCRETE=$(curl -sf "$OPENSEARCH_URL/_alias/staging_entities" \
            | python3 -c "import sys,json; print(' '.join(json.load(sys.stdin).keys()))" 2>/dev/null || true)
          if [ -n "$CONCRETE" ]; then
            for idx in $CONCRETE; do
              echo "Deleting index: $idx"
              curl -sf -X DELETE "$OPENSEARCH_URL/$idx"
            done
          else
            echo "No existing index to clean"
          fi

      - name: Start indexer for load test
        run: |
          ENVIRONMENT=staging \
          DATABASE_URL=${{ env.DATABASE_URL }} \
          DATABASE_MAX_CONNECTIONS=5 \
          KAFKA_BROKER=localhost:9092 \
          OPENSEARCH_URL=http://localhost:9200 \
          OPENSEARCH_MAX_BULK_SIZE=10 \
          KAFKA_GROUP_EDITS_ID=search-indexer-group-edits-load \
          KAFKA_GROUP_SCORES_ID=search-indexer-group-scores-load \
          KAFKA_GROUP_SPACE_TOPICS_ID=search-indexer-group-space-topics-load \
          KAFKA_GROUP_TOPOLOGY_ID=search-indexer-group-topology-load \
          TOPOLOGY_STATE_PATH=/tmp/topology_state_load.json \
          HEALTH_PORT=8081 \
          RUST_LOG=search_indexer=info,search_indexer_repository=info \
          ./target/release/search-indexer > /tmp/search-indexer-load.log 2>&1 &
          echo $! > /tmp/search-indexer-load.pid

          echo "Waiting for search-indexer to be ready..."
          for i in {1..30}; do
            if ! kill -0 $(cat /tmp/search-indexer-load.pid) 2>/dev/null; then
              echo "ERROR: search-indexer process exited unexpectedly"
              cat /tmp/search-indexer-load.log
              exit 1
            fi
            if curl -s http://localhost:8081/readyz | grep -q "ready"; then
              echo "search-indexer is ready"
              exit 0
            fi
            echo "Waiting for search-indexer... ($i/30)"
            sleep 2
          done
          echo "ERROR: search-indexer failed to become ready"
          cat /tmp/search-indexer-load.log
          exit 1

      - name: Build load test
        working-directory: ./search-indexer/tests/load-test
        run: cargo +nightly build --release

      - name: Run load test
        working-directory: ./search-indexer/tests/load-test
        run: |
          set -o pipefail
          ENVIRONMENT=staging \
          cargo +nightly run --release -- \
            --seed 42 --scale 0.05 --timeout 300 \
            --scores-group-id search-indexer-group-scores-load \
            2>&1 | tee /tmp/load-test.log

      - name: Upload search-indexer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-indexer-logs
          path: |
            /tmp/search-indexer.log
            /tmp/search-indexer-load.log
            /tmp/load-test.log
          retention-days: 3

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill $(cat /tmp/api.pid) 2>/dev/null || true
          fi
          if [ -f /tmp/search-indexer.pid ]; then
            kill $(cat /tmp/search-indexer.pid) 2>/dev/null || true
          fi
          if [ -f /tmp/search-indexer-load.pid ]; then
            kill $(cat /tmp/search-indexer-load.pid) 2>/dev/null || true
          fi
