name: Deploy Vote Indexer (Staging)

on:
  push:
    branches:
      - dev
    paths:
      - 'scoring-service/vote-indexer/**'
      - 'scoring-service/deployment/staging/vote-indexer.yaml'
      - 'hermes-schema/**'
      - 'wire/**'
      - '.github/workflows/scoring-vote-indexer-deploy-staging.yml'

concurrency:
  group: vote-indexer-staging
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: vote-indexer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging \
                       -f scoring-service/vote-indexer/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f scoring-service/deployment/staging/namespace.yaml
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/vote-indexer:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' scoring-service/deployment/staging/vote-indexer.yaml
          kubectl apply -f scoring-service/deployment/staging/vote-indexer.yaml

      - name: Restart deployment to pick up new image
        run: |
          kubectl rollout restart deployment/vote-indexer -n scoring-staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/vote-indexer -n scoring-staging --timeout=120s

      - name: Show deployment status
        run: |
          echo "=== Vote Indexer Deployment ==="
          kubectl get deployment vote-indexer -n scoring-staging
          echo ""
          echo "=== Vote Indexer Pods ==="
          kubectl get pods -n scoring-staging -l app=vote-indexer
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n scoring-staging --sort-by='.lastTimestamp' | grep vote-indexer | tail -10
