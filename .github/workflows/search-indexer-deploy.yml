name: Deploy Search Indexer (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'search-indexer/**'
      - 'search-indexer-shared/**'
      - 'search-indexer-repository/**'
      - 'search-indexer-deploy/k8s/production/**'
      - 'sdk/**'
      - 'hermes-schema/**'
      - 'wire/**'
      - 'indexer_utils/**'
      - '.github/workflows/search-indexer-deploy.yml'

concurrency:
  group: search-indexer-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: registry.digitalocean.com/geo
  IMAGE_NAME: search-indexer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -f search-indexer/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubectl for DigitalOcean
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f search-indexer-deploy/k8s/production/namespace.yaml
          # Remove legacy Deployment if it exists (one-time migration to StatefulSet)
          kubectl delete deployment search-indexer -n search --ignore-not-found
          # Update image tag to use SHA and apply
          sed -i 's|image: registry.digitalocean.com/geo/search-indexer:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' search-indexer-deploy/k8s/production/search-indexer.yaml
          kubectl apply -f search-indexer-deploy/k8s/production/search-indexer.yaml

      - name: Wait for rollout to be ready
        run: |
          kubectl rollout status statefulset/search-indexer -n search --timeout=120s

      - name: Show deployment status
        run: |
          echo "=== Search Indexer StatefulSet ==="
          kubectl get statefulset search-indexer -n search || echo "StatefulSet not found"
          echo ""
          echo "=== Search Indexer Pods ==="
          kubectl get pods -n search -l app=search-indexer
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n search --sort-by='.lastTimestamp' | tail -10
