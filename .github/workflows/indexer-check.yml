name: Indexer Check

# TODO(2026-02): Remove this workflow after legacy indexer sunset
# Disabled because legacy indexer uses old spaces schema
on:
  workflow_dispatch:  # Manual trigger only

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    if: false  # Disabled - legacy indexer
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./indexer

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./indexer

      - name: Build
        run: cargo build --verbose -p indexer
