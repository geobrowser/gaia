# Dependabot version updates for GitHub Actions only.
# Scans .github/workflows/*.yml weekly for outdated action versions
# (e.g. actions/checkout, actions/cache) and creates PRs to bump them.
#
# This does NOT scan code dependencies (Cargo, npm, etc.) for security
# vulnerabilities. For that, enable "Dependabot alerts" and "Dependabot
# security updates" in the repo's Settings → Code security and analysis.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # staging, NOT dev: gaia ships from staging, and dev has not moved since
    # 2026-07-13 (147 commits behind). Aimed at dev, every PR dependabot opens is
    # born unmergeable-in-practice — five were open against it when this was
    # changed, none of which could have affected the CI that actually runs.
    target-branch: "staging"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
