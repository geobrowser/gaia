# Dependabot version updates for GitHub Actions only.
# Scans .github/workflows/*.yml weekly for outdated action versions
# (e.g. actions/checkout, actions/cache) and creates PRs to bump them.
#
# This does NOT scan code dependencies (Cargo, npm, etc.) for security
# vulnerabilities. For that, enable "Dependabot alerts" and "Dependabot
# security updates" in the repo's Settings → Code security and analysis.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # main is the trunk and the only branch. It was called `staging` until
    # 2026-09-17, when `main` and `dev` were deleted and `staging` was renamed —
    # the name had come to mean both "the branch that serves production" and a
    # set of k8s environments that no longer exist.
    target-branch: "main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
