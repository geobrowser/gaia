[package]
name = "hermes-pipeline"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hermes-pipeline"
path = "src/main.rs"

[dependencies]
hermes-instrumentation = { path = "../hermes-instrumentation" }
hermes-kafka = { path = "../hermes-kafka" }
hermes-relay = { path = "../hermes-relay" }
hermes-schema = { path = "../hermes-schema" }
stream = { path = "../stream" }
wire = { path = "../wire" }
prost = "0.13.5"
tokio = { version = "1", features = ["full"] }
tokio-retry = "0.3"
async-trait = "0.1"
thiserror = "1"
futures = "0.3"
anyhow = "1"
dotenv = "0.15"
hex = "0.4"
uuid = "1"
alloy = { version = "1.0.24", features = ["sol-types"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "tls-rustls", "uuid"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false
