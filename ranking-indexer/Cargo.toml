[package]
name = "ranking-indexer"
version = "0.1.0"
edition = "2021"
description = "Aggregates GEO rank submissions into ranking results and projects them back into the knowledge graph"

[[bin]]
name = "ranking-indexer"
path = "src/main.rs"

[[bin]]
name = "backfill_blocks"
path = "src/bin/backfill_blocks.rs"

[[bin]]
name = "rolling_sweep"
path = "src/bin/rolling_sweep.rs"

[[bin]]
name = "feed_composition_sample"
path = "src/bin/feed_composition_sample.rs"

# Hourly rebuild of the onboarding topic suggestions (GEO-3079, migration 0095).
[[bin]]
name = "topic_suggestions_refresh"
path = "src/bin/topic_suggestions_refresh.rs"

[[bin]]
name = "account_weights_refresh"
path = "src/bin/account_weights_refresh.rs"

# Hourly repair of the For you topic ranking (GEO-3077, migration 0096); also its backfill.
[[bin]]
name = "topic_ranking_reconcile"
path = "src/bin/topic_ranking_reconcile.rs"

# Per-user topic interest (GEO-3088, migration 0100): `sweep` every 2 minutes, `refit` nightly.
[[bin]]
name = "topic_interest"
path = "src/bin/topic_interest.rs"

# Nightly analytics -> gaia test-account exclusion sync (GEO-3141, migration 0101).
[[bin]]
name = "account_exclusions_sync"
path = "src/bin/account_exclusions_sync.rs"

# Onboarding primer statistics hourly, anchor claims monthly (GEO-3143, migration 0103).
[[bin]]
name = "primer_claims_refresh"
path = "src/bin/primer_claims_refresh.rs"

[dependencies]
hermes-schema = { path = "../hermes-schema" }
hermes-instrumentation = { path = "../hermes-instrumentation" }
hermes-kafka = { path = "../hermes-kafka" }
indexer_utils = { path = "../indexer_utils" }
sdk = { path = "../sdk" }
# GRC-20 v2 binary format (same decoder the kg-indexer uses)
grc-20 = "0.4.1"
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "zstd"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures = "0.3.31"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
prost = "0.13.5"
thiserror = "2.0.12"
chrono = "0.4.41"
uuid = { version = "1.17.0", features = ["v4", "v5"] }
dotenv = "0.15.0"
# The rendered feed is only observable over HTTP. rustls-tls to match the other
# services here (delivery-worker, search-indexer e2e) and avoid pulling in OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

# Metrics (recorder and /metrics listener installed via hermes-instrumentation)
metrics = "0.24"

[dev-dependencies]
metrics-exporter-prometheus = { version = "0.17", default-features = false }
