apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-primer-claims
  namespace: gaia
  labels:
    app: ranking-indexer-primer-claims
    environment: testnet
spec:
  # GEO-3143: the onboarding primer and the shared anchor claims (migration 0103). Each run
  # rebuilds the per-claim statistics the primer reads, chooses a new anchor set on its first run
  # of each calendar month (every past set is kept), and samples the pair-overlap outcome once a
  # day. Set ANCHOR_FORCE=1 on a one-off Job to choose a new anchor set now.
  #
  # Hourly at :57, after the account weights it reads (:53), and clear of the rolling sweep (:00),
  # the feed-composition canary (:17), topic suggestions (:41) and the topic ranking (:51).
  schedule: "57 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-primer-claims
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["primer_claims_refresh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
              env:
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: RUST_LOG
                  value: "primer_claims_refresh=info,ranking_indexer=info"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
