apiVersion: batch/v1
kind: Job
metadata:
  name: ranking-indexer-not-interested-dryrun
  namespace: gaia
  labels:
    app: ranking-indexer-not-interested-sync
    environment: testnet
# GEO-3088 / GEO-2862 check before enabling the CronJob, run by hand (NOT in deploy-v2's list):
#
#   kubectl -n gaia delete job ranking-indexer-not-interested-dryrun --ignore-not-found
#   kubectl -n gaia apply -f ranking-indexer/k8s/v2/not-interested-sync-dryrun-job.yaml
#   kubectl -n gaia logs -f job/ranking-indexer-not-interested-dryrun
#
# Reads geo-chat's Not interested set, runs the whole replacement and recompute, and ROLLS BACK:
# prints how many rows were read, how many land on a personal space, and how many users would be
# recomputed. Writes nothing.
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        environment: testnet
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: ssl-certs
          emptyDir: {}
      initContainers:
        - name: setup-certs
          image: registry.digitalocean.com/geo/ranking-indexer:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "$DATABASE_SSL_CA" > /ssl/ca.crt
          env:
            - name: DATABASE_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_SSL_CA
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: ranking-indexer-not-interested-sync
          image: registry.digitalocean.com/geo/ranking-indexer:latest
          imagePullPolicy: Always
          command: ["not_interested_sync"]
          args: ["--dry-run"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
              readOnly: true
          env:
            - name: PGSSLROOTCERT
              value: /ssl/ca.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: GEO_CHAT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: not-interested-sync
                  key: GEO_CHAT_DATABASE_URL
            - name: RUST_LOG
              value: "not_interested_sync=info,ranking_indexer=info"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
