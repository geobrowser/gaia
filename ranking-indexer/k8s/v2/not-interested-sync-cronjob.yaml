apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-not-interested-sync
  namespace: gaia
  labels:
    app: ranking-indexer-not-interested-sync
    environment: testnet
spec:
  # GEO-3088 / GEO-2862: carry "Not interested" on claims from geo-chat (`claim_not_interested`,
  # off-chain and private) into the topic-interest model (migration 0105). Each run reads geo-chat's
  # whole set through a read-only role, replaces gaia's not_interested rows with it, and recomputes
  # each user whose set changed, so a mark or an undo reaches their weights within one run. Its own
  # CronJob: a geo-chat outage fails this Job and touches nothing else.
  #
  # Enabled once the `not-interested-sync` Secret (GEO_CHAT_DATABASE_URL: a read-only geo-chat
  # role, sslmode=require) existed and the dry run (not-interested-sync-dryrun-job.yaml) read
  # geo-chat cleanly. deploy-v2 re-applies this file, so suspend it in git, not with kubectl.
  #
  # Refuses to write (and fails the Job) when geo-chat returns rows but none lands on a gaia
  # personal space while gaia holds some: a broken identity mapping must not erase everyone's Not
  # interested. An empty read is honoured (everyone cleared their marks).
  suspend: false
  schedule: "*/2 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      # Never + backoffLimit 0: a failed attempt's pod, and so its error, stays around; the next
      # run two minutes later is the retry.
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
            - name: geodb-bin
              emptyDir: {}
            - name: geodb-space-map
              configMap:
                # Written by the geodb-feeder / serve. Not shipped in these manifests.
                name: geodb-space-map
                optional: true
            - name: geodb-key
              secret:
                secretName: geodb-scores-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: scores.key
          initContainers:
            - name: geodb-setup
              # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
              image: registry.digitalocean.com/geo/geodb:93be2804b7
              imagePullPolicy: IfNotPresent
              # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
              # binding and the mirror stays disabled even if the flag is turned on.
              command:
                - sh
                - -c
                - |
                  cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
                  node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
                  ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
                  if [ -n "$node" ] && [ -n "$ip" ]; then
                    printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
                  else
                    echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
                  fi
                  exit 0
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-not-interested-sync
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["not_interested_sync"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
                - name: geodb-bin
                  mountPath: /geodb
                  readOnly: true
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
                - name: geodb-key
                  mountPath: /etc/geodb/key
                  readOnly: true
              env:
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: GEO_CHAT_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: not-interested-sync
                      key: GEO_CHAT_DATABASE_URL
                # Copy personalization.external_interest_signals into geo-db derived collection 27 after each replace
                # commits (RUNBOOK section 2f-private), best-effort. ON, with the private switch: collection 27 is
                # restricted on the serve (derived_restricted, geo-db 9b871ed4e4).
                - name: GEODB_DERIVED_MIRROR
                  value: "1"
                - name: GEODB_DERIVED_MIRROR_PRIVATE
                  value: "1"
                - name: GEODB_DERIVED_BATCH
                  value: "1"
                - name: GEODB_CLIENT_BIN
                  value: /geodb/geodb-client
                - name: GEODB_KEY_PATH
                  value: /etc/geodb/key/scores.key
                - name: GEODB_BINDING_PATH
                  value: /geodb/binding.txt
                - name: RUST_LOG
                  value: "not_interested_sync=info,ranking_indexer=info,geodb_cursor=info"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
