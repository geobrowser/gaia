apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-topic-interest-sweep
  namespace: gaia
  labels:
    app: ranking-indexer-topic-interest-sweep
    environment: testnet
spec:
  # GEO-3088: learn each user's topic interests from their votes, comments, debates and follows
  # (migration 0100, `personalization` schema). Recomputes every user with activity since the last
  # run, so a new vote reaches that user's weights within minutes. Its own CronJob, never part of
  # the vote-indexer: since GEO-3101 a failed write halts vote indexing, and nothing here may.
  #
  # A failed run leaves the cursor where it was; the next one, two minutes later, repeats it.
  # Skips (and logs it) while the nightly refit holds the lock.
  schedule: "*/2 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      # restartPolicy Never + a small backoffLimit keeps the failed pod, and so its error, around
      # (OnFailure restarts in place and the logs of the failing attempt go with it).
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-topic-interest-sweep
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["topic_interest", "sweep"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
              env:
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: RUST_LOG
                  value: "topic_interest=info,ranking_indexer=info"
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-topic-interest-refit
  namespace: gaia
  labels:
    app: ranking-indexer-topic-interest-refit
    environment: testnet
spec:
  # GEO-3088: nightly, rebuild topic co-occurrence (for spreading interest to related topics),
  # recompute every user's interests from scratch, and warn in the log how far the incremental
  # state had drifted (when non-zero; no longer recorded in a table, migration 0117). 03:37 UTC is
  # clear of every hourly ranking job (:00, :17, :30, :41, :51).
  schedule: "37 3 * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # restartPolicy Never + a small backoffLimit keeps the failed pod, and so its error, around
      # (OnFailure restarts in place and the logs of the failing attempt go with it).
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
            # geodb-client for the topic_cooccurrence mirror (GEODB_DERIVED_MIRROR, RUNBOOK section 2f-cooccurrence / 23). Dormant while
            # the flag is "0": nothing below is read, and every reference is optional or fails soft, so an absent
            # geodb never blocks a rollout. Same wiring as hermes-pipeline.yaml, but with the SCORES key: a principal
            # that may write derived collections 0, 1, 2, 3, 4, 5, 11, 12, 13 to 20, 22 and 23 and nothing else (geodb-scores-key-job.yaml).
            - name: geodb-bin
              emptyDir: {}
            - name: geodb-space-map
              configMap:
                # Written by the geodb-feeder / serve. Not shipped in these manifests.
                name: geodb-space-map
                optional: true
            - name: geodb-key
              secret:
                secretName: geodb-scores-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: scores.key
          initContainers:
            - name: geodb-setup
              # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
              image: registry.digitalocean.com/geo/geodb:6b34f9feda
              imagePullPolicy: IfNotPresent
              # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
              # binding and the mirror stays disabled even if the flag is turned on.
              command:
                - sh
                - -c
                - |
                  cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
                  node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
                  ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
                  if [ -n "$node" ] && [ -n "$ip" ]; then
                    printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
                  else
                    echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
                  fi
                  exit 0
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-topic-interest-refit
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["topic_interest", "refit"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
                - name: geodb-bin
                  mountPath: /geodb
                  readOnly: true
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
                - name: geodb-key
                  mountPath: /etc/geodb/key
                  readOnly: true
              env:
                # Copy topic_cooccurrence into geo-db derived collection 23 after the refit commits (RUNBOOK
                # section 2f-cooccurrence), best-effort. OFF: "0". Turning it on is a separate change.
                - name: GEODB_DERIVED_MIRROR
                  value: "0"
                - name: GEODB_DERIVED_BATCH
                  value: "1"
                - name: GEODB_CLIENT_BIN
                  value: /geodb/geodb-client
                - name: GEODB_KEY_PATH
                  value: /etc/geodb/key/scores.key
                - name: GEODB_BINDING_PATH
                  value: /geodb/binding.txt
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: RUST_LOG
                  value: "topic_interest=info,ranking_indexer=info"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "200m"
