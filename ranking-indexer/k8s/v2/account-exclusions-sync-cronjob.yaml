apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-account-exclusions-sync
  namespace: gaia
  labels:
    app: ranking-indexer-account-exclusions-sync
    environment: testnet
spec:
  # GEO-3141: nightly sync of the test-account exclusion list from analytics
  # (`analytics.gaia_account_exclusions`, ClickHouse) into `account_exclusions`, matched to personal
  # spaces by wallet hash. The hourly account-weights job (:53) then gives those voters weight 0.
  #
  # Enabled once the ClickHouse reader and the `account-exclusions-sync` Secret existed and the dry
  # run (account-exclusions-sync-dryrun-job.yaml) matched the 2 Oct audit: 159 voters -> 128.
  # deploy-v2 re-applies this file, so suspend it in git, not with kubectl.
  #
  # 02:47 UTC, so the weights refresh six minutes later applies it; clear of the other ranking
  # jobs. Refuses to write (and fails the Job) when analytics returns nothing, when nothing matches a
  # personal space, or when more than EXCLUSION_SYNC_MAX_EXCLUDED spaces would be excluded.
  suspend: false
  schedule: "47 2 * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Never + backoffLimit 1: a failed attempt's pod, and so its error, stays around.
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
            # geodb-client for the account_exclusions mirror (GEODB_DERIVED_MIRROR, RUNBOOK section 2f-exclusions / 12). Dormant while
            # the flag is "0": nothing below is read, and every reference is optional or fails soft, so an absent
            # geodb never blocks a rollout. Same wiring as hermes-pipeline.yaml, but with the SCORES key: a principal
            # that may write derived collections 0, 1, 5, 11 and 12 and nothing else (geodb-scores-key-job.yaml).
            - name: geodb-bin
              emptyDir: {}
            - name: geodb-space-map
              configMap:
                # Written by the geodb-feeder / serve. Not shipped in these manifests.
                name: geodb-space-map
                optional: true
            - name: geodb-key
              secret:
                secretName: geodb-scores-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: scores.key
          initContainers:
            - name: geodb-setup
              # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
              image: registry.digitalocean.com/geo/geodb:2eab4e170c
              imagePullPolicy: IfNotPresent
              # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
              # binding and the mirror stays disabled even if the flag is turned on.
              command:
                - sh
                - -c
                - |
                  cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
                  node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
                  ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
                  if [ -n "$node" ] && [ -n "$ip" ]; then
                    printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
                  else
                    echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
                  fi
                  exit 0
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-account-exclusions-sync
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["account_exclusions_sync"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
                - name: geodb-bin
                  mountPath: /geodb
                  readOnly: true
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
                - name: geodb-key
                  mountPath: /etc/geodb/key
                  readOnly: true
              env:
                # Copy account_exclusions into geo-db derived collection 12 after the replace commits (RUNBOOK
                # section 2f-exclusions), best-effort. ON.
                - name: GEODB_DERIVED_MIRROR
                  value: "1"
                - name: GEODB_DERIVED_BATCH
                  value: "1"
                - name: GEODB_CLIENT_BIN
                  value: /geodb/geodb-client
                - name: GEODB_KEY_PATH
                  value: /etc/geodb/key/scores.key
                - name: GEODB_BINDING_PATH
                  value: /geodb/binding.txt
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: CLICKHOUSE_URL
                  valueFrom:
                    secretKeyRef:
                      name: account-exclusions-sync
                      key: CLICKHOUSE_URL
                - name: CLICKHOUSE_USER
                  valueFrom:
                    secretKeyRef:
                      name: account-exclusions-sync
                      key: CLICKHOUSE_USER
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: account-exclusions-sync
                      key: CLICKHOUSE_PASSWORD
                # More than this many excluded spaces is treated as a broken read, not a list.
                - name: EXCLUSION_SYNC_MAX_EXCLUDED
                  value: "500"
                - name: RUST_LOG
                  value: "account_exclusions_sync=info,ranking_indexer=info,geodb_cursor=info"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
