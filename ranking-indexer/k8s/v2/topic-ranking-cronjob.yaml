apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-topic-ranking
  namespace: gaia
  labels:
    app: ranking-indexer-topic-ranking
    environment: testnet
spec:
  # GEO-3077: repair the For you topic ranking (`reconcile_entity_topic_ranking()`, migration
  # 0096). Adds tags, names and types that arrived without a score change, drops ones that went,
  # and fixes drifted scores. About 20s on the live DB with nothing to change.
  #
  # GEO-3150: first re-scores every topic debate (`refresh_topic_debate_scores()`, migration 0107),
  # whose score counts Interested votes and debates held on its topic. Needs the api (migration)
  # deployed first, or the run fails on the missing function.
  #
  # Hourly, matching how quickly new entities get a score (vote-indexer's new_entity_sweep at
  # :30), so a new tag reaches For you on the same clock. At :51 to stay clear of the rolling
  # sweep (:00), the canary (:17), the new-entity sweep (:30) and topic suggestions (:41).
  schedule: "51 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
            # geodb-client for the entity_type_ranking / entity_topic_ranking mirror into derived collections 0 and 1 (GEODB_DERIVED_MIRROR,
            # RUNBOOK section 2f / 12). Same wiring as vote-indexer.yaml: the SCORES key, which may write derived collections 0 to 5 and 11 to 26.
            # Every reference is optional or fails soft, so an absent geodb never blocks a run.
            - name: geodb-bin
              emptyDir: {}
            - name: geodb-space-map
              configMap:
                # Written by the geodb-feeder / serve. Not shipped in these manifests.
                name: geodb-space-map
                optional: true
            - name: geodb-key
              secret:
                secretName: geodb-scores-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: scores.key
          initContainers:
            - name: geodb-setup
              # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
              image: registry.digitalocean.com/geo/geodb:93be2804b7
              imagePullPolicy: IfNotPresent
              # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
              # binding and the mirror stays disabled even if the flag is turned on.
              command:
                - sh
                - -c
                - |
                  cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
                  node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
                  ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
                  if [ -n "$node" ] && [ -n "$ip" ]; then
                    printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
                  else
                    echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
                  fi
                  exit 0
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-topic-ranking
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["topic_ranking_reconcile"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
                - name: geodb-bin
                  mountPath: /geodb
                  readOnly: true
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
                - name: geodb-key
                  mountPath: /etc/geodb/key
                  readOnly: true
              env:
                # Copy the type and topic ranking rows this job writes into geo-db derived collections 0 and 1, best-effort, after the
                # Postgres write commits. Only those two tables: the votes_count and entity-scores mirrors stay with vote-indexer.
                - name: GEODB_DERIVED_MIRROR
                  value: "1"
                - name: GEODB_DERIVED_MIRROR_TABLES
                  value: "entity_type_ranking,entity_topic_ranking"
                - name: GEODB_DERIVED_BATCH
                  value: "1"
                - name: GEODB_CLIENT_BIN
                  value: /geodb/geodb-client
                - name: GEODB_KEY_PATH
                  value: /etc/geodb/key/scores.key
                - name: GEODB_BINDING_PATH
                  value: /geodb/binding.txt
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: RUST_LOG
                  value: "topic_ranking_reconcile=info,ranking_indexer=info,geodb_cursor=info"
              resources:
                # Measured: the mirror holds the topic table's before state as a key -> score map. 1.0M and 1.75M rows
                # (1.75M is the ceiling: collections 0 and 1 together hold 1.73M) both peak at about 230 MB RSS while the
                # map grows (new 120 MB table + old 60 MB table + allocator slack); the job without the mirror peaks at
                # 5.8 MB (Prometheus, 7 days of runs). 512Mi leaves 2x on that. Past 2.1M rows the map doubles to ~460 MB.
                requests:
                  memory: "320Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "200m"
