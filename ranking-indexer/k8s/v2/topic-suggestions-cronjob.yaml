apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-topic-suggestions
  namespace: gaia
  labels:
    app: ranking-indexer-topic-suggestions
    environment: testnet
spec:
  # GEO-3079: rebuild the onboarding topic suggestions (`refresh_space_topic_suggestions()`,
  # migration 0095). One function call, 1.6s on the live DB, readers keep the previous ranking
  # until it commits.
  #
  # Hourly, though the ranking barely moves day to day: it is cheap, and a new space's topics
  # then show up in onboarding within the hour. At :41 so it does not overlap the rolling sweep
  # (:00) or the feed-composition canary (:17).
  schedule: "41 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-topic-suggestions
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["topic_suggestions_refresh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
              env:
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: RUST_LOG
                  value: "topic_suggestions_refresh=info,ranking_indexer=info"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
