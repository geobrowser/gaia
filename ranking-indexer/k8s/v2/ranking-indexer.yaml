# Ranking Indexer Deployment
#
# Consumes RANK_VOTES ops from the knowledge.edits stream and materializes
# ranking aggregates into the ranks.* schema. ranks.ranking_scores is the
# reputation system's v1 Expert-band signal, so this service is part of the
# rep-critical path (see docs/plans/2026-06-22-feat-reputation-system-plan.md).
# Modeled on the knowledge-staging deployment; env/resources match it, with
# the shared kafka-credentials secret standing in for ranking-indexer-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking-indexer
  namespace: gaia
  labels:
    app: ranking-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ranking-indexer
  template:
    metadata:
      labels:
        app: ranking-indexer
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: ssl-certs
          emptyDir: {}
        # geodb-client for the derived-score mirror (GEODB_DERIVED_MIRROR, RUNBOOK section 2f / 12). Dormant while
        # the flag is "0": nothing below is read, and every reference is optional or fails soft, so an absent
        # geodb never blocks a rollout. Same wiring as hermes-pipeline.yaml, but with the SCORES key: a principal
        # that may write derived collections 0, 1 and 11 and nothing else (geodb-scores-key-job.yaml).
        - name: geodb-bin
          emptyDir: {}
        - name: geodb-space-map
          configMap:
            # Written by the geodb-feeder / serve. Not shipped in these manifests.
            name: geodb-space-map
            optional: true
        - name: geodb-key
          secret:
            secretName: geodb-scores-key
            optional: true
            defaultMode: 0440
            items:
              - key: key
                path: scores.key
      initContainers:
        - name: geodb-setup
          # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
          image: registry.digitalocean.com/geo/geodb:b05dfd2217
          imagePullPolicy: IfNotPresent
          # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
          # binding and the mirror stays disabled even if the flag is turned on.
          command:
            - sh
            - -c
            - |
              cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
              node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
              ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
              if [ -n "$node" ] && [ -n "$ip" ]; then
                printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
              else
                echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
              fi
              exit 0
          volumeMounts:
            - name: geodb-bin
              mountPath: /geodb
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: setup-certs
          image: registry.digitalocean.com/geo/ranking-indexer:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "$DATABASE_SSL_CA" > /ssl/ca.crt
          env:
            - name: DATABASE_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_SSL_CA
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
      containers:
        - name: ranking-indexer
          image: registry.digitalocean.com/geo/ranking-indexer:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
              readOnly: true
            - name: geodb-bin
              mountPath: /geodb
              readOnly: true
            - name: geodb-space-map
              mountPath: /etc/geodb/space-map
              readOnly: true
            - name: geodb-key
              mountPath: /etc/geodb/key
              readOnly: true
          env:
            # Copy the rows this service writes into geo-db's derived class (RUNBOOK section 2f), best-effort,
            # after the Postgres write commits. OFF: "0". Turning it on is a separate change, after the
            # enable order in RUNBOOK section 12.
            - name: GEODB_DERIVED_MIRROR
              value: "0"
            - name: GEODB_CLIENT_BIN
              value: /geodb/geodb-client
            - name: GEODB_KEY_PATH
              value: /etc/geodb/key/scores.key
            - name: GEODB_BINDING_PATH
              value: /geodb/binding.txt
            - name: PGSSLROOTCERT
              value: /ssl/ca.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_BROKER
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_USERNAME
                  optional: true
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_PASSWORD
                  optional: true
            - name: KAFKA_SSL_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: KAFKA_SSL_CA_PEM
                  optional: true
            - name: ENVIRONMENT
              value: "testnet"
            - name: KAFKA_GROUP_ID
              value: "ranking-indexer-testnet-v1"
            - name: RUST_LOG
              value: "ranking_indexer=info"
            - name: METRICS_PORT
              value: "9464"
          resources:
            requests:
              memory: "768Mi"
              cpu: "50m"
            limits:
              memory: "2Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ranking-indexer
  namespace: gaia
  labels:
    app: ranking-indexer
    # Copied onto every scraped series by the hermes-metrics ServiceMonitor's
    # `targetLabels`, the same as kg-indexer and atlas.
    gaia_namespace: gaia
spec:
  type: ClusterIP
  selector:
    app: ranking-indexer
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
