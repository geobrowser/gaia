apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-feed-signals-sync
  namespace: gaia
  labels:
    app: ranking-indexer-feed-signals-sync
    environment: testnet
spec:
  # GEO-3235: hourly analytics -> gaia feed signals. Reads the bot-filtered Explore events through
  # three ClickHouse views (analytics migration 107) and replaces the last week (at least) of
  # personalization.feed_item_signals_hourly and feed_user_seen_daily, deleting per-user rows past
  # 30 days, in one transaction (migration 0109). Logs every run in feed_signal_runs.
  #
  # Enabled 2026-10-14 after analytics migration 107, the `gaia_feed_signals` ClickHouse reader, the
  # `feed-signals-sync` Secret and a clean dry run (feed-signals-sync-dryrun-job.yaml). deploy-v2
  # re-applies this file, so set suspend in git, not with kubectl. Fails the Job (and writes
  # nothing) when analytics is unreachable, a row is malformed, or the SQL refuses an empty or unplaceable read.
  #
  # :27, clear of the other hourly ranking jobs (:00, :17, :41, :51, :53, :57). The dashboard
  # refresh publishes a new analytics generation every ~30 minutes; an hour with nothing new is
  # logged as `unchanged`.
  suspend: false
  schedule: "27 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # Never + backoffLimit 1: a failed attempt's pod, and so its error, stays around.
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
            # Optional ConfigMap home for the config table (ranking-config-configmap.yaml). Unread unless
            # FEED_SIGNAL_CONFIG_SOURCE is "configmap"; absent ConfigMap blocks nothing.
            - name: ranking-config
              configMap:
                name: ranking-config
                optional: true
            # geodb-client for the feed_item_signals_hourly mirror (GEODB_DERIVED_MIRROR, RUNBOOK section 2f-feed-signals / 22). Dormant while
            # the flag is "0": nothing below is read, and every reference is optional or fails soft, so an absent
            # geodb never blocks a rollout. Same wiring as hermes-pipeline.yaml, but with the SCORES key: a principal
            # that may write derived collections 0, 1, 2, 3, 4, 5, 11, 12, 13 to 19, 20 to 24 and nothing else (geodb-scores-key-job.yaml).
            - name: geodb-bin
              emptyDir: {}
            - name: geodb-space-map
              configMap:
                # Written by the geodb-feeder / serve. Not shipped in these manifests.
                name: geodb-space-map
                optional: true
            - name: geodb-key
              secret:
                secretName: geodb-scores-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: scores.key
            # The CURSOR key (derived=10 only) for the run-log mirror (GEODB_FEED_RUNS_MIRROR): the scores key does not
            # grant collection 10. Optional, so an absent Secret blocks nothing.
            - name: geodb-cursor-key
              secret:
                secretName: geodb-cursor-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: cursor.key
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            - name: geodb-setup
              # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
              image: registry.digitalocean.com/geo/geodb:93be2804b7
              imagePullPolicy: IfNotPresent
              # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
              # binding and the mirror stays disabled even if the flag is turned on.
              command:
                - sh
                - -c
                - |
                  cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
                  node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
                  ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
                  if [ -n "$node" ] && [ -n "$ip" ]; then
                    printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
                  else
                    echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
                  fi
                  exit 0
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-feed-signals-sync
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["feed_signals_sync"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
                - name: ranking-config
                  mountPath: /etc/ranking-config
                  readOnly: true
                - name: geodb-bin
                  mountPath: /geodb
                  readOnly: true
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
                - name: geodb-key
                  mountPath: /etc/geodb/key
                  readOnly: true
                - name: geodb-cursor-key
                  mountPath: /etc/geodb/cursor-key
                  readOnly: true
              env:
                - name: FEED_SIGNAL_CONFIG_SOURCE
                  value: postgres
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: CLICKHOUSE_URL
                  valueFrom:
                    secretKeyRef:
                      name: feed-signals-sync
                      key: CLICKHOUSE_URL
                - name: CLICKHOUSE_USER
                  valueFrom:
                    secretKeyRef:
                      name: feed-signals-sync
                      key: CLICKHOUSE_USER
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: feed-signals-sync
                      key: CLICKHOUSE_PASSWORD
                # Copy personalization.feed_item_signals_hourly into geo-db derived collection 22 after the replace commits (RUNBOOK
                # section 2f-feed-signals), best-effort. ON.
                - name: GEODB_DERIVED_MIRROR
                  value: "1"
                # Also copy feed_user_seen_daily (collection 29, restricted: RUNBOOK section 2f-private).
                - name: GEODB_DERIVED_MIRROR_PRIVATE
                  value: "1"
                - name: GEODB_DERIVED_BATCH
                  value: "1"
                - name: GEODB_CLIENT_BIN
                  value: /geodb/geodb-client
                - name: GEODB_KEY_PATH
                  value: /etc/geodb/key/scores.key
                - name: GEODB_BINDING_PATH
                  value: /geodb/binding.txt
                # Copy the newest feed_signal_runs row of each status (succeeded, unchanged, failed) into geo-db's cursors
                # collection 10 after each run, best-effort (RUNBOOK section 2f-feed-signal-runs). OFF. Needs the cursor key above.
                - name: GEODB_FEED_RUNS_MIRROR
                  value: "0"
                - name: GEODB_FEED_RUNS_KEY_PATH
                  value: /etc/geodb/cursor-key/cursor.key
                - name: RUST_LOG
                  value: "feed_signals_sync=info,ranking_indexer=info,geodb_cursor=info"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-feed-signals-freshness
  namespace: gaia
  labels:
    app: ranking-indexer-feed-signals-freshness
    environment: testnet
spec:
  # GEO-3235: the freshness alert. Fails when no feed-signals run has succeeded for 3 hours or the
  # newest analytics data read is over 6 hours old (personalization.feed_signal_config), so
  # KubeJobFailed fires, like analytics' geo-analytics-input-generation-freshness. Reads only gaia.
  #
  # Enabled with the sync. A cluster where the sync has never succeeded fails this check, so suspend
  # both on a new cluster until the first run succeeds.
  suspend: false
  schedule: "*/15 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-feed-signals-freshness
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["feed_signals_sync", "--check-freshness"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
              env:
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: RUST_LOG
                  value: "feed_signals_sync=info,ranking_indexer=info,geodb_cursor=info"
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "500m"
