apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-feed-signals-sync
  namespace: gaia
  labels:
    app: ranking-indexer-feed-signals-sync
    environment: testnet
spec:
  # GEO-3235: hourly analytics -> gaia feed signals. Reads the bot-filtered Explore events through
  # three ClickHouse views (analytics migration 107) and replaces the last week (at least) of
  # personalization.feed_item_signals_hourly and feed_user_seen_daily, deleting per-user rows past
  # 30 days, in one transaction (migration 0109). Logs every run in feed_signal_runs.
  #
  # Shipped suspended: it needs the ClickHouse reader and the `feed-signals-sync` Secret first, then
  # a clean dry run (feed-signals-sync-dryrun-job.yaml). deploy-v2 re-applies this file, so flip
  # suspend in git, not with kubectl. Fails the Job (and writes nothing) when analytics is
  # unreachable, a row is malformed, or the SQL refuses an empty or unplaceable read.
  #
  # :27, clear of the other hourly ranking jobs (:00, :17, :41, :51, :53, :57). The dashboard
  # refresh publishes a new analytics generation every ~30 minutes; an hour with nothing new is
  # logged as `unchanged`.
  suspend: true
  schedule: "27 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # Never + backoffLimit 1: a failed attempt's pod, and so its error, stays around.
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-feed-signals-sync
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["feed_signals_sync"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
              env:
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: CLICKHOUSE_URL
                  valueFrom:
                    secretKeyRef:
                      name: feed-signals-sync
                      key: CLICKHOUSE_URL
                - name: CLICKHOUSE_USER
                  valueFrom:
                    secretKeyRef:
                      name: feed-signals-sync
                      key: CLICKHOUSE_USER
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: feed-signals-sync
                      key: CLICKHOUSE_PASSWORD
                - name: RUST_LOG
                  value: "feed_signals_sync=info,ranking_indexer=info"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-feed-signals-freshness
  namespace: gaia
  labels:
    app: ranking-indexer-feed-signals-freshness
    environment: testnet
spec:
  # GEO-3235: the freshness alert. Fails when no feed-signals run has succeeded for 3 hours or the
  # newest analytics data read is over 6 hours old (personalization.feed_signal_config), so
  # KubeJobFailed fires, like analytics' geo-analytics-input-generation-freshness. Reads only gaia.
  #
  # Suspended with the sync; unsuspend both together, after the first successful run.
  suspend: true
  schedule: "*/15 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-feed-signals-freshness
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["feed_signals_sync", "--check-freshness"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
              env:
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: RUST_LOG
                  value: "feed_signals_sync=info,ranking_indexer=info"
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "500m"
