apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-rolling-sweep
  namespace: gaia
  labels:
    app: ranking-indexer-rolling-sweep
    environment: testnet
spec:
  # GEO-2328: the actual timing mechanism Rolling ranking blocks need — without
  # this, a submission ageing past its `submission_frequency` never triggers a
  # recompute (nothing on-chain happens when a submission just expires).
  # Cadence is a product question, not an engineering one: how stale an
  # expired ranking is allowed to look. PLACEHOLDER at ship time — no Rolling
  # blocks exist yet, so there's no real submission_frequency distribution to
  # tune against. Retune to roughly the shortest submission_frequency in use
  # once that's known; this is a plain schedule edit, no code change needed.
  #
  # Until a Rolling block exists the sweep finds nothing and is a no-op, so
  # shipping it on v2 ahead of product costs nothing.
  #
  # Modeled on k8s/staging/rolling-sweep-cronjob.yaml; v2 conventions applied
  # (namespace gaia, `geo` pull secret, non-root pod securityContext) to
  # match k8s/v2/ranking-indexer.yaml. Needs DATABASE_URL, no Kafka; the geo-db mirror wiring below is dormant while GEODB_DERIVED_MIRROR is "0".
  schedule: "0 * * * *"
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
            # geodb-client for the ranking_scores mirror (GEODB_DERIVED_MIRROR, collection 11). Dormant while the
            # flag is "0": nothing below is read, and every reference is optional or fails soft, so an absent geodb
            # never blocks a run. Same wiring as ranking-indexer.yaml: the SCORES key, a principal that may write
            # derived collection 11 among others (geodb-scores-key-job.yaml).
            - name: geodb-bin
              emptyDir: {}
            - name: geodb-space-map
              configMap:
                # Written by the geodb-feeder / serve. Not shipped in these manifests.
                name: geodb-space-map
                optional: true
            - name: geodb-key
              secret:
                secretName: geodb-scores-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: scores.key
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            - name: geodb-setup
              # Pinned, never :latest. Always exits 0: with no node id or no Service it writes no binding and the
              # mirror stays off.
              image: registry.digitalocean.com/geo/geodb:93be2804b7
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
                  node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
                  ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
                  if [ -n "$node" ] && [ -n "$ip" ]; then
                    printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
                  else
                    echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
                  fi
                  exit 0
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-rolling-sweep
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["rolling_sweep"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
                - name: geodb-bin
                  mountPath: /geodb
                  readOnly: true
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
                - name: geodb-key
                  mountPath: /etc/geodb/key
                  readOnly: true
              env:
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                # Copy the rows a recomputed block writes into geo-db derived collection 11, best-effort, after the
                # Postgres write commits. OFF: the lead flips it to "1" once the one-time full fill has run.
                - name: GEODB_DERIVED_MIRROR
                  value: "0"
                - name: GEODB_DERIVED_BATCH
                  value: "1"
                - name: GEODB_CLIENT_BIN
                  value: /geodb/geodb-client
                - name: GEODB_KEY_PATH
                  value: /etc/geodb/key/scores.key
                - name: GEODB_BINDING_PATH
                  value: /geodb/binding.txt
                # Shadow read of hermes_pipeline's meta block (current_chain_meta) from geo-db's cursors collection
                # (10), counted in geodb_meta_block_shadow_total. Postgres stays the source. Reads with the scores
                # key above (GEODB_KEY_PATH); collection 10 is not restricted, so any authenticated key may read it.
                # "0" = off; flipping it to "1" is a separate decision.
                - name: GEODB_META_BLOCK_SHADOW
                  value: "0"
                - name: RUST_LOG
                  value: "rolling_sweep=info,ranking_indexer=info"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "250m"
