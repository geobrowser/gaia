apiVersion: batch/v1
kind: Job
metadata:
  name: ranking-indexer-feed-signals-dryrun
  namespace: gaia
  labels:
    app: ranking-indexer-feed-signals-sync
    environment: testnet
# GEO-3235 first check, run by hand (NOT in deploy-v2's manifest list):
#
#   kubectl -n gaia delete job ranking-indexer-feed-signals-dryrun --ignore-not-found
#   kubectl -n gaia apply -f ranking-indexer/k8s/v2/feed-signals-sync-dryrun-job.yaml
#   kubectl -n gaia logs -f job/ranking-indexer-feed-signals-dryrun
#
# Reads the views and runs the whole replacement inside a transaction it rolls back, printing what a
# real run would write: the window, item-hours, and how many per-user rows place on a personal
# space. Writes nothing, not even the run log.
spec:
  # One attempt; the pod and its output stay for a day.
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
  template:
    metadata:
      labels:
        environment: testnet
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: geo
      volumes:
        - name: ssl-certs
          emptyDir: {}
      initContainers:
        - name: setup-certs
          image: registry.digitalocean.com/geo/ranking-indexer:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "$DATABASE_SSL_CA" > /ssl/ca.crt
          env:
            - name: DATABASE_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_SSL_CA
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: ranking-indexer-feed-signals-dryrun
          image: registry.digitalocean.com/geo/ranking-indexer:latest
          imagePullPolicy: Always
          command: ["feed_signals_sync", "--dry-run"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ssl-certs
              mountPath: /ssl
              readOnly: true
          env:
            - name: PGSSLROOTCERT
              value: /ssl/ca.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: feed-signals-sync
                  key: CLICKHOUSE_URL
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: feed-signals-sync
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feed-signals-sync
                  key: CLICKHOUSE_PASSWORD
            - name: RUST_LOG
              value: "feed_signals_sync=info,ranking_indexer=info"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
