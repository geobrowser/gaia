apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-account-weights
  namespace: gaia
  labels:
    app: ranking-indexer-account-weights
    environment: testnet
spec:
  # GEO-3141: recompute each voter's account weight (`refresh_account_weights()`, migration
  # 0101): how much their votes count towards other people's personalization. One function call;
  # readers keep the previous weights until it commits.
  #
  # Hourly (the ticket asks for at least nightly), so a new account's ramp and a fresh analytics
  # exclusion apply within the hour. At :53, clear of the rolling sweep (:00), the
  # feed-composition canary (:17) and topic suggestions (:41).
  schedule: "53 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
            # geodb-client for the account_weights mirror (GEODB_DERIVED_MIRROR, RUNBOOK section 2f-weights / 12). Dormant while
            # the flag is "0": nothing below is read, and every reference is optional or fails soft, so an absent
            # geodb never blocks a rollout. Same wiring as hermes-pipeline.yaml, but with the SCORES key: a principal
            # that may write derived collections 0, 1, 5 and 11 and nothing else (geodb-scores-key-job.yaml).
            - name: geodb-bin
              emptyDir: {}
            - name: geodb-space-map
              configMap:
                # Written by the geodb-feeder / serve. Not shipped in these manifests.
                name: geodb-space-map
                optional: true
            - name: geodb-key
              secret:
                secretName: geodb-scores-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: scores.key
          initContainers:
            - name: geodb-setup
              # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
              image: registry.digitalocean.com/geo/geodb:2eab4e170c
              imagePullPolicy: IfNotPresent
              # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
              # binding and the mirror stays disabled even if the flag is turned on.
              command:
                - sh
                - -c
                - |
                  cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
                  node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
                  ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
                  if [ -n "$node" ] && [ -n "$ip" ]; then
                    printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
                  else
                    echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
                  fi
                  exit 0
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-account-weights
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["account_weights_refresh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
                - name: geodb-bin
                  mountPath: /geodb
                  readOnly: true
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
                - name: geodb-key
                  mountPath: /etc/geodb/key
                  readOnly: true
              env:
                # Copy account_weights into geo-db derived collection 5 after the refresh commits (RUNBOOK
                # section 2f-weights), best-effort. OFF: "0". Turning it on is a separate change.
                - name: GEODB_DERIVED_MIRROR
                  value: "1"
                - name: GEODB_DERIVED_BATCH
                  value: "1"
                - name: GEODB_CLIENT_BIN
                  value: /geodb/geodb-client
                - name: GEODB_KEY_PATH
                  value: /etc/geodb/key/scores.key
                - name: GEODB_BINDING_PATH
                  value: /geodb/binding.txt
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: RUST_LOG
                  value: "account_weights_refresh=info,ranking_indexer=info,geodb_cursor=info"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
