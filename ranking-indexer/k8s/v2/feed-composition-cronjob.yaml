apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-feed-composition
  namespace: gaia
  labels:
    app: ranking-indexer-feed-composition
    environment: testnet
spec:
  # GEO-2926 follow-up: record what the ranked feed is made of, so a ranking change
  # cannot quietly change what people see. See src/bin/feed_composition_sample.rs for
  # the incident this exists because of.
  #
  # Hourly. The sample is one indexed walk of `entity_type_ranking` plus one insert, so
  # the cost is negligible and 24 points a day is enough resolution to place a change
  # against a deploy. Offset from :00 so it does not contend with the rolling sweep.
  schedule: "17 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: regcred
          volumes:
            - name: ssl-certs
              emptyDir: {}
          initContainers:
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-feed-composition
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["feed_composition_sample"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
              env:
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                # MIRRORS geogenesis DEFAULT_EXPLORE_TYPE_IDS (apps/web/core/explore/
                # explore-constants.ts): News story, Debate, Claim — the three types
                # Explore arrives with ticked. These two lists must be changed together;
                # if they diverge this canary watches a feed nobody is looking at, which
                # is why the binary refuses to start rather than compile in a default.
                - name: FEED_COMPOSITION_TYPE_IDS
                  value: "e550fe51-7e90-4b2c-8fff-df13408f5634,fd51f935-2063-4617-be39-7b672b23364c,96f859ef-a1ca-4b22-9372-c86ad58b694b"
                # EXPLORE_DIVERSITY_WINDOW_SIZE: the window Explore fetches before its
                # diversity cap and per-space quota reorder it.
                - name: FEED_COMPOSITION_WINDOW
                  value: "66"
                # The global feed is always sampled; these are sampled in addition, one
                # scope each, with drift tracked per scope. The complaint this canary
                # exists because of was about the top of a SINGLE space, which a
                # global-only sample would not have caught.
                #
                # The eight spaces holding the most feed-eligible entities of the watched
                # types, as of 2026-09-17 (181,905 down to 6,028). One sample is a bounded
                # ranked walk of ~10-30 ms, so the list is cheap to extend; it is a plain
                # manifest edit with no code change. Nothing breaks if a space is deleted
                # — that scope fails, is logged, and the others still record.
                - name: FEED_COMPOSITION_SPACE_IDS
                  value: "b5a31f81-82b0-4243-7ede-0f84ee02f104,89bd89bf-28ff-8a09-63fa-f92a8c905e20,c9f267dc-b0d2-7071-8c2a-3c45a64afd32,41e85161-0e13-a194-41c4-d980f2f2ce6b,52c7ae14-9838-b6d4-7ce0-f3b2a5974546,4582fbbe-e28a-1658-9154-f7e36f1ee3c5,5908c73a-d336-472c-cbd9-83491d2d17e4,da96a4c2-6e71-8bfa-6c27-c3b1f3c316cd"
                - name: RUST_LOG
                  value: "feed_composition_sample=info,ranking_indexer=info"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
