apiVersion: batch/v1
kind: CronJob
metadata:
  name: ranking-indexer-agenda-listings
  namespace: gaia
  labels:
    app: ranking-indexer-agenda-listings
    environment: testnet
spec:
  # GEO-3488: Best lifts the claims on each space's Debate agenda and the debates recorded on them,
  # and more lightly everything on the topics the agenda names (migration 0113). Each run brings
  # trending.agenda_listings in step with the graph and re-scores what changed: claims added, removed
  # or re-dated on an agenda and their debates, and the claims and debates on topics that were. The
  # boosts decay per New York day, so the first run of each New York day is a full pass that moves
  # every score to the new day: every listed claim and its debates, everything on a topic named in
  # the last 16 days (trending_horizon_days), and anything still storing a term. Needs the api
  # (migration) deployed first, or the run fails on the missing function.
  #
  # Hourly at :05, clear of the rolling sweep (:00), the feed-composition canary (:17), the feed
  # signals sync (:27), topic suggestions (:41), the topic ranking (:51), the account weights (:53)
  # and the primer claims (:57).
  schedule: "5 * * * *"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400 # clear finished runs after a day, so a stale failure stops firing KubeJobFailed
      template:
        metadata:
          labels:
            environment: testnet
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          imagePullSecrets:
            - name: geo
          volumes:
            - name: ssl-certs
              emptyDir: {}
            # geodb-client for the trending.agenda_listings mirror (GEODB_DERIVED_MIRROR, RUNBOOK section 2f-agenda / 20). Dormant while
            # the flag is "0": nothing below is read, and every reference is optional or fails soft, so an absent
            # geodb never blocks a rollout. Same wiring as hermes-pipeline.yaml, but with the SCORES key: a principal
            # that may write derived collections 0, 1, 2, 3, 4, 5, 11, 12, 13 to 19 and 20 and nothing else (geodb-scores-key-job.yaml).
            - name: geodb-bin
              emptyDir: {}
            - name: geodb-space-map
              configMap:
                # Written by the geodb-feeder / serve. Not shipped in these manifests.
                name: geodb-space-map
                optional: true
            - name: geodb-key
              secret:
                secretName: geodb-scores-key
                optional: true
                defaultMode: 0440
                items:
                  - key: key
                    path: scores.key
          initContainers:
            - name: geodb-setup
              # Pinned, never :latest: deploy-v2 rewrites every :latest in this file to this service's tag.
              image: registry.digitalocean.com/geo/geodb:2eab4e170c
              imagePullPolicy: IfNotPresent
              # Always exits 0. With no node id yet (geodb never started) or no Service, it writes no
              # binding and the mirror stays disabled even if the flag is turned on.
              command:
                - sh
                - -c
                - |
                  cp /usr/local/bin/geodb-client /geodb/geodb-client || exit 0
                  node=$(cat /etc/geodb/space-map/node-id 2>/dev/null) || node=
                  ip=$(getent hosts geodb.gaia.svc.cluster.local | cut -d' ' -f1)
                  if [ -n "$node" ] && [ -n "$ip" ]; then
                    printf 'version = 1\nlisten = tcp:%s:7447\nnode = %s\n' "$ip" "$node" > /geodb/binding.txt
                  else
                    echo "geodb-setup: no node id or no geodb Service; derived mirror stays off"
                  fi
                  exit 0
              volumeMounts:
                - name: geodb-bin
                  mountPath: /geodb
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            - name: setup-certs
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command:
                - sh
                - -c
                - |
                  echo "$DATABASE_SSL_CA" > /ssl/ca.crt
              env:
                - name: DATABASE_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_SSL_CA
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ranking-indexer-agenda-listings
              image: registry.digitalocean.com/geo/ranking-indexer:latest
              imagePullPolicy: Always
              command: ["agenda_listings_refresh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: ssl-certs
                  mountPath: /ssl
                  readOnly: true
                - name: geodb-bin
                  mountPath: /geodb
                  readOnly: true
                - name: geodb-space-map
                  mountPath: /etc/geodb/space-map
                  readOnly: true
                - name: geodb-key
                  mountPath: /etc/geodb/key
                  readOnly: true
              env:
                # Copy trending.agenda_listings into geo-db derived collection 20 after the refresh commits (RUNBOOK
                # section 2f-agenda), best-effort. ON.
                - name: GEODB_DERIVED_MIRROR
                  value: "1"
                # Also copy last_full_pass_on (trending_refresh_state, collection 7; needs a binding that grants 7). Off.
                - name: GEODB_STATE_MIRROR
                  value: "1"
                - name: GEODB_DERIVED_BATCH
                  value: "1"
                - name: GEODB_CLIENT_BIN
                  value: /geodb/geodb-client
                - name: GEODB_KEY_PATH
                  value: /etc/geodb/key/scores.key
                - name: GEODB_BINDING_PATH
                  value: /geodb/binding.txt
                - name: PGSSLROOTCERT
                  value: /ssl/ca.crt
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
                - name: RUST_LOG
                  value: "agenda_listings_refresh=info,ranking_indexer=info,geodb_cursor=info"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
