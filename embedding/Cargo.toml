[package]
name = "embedding"
version = "0.1.0"
edition = "2024"
description = "Embedding descriptors and slots, the text template, and the local ONNX provider shared by embedding-service and embedding-indexer"

[lib]
path = "src/lib.rs"

[dependencies]
# Local ONNX inference. No default features: the Hugging Face client (and its OpenSSL) stays out
# because model files come from verified bundles on disk, and the ONNX Runtime prebuilt is
# downloaded at build time over rustls and linked statically. See
# docs/tech-designs/semantic-search.md ("Spike results") for the measurements behind this.
fastembed = { version = "7.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
unicode-normalization = "0.1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
