[package]
name = "kg-indexer"
version = "0.1.0"
edition = "2021"
description = "Knowledge Graph indexer that consumes events from Kafka and indexes into PostgreSQL"

[dependencies]
# Workspace dependencies
hermes-schema = { path = "../hermes-schema" }
hermes-instrumentation = { path = "../hermes-instrumentation" }
wire = { path = "../wire" }
indexer_utils = { path = "../indexer_utils" }

# Kafka
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "zstd"] }

# Async runtime
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures = "0.3.31"
async-trait = "0.1.88"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "uuid", "tls-rustls"] }

# Serialization
prost = "0.13.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
tracing-opentelemetry = "0.32"

# Error handling
thiserror = "2.0.12"

# Utilities
chrono = "0.4.41"
uuid = { version = "1.17.0", features = ["v4", "v5"] }
dotenv = "0.15.0"
hex = "0.4"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
axiom-rs = "0.11.4"

[dev-dependencies]
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "test-util"] }

[[test]]
name = "e2e"
path = "tests/e2e.rs"
