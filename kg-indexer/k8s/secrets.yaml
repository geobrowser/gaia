# kg-indexer secrets template
#
# =============================================================================
# PRODUCTION (knowledge namespace)
# =============================================================================
#
# 1. Create the knowledge namespace (if not exists):
#    kubectl create namespace knowledge
#
# 2. Copy regcred for image pulls:
#    kubectl get secret regcred -n api -o yaml | \
#      sed 's/namespace: api/namespace: knowledge/' | \
#      kubectl apply -f -
#
# 3. Copy database secrets (api-secrets.DATABASE_URL should be the pooler URL):
#    kubectl get secret api-secrets -n api -o yaml | \
#      sed 's/namespace: api/namespace: knowledge/' | \
#      kubectl apply -f -
#
# 4. Copy Kafka credentials:
#    kubectl get secret kafka-credentials -n kafka -o yaml | \
#      sed 's/namespace: kafka/namespace: knowledge/' | \
#      sed 's/name: kafka-credentials/name: kg-indexer-secrets/' | \
#      kubectl apply -f -
#
# =============================================================================
# STAGING (knowledge-staging namespace)
# =============================================================================
#
# 1. Create the knowledge-staging namespace (if not exists):
#    kubectl create namespace knowledge-staging
#
# 2. Copy regcred for image pulls:
#    kubectl get secret regcred -n api-staging -o yaml | \
#      sed 's/namespace: api-staging/namespace: knowledge-staging/' | \
#      kubectl apply -f -
#
# 3. Copy database secrets (from api-staging, points to staging DB):
#    kubectl get secret api-secrets -n api-staging -o yaml | \
#      sed 's/namespace: api-staging/namespace: knowledge-staging/' | \
#      kubectl apply -f -
#
# 4. Copy Kafka credentials (from kafka-staging):
#    kubectl get secret kafka-credentials -n kafka-staging -o yaml | \
#      sed 's/namespace: kafka-staging/namespace: knowledge-staging/' | \
#      sed 's/name: kafka-credentials/name: kg-indexer-secrets/' | \
#      kubectl apply -f -
#
# Or create Kafka secrets manually:
apiVersion: v1
kind: Secret
metadata:
  name: kg-indexer-secrets
  namespace: knowledge
type: Opaque
stringData:
  KAFKA_BROKER: "<kafka-broker-url>"
  KAFKA_USERNAME: "<kafka-username>"
  KAFKA_PASSWORD: "<kafka-password>"
  KAFKA_SSL_CA_PEM: "<kafka-ssl-ca-pem>"
