[package]
name = "hermes-relay"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
stream = { path = "../stream" }
hermes-substream = { path = "../hermes-substream" }
alloy = { version = "1.0.24", features = ["sol-types"] }
ethabi = "18.0.0"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1.41", features = ["sync"] }
prost = "0.13"
prost-types = "0.13"
thiserror = "1"
futures03 = { version = "0.3.1", package = "futures", features = ["compat"] }
